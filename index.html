(function(){
PDE.i18n = PDE.i18n || {lessons:{},q:{},flash:{},tools:{},dom:{}};
const X=PDE.i18n;
X.dom.d1={short:"Designing",name:"Mendesain sistem pemrosesan data (Designing data processing systems)",blurb:"Security, compliance, reliability, portability, dan migrasi."};

X.lessons["d1-l1"]={title:"IAM ala Google",why:"Membaca tabel (dataViewer) dan menjalankan query (jobUser) adalah izin yang terpisah. Berikan keduanya di scope sekecil mungkin, ke group, bukan ke individu.",
 cards:[
 {h:"Hierarki & pewarisan",b:`<ul><li><b>Organization → Folder → Project → Resource</b>. Izin <mark>diwariskan ke bawah</mark>. Level bawah tidak bisa mencabut izin yang diberikan level atas.</li><li>Principal: akun Google, <mark>Google Group (paling disarankan)</mark>, <b>service account</b> (app), Workload Identity Federation (workload dari luar, tanpa key).</li><li>Role: <b>basic</b> (Owner/Editor/Viewer, hindari) · <mark>predefined</mark> (pilihan default) · custom (hanya kalau tidak ada predefined yang cocok).</li></ul>`},
 {h:"Role BigQuery yang perlu diingat",b:`<table><tr><th>Role</th><th>Dipakai untuk</th></tr><tr><td>dataViewer</td><td>Membaca tabel</td></tr><tr><td>dataEditor</td><td>Membaca + menulis data (pipeline)</td></tr><tr><td>dataOwner</td><td>Mengatur akses dataset</td></tr><tr><td><mark>jobUser</mark></td><td>Menjalankan query di project</td></tr><tr><td>user</td><td>Menjalankan job + membuat dataset</td></tr><tr><td>admin</td><td>Hampir tidak pernah jadi jawaban</td></tr></table><div class="box trap"><div class="l">Fakta usang</div>"BigQuery tidak punya security level tabel" sudah tidak benar. Sekarang ada IAM tabel, row-level policy, policy tags kolom dan masking.</div>`},
 {h:"Service account & org policy",b:`<ul><li>Satu service account per pipeline, least privilege, hindari key yang di-download.</li><li><code>iam.serviceAccountUser</code> hanya untuk orang yang harus menjalankan job sebagai SA itu.</li><li><mark>Organization policy</mark> adalah pagar pembatas: <code>gcp.resourceLocations</code> (data residency), larang pembuatan SA key, batasi public IP.</li></ul>`}],
 keys:["Predefined role → group/service account → scope terkecil","Analis = dataViewer + jobUser","Pagar residency → resource locations org policy"]};

X.lessons["d1-l2"]={title:"Enkripsi & manajemen kunci",why:"Dengan CMEK kamu mengontrol kunci di Cloud KMS. Men-disable atau menghancurkannya membuat data tidak bisa dibaca. CSEK tidak didukung BigQuery, dan enkripsi client-side akan merusak query BigQuery.",
 cards:[
 {h:"Siapa yang pegang kunci?",b:`<table><tr><th>Opsi</th><th>Pilih saat</th></tr><tr><td>Google-managed</td><td>Default, tidak ada syarat khusus</td></tr><tr><td><mark>CMEK (Cloud KMS)</mark></td><td>"Kontrol rotasi", "cabut akses", "kami harus mengelola kunci"</td></tr><tr><td>Cloud HSM</td><td>Kunci berbasis hardware (FIPS 140-2 L3)</td></tr><tr><td><mark>Cloud EKM</mark></td><td>Kunci harus tetap di luar Google</td></tr><tr><td>CSEK</td><td>Hanya GCS + disk Compute Engine</td></tr><tr><td>Client-side</td><td>Google tidak boleh melihat plaintext sama sekali</td></tr></table>`},
 {h:"Crypto-shredding",b:`<p>Hancurkan atau disable kunci CMEK, maka semua yang dienkripsi dengan kunci itu tidak bisa dibaca lagi. Berguna untuk "hapus semua data customer/tenant ini" kalau kamu memakai satu kunci per tenant.</p><div class="box trap"><div class="l">Trap</div><mark>CSEK tidak didukung di BigQuery.</mark> Jawaban yang menggabungkan keduanya pasti salah.</div>`}],
 keys:["Kontrol/cabut kunci → CMEK","Kunci di luar Google → EKM","CSEK hanya untuk GCS/GCE"]};

X.lessons["d1-l3"]={title:"PII & Sensitive Data Protection",why:"Tokenization deterministik memetakan email yang sama ke token yang sama di kedua tabel, jadi join tetap jalan. Juga bisa dikembalikan dengan kunci. Redaction dan nilai acak merusak join.",
 cards:[
 {h:"Apa yang dilakukan DLP",b:`<ul><li><b>Inspect</b>: menemukan 150+ infoType (kartu, email, ID, regex custom) di BigQuery, GCS, Datastore, atau stream lewat API.</li><li><b>De-identify</b>, lalu <b>risk analysis</b> (k-anonymity, l-diversity).</li><li>Alur umum: raw → bucket staging → DLP/Dataflow de-identify → BigQuery.</li></ul>`},
 {h:"Pilih teknik yang tepat",b:`<table><tr><th>Teknik</th><th>Bisa di-join?</th><th>Bisa dibalik?</th></tr><tr><td>Redaction / masking</td><td>Tidak</td><td>Tidak</td></tr><tr><td><mark>Deterministic encryption / FPE (tokenization)</mark></td><td>Ya</td><td>Ya (dengan kunci)</td></tr><tr><td>Crypto hash</td><td>Ya</td><td>Tidak</td></tr><tr><td>Bucketing / date shifting</td><td>Sebagian</td><td>Tidak</td></tr></table><p>Coba tool <b>Protect-the-data Picker</b> di domain ini.</p>`}],
 keys:["Join tanpa membuka data → deterministic tokenization / FPE","Masking tampilan permanen → redaction/masking","Ukur risiko identifikasi ulang → DLP risk analysis"]};

X.lessons["d1-l4"]={title:"Perimeter, jaringan & audit",why:"VPC Service Controls memblokir data keluar dari perimeter bahkan saat request-nya memakai kredensial valid. IAM saja tidak bisa menghentikan orang yang memegang kredensial curian.",
 cards:[
 {h:"Kontrol jaringan",b:`<ul><li><mark>VPC Service Controls</mark>: perimeter yang menghentikan exfiltration lewat API Google.</li><li><b>Private Google Access</b>: VM tanpa public IP bisa mengakses API Google.</li><li><b>Private Service Connect</b>: endpoint privat untuk service.</li></ul>`},
 {h:"Audit & environment",b:`<ul><li>Audit log: <b>Admin Activity</b> (selalu aktif) · <b>Data Access</b> (mati secara default untuk kebanyakan service, <mark>aktif secara default untuk BigQuery</mark>) · System Event · Policy Denied.</li><li>"Siapa yang membaca tabel ini?" → Data Access log, diekspor ke BigQuery lewat log sink.</li><li><mark>Project terpisah untuk dev / test / prod.</mark></li><li>Lokasi dataset tidak bisa diubah setelah dibuat. Residency = pilih region + paksa lewat org policy.</li></ul>`}],
 keys:["Exfiltration dengan kredensial valid → VPC-SC","Siapa mengakses data → Data Access audit log","Isolasi environment → project terpisah"]};

X.lessons["d1-l5"]={title:"Reliability, fidelity & DR",why:"RPO/RTO yang longgar → opsi termurah yang tetap memenuhinya: backup atau snapshot di region lain. Opsi lain jauh lebih mahal dari yang dibutuhkan, dan HA saja tidak melindungi dari kehilangan region.",
 cards:[
 {h:"Istilah",b:`<ul><li><mark>RPO</mark> = berapa banyak data boleh hilang. <mark>RTO</mark> = berapa lama boleh down.</li><li>RPO/RTO makin kecil = makin mahal. Pilih opsi termurah yang memenuhi angka di soal.</li><li>Pola: storage multi-region · cross-region replica · replikasi dengan failover · backup ke region lain.</li></ul>`},
 {h:"Fidelity (data yang benar)",b:`<ul><li><b>Dataform</b>: transformasi SQL dengan <mark>assertion</mark> (test) dan dependency.</li><li><b>Dataplex data quality scan</b>: aturan + alert.</li><li>Dead-letter output untuk record rusak. Hindari <code>max_bad_records</code> sebagai "solusi" (diam-diam membuang baris).</li><li>Validasi migrasi dengan row count dan checksum, dan jalankan sistem lama dan baru secara paralel.</li></ul>`}],
 keys:["DR termurah yang memenuhi RPO/RTO","Test data → Dataform assertion / Dataplex quality"]};

X.lessons["d1-l6"]={title:"Portability & multicloud",why:"BigLake menyediakan tabel ber-governance di atas format terbuka seperti Iceberg, bisa dibaca dari BigQuery dan Spark dengan security fine-grained.",
 cards:[
 {h:"Terbuka & multicloud",b:`<ul><li><mark>BigQuery Omni</mark>: analitik untuk data di AWS/Azure tanpa memindahkannya.</li><li><mark>BigLake</mark>: tabel lakehouse format terbuka (Parquet, ORC, Iceberg) dengan security baris/kolom.</li><li>Portability: format terbuka, Beam (jalan di Dataflow/Flink/Spark), container.</li><li><b>Dataplex Universal Catalog</b>: discovery, metadata, profiling, lineage.</li></ul>`}],
 keys:["Data di cloud lain → Omni","Format terbuka + governance → BigLake"]};

X.lessons["d1-l7"]={title:"Migrasi data",why:"800 TB dengan 200 Mbps butuh sekitar 400 hari. Kirim secara fisik dengan Transfer Appliance. Rumus cepat: 1 TB lewat 100 Mbps ≈ 1 hari.",
 cards:[
 {h:"Pilih tool transfer",b:`<table><tr><th>Tool</th><th>Kapan</th></tr><tr><td>gcloud storage</td><td>Copy kecil/sedang (paralel)</td></tr><tr><td><mark>Storage Transfer Service</mark></td><td>Besar, terjadwal, S3/Azure/HTTP/on-prem (agent)</td></tr><tr><td><mark>Transfer Appliance</mark></td><td>Data sangat besar + jaringan lambat (berminggu-minggu atau berbulan-bulan kalau online)</td></tr><tr><td><mark>BigQuery DTS</mark></td><td>Migrasi Teradata/Redshift, SaaS (Ads, YouTube), scheduled query</td></tr><tr><td><mark>Database Migration Service</mark></td><td>MySQL/Postgres/SQL Server/Oracle → Cloud SQL/AlloyDB, downtime minimal</td></tr><tr><td><mark>Datastream</mark></td><td>CDC → BigQuery/GCS, hampir real-time</td></tr></table><p>Pakai tool <b>Transfer Calculator</b> untuk latihan hitungannya.</p>`},
 {h:"Jaringan & langkah migrasi",b:`<ul><li><b>Cloud VPN</b>: cepat dibuat, terenkripsi lewat internet, bandwidth sedang. <b>Dedicated Interconnect</b>: link privat 10/100 Gbps. <b>Partner Interconnect</b>: lewat provider.</li><li>Langkah: <b>assess → plan → migrate → validate → optimize</b>.</li><li>Lift &amp; shift: Hadoop → Dataproc · Kafka → Managed Kafka · HBase → Bigtable · Airflow → Composer · MySQL → Cloud SQL. Modernisasi: → BigQuery, Dataflow, Pub/Sub.</li></ul>`}],
 keys:["1 TB @100 Mbps ≈ 1 hari → terlalu lambat = Transfer Appliance","Warehouse → BigQuery DTS · DB → DMS · CDC → Datastream","Privat dengan throughput tinggi → Interconnect"]};

const q=(id,tip,...w)=>{X.q[id]={w,tip};};
q("d1q01","Analis self-service → bigquery.user, ke group.",
 "Benar. bigquery.user bisa menjalankan job dan membuat dataset, dan group membuat akses mudah dikelola.",
 "Basic role, terlalu luas.",
 "Bisa membaca, tapi tidak bisa menjalankan query atau membuat dataset.",
 "Terlalu luas, dan diberikan ke individu, bukan ke group.");
q("d1q02","Pipeline → service account khusus, least privilege.",
 "Akun pribadi rusak saat orangnya keluar, dan izinnya berlebihan.",
 "Benar. Satu SA per pipeline dengan least privilege.",
 "Editor terlalu luas.",
 "Key yang bocor adalah risiko besar.");
q("d1q03","Pagar residency → resource locations org policy.",
 "Tidak dipaksakan.",
 "Benar. Berlaku untuk setiap project di organisasi.",
 "Tidak mengontrol lokasi.",
 "Mengontrol exfiltration data, bukan di mana resource dibuat.");
q("d1q04","Workload luar, tanpa key → Workload Identity Federation.",
 "Ini key jangka panjang, justru yang dilarang.",
 "Benar. Kredensial berumur pendek tanpa key.",
 "Izinnya jauh berlebihan.",
 "Bukan CI/CD.");
q("d1q05","Kontrol + rotasi + cabut → CMEK.",
 "Benar. Kamu mengontrol rotasi, dan men-disable kunci langsung mencabut akses.",
 "Dikelola Google, jadi kamu tidak punya kontrol.",
 "CSEK tidak didukung BigQuery.",
 "BigQuery tidak bisa query data yang tidak bisa didekripsi.");
q("d1q06","Kunci di luar Google → EKM.",
 "Disimpan di Google.",
 "Hardware, tapi tetap di dalam Google.",
 "Benar. Kunci tetap di key manager eksternal, di partner atau on-prem.",
 "Sepenuhnya dipegang Google.");
q("d1q07","Penghapusan permanen seketika → CMEK per tenant + crypto-shredding.",
 "Time travel dan fail-safe membuat data masih bisa dipulihkan selama beberapa hari.",
 "Benar. Crypto-shredding membuat semua salinan yang dienkripsi dengan kunci itu tidak bisa dibaca.",
 "Mengontrol akses, tapi tidak menghancurkan data.",
 "Tidak menangani backup.");
q("d1q08","Temukan + samarkan PII di konten → DLP.",
 "Rapuh, dan data mentah tetap masuk ke BigQuery.",
 "Benar. DLP mendeteksi infoType dan menyamarkannya sebelum data disimpan.",
 "Menyembunyikan seluruh kolom, tidak menyamarkan nilai di dalam teks.",
 "Enkripsi tidak menghapus PII.");
q("d1q09","Pertahankan bentuk, sembunyikan nilai pasti → bucketing / date shifting.",
 "Benar. Tren tetap terlihat, nilai pastinya tersembunyi.",
 "Benar. Tanggal asli tersembunyi tapi jarak antar kunjungan tetap.",
 "Menghancurkan tren yang dibutuhkan peneliti.",
 "Tidak berhubungan dengan de-identifikasi.");
q("d1q10","Bisa di-join + bisa dibalik → deterministic encryption / FPE.",
 "Merusak join dan tidak bisa dipulihkan.",
 "Bisa di-join, tapi tidak bisa dipulihkan.",
 "Benar. Bisa di-join dan bisa dibalik oleh pemegang kunci yang berwenang.",
 "Merusak join.");
q("d1q11","Exfiltration bahkan dengan kredensial valid → VPC-SC.",
 "Benar. Memblokir exfiltration berbasis API yang melewati batas perimeter.",
 "Tidak mengontrol perpindahan data lewat API Google.",
 "Salinannya tetap bisa dibaca project penyerang kalau izin kuncinya memungkinkan, jadi ini tidak mencegah penyalinan.",
 "Membantu, tapi tidak menghentikan penyalahgunaan sesi yang valid.");
q("d1q12","Tanpa external IP + API Google → Private Google Access.",
 "Melanggar desain tanpa external IP.",
 "Benar. VM yang hanya punya IP internal bisa mengakses API Google.",
 "Perimeter tidak memberi konektivitas.",
 "Tidak perlu untuk mengakses API Google dari dalam VPC.");
q("d1q13","Siapa yang membaca data → Data Access audit log + sink.",
 "Mencatat perubahan konfigurasi, bukan pembacaan data (dan selalu aktif).",
 "Benar. Data access di BigQuery dicatat secara default, dan sink menyimpannya untuk analisis dan retensi.",
 "Tidak bisa diandalkan.",
 "Retensinya terbatas (sekitar 180 hari), jadi tidak memenuhi 3 tahun.");
q("d1q14","Isolasi environment → project terpisah.",
 "Bukan kontrol.",
 "Benar. Isolasi per project adalah pola standar.",
 "Izinnya sama, jadi risikonya juga sama.",
 "Role berlaku per project, dan mencampur environment di satu project menggagalkan tujuannya.");
q("d1q15","Lokasi salah → dataset baru + copy.",
 "Lokasi dataset tidak bisa diubah setelah dibuat.",
 "Benar. Lokasi tetap sejak dibuat, jadi copy ke dataset baru.",
 "Mencegah kesalahan berikutnya tapi tidak memindahkan data.",
 "Tidak berhubungan dengan lokasi.");
q("d1q16","Test data di pipeline SQL → Dataform assertions (atau Dataplex quality).",
 "Benar. Assertion jalan bersama transformasi dan gagal saat datanya buruk.",
 "Diam-diam membuang baris, kebalikan dari gagal cepat.",
 "Tidak berhubungan.",
 "Mengatur storage, tidak memvalidasi.");
q("d1q17","RPO/RTO longgar → backup termurah yang memenuhinya.",
 "Jauh lebih dari yang dibutuhkan.",
 "Benar. Murah dan memenuhi RPO/RTO yang longgar.",
 "Terlalu mahal dan berlebihan.",
 "Kehilangan region akan melewati RTO tanpa ada yang bisa dipulihkan.");
q("d1q18","Pipeline portable → Apache Beam.",
 "Benar. Pipeline Beam bisa jalan di runner Dataflow, Flink atau Spark.",
 "Terikat ke BigQuery.",
 "Bukan model pemrosesan data yang portable.",
 "Terikat ke service-nya.");
q("d1q19","PB + bandwidth terbatas → Transfer Appliance.",
 "2 PB lewat link 1 Gbps yang dipakai bersama butuh berbulan-bulan.",
 "Tetap terbatas link lambat yang sama.",
 "Benar. Untuk data skala PB dengan bandwidth terbatas, kirim secara fisik.",
 "Untuk CDC database.");
q("d1q20","Copy berkala cloud ke GCS → Storage Transfer Service.",
 "Infrastruktur yang dikelola sendiri.",
 "Benar. Managed, terjadwal, incremental, dengan retry.",
 "Untuk transfer massal offline.",
 "Query data di S3, tidak meng-copy file.");
q("d1q21","Teradata/Redshift → BigQuery DTS / migration service.",
 "Meng-copy file, bukan schema warehouse.",
 "Benar. Dibuat khusus untuk migrasi warehouse ke BigQuery.",
 "Targetnya Cloud SQL/AlloyDB, bukan BigQuery.",
 "CDC dari database operasional, bukan migrasi warehouse Teradata.");
q("d1q22","DB → Cloud SQL, downtime minimal → DMS.",
 "Downtime berjam-jam.",
 "Benar. Migrasi ke Cloud SQL dengan downtime minimal.",
 "Targetnya salah.",
 "Untuk file, dan terlalu lambat untuk ini.");
q("d1q23","Privat + throughput tinggi → Dedicated Interconnect.",
 "Bandwidth lebih rendah dan kurang stabil.",
 "Benar. Link fisik privat 10/100 Gbps.",
 "Tidak privat dan tidak stabil.",
 "Offline dan tidak praktis untuk pemakaian harian.");
q("d1q24","Validasi migrasi → row count, checksum, jalan paralel.",
 "Tidak menunjukkan apa pun soal kebenaran data.",
 "Benar. Validasi sistematis sebelum cut-over.",
 "Tidak sistematis.",
 "Menghilangkan cadangan kalau ada masalah.");
q("d1q25","Migrasi cepat dulu (Dataproc), modernisasi belakangan.",
 "Lambat, dan bertentangan dengan syarat \"cepat sekarang\".",
 "Benar. Pindah cepat dengan perubahan minimal, lalu optimasi.",
 "Dikelola sendiri, bukan rekomendasi Google.",
 "Tidak memenuhi tujuannya.");
q("d1q26","Samarkan kolom untuk sebagian user → policy tags + dynamic masking.",
 "Duplikasi dan data jadi tidak sinkron.",
 "Benar. Satu tabel, disamarkan untuk sebagian besar user, nilai asli untuk yang berwenang.",
 "Tim CRM membutuhkannya.",
 "Bukan level kolom.");
q("d1m01",null,"Benar. Predefined role, group, scope sekecil yang masuk akal.","Basic role, scope maksimal.","Izinnya berlebihan dan sulit dikelola.","Kredensial dipakai bersama, tidak ada akuntabilitas.");
q("d1m02",null,"BigQuery tidak mendukung CSEK.","Benar.","Itu CMEK.","Enkripsi tidak menggantikan kontrol akses.");

X.tools.protect={title:"Protect-the-data Picker",sub:"Kontrol keamanan apa yang dibutuhkan skenario ini?",
 intro:"Soal security itu tentang memilih kontrol yang cocok dengan ancamannya. Jawab sesuai skenarionya.",
 nodes:{
  start:{q:"Apa kekhawatiran utama di skenario ini?",opts:["Siapa boleh mengakses apa (orang/app)","Siapa yang memegang kunci enkripsi","Nilai sensitif (PII) di dalam data","Data keluar dari perusahaan, bahkan dengan kredensial valid","Data harus tetap di wilayah tertentu","Membuktikan siapa yang mengakses data"]},
  iam:{q:"Siapa yang butuh akses?",opts:["Analis yang hanya query","Pipeline / aplikasi","User berbeda melihat baris atau kolom berbeda"]},
  iamA:{result:"dataViewer + jobUser, ke Google Group",why:"Baca di dataset, jalankan job di project, scope terkecil, dikelola lewat group.",keys:"least privilege, analis, hanya query",trap:"Basic role (Editor/Owner) atau bigquery.admin hampir tidak pernah benar."},
  iamSA:{result:"Service account khusus dengan predefined role",why:"Satu service account per pipeline, misalnya dataEditor di dataset tujuan. Hindari key yang di-download (pakai SA yang terpasang atau Workload Identity Federation).",keys:"service account, least privilege"},
  fine:{result:"Row-level policy / policy tags / authorized view",why:"Baris → row access policy. Kolom → policy tags (+ dynamic masking). Hanya membagikan hasil → authorized view.",keys:"akses fine-grained"},
  keys:{q:"Apa syarat soal kuncinya?",opts:["Kami harus mengontrol rotasi dan bisa mencabutnya","Kunci harus disimpan di hardware (HSM)","Kunci tidak boleh disimpan di Google","Google tidak boleh melihat plaintext sama sekali"]},
  cmek:{result:"CMEK (Cloud KMS)",why:"Kamu mengelola kuncinya, dan men-disable atau menghancurkannya membuat data tidak bisa dibaca (crypto-shredding).",keys:"kontrol kunci, rotasi, cabut",trap:"CSEK tidak didukung BigQuery."},
  hsm:{result:"Cloud HSM (CMEK di hardware)",why:"Kunci disimpan di HSM FIPS 140-2 Level 3."},
  ekm:{result:"Cloud External Key Manager (EKM)",why:"Kunci tetap di key manager eksternal di luar Google."},
  cse:{result:"Client-side encryption",why:"Enkripsi sebelum upload. Google hanya menyimpan ciphertext.",trap:"BigQuery tidak bisa query data yang tidak bisa didekripsi."},
  pii:{q:"Setelah dilindungi, apa yang masih harus bisa dilakukan?",opts:["Join dan count di kolom yang dilindungi, dan bisa dibalik","Tidak ada, cukup disembunyikan untuk tampilan","Join, tapi harus satu arah","Mempertahankan bentuk kasarnya (umur, tanggal)"]},
  tok:{result:"Deterministic encryption / FPE tokenization (DLP)",why:"Input yang sama selalu jadi token yang sama, jadi join tetap jalan dan bisa dibalik dengan kunci.",keys:"pseudonymize, join pakai PII"},
  mask:{result:"Masking / redaction (DLP)",why:"Permanen: ****1234 atau dihapus seluruhnya."},
  hash:{result:"Cryptographic hashing (DLP)",why:"Konsisten tapi satu arah: bisa di-join, tidak bisa dibalik."},
  bucket:{result:"Bucketing / date shifting (DLP)",why:"Menggeneralisasi nilai untuk mengurangi risiko identifikasi ulang sambil mempertahankan bentuk analitiknya."},
  vpcsc:{result:"VPC Service Controls",why:"Service perimeter memblokir data keluar dari project yang dilindungi lewat API Google, bahkan dengan kredensial valid.",keys:"exfiltration, kredensial dicuri"},
  resid:{result:"Resource regional + resource locations org policy",why:"Buat dataset/bucket di region yang diizinkan dan paksakan untuk seluruh organisasi dengan constraints/gcp.resourceLocations.",trap:"Lokasi dataset BigQuery tidak bisa diubah belakangan."},
  audit:{result:"Cloud Audit Logs (Data Access) → log sink ke BigQuery",why:"Data Access log mencatat siapa yang membaca data (aktif secara default untuk BigQuery). Ekspor dengan sink untuk analisis atau retensi."}
 }};
})();

(function(){
PDE.i18n = PDE.i18n || {lessons:{},q:{},flash:{},tools:{},dom:{}};
const X=PDE.i18n;
X.dom.d4={short:"Analysis & ML",name:"Menyiapkan & memakai data untuk analisis (Preparing and using data for analysis)",blurb:"Performa BI, keamanan data saat berbagi, BigQuery ML, Vertex AI dan GenAI."};

X.lessons["d4-l1"]={title:"Dashboard yang cepat dan murah",why:"BI Engine adalah akselerator in-memory BigQuery untuk tool BI, memberi respons di bawah 1 detik dan concurrency tinggi tanpa redesign. LIMIT tidak membantu, dan opsi lain menambah pekerjaan dan duplikasi.",
 cards:[
 {h:"Tiga pengungkit kecepatan",b:`<table><tr><th>Fitur</th><th>Pilih saat</th></tr><tr><td><mark>BI Engine</mark></td><td>Dashboard di bawah 1 detik, banyak user bersamaan</td></tr><tr><td><mark>Materialized view</mark></td><td>Agregasi yang sama di-query berulang kali. Refresh otomatis, dan query <b>di-rewrite otomatis</b> untuk memakainya</td></tr><tr><td>Partition + cluster</td><td>Dashboard filter berdasarkan tanggal dan ID</td></tr><tr><td>Summary table</td><td>Logika rumit yang tidak didukung MV (scheduled query / Dataform)</td></tr><tr><td>Query cache</td><td>Query identik dalam 24 jam di data yang tidak berubah itu gratis</td></tr></table>`},
 {h:"Tool BI",b:`<ul><li><mark>Looker</mark>: BI enterprise dengan semantic layer (<b>LookML</b>). "Definisi metrik konsisten antar tim" → Looker.</li><li><b>Looker Studio</b> (dulu Data Studio): dashboard cepat dan gratis. Data basi → cek setting <b>data freshness/cache</b> di laporan.</li><li><b>Connected Sheets</b>: Google Sheets di atas miliaran baris BigQuery.</li></ul><div class="box trap"><div class="l">Trap</div>Logical view hanyalah SQL yang disimpan, jadi tidak membuat query lebih cepat. Untuk kecepatan, pakai materialized view atau BI Engine.</div>`}],
 keys:["BI di bawah 1 detik → BI Engine","Agregasi berulang → materialized view","Definisi metrik bersama → Looker (LookML)"]};

X.lessons["d4-l2"]={title:"Troubleshooting query lambat & mahal",why:"Window function menghitung perbandingan antar baris dalam satu kali baca. Self-join di tabel raksasa adalah anti-pattern klasik BigQuery.",
 cards:[
 {h:"Checklist-nya",b:`<ol><li>Baca <b>execution graph</b>: stage yang lambat, byte yang di-shuffle, skew.</li><li>Pilih kolom yang dibutuhkan saja. <mark>LIMIT tidak mengurangi byte yang di-scan.</mark></li><li>Filter di kolom <b>partition/cluster</b> sedini mungkin.</li><li>Filter <i>sebelum</i> join. Waspadai <b>skew</b> dan <b>cross join</b> yang tidak disengaja.</li><li>Self-join → <mark>window function</mark>.</li><li>Tidak perlu angka pasti → <code>APPROX_COUNT_DISTINCT</code>.</li><li><b>Dry run</b> untuk melihat byte dulu. Atur <b>maximum bytes billed</b> sebagai pengaman.</li></ol>`},
 {h:"Mencari jarum di tumpukan jerami",b:`<ul><li><b>Search index</b> + <code>SEARCH()</code>: cari ID atau teks tertentu di tabel log raksasa dengan cepat.</li><li>Clustering di kolom yang dicari juga membantu point lookup.</li></ul>`}],
 keys:["Self-join → window function","Kolom lebih sedikit + filter partisi","Dry run + maximum bytes billed"]};

X.lessons["d4-l3"]={title:"Berbagi data dengan aman di BigQuery",why:"Authorized view memungkinkan user query hasil view tanpa punya akses ke tabel sumbernya. Taruh view di dataset terpisah dan beri izin ke dataset sumber.",
 cards:[
 {h:"Pilih berdasarkan apa yang dibatasi",b:`<table><tr><th>Kebutuhan</th><th>Fitur</th></tr><tr><td>Bagikan hasil, bukan sumber</td><td><mark>Authorized view</mark> (juga authorized dataset/routine)</td></tr><tr><td>Baris berbeda per user</td><td><mark>Row-level access policy</mark></td></tr><tr><td>Sembunyikan kolom sensitif</td><td><mark>Policy tags</mark> (column-level security)</td></tr><tr><td>Tampilkan nilai tersamar</td><td><mark>Dynamic data masking</mark></td></tr><tr><td>Temukan/ubah PII sebelum load</td><td>Sensitive Data Protection</td></tr></table>`},
 {h:"Cara kerjanya",b:`<ul><li>Row policy: <code>CREATE ROW ACCESS POLICY … GRANT TO ("group:apac@…") FILTER USING (region="APAC")</code>.</li><li>Policy tags disimpan di taxonomy (Dataplex). Beri <b>Fine-Grained Reader</b> ke yang boleh melihat nilai asli.</li><li>Aturan masking: nullify, hash, 4 karakter terakhir, nilai default.</li></ul><div class="box brain"><div class="l">Exam brain</div>"Satu view per region" atau "satu tabel per tim" biasanya jawaban salah yang perawatannya berat. Pakai row-level policy.</div>`}],
 keys:["Hanya hasil → authorized view","Baris → row access policy · kolom → policy tags · nilai tersamar → dynamic masking"]};

X.lessons["d4-l4"]={title:"Dasar ML yang terus muncul",why:"Akurasi training sangat bagus tapi generalisasi buruk adalah overfitting. Regularization (dropout, L1/L2), tambah data, kurangi fitur atau early stopping membantu. Training lebih lama malah memperparah.",
 cards:[
 {h:"Diagnosis modelnya",b:`<table><tr><th>Gejala</th><th>Masalah → solusi</th></tr><tr><td>Bagus di train, jelek di test</td><td><mark>Overfitting</mark> → L1/L2, dropout, tambah data, early stopping, kurangi fitur</td></tr><tr><td>Jelek di train dan test</td><td><b>Underfitting</b> → tambah fitur, feature cross, model lebih kompleks</td></tr><tr><td>Bagus offline, jelek di prod</td><td><mark>Training-serving skew</mark> / drift → preprocessing yang sama, Feature Store, monitoring</td></tr><tr><td>Terlalu bagus untuk jadi kenyataan</td><td><b>Data leakage</b> → buang fitur yang bocor, split berdasarkan waktu</td></tr><tr><td>Loss naik-turun tidak karuan</td><td>Learning rate terlalu tinggi</td></tr></table>`},
 {h:"Metrik",b:`<ul><li><b>Precision</b>: dari yang aku tandai, berapa yang benar. Pakai saat false alarm mahal.</li><li><mark>Recall</mark>: dari semua positif asli, berapa yang tertangkap. Pakai saat yang terlewat mahal (fraud, penyakit).</li><li><b>F1</b> menyeimbangkan keduanya. <b>AUC-ROC</b> mengukur kualitas ranking. Regresi pakai RMSE/MAE.</li><li><mark>Kelas tidak seimbang</mark>: accuracy menyesatkan. Pakai precision/recall/PR-AUC, dan downsample atau upweight.</li></ul>`},
 {h:"Fitur",b:`<ul><li>One-hot untuk kategori dengan nilai unik sedikit. <mark>Embedding / hash bucket</mark> untuk nilai unik banyak (ID, kata).</li><li><b>Bucketize</b> angka yang efeknya tidak linear (kelompok umur). <b>Feature cross</b> (lat × long).</li><li>Normalisasi fitur numerik. Split train/validation/test, dan <b>split berdasarkan waktu</b> untuk time series.</li><li>Perilaku yang berubah (fashion, fraud) → retrain rutin dengan <mark>data lama + baru</mark>.</li><li>L1 → bobot sparse (seleksi fitur). L2 → semua bobot jadi kecil.</li></ul>`}],
 keys:["Overfit → regularisasi / dropout / tambah data","Positif yang langka → recall, bukan accuracy","Nilai unik banyak → embedding"]};

X.lessons["d4-l5"]={title:"BigQuery ML",why:"Segmentasi tanpa label adalah clustering, dan BigQuery ML k-means menjalankannya dengan SQL langsung di tempat data berada.",
 cards:[
 {h:"Jenis model",b:`<table><tr><th>Masalah</th><th>model_type</th></tr><tr><td>Prediksi angka</td><td>linear_reg, boosted_tree_regressor, dnn_regressor</td></tr><tr><td>Prediksi kategori</td><td>logistic_reg, boosted_tree_classifier, AutoML</td></tr><tr><td>Segmen (tanpa label)</td><td><mark>kmeans</mark></td></tr><tr><td>Rekomendasi</td><td><mark>matrix_factorization</mark></td></tr><tr><td>Forecast / anomali</td><td><mark>arima_plus</mark>, ML.DETECT_ANOMALIES</td></tr><tr><td>Panggil Gemini / Vertex</td><td>Remote model (ML.GENERATE_TEXT, ML.GENERATE_EMBEDDING)</td></tr></table>`},
 {h:"Alur kerja",b:`<p><code>CREATE MODEL … AS SELECT</code> → <code>ML.EVALUATE</code> → <code>ML.PREDICT</code>. Explainability dengan <code>ML.EXPLAIN_PREDICT</code>.</p><ul><li>Taruh preprocessing di klausa <mark>TRANSFORM</mark> supaya langkah yang sama dipakai saat prediksi (mencegah skew).</li><li>Ekspor model ke Vertex AI untuk online serving latency rendah.</li></ul>`}],
 keys:["User SQL + data di BigQuery → BigQuery ML","kmeans = segmen · matrix_factorization = rekomendasi · arima_plus = forecast","TRANSFORM mencegah training-serving skew"]};

X.lessons["d4-l6"]={title:"Vertex AI & pre-trained API",why:"Document AI adalah layanan pre-trained yang di-manage untuk membaca dokumen. Ini jawaban paling hemat usaha saat tidak ada keahlian ML.",
 cards:[
 {h:"Tool ML mana?",b:`<table><tr><th>Situasi</th><th>Pakai</th></tr><tr><td>Tugas umum, tidak ada tim ML</td><td><mark>Pre-trained API</mark>: Vision, Natural Language, Speech-to-Text, Translation, Video Intelligence, Document AI, Gemini</td></tr><tr><td>Model custom, data berlabel, sedikit kode</td><td><mark>Vertex AI AutoML</mark></td></tr><tr><td>Kontrol penuh (TF/PyTorch), GPU/TPU</td><td><b>Vertex AI custom training</b></td></tr><tr><td>User SQL, data di BigQuery</td><td>BigQuery ML</td></tr><tr><td>Alur ML yang bisa diulang</td><td><b>Vertex AI Pipelines</b></td></tr></table><p>Coba <b>ML Tool Picker</b> di domain ini.</p>`},
 {h:"Serving & operasional",b:`<ul><li><mark>Online prediction</mark> (endpoint, latency rendah, sinkron) vs <mark>batch prediction</mark> (volume besar, asinkron, output ke GCS/BigQuery).</li><li><b>Feature Store</b>: fitur yang konsisten untuk training dan serving.</li><li><b>Model Monitoring</b>: alert skew dan drift.</li><li>Notebook: <b>Vertex AI Workbench / Colab Enterprise</b> (Datalab sudah pensiun). Hyperparameter tuning sudah tersedia.</li></ul>`}],
 keys:["Tidak ada tim ML → pre-trained API","Custom + sedikit kode → AutoML","Real-time → online prediction; scoring malam → batch prediction"]};

X.lessons["d4-l7"]={title:"GenAI: embedding, vector search & RAG",why:"RAG mengambil potongan yang relevan saat pertanyaan diajukan dan mendasarkan jawaban model pada potongan itu. Lebih murah dan lebih segar daripada fine-tuning terus-menerus.",
 cards:[
 {h:"Pipeline RAG",b:`<ol><li><b>Kumpulkan</b> dokumen di GCS (BigQuery object table).</li><li><b>Parse &amp; chunk</b> (Document AI / Dataflow).</li><li><b>Embed</b>: <code>ML.GENERATE_EMBEDDING</code> atau Vertex AI embeddings.</li><li><b>Index</b>: BigQuery vector index, AlloyDB, atau Vertex AI Vector Search.</li><li><b>Retrieve</b> dengan <code>VECTOR_SEARCH</code>, lalu <b>generate</b> dengan Gemini.</li></ol><div class="box pic"><div class="l">Bayangkan</div>Embedding adalah posisi di "peta makna". "Tiket murah ke Bali" dan "pesawat hemat ke Denpasar" letaknya bersebelahan.</div>`},
 {h:"Perhatian data engineer",b:`<ul><li>Ukuran chunk dan overlap, plus metadata untuk filter.</li><li><mark>Buat ulang embedding secara incremental</mark> saat dokumen berubah, supaya jawaban tidak basi.</li><li>Terapkan kontrol akses yang sama ke chunk yang diambil seperti ke dokumen sumbernya.</li></ul>`}],
 keys:["Jawaban dari dokumen sendiri → RAG","Embedding + vector index + retrieval + LLM","Jaga embedding tetap segar"]};

X.lessons["d4-l8"]={title:"Berbagi data di luar tim",why:"Analytics Hub memberi subscriber linked dataset, pointer read-only yang live tanpa copy, dan subscriber membayar compute-nya sendiri.",
 cards:[
 {h:"Analytics Hub (BigQuery sharing)",b:`<ul><li>Publisher membuat <b>exchange</b> dan <b>listing</b>. Subscriber mendapat <mark>linked dataset</mark>: read-only, live, tanpa copy.</li><li>Bisa lintas organisasi. Exchange bisa public, private atau komersial.</li><li><b>Data clean room</b>: analisis bersama dengan aturan privasi (misalnya ambang agregasi), tanpa membuka baris mentah.</li><li>Aturan billing: <mark>project yang menjalankan query membayar compute</mark>. Pemilik tabel membayar storage.</li></ul>`}],
 keys:["Berbagi data live, tanpa copy, banyak konsumen → Analytics Hub","Analisis bersama tanpa akses mentah → data clean room"]};

const q=(id,tip,...w)=>{X.q[id]={w,tip};};
q("d4q01","Agregasi berulang → materialized view.",
 "SQL yang disimpan, tetap full scan setiap kali dijalankan.",
 "Benar. Dihitung di awal, refresh otomatis, dan BigQuery bisa me-rewrite query ke tabel dasar supaya memakainya.",
 "Manual dan basi.",
 "Lebih cepat, tapi tetap bayar full scan.");
q("d4q02","Kecepatan BI interaktif → BI Engine.",
 "Benar. Akselerasi in-memory yang dirancang untuk tool BI dan concurrency.",
 "Tidak dibuat untuk volume analitik ini.",
 "Usahanya besar.",
 "Malah lebih lambat.");
q("d4q03","Metrik konsisten → semantic layer Looker (LookML).",
 "Benar. Semantic layer mendefinisikan metrik sekali untuk semua dashboard.",
 "Setiap laporan tetap mendefinisikan metriknya masing-masing.",
 "Tidak dipaksakan.",
 "Mempercepat query tapi tidak mengatur definisi.");
q("d4q04","Dashboard basi, tabel sudah terbaru → setting cache tool BI.",
 "Tabelnya sudah terbaru.",
 "Benar. Laporannya menampilkan hasil dari cache.",
 "Cache-nya bukan di browser.",
 "Tidak berhubungan dengan cache laporan.");
q("d4q05","Mengintip data → preview; LIMIT ≠ lebih murah.",
 "LIMIT tidak mengurangi byte yang di-scan.",
 "Benar. Preview gratis, dan kolom lebih sedikit plus partition pruning mengurangi byte.",
 "Tidak mengurangi byte on-demand.",
 "Tidak perlu.");
q("d4q06","Beban stage tidak merata → skew.",
 "Benar. Skew berarti satu key membebani satu worker.",
 "LIMIT tidak memperbaiki pola join-nya.",
 "Tidak berhubungan.",
 "Tidak berhubungan.");
q("d4q07","Perkiraan sudah cukup → fungsi APPROX_.",
 "Pasti, tapi lebih mahal dan lambat di skala ini.",
 "Benar. Berbasis HyperLogLog, cepat dan perkiraan.",
 "Membangun array raksasa.",
 "Memindahkan data terlalu banyak.");
q("d4q08","Filter baris per user → row-level access policy.",
 "Benar. Baris difilter otomatis berdasarkan group user.",
 "Menduplikasi data dan perawatan.",
 "Menyembunyikan kolom, bukan memfilter baris.",
 "Bisa, tapi ini pola yang perawatannya berat dan justru dikecualikan soal.");
q("d4q09","Sembunyikan kolom → policy tags.",
 "Benar. Column-level security lewat policy tags.",
 "Duplikasi.",
 "Membatasi baris, bukan kolom.",
 "CMEK berlaku di level tabel/dataset, dan semua yang punya akses tetap bisa membacanya.");
q("d4q10","Bagikan hasil, bukan sumber → authorized view.",
 "Membuka tabel mentah.",
 "Benar. User melihat hasil, bukan sumber.",
 "Manual dan basi.",
 "Tetap membuka baris mentah.");
q("d4q11","Nilai tersamar untuk sebagian user → dynamic data masking.",
 "Benar. Disamarkan untuk kebanyakan user, nilai lengkap untuk yang berwenang, semuanya di satu tabel.",
 "Duplikasi dan data tidak sinkron.",
 "Investigator jadi kehilangan nilai aslinya.",

(function(){
PDE.i18n = PDE.i18n || {lessons:{},q:{},flash:{},tools:{},dom:{}};
const X=PDE.i18n;
X.dom.d5={short:"Maintaining",name:"Memelihara & mengotomasi workload data (Maintaining and automating data workloads)",blurb:"Biaya, kapasitas, orkestrasi, monitoring, dan desain tahan gagal."};

X.lessons["d5-l1"]={title:"Harga BigQuery: on-demand vs Editions",why:"Harga kapasitas (Editions) membuat biaya compute bisa diprediksi. Flat-rate sudah pensiun dan diganti Editions. LIMIT dan batch priority tidak mengubah tagihan.",
 cards:[
 {h:"Dua cara membayar compute",b:`<table><tr><th>Model</th><th>Cara</th><th>Cocok untuk</th></tr><tr><td><b>On-demand</b></td><td>Per TiB yang di-scan (pool slot bersama, sekitar 2.000 slot per project)</td><td>Workload naik-turun atau kecil</td></tr><tr><td><mark>Editions</mark> (Standard / Enterprise / Enterprise Plus)</td><td>Per slot-jam: <b>reservation</b> dengan <b>baseline</b> + <b>autoscaling</b> sampai batas maksimum, opsional <b>commitment</b> 1/3 tahun</td><td>Workload stabil dan berat, budget terprediksi, isolasi</td></tr></table><div class="box trap"><div class="l">Fakta usang</div><mark>Flat-rate sudah pensiun.</mark> Kalau soal lama menyebut flat-rate, pikirkan Editions + reservation.</div>`},
 {h:"Reservation & pengaman",b:`<ul><li>Buat reservation (<code>etl</code>, <code>bi</code>, <code>adhoc</code>) lalu <b>assign</b> project/folder ke sana, <mark>supaya ETL tidak menghabiskan kapasitas dashboard</mark>. Slot yang menganggur bisa dipakai bersama.</li><li>Enterprise Plus menambah fitur seperti <b>managed disaster recovery</b>.</li><li>Pengaman: <mark>custom quota</mark> (byte per user/project per hari), <b>maximum bytes billed</b> per query, dry run, budget + alert, billing export ke BigQuery.</li><li>Storage: harga long-term setelah 90 hari tidak diubah, plus partition/table expiration.</li></ul>`}],
 keys:["Compute terprediksi → reservation Editions (baseline + autoscaling)","Pisahkan ETL vs BI → reservation terpisah","Hentikan query kebablasan → custom quota + max bytes billed"]};

X.lessons["d5-l2"]={title:"Cara hemat di setiap service",why:"Bayar hanya saat job jalan, simpan data di GCS, dan taruh kapasitas Spot yang murah di secondary worker yang hanya mengerjakan compute.",
 cards:[
 {h:"Cara hemat per service",b:`<table><tr><th>Service</th><th>Cara hemat</th></tr><tr><td>Dataproc</td><td><mark>Ephemeral cluster</mark>, Spot secondary, autoscaling, scheduled deletion. Persistent hanya untuk pemakaian terus-menerus/interaktif</td></tr><tr><td>Dataflow</td><td>Batas max workers, ukuran mesin yang pas, <mark>FlexRS</mark> untuk batch yang tidak mendesak, Streaming Engine</td></tr><tr><td>Cloud Storage</td><td>Lifecycle rules, Autoclass, hindari sering membaca data dingin</td></tr><tr><td>Bigtable / Spanner</td><td>Autoscaling, HDD untuk data besar yang dingin (Bigtable)</td></tr><tr><td>Semua</td><td><b>Labels</b> + billing export ke BigQuery untuk melihat siapa menghabiskan berapa</td></tr></table>`},
 {h:"Jaga job penting tetap aman",b:`<ul><li><b>Reservation</b> BigQuery khusus untuk pipeline penting.</li><li>Cluster/app profile Bigtable terpisah untuk serving vs batch.</li><li>Pool/prioritas Composer untuk task penting.</li></ul>`}],
 keys:["Dataproc → ephemeral + Spot secondary","Batch Dataflow yang boleh menunggu → FlexRS","Siapa menghabiskan biaya → labels + billing export"]};

X.lessons["d5-l3"]={title:"Otomasi dengan Composer",why:"Task yang idempotent memberi hasil yang sama berapa kali pun dijalankan. Menimpa partisi run tersebut atau memakai MERGE mencegah duplikat saat retry dan backfill.",
 cards:[
 {h:"Kebiasaan DAG yang baik",b:`<ul><li><mark>Task idempotent</mark>: <code>WRITE_TRUNCATE</code> per partisi atau <code>MERGE</code>, jangan pernah append sembarangan.</li><li>Beri parameter berdasarkan tanggal logis (<code>{{ ds }}</code>) supaya <mark>backfill</mark> dan rerun bisa jalan.</li><li><b>Sensor</b> menunggu kondisi (file di GCS, DAG lain). <b>Retry</b> dengan jeda, plus <b>SLA</b> dan alert kegagalan.</li><li>Pekerjaan berat dijalankan lewat operator BigQuery/Dataflow/Dataproc. Composer mengorkestrasi, bukan mengolah data.</li><li>File DAG di-deploy ke folder <code>dags/</code> di bucket GCS environment, idealnya lewat CI/CD.</li></ul>`},
 {h:"Kesehatan environment",b:`<ul><li>Task tertahan di <b>queued</b> → kapasitas worker atau concurrency kurang → scale worker / atur parallelism.</li><li>Scheduler tertinggal → terlalu banyak atau terlalu berat file DAG saat di-parse. Jaga kode top-level DAG tetap ringan.</li></ul>`}],
 keys:["DAG idempotent + berparameter tanggal","Task queued → scale environment","Composer mengorkestrasi; service lain yang bekerja"]};

X.lessons["d5-l4"]={title:"Mengatur workload",why:"Query batch priority menunggu kapasitas kosong dan tidak dihitung ke batas query interactive bersamaan, jadi query mendesak bisa jalan duluan.",
 cards:[
 {h:"Interactive vs batch, isolasi",b:`<ul><li><b>Interactive</b> (default): dijalankan secepat mungkin dan dihitung ke concurrency.</li><li><mark>Batch</mark>: antre sampai kapasitas kosong. Cocok untuk pekerjaan yang tidak mendesak.</li><li><mark>Isolasi workload</mark>: reservation terpisah untuk ETL / BI / data science, dan project terpisah untuk visibilitas biaya.</li><li>Perencanaan kapasitas: pantau pemakaian slot dari waktu ke waktu (<code>INFORMATION_SCHEMA.JOBS</code>, admin resource charts) untuk menentukan baseline vs autoscaling.</li></ul>`}],
 keys:["Query tidak mendesak → batch priority","Tim/workload berbeda → reservation terpisah"]};

X.lessons["d5-l5"]={title:"Monitoring & troubleshooting",why:"INFORMATION_SCHEMA.JOBS mencatat setiap job beserta user, byte yang ditagih dan pemakaian slot, jadi ini sumber forensik yang tepat.",
 cards:[
 {h:"Kotak peralatan observability",b:`<table><tr><th>Tool</th><th>Dipakai untuk</th></tr><tr><td>Cloud Monitoring</td><td>Metrik, dashboard, <mark>alerting policy</mark> (system lag/data freshness Dataflow, oldest unacked age Pub/Sub, slot BigQuery)</td></tr><tr><td>Cloud Logging</td><td>Log, <mark>log-based metric</mark>, <mark>log sink</mark> → BigQuery / GCS / Pub/Sub</td></tr><tr><td>Audit log</td><td>Siapa melakukan apa, kapan</td></tr><tr><td><mark>INFORMATION_SCHEMA.JOBS</mark></td><td>Query mahal, user, error, antrean</td></tr><tr><td>Billing export</td><td>Tren biaya per project dan label</td></tr></table>`},
 {h:"Error yang sering muncul",b:`<ul><li><b>429 / quotaExceeded / rateLimitExceeded</b> → <mark>retry dengan exponential backoff</mark>, lalu minta tambahan quota kalau terus terjadi.</li><li><b>Resources exceeded</b> (BigQuery) → kurangi data sedini mungkin, hindari ORDER BY global di hasil raksasa, pecah query-nya.</li><li><b>Permission denied</b> di sebuah job → cek <mark>service account</mark> job-nya, bukan user-mu sendiri.</li><li>Dataflow OOM → mesin lebih besar, perbaiki hot key, side input lebih kecil.</li></ul>`}],
 keys:["Alert di metrik lag/backlog","Forensik biaya → INFORMATION_SCHEMA.JOBS","Error rate/quota → exponential backoff"]};

X.lessons["d5-l6"]={title:"Desain tahan gagal",why:"Tabel yang terhapus bisa dipulihkan dalam jendela time travel (sampai 7 hari). Fail-safe butuh Google support dan berlaku setelah jendela time travel lewat.",
 cards:[
 {h:"Pemulihan per service",b:`<table><tr><th>Service</th><th>Tool</th></tr><tr><td>BigQuery</td><td><mark>Time travel</mark> (≤7 hari) + fail-safe, snapshot, cross-region replication, managed DR (Enterprise Plus)</td></tr><tr><td>Cloud Storage</td><td>Dual/multi-region, turbo replication, versioning, soft delete</td></tr><tr><td>Pub/Sub</td><td><mark>Seek</mark> ke snapshot/timestamp, dead-letter topic</td></tr><tr><td>Dataflow</td><td>Drain/update, snapshot, jalankan ulang di region lain, dead-letter output</td></tr><tr><td>Dataproc</td><td>Data di GCS, HA mode, cukup buat ulang cluster</td></tr><tr><td>Bigtable</td><td>Replikasi + multi-cluster routing, backup</td></tr><tr><td>Cloud SQL</td><td>HA (zona), <mark>cross-region replica</mark> (region), PITR</td></tr><tr><td>Spanner</td><td>Konfigurasi multi-region, PITR, backup</td></tr></table>`},
 {h:"Data buruk atau hilang",b:`<ul><li>Validasi saat ingest: schema, Dataplex quality, Dataform assertion.</li><li>Arahkan record rusak ke <mark>dead-letter</mark> daripada menggagalkan semuanya.</li><li>Simpan <mark>salinan mentah yang tidak diubah</mark> di GCS supaya bisa diproses ulang.</li><li>Pipeline idempotent membuat replay jadi aman.</li></ul>`}],
 keys:["Salah di BigQuery → time travel","Putar ulang pesan → Pub/Sub seek","Simpan data mentah + pipeline idempotent = proses ulang yang aman"]};

q("d5q18","Kesalahan baru di BigQuery → time travel.",

X.tools.recover={title:"Recovery Picker",sub:"Ada yang rusak: apa perbaikan tercepat yang benar?",

 nodes:{
  start:{q:"Apa yang salah?",opts:["Data terhapus atau tertimpa tidak sengaja","Satu zona atau region mati","Deploy yang salah memproses pesan dengan keliru","Record korup atau tidak valid masuk","Job gagal karena error quota / rate limit"]},
  oops:{q:"Di mana?",opts:["Tabel BigQuery (dalam 7 hari terakhir)","Tabel BigQuery (lebih lama dari time travel)","Objek Cloud Storage","Baris Cloud SQL"]},
  bqtt:{result:"BigQuery time travel",why:"Query atau pulihkan tabel FOR SYSTEM_TIME AS OF titik sebelum kesalahan (sampai 7 hari). Tabel yang di-drop juga bisa dipulihkan.",keys:"undo, terhapus tidak sengaja, UPDATE salah"},
  bqsnap:{result:"Pulihkan dari table snapshot (atau fail-safe lewat support)",why:"Snapshot yang kamu jadwalkan menyimpan salinan titik-waktu selama yang kamu mau. Fail-safe hanya jendela singkat setelah time travel.",trap:"Tidak punya snapshot? Itu sebabnya snapshot perlu dijadwalkan untuk kebutuhan jangka panjang."},
  gcsv:{result:"Object versioning / soft delete",why:"Pulihkan versi sebelumnya, atau undelete dalam jendela soft delete."},
  sqlpitr:{result:"Point-in-time recovery Cloud SQL ke clone",why:"Pulihkan ke titik tepat sebelum kesalahan di sebuah clone, lalu copy barisnya kembali."},
  outage:{q:"Service mana yang harus tetap hidup?",opts:["Cloud SQL","Bigtable","BigQuery","Cloud Storage","Job Dataproc"]},
  sqlha:{result:"HA untuk zona · cross-region replica untuk region",why:"Regional HA instance failover antar zona. Kalau region hilang, promote cross-region read replica."},
  bthA:{result:"Replikasi + multi-cluster routing",why:"Cluster di beberapa zona/region dengan failover otomatis lewat app profile."},
  bqdr:{result:"Dataset multi-region / cross-region replication (managed DR)",why:"Simpan replika di region lain dan lakukan failover (managed disaster recovery di Enterprise Plus)."},
  gcsdr:{result:"Bucket dual-/multi-region (turbo replication untuk RPO 15 menit)",why:"Objek direplikasi antar region secara otomatis."},
  dpdr:{result:"Buat ulang cluster dan jalankan ulang (data ada di GCS)",why:"Karena storage terpisah, cluster bisa dibuang kapan saja. Pakai HA mode (3 master) untuk cluster yang berjalan lama."},
  replay:{result:"Pub/Sub seek ke snapshot atau timestamp",why:"Mundurkan subscription dan proses ulang dengan kode yang sudah diperbaiki. Ambil snapshot sebelum deploy yang berisiko.",keys:"proses ulang, replay, subscriber bermasalah"},
  bad:{result:"Dead-letter output + proses ulang dari data mentah",why:"Singkirkan record yang gagal (tagged output Dataflow / DLQ Pub/Sub), perbaiki, lalu proses ulang dari salinan mentah yang tidak diubah di GCS. Jaga pipeline tetap idempotent.",trap:"max_bad_records diam-diam membuang data, jadi jarang jadi jawaban terbaik."},
  quota:{result:"Exponential backoff (lalu minta tambahan quota)",why:"Retry dengan jeda yang makin panjang plus jitter. Kalau kebutuhanmu memang terus di atas batas, minta tambahan quota atau ubah desain (batching)."}
 }};

CQ("cjc1","d2","jalancepat","Ingestion","For phase 1, JalanCepat needs to move GPS ingestion to Google Cloud while its hundreds of existing Kafka producers keep working with minimal code changes, and the operations team wants to stop managing brokers. What should you use?",[
 ["Pub/Sub, after rewriting the producers to use the Pub/Sub client","Least ops long term, but rewriting hundreds of producers violates \"minimal code changes\" for phase 1.","Ops paling kecil dalam jangka panjang, tapi menulis ulang ratusan producer melanggar syarat \"perubahan kode minimal\" di fase 1."],
 ["Google Cloud Managed Service for Apache Kafka","Correct. Kafka API compatibility with no brokers to manage.","Benar. Kompatibel dengan Kafka API dan tidak perlu mengurus broker."],
 ["Kafka on Compute Engine VMs","Keeps the Kafka API but the team still manages brokers, against the business requirement.","Kafka API tetap, tapi tim masih mengurus broker, bertentangan dengan kebutuhan bisnis."],
 ["Upload GPS files to Cloud Storage every minute","Breaks the real-time requirement and changes every producer.","Melanggar kebutuhan real-time dan mengubah setiap producer."]],1,
 "Read the phase: \"minimal code changes\" now → Managed Kafka; Pub/Sub can come later.","Perhatikan fasenya: \"perubahan kode minimal\" sekarang → Managed Kafka; Pub/Sub bisa menyusul nanti.");
CQ("cjc2","d3","jalancepat","Bigtable","The app must look up a driver's latest location in under 10 ms while absorbing ~400,000 location writes per second. Which design fits best?",[
 ["BigQuery table partitioned by day","Analytical latency is seconds, not milliseconds.","Latency analitik itu detik, bukan milidetik."],
 ["Cloud SQL with read replicas","A single primary can't take 400k writes per second.","Satu primary tidak sanggup menerima 400 ribu write per detik."],
 ["Bigtable with row key driver_id#reverse_timestamp","Correct. Writes spread across drivers, and the newest reading for a driver is the first row of its prefix.","Benar. Write tersebar ke banyak driver, dan data terbaru seorang driver ada di baris pertama prefix-nya."],
 ["Bigtable with row key timestamp#driver_id","All current writes hit the same key range, causing a hotspot.","Semua write terbaru jatuh di range key yang sama, jadi terjadi hotspot."]],2,
 "Massive writes + <10 ms key lookups → Bigtable; entity first, reverse timestamp for latest.","Write masif + lookup per key <10 ms → Bigtable; entitas di depan, reverse timestamp untuk data terbaru.");
CQ("cjc3","d2","jalancepat","Windowing","JalanCepat needs demand per city area for every minute. Events can arrive up to 10 minutes late, and late events must still be counted. How should the Dataflow pipeline be configured?",[
 ["Fixed 1-minute windows on processing time","Late events would be counted in the wrong minute.","Event yang telat akan dihitung di menit yang salah."],
 ["Fixed 1-minute windows on event time, with allowed lateness of 10 minutes","Correct. Event-time windows place each event in the right minute, and allowed lateness keeps late events.","Benar. Window berbasis event time menaruh setiap event di menit yang tepat, dan allowed lateness menjaga event yang telat."],
 ["Session windows with a 1-minute gap","Session windows group activity per key until a gap. They aren't fixed per-minute buckets.","Session window mengelompokkan aktivitas per key sampai ada jeda. Itu bukan ember per menit."],
 ["A BigQuery scheduled query every minute","Not a streaming solution, and scheduled queries can't run every minute reliably at this scale.","Bukan solusi streaming, dan scheduled query tidak bisa diandalkan berjalan tiap menit di skala ini."]],1,
 "\"Every N minutes\" + late data → fixed event-time windows + allowed lateness.","\"Setiap N menit\" + data telat → fixed window berbasis event time + allowed lateness.");
CQ("cjc4","d1","jalancepat","Residency","Regulators require that Indonesian customer data stays in Indonesia. How do you guarantee this across all current and future projects?",[
 ["Ask teams to choose the Jakarta region","Not enforced, and someone will eventually pick another region.","Tidak dipaksakan, dan suatu saat ada yang memilih region lain."],
 ["Create resources in asia-southeast2 (Jakarta) and enforce the resource locations organization policy","Correct. An org-level guardrail prevents creating resources outside allowed locations.","Benar. Guardrail di level organisasi mencegah pembuatan resource di luar lokasi yang diizinkan."],
 ["Enable VPC Service Controls","Controls data exfiltration, not where resources are created.","Mengontrol exfiltration data, bukan lokasi pembuatan resource."],
 ["Encrypt everything with CMEK","Encryption doesn't control location.","Enkripsi tidak mengontrol lokasi."]],1,
 "Residency → region choice + resource locations org policy.","Residency → pilih region + org policy resource locations.");
CQ("cjc5","d2","jalancepat","Dataproc","The existing nightly Spark jobs must keep running during migration, and the company wants to stop paying for idle Hadoop capacity. What should you do?",[
 ["Run a persistent 60-node Dataproc cluster 24/7","Recreates the idle-capacity problem in the cloud.","Masalah kapasitas menganggur hanya pindah ke cloud."],
 ["Rewrite all Spark jobs in Apache Beam before migrating","Slow and risky, and the requirement says the jobs must keep running during migration.","Lambat dan berisiko, padahal syaratnya job harus tetap jalan selama migrasi."],
 ["Run the jobs on ephemeral Dataproc clusters with data in Cloud Storage and Spot secondary workers","Correct. Same Spark code, clusters exist only while jobs run, and storage is separate from compute.","Benar. Kode Spark sama, cluster hanya ada saat job jalan, dan storage terpisah dari compute."],
 ["Install Hadoop on Compute Engine VMs","Self-managed, which goes against reducing the operations team.","Dikelola sendiri, bertentangan dengan tujuan mengecilkan tim operasional."]],2,
 "Existing Spark + cost → ephemeral Dataproc + GCS + Spot secondaries.","Spark yang sudah ada + biaya → Dataproc ephemeral + GCS + Spot secondary.");

/* ---- Toko Serba ---- */
CQ("cts1","d1","tokoserba","Migration","Which service should Toko Serba use to migrate the Teradata warehouse, including schemas and historical data, into BigQuery?",[
 ["Storage Transfer Service","Copies files, not warehouse schemas and SQL.","Meng-copy file, bukan schema dan SQL warehouse."],
 ["BigQuery Data Transfer Service / BigQuery Migration Service for Teradata","Correct. Purpose-built for Teradata → BigQuery migrations.","Benar. Dibuat khusus untuk migrasi Teradata → BigQuery."],
 ["Database Migration Service","Targets Cloud SQL / AlloyDB, not BigQuery.","Tujuannya Cloud SQL / AlloyDB, bukan BigQuery."],
 ["Datastream","CDC from operational databases. Teradata warehouse migration isn't its job.","CDC dari database operasional. Migrasi warehouse Teradata bukan tugasnya."]],1,
 "Warehouse → BigQuery = DTS / Migration Service.","Warehouse → BigQuery = DTS / Migration Service.");
CQ("cts2","d1","tokoserba","Migration","The 1.2 PB HDFS archive must be in Google Cloud within 3 months. The site's 1 Gbps link is shared with store traffic. What should you do?",[
 ["Use gcloud storage cp in parallel over the link","1.2 PB at well under 1 Gbps takes far longer than 3 months.","1,2 PB dengan kecepatan jauh di bawah 1 Gbps butuh jauh lebih lama dari 3 bulan."],
 ["Use Storage Transfer Service with on-prem agents","Managed, but still limited by the same shared link.","Managed, tapi tetap dibatasi link yang sama."],
 ["Use Transfer Appliance","Correct. Even at full speed the link needs ~140 days, so ship the data physically.","Benar. Bahkan dengan kecepatan penuh link butuh ~140 hari, jadi kirim datanya secara fisik."],
 ["Upgrade to Dedicated Interconnect and copy it","Provisioning and the transfer itself likely won't fit the deadline, and it's costly for a one-time move.","Provisioning dan transfernya kemungkinan tidak sempat sebelum deadline, dan mahal untuk pemindahan satu kali."]],2,
 "Do the math (1 TB @ 100 Mbps ≈ 1 day). Too slow → Transfer Appliance.","Hitung dulu (1 TB @ 100 Mbps ≈ 1 hari). Terlalu lama → Transfer Appliance.");
CQ("cts3","d3","tokoserba","BigQuery design","Most sales queries filter on sale_date and store_id. How should the sales fact table be designed in BigQuery?",[
 ["Partition by sale_date and cluster by store_id","Correct. Date pruning plus block skipping on store_id.","Benar. Partisi tanggal yang tidak relevan dilewati, dan blok berdasarkan store_id juga dilewati."],
 ["One table per store","900 tables is an anti-pattern and makes cross-store reports painful.","900 tabel adalah anti-pattern dan menyulitkan laporan lintas toko."],
 ["Partition by store_id only","You lose date pruning, which is the most common filter.","Kehilangan pruning tanggal, padahal itu filter yang paling sering dipakai."],
 ["No partitioning; add LIMIT to queries","LIMIT doesn't reduce bytes scanned.","LIMIT tidak mengurangi byte yang di-scan."]],0,
 "Date filter → partition; high-cardinality ID filter → cluster.","Filter tanggal → partition; filter ID dengan banyak nilai → cluster.");
CQ("cts4","d4","tokoserba","Security","Each of the 900 store managers must see only their own store's rows in shared Looker Studio dashboards, and the team wants to stop maintaining per-store report copies. What should you implement?",[
 ["One authorized view per store","Works, but 900 views is exactly the maintenance burden they want to remove.","Bisa jalan, tapi 900 view adalah beban perawatan yang justru ingin dihilangkan."],
 ["Row-level access policies on the sales table, filtered by each manager's store","Correct. One table and one dashboard, with rows filtered per user or group.","Benar. Satu tabel dan satu dashboard, baris difilter per user atau group."],
 ["Policy tags on the store_id column","Hides a column. It doesn't filter rows.","Menyembunyikan kolom, bukan memfilter baris."],
 ["Separate datasets per store","Duplication and drift.","Data duplikat dan lama-lama tidak sinkron."]],1,
 "Different rows per user → row-level access policy.","Baris berbeda per user → row-level access policy.");
CQ("cts5","d5","tokoserba","Cost & capacity","After the migration, nightly ETL slows the morning dashboards and the on-demand bill varies wildly month to month. What should you do?",[
 ["Move the ETL to run at noon instead","Doesn't fix unpredictable spend and just moves the contention.","Tidak memperbaiki biaya yang tidak terprediksi dan hanya memindahkan bentrokannya."],
 ["Adopt BigQuery Editions with separate reservations for ETL and BI (baseline + autoscaling), and assign projects to each","Correct. Predictable capacity spend, and dashboards get guaranteed slots.","Benar. Biaya kapasitas bisa diprediksi dan dashboard mendapat slot yang terjamin."],
 ["Add LIMIT to all ETL queries","Doesn't reduce slot use meaningfully.","Tidak mengurangi pemakaian slot secara berarti."],
 ["Buy flat-rate slots","Flat-rate is retired. Editions is the modern equivalent.","Flat-rate sudah pensiun. Editions adalah penggantinya."]],1,
 "Isolation + predictability → Editions reservations.","Isolasi + biaya terprediksi → reservation Editions.");

/* ---- DanaKu ---- */
CQ("cdk1","d1","danaku","PII","Analysts must join loan and payment tables on NIK without ever seeing real NIK values, and compliance must be able to recover real values during investigations. What should you do?",[
 ["Redact NIK with Sensitive Data Protection","Redaction breaks the join and can't be reversed.","Redaction merusak join dan tidak bisa dikembalikan."],
 ["Hash NIK with SHA-256 in the pipeline","Joinable, but compliance can't recover the real values.","Bisa di-join, tapi compliance tidak bisa mengembalikan nilai aslinya."],
 ["Tokenize NIK with deterministic encryption (or FPE) via Sensitive Data Protection in the Dataflow pipeline, with the key in Cloud KMS","Correct. The same NIK always gives the same token, so joins work, and authorized key holders can reverse it.","Benar. NIK yang sama selalu jadi token yang sama, jadi join tetap jalan, dan pemegang kunci yang berwenang bisa membaliknya."],
 ["Restrict the NIK column with policy tags","Analysts couldn't join on it at all, and raw values are still stored.","Analis jadi tidak bisa join sama sekali, dan nilai mentahnya tetap tersimpan."]],2,
 "Joinable + reversible → deterministic tokenization / FPE.","Bisa di-join + bisa dibalik → deterministic tokenization / FPE.");
CQ("cdk2","d1","danaku","Encryption","DanaKu must control the encryption keys for its BigQuery datasets and Cloud Storage buckets and be able to revoke access instantly. What should you configure?",[
 ["Default Google-managed encryption","No customer control over the keys.","Pelanggan tidak punya kontrol atas kunci."],
 ["CMEK with keys in Cloud KMS","Correct. You control rotation, and disabling the key revokes access.","Benar. Kamu mengontrol rotasi, dan men-disable kunci berarti mencabut akses."],
 ["CSEK for BigQuery and Cloud Storage","BigQuery doesn't support CSEK.","BigQuery tidak mendukung CSEK."],
 ["Client-side encryption before loading into BigQuery","BigQuery couldn't query the encrypted values.","BigQuery tidak bisa meng-query nilai yang terenkripsi."]],1,
 "Control + revoke keys → CMEK.","Kontrol + cabut kunci → CMEK.");
CQ("cdk3","d1","danaku","Perimeter","Security wants to make sure data in the analytics projects can't be copied to any project outside the company, even if an employee's credentials are stolen. What should you implement?",[
 ["Stricter IAM roles","IAM can't stop someone who already holds valid credentials.","IAM tidak bisa menahan orang yang sudah memegang kredensial valid."],
 ["A VPC Service Controls perimeter around the analytics projects","Correct. Blocks data from leaving the perimeter through Google APIs.","Benar. Memblokir data keluar dari perimeter lewat API Google."],
 ["CMEK on all datasets","An attacker with valid access can still read and copy the data.","Penyerang dengan akses valid tetap bisa membaca dan meng-copy data."],
 ["Private Google Access","Provides private connectivity. It doesn't prevent exfiltration.","Menyediakan konektivitas privat, bukan mencegah exfiltration."]],1,
 "Exfiltration with valid credentials → VPC Service Controls.","Exfiltration dengan kredensial valid → VPC Service Controls.");
CQ("cdk4","d5","danaku","Audit","Auditors want a monthly report of everyone who queried the salaries table, and the logs must be kept for 5 years. What should you set up?",[
 ["Admin Activity audit logs","Record configuration changes, not data reads.","Mencatat perubahan konfigurasi, bukan pembacaan data."],
 ["BigQuery Data Access audit logs routed by a log sink to a BigQuery dataset (and/or GCS) with 5-year retention","Correct. Data access is logged by default for BigQuery, and the sink keeps it for analysis and retention.","Benar. Akses data BigQuery tercatat secara default, dan sink menyimpannya untuk analisis dan retensi."],
 ["INFORMATION_SCHEMA.JOBS only","History is limited (~180 days), so it doesn't meet 5 years.","Riwayatnya terbatas (~180 hari), jadi tidak memenuhi 5 tahun."],
 ["Ask analysts to log their queries in a spreadsheet","Not reliable.","Tidak bisa diandalkan."]],1,
 "Who read the data + long retention → Data Access logs + log sink.","Siapa yang membaca data + retensi panjang → Data Access logs + log sink.");
CQ("cdk5","d4","danaku","ML","Analysts (strong in SQL) need a default-prediction model on BigQuery data quickly. About 2% of loans default. Which approach is best?",[
 ["Vertex AI custom training with a new TensorFlow model","Possible, but slow for SQL analysts and not needed for tabular data in BigQuery.","Bisa, tapi lambat untuk analis SQL dan tidak perlu untuk data tabular di BigQuery."],
 ["BigQuery ML (e.g. boosted_tree_classifier) with class weighting, evaluated on precision/recall rather than accuracy","Correct. ML in SQL where the data lives, with an evaluation that suits rare positives.","Benar. ML dengan SQL di tempat datanya berada, dengan evaluasi yang cocok untuk kasus positif yang langka."],
 ["BigQuery ML linear_reg, optimized for accuracy","It's the wrong problem type (classification, not regression), and accuracy is misleading at 2% positives.","Jenis masalahnya salah (klasifikasi, bukan regresi), dan accuracy menyesatkan kalau positifnya hanya 2%."],
 ["The Natural Language API","Not a tabular prediction tool.","Bukan tool untuk prediksi data tabular."]],1,
 "SQL users + BigQuery data → BigQuery ML; imbalanced → precision/recall.","User SQL + data BigQuery → BigQuery ML; data tidak seimbang → precision/recall.");

/* ---- StreamNusa ---- */
CQ("csn1","d2","streamnusa","Windowing","StreamNusa wants viewing sessions per user, where a session ends after 30 minutes without heartbeats. Offline devices can send events up to 1 hour late. How should the Dataflow pipeline be configured?",[
 ["Fixed 30-minute windows on processing time","Cuts sessions at arbitrary boundaries and misplaces late events.","Memotong sesi di batas yang sembarangan dan salah menempatkan event yang telat."],
 ["Session windows with a 30-minute gap keyed by user, on event time, with allowed lateness of 1 hour","Correct. A gap-based window per user, correct even when events arrive late.","Benar. Window berbasis jeda per user, tetap benar walaupun event datang terlambat."],
 ["Sliding 30-minute windows every minute","Overlapping time ranges, not sessions.","Rentang waktu yang tumpang tindih, bukan sesi."],
 ["A global window with no trigger","Never emits results on an unbounded stream.","Tidak pernah mengeluarkan hasil di stream yang tidak berujung."]],1,
 "\"Until idle for X\" → session windows; late data → event time + allowed lateness.","\"Sampai idle selama X\" → session window; data telat → event time + allowed lateness.");
CQ("csn2","d2","streamnusa","Pub/Sub","All raw events must also land in BigQuery exactly as received, with the least operational overhead. What should you add?",[
 ["A second Dataflow pipeline that writes raw events","Works, but it's another pipeline to run and pay for.","Bisa, tapi itu pipeline tambahan yang harus dijalankan dan dibayar."],
 ["A BigQuery subscription on the existing Pub/Sub topic","Correct. Pub/Sub writes messages straight into a table, with no pipeline to manage.","Benar. Pub/Sub menulis pesan langsung ke tabel, tanpa pipeline yang perlu diurus."],
 ["A Cloud Run service that inserts rows","Custom code to maintain.","Kode custom yang harus dirawat."],
 ["Hourly exports from Cloud Storage","Extra steps and delay.","Langkah tambahan dan ada jeda."]],1,
 "No transformation → BigQuery subscription.","Tanpa transformasi → BigQuery subscription.");
CQ("csn3","d4","streamnusa","Sharing","25 advertisers need daily access to their ad-impression data. They must always see fresh data, pay for their own queries, and no data copies may be made. What should you use?",[
 ["Daily CSV exports to each advertiser's bucket","Copies, and the data goes stale.","Ada salinan, dan datanya jadi basi."],
 ["Analytics Hub (BigQuery sharing) listings, with row-level filtering per advertiser where needed","Correct. Linked datasets with no copies, live data, and subscribers pay for compute.","Benar. Linked dataset tanpa salinan, data selalu terbaru, dan subscriber membayar compute-nya."],
 ["dataViewer on StreamNusa's project for each advertiser","Their queries would bill to StreamNusa's project and expose too much.","Query mereka akan ditagih ke project StreamNusa dan membuka akses terlalu luas."],
 ["Copy tables into each advertiser's project nightly","Copies and staleness.","Ada salinan dan datanya basi."]],1,
 "Share live, no copies, consumers pay → Analytics Hub.","Berbagi data live, tanpa salinan, konsumen yang bayar → Analytics Hub.");
CQ("csn4","d4","streamnusa","BigQuery ML","SQL analysts want \"viewers who watched X also watched Y\" recommendations from the viewing history in BigQuery. Which approach fits?",[
 ["BigQuery ML matrix_factorization","Correct. Collaborative filtering recommendations in SQL.","Benar. Rekomendasi collaborative filtering dengan SQL."],
 ["BigQuery ML arima_plus","That's for time-series forecasting.","Itu untuk forecasting time series."],
 ["Vision API","Not relevant.","Tidak relevan."],
 ["BigQuery ML kmeans only","Clusters users, but doesn't produce item-to-item recommendations directly.","Mengelompokkan user, tapi tidak langsung menghasilkan rekomendasi antar item."]],0,
 "Recommendations in BigQuery → matrix_factorization.","Rekomendasi di BigQuery → matrix_factorization.");
CQ("csn5","d5","streamnusa","Troubleshooting","During evening peaks, the Dataflow job's data freshness degrades steadily while worker CPU stays low. The job calls the internal metadata API once per event. What should you do?",[
 ["Increase max workers only","CPU is low, so compute isn't the bottleneck.","CPU rendah, jadi compute bukan bottleneck-nya."],
 ["Batch the API calls (e.g. GroupIntoBatches) and/or cache the metadata or load it as a side input","Correct. Low CPU with growing lag means waiting on I/O, so cut the per-event round-trips.","Benar. CPU rendah tapi lag naik artinya menunggu I/O, jadi kurangi round-trip per event."],
 ["Switch to session windows","Unrelated to the bottleneck.","Tidak berhubungan dengan bottleneck-nya."],
 ["Cancel and restart the job","Loses in-flight data and doesn't fix the cause.","Menghilangkan data in-flight dan tidak memperbaiki penyebabnya."]],1,
 "Lag + low CPU → slow external calls; batch/cache them.","Lag + CPU rendah → pemanggilan eksternal yang lambat; batch atau cache.");
