(function(){
const d1 = PDE.domains.find(d=>d.id==="d1");
d1.ready = true;
d1.tools = ["protect","transfer"];
d1.lessons = [
{id:"d1-l1",title:"IAM the Google way",mins:5,
 opener:{q:"Analysts must query tables in the finance dataset but must not change them. What's the least-privilege setup?",
  opts:["Project Editor for each analyst","bigquery.dataViewer on the dataset + bigquery.jobUser on the project, granted to an analysts group","bigquery.admin on the dataset","bigquery.dataOwner on the project"],ans:1,
  why:"Reading tables (dataViewer) and running queries (jobUser) are separate permissions. Grant both at the smallest scope, to a group, not to individuals."},
 cards:[
  {h:"Hierarchy & inheritance",b:`<ul><li><b>Organization → Folders → Projects → Resources</b>. Permissions are <mark>inherited downward</mark>. A child can't remove what a parent granted.</li><li>Principals: Google accounts, <mark>Google Groups (preferred)</mark>, <b>service accounts</b> (apps), Workload Identity Federation (external workloads, no keys).</li><li>Roles: <b>basic</b> (Owner/Editor/Viewer, avoid) · <mark>predefined</mark> (default choice) · custom (only if no predefined role fits).</li></ul>`},
  {h:"BigQuery roles to know",b:`<table><tr><th>Role</th><th>Use</th></tr><tr><td>dataViewer</td><td>Read tables</td></tr><tr><td>dataEditor</td><td>Read + write data (pipelines)</td></tr><tr><td>dataOwner</td><td>Manage dataset access</td></tr><tr><td><mark>jobUser</mark></td><td>Run queries in a project</td></tr><tr><td>user</td><td>Run jobs + create datasets</td></tr><tr><td>admin</td><td>Almost never the answer</td></tr></table><div class="box trap"><div class="l">Old fact</div>"BigQuery has no table-level security" is outdated. There's table IAM, row-level policies, column policy tags and masking.</div>`},
  {h:"Service accounts & org policies",b:`<ul><li>One service account per pipeline, least privilege, avoid downloaded keys.</li><li><code>iam.serviceAccountUser</code> only for people who must run jobs as that SA.</li><li><mark>Organization policies</mark> are guardrails: <code>gcp.resourceLocations</code> (data residency), disable SA key creation, restrict public IPs.</li></ul>`}
 ],
 keys:["Predefined roles → groups/service accounts → smallest scope","Analyst = dataViewer + jobUser","Residency guardrail → resource locations org policy"]},

{id:"d1-l2",title:"Encryption & key management",mins:4,
 opener:{q:"Compliance says the company must be able to revoke Google's ability to decrypt its BigQuery data at any time. What should you use?",
  opts:["Default Google-managed encryption","CMEK with Cloud KMS","CSEK","Client-side encryption only"],ans:1,
  why:"With CMEK you control the key in Cloud KMS. Disabling or destroying it makes the data unreadable. CSEK isn't supported by BigQuery, and client-side encryption would break BigQuery queries."},
 cards:[
  {h:"Who holds the key?",b:`<table><tr><th>Option</th><th>Pick when</th></tr><tr><td>Google-managed</td><td>Default, nothing special required</td></tr><tr><td><mark>CMEK (Cloud KMS)</mark></td><td>"Control rotation", "revoke access", "we must manage keys"</td></tr><tr><td>Cloud HSM</td><td>Hardware-backed keys (FIPS 140-2 L3)</td></tr><tr><td><mark>Cloud EKM</mark></td><td>Keys must stay outside Google</td></tr><tr><td>CSEK</td><td>Only GCS + Compute Engine disks</td></tr><tr><td>Client-side</td><td>Google must never see plaintext</td></tr></table>`},
  {h:"Crypto-shredding",b:`<p>Destroy or disable a CMEK key, and everything encrypted with it becomes unreadable. Useful for "delete all data for this customer/tenant" when you use a key per tenant.</p><div class="box trap"><div class="l">Trap</div><mark>CSEK is not supported in BigQuery.</mark> Any answer combining the two is wrong.</div>`}
 ],
 keys:["Control/revoke keys → CMEK","Keys outside Google → EKM","CSEK only for GCS/GCE"]},

{id:"d1-l3",title:"PII & Sensitive Data Protection",mins:5,
 opener:{q:"Analysts must join two tables on email address, but must never see real emails. Which de-identification technique?",
  opts:["Redact emails","Deterministic encryption / tokenization with Sensitive Data Protection (DLP)","Replace emails with random UUIDs per row","Bucketing"],ans:1,
  why:"Deterministic tokenization maps the same email to the same token in both tables, so joins still work. It's also reversible with the key. Redaction and random values break joins."},
 cards:[
  {h:"What DLP does",b:`<ul><li><b>Inspect</b>: finds 150+ infoTypes (cards, emails, IDs, custom regex) in BigQuery, GCS, Datastore, or streams via the API.</li><li><b>De-identify</b>, then <b>risk analysis</b> (k-anonymity, l-diversity).</li><li>Typical flow: raw → staging bucket → DLP/Dataflow de-identify → BigQuery.</li></ul>`},
  {h:"Pick the right technique",b:`<table><tr><th>Technique</th><th>Joinable?</th><th>Reversible?</th></tr><tr><td>Redaction / masking</td><td>No</td><td>No</td></tr><tr><td><mark>Deterministic encryption / FPE (tokenization)</mark></td><td>Yes</td><td>Yes (with key)</td></tr><tr><td>Crypto hash</td><td>Yes</td><td>No</td></tr><tr><td>Bucketing / date shifting</td><td>Partly</td><td>No</td></tr></table><p>Try the <b>Protect-the-data Picker</b> tool in this domain.</p>`}
 ],
 keys:["Join without exposing → deterministic tokenization / FPE","Irreversible display masking → redaction/masking","Measure re-identification risk → DLP risk analysis"]},

{id:"d1-l4",title:"Perimeters, networks & audit",mins:4,
 opener:{q:"Even with strict IAM, the CISO worries that stolen credentials could be used to copy BigQuery data to a personal project. What prevents this?",
  opts:["Stronger passwords","VPC Service Controls perimeter around the projects","CMEK","Removing the dataViewer role from everyone"],ans:1,
  why:"VPC Service Controls blocks data from leaving the perimeter even when the request has valid credentials. IAM alone can't stop someone who holds stolen credentials."},
 cards:[
  {h:"Network controls",b:`<ul><li><mark>VPC Service Controls</mark>: perimeter that stops exfiltration via Google APIs.</li><li><b>Private Google Access</b>: VMs without public IPs reach Google APIs.</li><li><b>Private Service Connect</b>: private endpoints for services.</li></ul>`},
  {h:"Audit & environments",b:`<ul><li>Audit logs: <b>Admin Activity</b> (always on) · <b>Data Access</b> (off by default for most services, <mark>on by default for BigQuery</mark>) · System Event · Policy Denied.</li><li>"Who read this table?" → Data Access logs, exported to BigQuery with a log sink.</li><li><mark>Separate projects for dev / test / prod.</mark></li><li>Dataset location is fixed at creation. Residency = choose the region + enforce it with an org policy.</li></ul>`}
 ],
 keys:["Exfiltration with valid creds → VPC-SC","Who accessed data → Data Access audit logs","Environment isolation → separate projects"]},

{id:"d1-l5",title:"Reliability, fidelity & DR",mins:4,
 opener:{q:"A pipeline's RPO is 24 hours and RTO is 2 days. Budget is tight. Which DR approach fits?",
  opts:["Spanner multi-region","Active-active in two regions","Scheduled backups/exports to another region","Cloud SQL HA only"],ans:2,
  why:"Loose RPO/RTO → the cheapest option that meets them: backups or snapshots in another region. The others cost far more than needed, and HA alone doesn't cover a region loss."},
 cards:[
  {h:"Vocabulary",b:`<ul><li><mark>RPO</mark> = how much data you can lose. <mark>RTO</mark> = how long you can be down.</li><li>Lower RPO/RTO = more cost. Pick the cheapest option that meets the stated numbers.</li><li>Patterns: multi-region storage · cross-region replicas · replication with failover · backups to another region.</li></ul>`},
  {h:"Fidelity (correct data)",b:`<ul><li><b>Dataform</b>: SQL transforms with <mark>assertions</mark> (tests) and dependencies.</li><li><b>Dataplex data quality scans</b>: rules + alerts.</li><li>Dead-letter outputs for bad records. Avoid <code>max_bad_records</code> as the "solution" (it silently drops rows).</li><li>Validate migrations with row counts and checksums, and run old and new in parallel.</li></ul>`}
 ],
 keys:["Cheapest DR that meets RPO/RTO","Data tests → Dataform assertions / Dataplex quality"]},

{id:"d1-l6",title:"Portability & multicloud",mins:3,
 opener:{q:"Iceberg tables in Cloud Storage must be queried by both BigQuery and Spark, with column-level security. What should you use?",
  opts:["External CSV tables","BigLake tables","Copy the data into native BigQuery","Bigtable"],ans:1,
  why:"BigLake provides governed tables over open formats like Iceberg, readable from BigQuery and Spark with fine-grained security."},
 cards:[
  {h:"Open & multicloud",b:`<ul><li><mark>BigQuery Omni</mark>: analytics on data in AWS/Azure without moving it.</li><li><mark>BigLake</mark>: open-format lakehouse tables (Parquet, ORC, Iceberg) with row/column security.</li><li>Portability: open formats, Beam (runs on Dataflow/Flink/Spark), containers.</li><li><b>Dataplex Universal Catalog</b>: discovery, metadata, profiling, lineage.</li></ul>`}
 ],
 keys:["Data in other clouds → Omni","Open formats + governance → BigLake"]},

{id:"d1-l7",title:"Data migrations",mins:6,
 opener:{q:"You must move 800 TB from an on-prem data center to Cloud Storage. The internet link is 200 Mbps and the project must finish within a month. What should you use?",
  opts:["gcloud storage cp","Storage Transfer Service","Transfer Appliance","Datastream"],ans:2,
  why:"800 TB at 200 Mbps takes about 400 days. Ship it physically with Transfer Appliance. Rule of thumb: 1 TB at 100 Mbps ≈ 1 day."},
 cards:[
  {h:"Pick the transfer tool",b:`<table><tr><th>Tool</th><th>When</th></tr><tr><td>gcloud storage</td><td>Small/medium copies (parallel)</td></tr><tr><td><mark>Storage Transfer Service</mark></td><td>Large, scheduled, S3/Azure/HTTP/on-prem (agents)</td></tr><tr><td><mark>Transfer Appliance</mark></td><td>Huge data + slow network (weeks or months online)</td></tr><tr><td><mark>BigQuery DTS</mark></td><td>Teradata/Redshift migration, SaaS (Ads, YouTube), scheduled queries</td></tr><tr><td><mark>Database Migration Service</mark></td><td>MySQL/Postgres/SQL Server/Oracle → Cloud SQL/AlloyDB, minimal downtime</td></tr><tr><td><mark>Datastream</mark></td><td>CDC → BigQuery/GCS, near real time</td></tr></table><p>Use the <b>Transfer Calculator</b> tool to practise the math.</p>`},
  {h:"Network & playbook",b:`<ul><li><b>Cloud VPN</b>: quick, encrypted over the internet, moderate bandwidth. <b>Dedicated Interconnect</b>: private 10/100 Gbps. <b>Partner Interconnect</b>: via a provider.</li><li>Playbook: <b>assess → plan → migrate → validate → optimize</b>.</li><li>Lift &amp; shift: Hadoop → Dataproc · Kafka → Managed Kafka · HBase → Bigtable · Airflow → Composer · MySQL → Cloud SQL. Modernize: → BigQuery, Dataflow, Pub/Sub.</li></ul>`}
 ],
 keys:["1 TB @100 Mbps ≈ 1 day → too slow = Transfer Appliance","Warehouse → BigQuery DTS · DB → DMS · CDC → Datastream","Private high throughput → Interconnect"]}
];

PDE.tools.protect = {title:"Protect-the-data Picker",sub:"Which security control does the scenario need?",
 intro:"Security questions are about picking the control that matches the threat. Answer as the scenario would.",
 nodes:{
  start:{q:"What's the main concern in the scenario?",opts:[["Who can access what (people/apps)","iam"],["Who holds the encryption keys","keys"],["Sensitive values (PII) inside the data","pii"],["Data leaving the company, even with valid credentials","vpcsc"],["Data must stay in a geography","resid"],["Proving who accessed data","audit"]]},
  iam:{q:"Who needs access?",opts:[["Analysts who only query","iamA"],["A pipeline / application","iamSA"],["Different users see different rows or columns","fine"]]},
  iamA:{result:"dataViewer + jobUser, to a Google Group",why:"Read on the dataset, run jobs in the project, smallest scope, managed through a group.",keys:"least privilege, analysts, query only",trap:"Basic roles (Editor/Owner) or bigquery.admin are almost never correct.",color:"#4f46e5"},
  iamSA:{result:"Dedicated service account with a predefined role",why:"One service account per pipeline, e.g. dataEditor on the target dataset. Avoid downloaded keys (use attached SAs or Workload Identity Federation).",keys:"service account, least privilege",color:"#4f46e5"},
  fine:{result:"Row-level policies / policy tags / authorized views",why:"Rows → row access policies. Columns → policy tags (+ dynamic masking). Share results only → authorized view.",keys:"fine-grained access",color:"#d97706"},
  keys:{q:"What's the key requirement?",opts:[["We must control rotation and be able to revoke","cmek"],["Keys must live in hardware (HSM)","hsm"],["Keys must never be stored in Google","ekm"],["Google must never see plaintext","cse"]]},
  cmek:{result:"CMEK (Cloud KMS)",why:"You manage the key, and disabling or destroying it makes the data unreadable (crypto-shredding).",keys:"control keys, rotate, revoke",trap:"CSEK isn't supported by BigQuery.",color:"#4f46e5"},
  hsm:{result:"Cloud HSM (CMEK in hardware)",why:"Keys are kept in FIPS 140-2 Level 3 HSMs.",color:"#4f46e5"},
  ekm:{result:"Cloud External Key Manager (EKM)",why:"Keys stay in an external key manager outside Google.",color:"#4f46e5"},
  cse:{result:"Client-side encryption",why:"Encrypt before upload. Google only ever stores ciphertext.",trap:"BigQuery can't query data it can't decrypt.",color:"#4f46e5"},
  pii:{q:"What must still be possible after protecting the values?",opts:[["Joins and counts on the protected column, and reversibility","tok"],["Nothing, just hide it for display","mask"],["Joins, but it must be one-way","hash"],["Keep the rough shape (ages, dates)","bucket"]]},
  tok:{result:"Deterministic encryption / FPE tokenization (DLP)",why:"The same input always gives the same token, so joins work and it's reversible with the key.",keys:"pseudonymize, join on PII",color:"#16a34a"},
  mask:{result:"Masking / redaction (DLP)",why:"Irreversible: ****1234 or removed entirely.",color:"#16a34a"},
  hash:{result:"Cryptographic hashing (DLP)",why:"Consistent but one-way: joinable, not reversible.",color:"#16a34a"},
  bucket:{result:"Bucketing / date shifting (DLP)",why:"Generalizes values to reduce re-identification while keeping analytic shape.",color:"#16a34a"},
  vpcsc:{result:"VPC Service Controls",why:"A service perimeter blocks data from leaving protected projects via Google APIs, even with valid credentials.",keys:"exfiltration, stolen credentials",color:"#db2777"},
  resid:{result:"Regional resources + resource locations org policy",why:"Create datasets/buckets in the allowed region and enforce it org-wide with constraints/gcp.resourceLocations.",trap:"A BigQuery dataset's location can't be changed later.",color:"#0891b2"},
  audit:{result:"Cloud Audit Logs (Data Access) → log sink to BigQuery",why:"Data Access logs record who read data (on by default for BigQuery). Export with a sink for analysis or retention.",color:"#0891b2"}
 }};

const Q=(id,topic,q,opts,ans,tip,mock)=>({id,d:"d1",topic,q,opts:opts.map(([t,w])=>({t,w})),ans:Array.isArray(ans)?ans:[ans],tip,mock:!!mock});
PDE.questions.push(
Q("d1q01","IAM","A data science team of 12 people needs to create their own datasets and run queries in a sandbox project. What should you grant?",[
 ["roles/bigquery.user on the sandbox project to the team's Google Group","Correct. bigquery.user can run jobs and create datasets, and a group makes access easy to manage."],
 ["roles/owner on the project to each person","A basic role, far too broad."],
 ["roles/bigquery.dataViewer on the project","Can read, but can't run queries or create datasets."],
 ["roles/bigquery.admin to each person individually","Too broad, and granted to individuals instead of a group."]],0,"Self-service analysts → bigquery.user, to a group."),
Q("d1q02","IAM","A Dataflow pipeline must read from Pub/Sub and write to one BigQuery dataset. What's the best identity setup?",[
 ["Run it as a developer's user account","Personal accounts break when people leave, and they're over-privileged."],
 ["A dedicated worker service account with the Pub/Sub subscriber role and dataEditor on the target dataset only","Correct. One SA per pipeline with least privilege."],
 ["The Compute Engine default service account with Editor","Editor is far too broad."],
 ["A service account key file stored in the code repository","Leaked keys are a major risk."]],1,"Pipelines → dedicated service account, least privilege."),
Q("d1q03","IAM","Your organization must ensure that no one can create resources outside Europe, in any project. What should you do?",[
 ["Tell teams to choose EU regions","Not enforced."],
 ["Set the resource locations organization policy (constraints/gcp.resourceLocations) to EU locations at the organization level","Correct. Enforced for every project in the organization."],
 ["Remove Editor roles from developers","Doesn't control location."],
 ["Use VPC Service Controls","Controls data exfiltration, not where resources are created."]],1,"Residency guardrail → resource locations org policy."),
Q("d1q04","IAM","An external CI system on GitHub Actions must deploy Dataflow templates to your project. Security forbids long-lived service account keys. What should you use?",[
 ["Create a service account key and store it as a GitHub secret","A long-lived key, which is exactly what's forbidden."],
 ["Workload Identity Federation with GitHub's OIDC provider, impersonating a deploy service account","Correct. Short-lived credentials with no keys."],
 ["Grant the GitHub organization Owner on the project","Wildly over-privileged."],
 ["Have a developer deploy manually","Not CI/CD."]],1,"External workloads, no keys → Workload Identity Federation."),
Q("d1q05","Encryption","A healthcare company requires that encryption keys for its BigQuery and Cloud Storage data be rotated every 90 days under its own control, and that access can be revoked instantly. What should you configure?",[
 ["CMEK with Cloud KMS keys and a 90-day rotation schedule","Correct. You control rotation, and disabling the key revokes access."],
 ["Default encryption","Google manages it, so you have no control."],
 ["CSEK for both services","CSEK isn't supported by BigQuery."],
 ["Client-side encryption for BigQuery","BigQuery can't query data it can't decrypt."]],0,"Control + rotate + revoke → CMEK."),
Q("d1q06","Encryption","A government customer requires that encryption keys are held in their own key management system outside Google Cloud. Which option meets this?",[
 ["Cloud KMS software keys","Stored in Google."],
 ["Cloud HSM","Hardware, but still within Google."],
 ["Cloud External Key Manager (EKM)","Correct. Keys stay in an external, partner-hosted or on-prem key manager."],
 ["Google-managed keys","Fully Google-held."]],2,"Keys outside Google → EKM."),
Q("d1q07","Encryption","A SaaS platform stores each tenant's data in its own BigQuery dataset. When a tenant leaves, all of their data must become unrecoverable immediately, including backups. What design supports this best?",[
 ["Delete the dataset and rely on time travel expiring","Time travel and fail-safe keep data recoverable for days."],
 ["A separate CMEK key per tenant; destroy the tenant's key when they leave","Correct. Crypto-shredding makes every copy encrypted with that key unreadable."],
 ["Row-level security per tenant","Controls access, but doesn't destroy data."],
 ["Export tenant data to GCS, then delete it","Doesn't address backups."]],1,"Immediate unrecoverable deletion → per-tenant CMEK + crypto-shredding."),
Q("d1q08","DLP","Customer support transcripts in Cloud Storage may contain credit card numbers and phone numbers. Before loading them into BigQuery, these must be found and masked automatically. What should you use?",[
 ["Regular expressions in a BigQuery view","Fragile, and the raw data still lands in BigQuery."],
 ["Sensitive Data Protection (DLP) inspection + de-identification in the pipeline (e.g. Dataflow) before loading","Correct. DLP detects infoTypes and masks them before the data is stored."],
 ["Column-level security on the transcript column","Hides the whole column, doesn't mask values inside the text."],
 ["CMEK on the bucket","Encryption doesn't remove PII."]],1,"Find + mask PII in content → DLP."),
Q("d1q09","DLP","Researchers need patient records where exact ages and dates of birth are hidden, but they still want age-group trends and the time intervals between visits. Which TWO techniques fit?",[
 ["Bucketing ages into ranges","Correct. Keeps trends while hiding exact values."],
 ["Date shifting by a consistent random offset per patient","Correct. Hides real dates but preserves intervals."],
 ["Redacting ages and dates entirely","Destroys the trends the researchers need."],
 ["Storing the data in Archive class","Unrelated to de-identification."]],[0,1],"Keep shape, hide exact values → bucketing / date shifting."),
Q("d1q10","DLP","Analysts in two departments join their tables on customer national ID. Policy says they must not see real IDs, but the compliance team must be able to recover real IDs during audits. Which technique?",[
 ["Redaction","Breaks joins and can't be recovered."],
 ["SHA-256 hashing","Joinable, but not recoverable."],
 ["Deterministic encryption (or FPE) with a key in Cloud KMS","Correct. Joinable and reversible by authorized key holders."],
 ["Random token per row","Breaks joins."]],2,"Joinable + reversible → deterministic encryption / FPE."),
Q("d1q11","Perimeter","A bank wants to ensure that BigQuery data in its analytics projects can't be copied to any project outside the company, even if an employee's credentials are compromised. What should you implement?",[
 ["VPC Service Controls service perimeter around the analytics projects","Correct. Blocks API-based exfiltration across the perimeter boundary."],
 ["Firewall rules","Don't control Google API data movement."],
 ["CMEK","The copy would still be readable by the attacker's project if the key permissions allow it, so this doesn't stop copying."],
 ["Two-factor authentication only","Helps, but doesn't stop misuse of valid sessions."]],0,"Exfiltration even with valid creds → VPC-SC."),
Q("d1q12","Network","Dataproc clusters run on VMs without external IP addresses, but jobs fail to read from Cloud Storage. What should you enable?",[
 ["Public IPs on all workers","Violates the no-external-IP design."],
 ["Private Google Access on the cluster's subnet","Correct. Internal-only VMs can reach Google APIs."],
 ["VPC Service Controls","A perimeter doesn't provide connectivity."],
 ["A Cloud VPN to Google","Not needed to reach Google APIs from inside the VPC."]],1,"No external IPs + Google APIs → Private Google Access."),
Q("d1q13","Audit","Security asks for a monthly report of every user who read the salaries table in BigQuery, kept for 3 years. What should you do?",[
 ["Enable Admin Activity logs","They record config changes, not data reads (and they're always on)."],
 ["Use BigQuery Data Access audit logs and route them with a log sink to a BigQuery dataset (or GCS) with 3-year retention","Correct. Data access is logged for BigQuery by default, and a sink keeps it for analysis and retention."],
 ["Ask users to self-report","Not reliable."],
 ["Query INFORMATION_SCHEMA.JOBS only","Retention is limited (about 180 days), so it doesn't meet 3 years."]],1,"Who read the data → Data Access audit logs + sink."),
Q("d1q14","Environments","Developers occasionally break production tables while testing pipeline changes. What's the Google-recommended structural fix?",[
 ["Ask developers to be careful","Not a control."],
 ["Separate projects for dev, test and prod, with different IAM, and promote changes via CI/CD","Correct. Isolation by project is the standard pattern."],
 ["Prefix test tables with test_","Same permissions, so the same risk."],
 ["Give developers Viewer on prod and Owner on dev in the same project","Roles are per project, and mixing environments in one project defeats the purpose."]],1,"Environment isolation → separate projects."),
Q("d1q15","Residency","A dataset was created in the US multi-region by mistake. It must now be in europe-west3. What should you do?",[
 ["Edit the dataset location","Dataset location can't be changed after creation."],
 ["Create a new dataset in europe-west3 and copy the tables (e.g. dataset copy / cross-region copy), then delete the old one","Correct. Location is fixed at creation, so copy into a new dataset."],
 ["Set an org policy","Prevents future mistakes but doesn't move data."],
 ["Use VPC Service Controls","Unrelated to location."]],1,"Wrong location → new dataset + copy."),
Q("d1q16","Reliability","Your transformation SQL in BigQuery occasionally produces duplicate order IDs, which nobody notices for days. You want the pipeline to fail fast when this happens. What should you add?",[
 ["Dataform assertions (uniqueness) on the output table","Correct. Assertions run with the transformation and fail on bad data."],
 ["max_bad_records on load jobs","Silently drops rows, the opposite of failing fast."],
 ["A larger reservation","Unrelated."],
 ["Clustering by order_id","Organizes storage, doesn't validate."]],0,"Data tests in SQL pipelines → Dataform assertions (or Dataplex quality)."),
Q("d1q17","DR","An analytics dataset feeds a non-critical weekly report. Requirements: RPO 7 days, RTO 3 days, minimal cost. Which DR approach is enough?",[
 ["Managed cross-region replication with failover reservations","Far more than needed."],
 ["Periodic table snapshots or exports to Cloud Storage in another region","Correct. Cheap, and meets the loose RPO/RTO."],
 ["Active-active pipelines in two regions","Expensive overkill."],
 ["No DR at all","A region loss would exceed the RTO with nothing to restore."]],1,"Loose RPO/RTO → cheapest backup that meets them."),
Q("d1q18","Portability","A company wants its pipeline code to be portable so it can run on Google Cloud today and possibly on another runner later, without a rewrite. What should they build on?",[
 ["Apache Beam (run on Dataflow)","Correct. Beam pipelines run on Dataflow, Flink or Spark runners."],
 ["BigQuery stored procedures","Tied to BigQuery."],
 ["Cloud Run functions with proprietary APIs","Not a portable data-processing model."],
 ["Dataprep recipes","Tied to the service."]],0,"Portable pipelines → Apache Beam."),
Q("d1q19","Migration","You need to move 2 PB of archived files from an on-prem NAS to Cloud Storage. The site has a 1 Gbps connection that's shared with business traffic. What should you use?",[
 ["gcloud storage cp in parallel","2 PB over a shared 1 Gbps link takes many months."],
 ["Storage Transfer Service with on-prem agents","Still bound by the same slow link."],
 ["Transfer Appliance","Correct. For PB-scale data with constrained bandwidth, ship it physically."],
 ["Datastream","For database CDC."]],2,"PB + limited bandwidth → Transfer Appliance."),
Q("d1q20","Migration","Every night, new files in an Amazon S3 bucket must be copied to Cloud Storage, with retries and no servers to manage. What should you use?",[
 ["A cron job on a Compute Engine VM running aws s3 sync","Self-managed infrastructure."],
 ["Storage Transfer Service scheduled job from S3","Correct. Managed, scheduled, incremental, with retries."],
 ["Transfer Appliance","For offline bulk transfers."],
 ["BigQuery Omni","Queries S3 data; it doesn't copy files."]],1,"Recurring cloud-to-GCS copy → Storage Transfer Service."),
Q("d1q21","Migration","A retailer is migrating its on-prem Teradata warehouse to BigQuery, including schema and historical data. Which service is designed for this?",[
 ["Storage Transfer Service","Copies files, not warehouse schemas."],
 ["BigQuery Data Transfer Service (with the migration service for Teradata)","Correct. Purpose-built for warehouse migrations into BigQuery."],
 ["Database Migration Service","Targets Cloud SQL/AlloyDB, not BigQuery."],
 ["Datastream","CDC from operational databases, not Teradata warehouse migration."]],1,"Teradata/Redshift → BigQuery DTS / migration service."),
Q("d1q22","Migration","An e-commerce MySQL database (3 TB) must move to Cloud SQL with less than 10 minutes of downtime. What should you use?",[
 ["mysqldump and restore over a weekend","Hours of downtime."],
 ["Database Migration Service with continuous replication, then a short cut-over","Correct. Minimal-downtime migration into Cloud SQL."],
 ["Datastream to BigQuery","The wrong target."],
 ["Transfer Appliance","For files, and far too slow for this."]],1,"DB → Cloud SQL, minimal downtime → DMS."),
Q("d1q23","Networking","A hybrid architecture needs a private, high-throughput (20 Gbps+) and consistent connection between an on-prem data center and Google Cloud for daily bulk transfers. What should you choose?",[
 ["Cloud VPN over the internet","Lower and less predictable bandwidth."],
 ["Dedicated Interconnect","Correct. Private physical links of 10/100 Gbps."],
 ["Public internet with TLS","Not private or consistent."],
 ["Transfer Appliance every day","Offline and impractical for daily use."]],1,"Private + high throughput → Dedicated Interconnect."),
Q("d1q24","Migration","After migrating a large table from an on-prem warehouse to BigQuery, how should you validate the migration before switching users over?",[
 ["Check that the table exists","Says nothing about correctness."],
 ["Compare row counts and aggregate checksums per partition, and run key reports on both systems in parallel","Correct. Systematic validation before cut-over."],
 ["Ask one analyst to eyeball a few rows","Not systematic."],
 ["Delete the source immediately to avoid confusion","Removes your fallback."]],1,"Validate migrations → counts, checksums, parallel runs."),
Q("d1q25","Migration","A company runs Hive and Spark on-prem and wants to move to Google Cloud quickly now, then modernize later. What's the right sequence?",[
 ["Rewrite everything in Dataflow first","Slow, and against the \"quickly now\" requirement."],
 ["Lift and shift to Dataproc with data in Cloud Storage, then modernize to BigQuery/Dataflow over time","Correct. Move fast with minimal changes, then optimize."],
 ["Move to Compute Engine VMs with Hadoop installed","Self-managed, not Google's recommendation."],
 ["Stay on-prem until a full redesign is ready","Doesn't meet the goal."]],1,"Fast migration first (Dataproc), modernize later."),
Q("d1q26","Privacy","A marketing dataset in BigQuery has an email column. Most analysts may only see a masked version, while the CRM team may see real values. Analysts should still be able to query the table. What should you use?",[
 ["Two copies of the table","Duplication and drift."],
 ["A policy tag on the column with a dynamic data masking rule, and Fine-Grained Reader for the CRM team","Correct. One table, masked for most users, real values for authorized readers."],
 ["Delete the email column","The CRM team needs it."],
 ["VPC Service Controls","Not column-level."]],1,"Mask a column for some users → policy tags + dynamic masking."),

/* mock-only */
Q("d1m01","IAM","Which approach to granting BigQuery access is most aligned with Google's best practices?",[
 ["Grant predefined roles to Google Groups at the dataset level","Correct. Predefined roles, groups, smallest practical scope."],
 ["Grant Editor at the organization level","Basic role, maximum scope."],
 ["Grant custom roles with all permissions to each user","Over-privileged and hard to manage."],
 ["Share a single service account key with all analysts","Shared credentials, no accountability."]],0,null,true),
Q("d1m02","Encryption","Which statement about CSEK (customer-supplied encryption keys) is true?",[
 ["It's the recommended way to encrypt BigQuery tables","BigQuery doesn't support CSEK."],
 ["It's supported for Cloud Storage and Compute Engine disks only, and you must supply the key with each request","Correct."],
 ["Google stores the key for you in Cloud KMS","That's CMEK."],
 ["It replaces the need for IAM","Encryption doesn't replace access control."]],1,null,true),
Q("d1m03","DLP","You need to measure how easily individuals could be re-identified from a de-identified dataset before publishing it. What should you use?",[
 ["Sensitive Data Protection risk analysis (e.g. k-anonymity)","Correct. DLP computes re-identification risk metrics."],
 ["Cloud Audit Logs","Records access, not identifiability."],
 ["VPC Service Controls","Controls exfiltration, not risk."],
 ["CMEK","Encryption, not risk measurement."]],0,null,true),
Q("d1m04","Perimeter","A partner must be able to load data into one bucket inside your VPC Service Controls perimeter from their own project. What's the right approach?",[
 ["Remove the perimeter","Defeats the protection."],
 ["Configure an ingress rule (or perimeter bridge) allowing that specific identity/project to write to the bucket","Correct. Narrow, explicit exceptions to the perimeter."],
 ["Give the partner Owner on your project","Over-privileged, and it doesn't address the perimeter."],
 ["Make the bucket public","Exposes the data to everyone."]],1,null,true),
Q("d1m05","Migration","You have 50 TB to move and a dedicated 10 Gbps link that's mostly idle. The migration must finish within a week. What's the most practical option?",[
 ["Transfer Appliance","Shipping takes longer than the network here."],
 ["Storage Transfer Service (or parallel gcloud storage) over the link","Correct. 50 TB at about 8 Gbps effective is roughly half a day."],
 ["Datastream","For database CDC."],
 ["Email the files","No."]],1,null,true),
Q("d1m06","Audit","Admin Activity audit logs for your projects are:",[
 ["Disabled by default and must be enabled","Admin Activity logs are always on."],
 ["Always enabled and can't be disabled","Correct."],
 ["Only available for BigQuery","They cover all services."],
 ["Stored only for 24 hours","Retention is much longer."]],1,null,true),
Q("d1m07","DR","Which change lowers the RPO of a Cloud Storage bucket for a regional disaster most directly?",[
 ["Enable object versioning","Protects against overwrites, not region loss."],
 ["Use a dual-region bucket with turbo replication","Correct. Replicated to a second region with a 15-minute RPO target."],
 ["Switch to Nearline","A cost class, not resilience."],
 ["Enable uniform bucket-level access","An access model, not DR."]],1,null,true),
Q("d1m08","Migration","An on-prem Oracle database must stay the system of record for 6 months during a migration, while analysts query an always-up-to-date copy in BigQuery. What should you use?",[
 ["Datastream CDC from Oracle to BigQuery","Correct. Continuous near-real-time replication into BigQuery."],
 ["Monthly full exports","Stale."],
 ["Database Migration Service to Cloud SQL","Targets Cloud SQL, and it's for moving the database itself."],
 ["Transfer Appliance","Offline and one-time."]],0,null,true),
Q("d1m09","Privacy","A dataset must be shared with a vendor for model training. Names must be removed, and ZIP codes generalized to the first 3 digits. Which approach?",[
 ["DLP de-identification: redact names and generalize/bucket ZIP codes, then share the output","Correct. The right technique for each field."],
 ["CMEK on the dataset","Doesn't change the values."],
 ["Row-level security","Controls rows, not values."],
 ["Share the raw data under an NDA","Doesn't meet the privacy requirement."]],0,null,true),
Q("d1m10","IAM","A team needs a custom set of 5 permissions that no predefined role matches exactly, and predefined roles would grant too much. What should you do?",[
 ["Grant Editor","Far too broad."],
 ["Create a custom role with exactly those permissions and grant it to the team's group","Correct. Custom roles are for when no predefined role fits."],
 ["Grant bigquery.admin","Too broad."],
 ["Grant each permission individually to each user","Permissions are granted through roles, and per-user grants are hard to manage."]],1,null,true),
Q("d1m11","Network","A company needs encrypted connectivity from a small branch office to Google Cloud this week, with modest bandwidth needs. What's the fastest suitable option?",[
 ["Dedicated Interconnect","Takes weeks to provision and is meant for high bandwidth."],
 ["Cloud VPN (HA VPN)","Correct. Quick to set up, IPsec-encrypted, fine for moderate bandwidth."],
 ["Transfer Appliance","Offline data shipping."],
 ["Public IPs with firewall rules","Not a private, encrypted connection."]],1,null,true),
Q("d1m12","Reliability","Which statement about choosing a DR strategy for data workloads is correct?",[
 ["Always choose the lowest RPO/RTO available","Ignores cost."],
 ["Pick the lowest-cost option that still meets the stated RPO and RTO","Correct. Lower RPO/RTO costs more, so only buy what the requirement needs."],
 ["Backups are never acceptable for DR","They often are, for loose requirements."],
 ["Multi-region is required for every dataset","Overkill for many workloads."]],1,null,true)
);

(function(){
const d4 = PDE.domains.find(d=>d.id==="d4");
d4.ready = true;
d4.tools = ["mlpick"];
d4.lessons = [
{id:"d4-l1",title:"Fast, cheap dashboards",mins:4,
 opener:{q:"500 sales managers open the same Looker Studio dashboard on BigQuery every morning and it takes 15 seconds to load. You want sub-second responses with minimal changes. What should you do?",
  opts:["Export the data to Cloud SQL","Enable BI Engine for the project","Add LIMIT to the dashboard queries","Create one table per manager"],ans:1,
  why:"BI Engine is BigQuery's in-memory accelerator for BI tools, giving sub-second responses and high concurrency without redesign. LIMIT doesn't help, and the other options add work and duplication."},
 cards:[
  {h:"Three speed levers",b:`<table><tr><th>Feature</th><th>Pick when</th></tr><tr><td><mark>BI Engine</mark></td><td>Sub-second dashboards, many concurrent users</td></tr><tr><td><mark>Materialized views</mark></td><td>Same aggregation queried over and over. Auto-refreshed, and queries are <b>auto-rewritten</b> to use them</td></tr><tr><td>Partition + cluster</td><td>Dashboards filter by date and ID</td></tr><tr><td>Summary tables</td><td>Complex logic MVs don't support (scheduled query / Dataform)</td></tr><tr><td>Query cache</td><td>Identical query within 24 h on unchanged data is free</td></tr></table>`},
  {h:"BI tools",b:`<ul><li><mark>Looker</mark>: enterprise BI with a semantic layer (<b>LookML</b>). "Consistent metric definitions across teams" → Looker.</li><li><b>Looker Studio</b> (formerly Data Studio): quick, free dashboards. Stale data → check the report's <b>data freshness/cache</b> settings.</li><li><b>Connected Sheets</b>: Google Sheets on billions of BigQuery rows.</li></ul><div class="box trap"><div class="l">Trap</div>A logical view is saved SQL, so it doesn't make queries faster. For speed, use a materialized view or BI Engine.</div>`}
 ],
 keys:["Sub-second BI → BI Engine","Repeated aggregations → materialized views","Shared metric definitions → Looker (LookML)"]},

{id:"d4-l2",title:"Troubleshooting slow & costly queries",mins:4,
 opener:{q:"A query joins a 5 TB events table to itself to compute each user's previous event. It's slow and expensive. What's the best rewrite?",
  opts:["Add more slots","Use a window function such as LAG() OVER (PARTITION BY user ORDER BY ts)","Add LIMIT 1000","Export to Dataproc"],ans:1,
  why:"Window functions compute row-to-row comparisons in a single pass. Self-joins on huge tables are a classic BigQuery anti-pattern."},
 cards:[
  {h:"The checklist",b:`<ol><li>Read the <b>execution graph</b>: slow stages, bytes shuffled, skew.</li><li>Select only the needed columns. <mark>LIMIT doesn't cut bytes scanned.</mark></li><li>Filter on <b>partition/cluster</b> columns early.</li><li>Filter <i>before</i> joins. Watch for <b>skew</b> and accidental <b>cross joins</b>.</li><li>Self-joins → <mark>window functions</mark>.</li><li>Exact count not needed → <code>APPROX_COUNT_DISTINCT</code>.</li><li><b>Dry run</b> to see bytes first. Set <b>maximum bytes billed</b> as a safety cap.</li></ol>`},
  {h:"Search & needle-in-haystack",b:`<ul><li><b>Search indexes</b> + <code>SEARCH()</code>: find specific IDs or text in huge log tables quickly.</li><li>Clustering on the lookup column also helps point lookups.</li></ul>`}
 ],
 keys:["Self-join → window function","Fewer columns + partition filters","Dry run + maximum bytes billed"]},

{id:"d4-l3",title:"Secure sharing inside BigQuery",mins:5,
 opener:{q:"A partner team should see aggregated revenue per region, but must not be able to query the underlying orders table. What should you create?",
  opts:["Grant dataViewer on the orders dataset","An authorized view in a separate dataset, authorized to read the orders dataset","A copy of the orders table","A row-level policy on orders"],ans:1,
  why:"An authorized view lets users query the view's results without having access to the source tables. Put it in a separate dataset and authorize it on the source."},
 cards:[
  {h:"Pick by what you restrict",b:`<table><tr><th>Need</th><th>Feature</th></tr><tr><td>Share results, not sources</td><td><mark>Authorized view</mark> (also authorized datasets/routines)</td></tr><tr><td>Different rows per user</td><td><mark>Row-level access policy</mark></td></tr><tr><td>Hide sensitive columns</td><td><mark>Policy tags</mark> (column-level security)</td></tr><tr><td>Show masked values</td><td><mark>Dynamic data masking</mark></td></tr><tr><td>Find/transform PII before load</td><td>Sensitive Data Protection</td></tr></table>`},
  {h:"How it works",b:`<ul><li>Row policy: <code>CREATE ROW ACCESS POLICY … GRANT TO ("group:apac@…") FILTER USING (region="APAC")</code>.</li><li>Policy tags live in a taxonomy (Dataplex). Grant <b>Fine-Grained Reader</b> to those who may see the real values.</li><li>Masking rules: nullify, hash, last four characters, default value.</li></ul><div class="box brain"><div class="l">Exam brain</div>"One view per region" or "one table per team" is usually the high-maintenance wrong answer. Use row-level policies.</div>`}
 ],
 keys:["Results only → authorized view","Rows → row access policy · columns → policy tags · masked values → dynamic masking"]},

{id:"d4-l4",title:"ML fundamentals that keep showing up",mins:6,
 opener:{q:"Your neural network has 99% training accuracy but 70% on new data. What should you try first?",
  opts:["Train for many more epochs","Add regularization such as dropout or L2","Remove the validation set","Increase the learning rate a lot"],ans:1,
  why:"Great training accuracy with poor generalization is overfitting. Regularization (dropout, L1/L2), more data, fewer features or early stopping help. Training longer makes it worse."},
 cards:[
  {h:"Diagnose the model",b:`<table><tr><th>Symptom</th><th>Problem → fix</th></tr><tr><td>Good train, bad test</td><td><mark>Overfitting</mark> → L1/L2, dropout, more data, early stopping, fewer features</td></tr><tr><td>Bad train and test</td><td><b>Underfitting</b> → more features, feature crosses, more complex model</td></tr><tr><td>Good offline, bad in prod</td><td><mark>Training-serving skew</mark> / drift → same preprocessing, Feature Store, monitoring</td></tr><tr><td>Too good to be true</td><td><b>Data leakage</b> → remove leaking features, split by time</td></tr><tr><td>Loss jumps around</td><td>Learning rate too high</td></tr></table>`},
  {h:"Metrics",b:`<ul><li><b>Precision</b>: of the items I flagged, how many were right. Use it when false alarms are costly.</li><li><mark>Recall</mark>: of the real positives, how many I caught. Use it when misses are costly (fraud, disease).</li><li><b>F1</b> balances both. <b>AUC-ROC</b> measures ranking quality. Regression uses RMSE/MAE.</li><li><mark>Imbalanced classes</mark>: accuracy misleads. Use precision/recall/PR-AUC, and downsample or upweight.</li></ul>`},
  {h:"Features",b:`<ul><li>One-hot for low-cardinality categories. <mark>Embeddings / hash buckets</mark> for high cardinality (IDs, words).</li><li><b>Bucketize</b> numbers with nonlinear effects (age bands). <b>Feature crosses</b> (lat × long).</li><li>Normalize numeric features. Split train/validation/test, and <b>split by time</b> for time series.</li><li>Changing behaviour (fashion, fraud) → retrain regularly on <mark>old + new data</mark>.</li><li>L1 → sparse weights (feature selection). L2 → small weights overall.</li></ul>`}
 ],
 keys:["Overfit → regularize / dropout / more data","Rare positives → recall, not accuracy","High-cardinality → embeddings"]},

{id:"d4-l5",title:"BigQuery ML",mins:5,
 opener:{q:"Marketing analysts who know SQL want to segment customers into groups based on purchase behaviour. Data is already in BigQuery. What's the quickest approach?",
  opts:["Export to Vertex AI custom training","BigQuery ML with model_type='kmeans'","Build a TensorFlow model in a notebook","Use the Vision API"],ans:1,
  why:"Segmentation without labels is clustering, and BigQuery ML k-means runs it with SQL where the data already lives."},
 cards:[
  {h:"Model types",b:`<table><tr><th>Problem</th><th>model_type</th></tr><tr><td>Predict a number</td><td>linear_reg, boosted_tree_regressor, dnn_regressor</td></tr><tr><td>Predict a category</td><td>logistic_reg, boosted_tree_classifier, AutoML</td></tr><tr><td>Segments (no labels)</td><td><mark>kmeans</mark></td></tr><tr><td>Recommendations</td><td><mark>matrix_factorization</mark></td></tr><tr><td>Forecast / anomalies</td><td><mark>arima_plus</mark>, ML.DETECT_ANOMALIES</td></tr><tr><td>Call Gemini / Vertex</td><td>Remote models (ML.GENERATE_TEXT, ML.GENERATE_EMBEDDING)</td></tr></table>`},
  {h:"Workflow",b:`<p><code>CREATE MODEL … AS SELECT</code> → <code>ML.EVALUATE</code> → <code>ML.PREDICT</code>. Explainability with <code>ML.EXPLAIN_PREDICT</code>.</p><ul><li>Put preprocessing in the <mark>TRANSFORM</mark> clause so the same steps run at prediction time (avoids skew).</li><li>Export models to Vertex AI for low-latency online serving.</li></ul>`}
 ],
 keys:["SQL users + data in BigQuery → BigQuery ML","kmeans = segments · matrix_factorization = recommendations · arima_plus = forecasts","TRANSFORM prevents training-serving skew"]},

{id:"d4-l6",title:"Vertex AI & pre-trained APIs",mins:5,
 opener:{q:"A logistics company wants to extract fields from scanned delivery receipts. It has no ML team. What should it use?",
  opts:["Vertex AI custom training with TensorFlow","Document AI","BigQuery ML linear regression","Dataproc with Spark MLlib"],ans:1,
  why:"Document AI is a pre-trained, managed service for parsing documents. It's the least-effort answer when no ML expertise exists."},
 cards:[
  {h:"Which ML tool?",b:`<table><tr><th>Situation</th><th>Use</th></tr><tr><td>Common task, no ML team</td><td><mark>Pre-trained APIs</mark>: Vision, Natural Language, Speech-to-Text, Translation, Video Intelligence, Document AI, Gemini</td></tr><tr><td>Custom model, labelled data, little code</td><td><mark>Vertex AI AutoML</mark></td></tr><tr><td>Full control (TF/PyTorch), GPUs/TPUs</td><td><b>Vertex AI custom training</b></td></tr><tr><td>SQL users, data in BigQuery</td><td>BigQuery ML</td></tr><tr><td>Repeatable ML workflow</td><td><b>Vertex AI Pipelines</b></td></tr></table><p>Try the <b>ML Tool Picker</b> in this domain.</p>`},
  {h:"Serving & ops",b:`<ul><li><mark>Online prediction</mark> (endpoint, low latency, synchronous) vs <mark>batch prediction</mark> (big volume, async, output to GCS/BigQuery).</li><li><b>Feature Store</b>: consistent features for training and serving.</li><li><b>Model Monitoring</b>: skew and drift alerts.</li><li>Notebooks: <b>Vertex AI Workbench / Colab Enterprise</b> (Datalab is retired). Hyperparameter tuning built in.</li></ul>`}
 ],
 keys:["No ML team → pre-trained API","Custom + little code → AutoML","Real-time → online prediction; nightly scoring → batch prediction"]},

{id:"d4-l7",title:"GenAI: embeddings, vector search & RAG",mins:4,
 opener:{q:"HR wants a chatbot that answers employees' questions using 5,000 internal policy PDFs, and the answers must be grounded in those documents. What's the right pattern?",
  opts:["Fine-tune a model on the PDFs every hour","Retrieval-augmented generation: embed document chunks, retrieve the most relevant ones with vector search, and pass them to Gemini","Train a BigQuery ML logistic regression","Ask Gemini without any documents"],ans:1,
  why:"RAG retrieves relevant passages at question time and grounds the model's answer in them. It's cheaper and fresher than constant fine-tuning."},
 cards:[
  {h:"The RAG pipeline",b:`<ol><li><b>Collect</b> docs in GCS (BigQuery object tables).</li><li><b>Parse &amp; chunk</b> (Document AI / Dataflow).</li><li><b>Embed</b>: <code>ML.GENERATE_EMBEDDING</code> or Vertex AI embeddings.</li><li><b>Index</b>: BigQuery vector index, AlloyDB, or Vertex AI Vector Search.</li><li><b>Retrieve</b> with <code>VECTOR_SEARCH</code>, then <b>generate</b> with Gemini.</li></ol><div class="box pic"><div class="l">Picture it</div>An embedding is a location on a "meaning map". "Cheap flight to Bali" and "budget airfare Denpasar" sit right next to each other.</div>`},
  {h:"Data engineer concerns",b:`<ul><li>Chunk size and overlap, plus metadata for filtering.</li><li><mark>Re-embed incrementally</mark> when documents change, so answers don't go stale.</li><li>Apply the same access controls to retrieved chunks as to the source docs.</li></ul>`}
 ],
 keys:["Answers from your own docs → RAG","Embeddings + vector index + retrieval + LLM","Keep embeddings fresh"]},

{id:"d4-l8",title:"Sharing data beyond your team",mins:4,
 opener:{q:"You must share a constantly updated BigQuery dataset with 40 external partners. They should always see fresh data, pay for their own queries, and you don't want to copy data. What should you use?",
  opts:["Nightly exports to GCS with signed URLs","Analytics Hub (BigQuery sharing) listing","Copy the dataset into each partner's project daily","Give partners dataViewer on your project"],ans:1,
  why:"Analytics Hub gives subscribers a linked dataset, a live read-only pointer with no copies, and subscribers pay for their own compute."},
 cards:[
  {h:"Analytics Hub (BigQuery sharing)",b:`<ul><li>Publishers create <b>exchanges</b> and <b>listings</b>. Subscribers get a <mark>linked dataset</mark>: read-only, live, no copy.</li><li>Works across organizations. Exchanges can be public, private or commercial.</li><li><b>Data clean rooms</b>: joint analysis with privacy rules (e.g. aggregation thresholds), without exposing raw rows.</li><li>Billing rule: <mark>the project that runs the query pays for compute</mark>. The table owner pays for storage.</li></ul>`}
 ],
 keys:["Share live data, no copies, many consumers → Analytics Hub","Joint analysis without raw access → data clean room"]}
];

PDE.tools.mlpick = {title:"ML Tool Picker",sub:"BigQuery ML, AutoML, custom training or a pre-trained API?",
 intro:"ML questions on the PDE are mostly about choosing the right level of tool. Answer as the scenario would.",
 nodes:{
  start:{q:"Is this a common task that Google already has a model for (OCR, labels, sentiment, translation, speech, documents, general text generation)?",opts:[["Yes, a common task","api"],["No, it's specific to our business data","custom"]]},
  api:{result:"Pre-trained API (or Gemini)",why:"Vision, Natural Language, Speech-to-Text, Translation, Video Intelligence and Document AI need no training. Gemini covers general generation and understanding.",keys:"no ML team, fastest, least effort",trap:"Don't train a custom model for something an API already does.",color:"#d97706"},
  custom:{q:"Who builds it, and where is the data?",opts:[["SQL analysts, data already in BigQuery","bqml"],["Engineers with labelled data, want minimal ML code","automl"],["Data scientists who need full control (custom architectures, TF/PyTorch, GPUs/TPUs)","vtx"]]},
  bqml:{q:"What kind of problem?",opts:[["Predict a number","bq_reg"],["Predict a category","bq_cls"],["Find segments without labels","bq_km"],["Recommend products","bq_mf"],["Forecast a time series","bq_ts"]]},
  bq_reg:{result:"BigQuery ML: linear_reg / boosted_tree_regressor",why:"Regression with SQL. Evaluate with ML.EVALUATE, predict with ML.PREDICT.",color:"#16a34a"},
  bq_cls:{result:"BigQuery ML: logistic_reg / boosted_tree_classifier",why:"Classification with SQL. Use TRANSFORM for consistent preprocessing.",color:"#16a34a"},
  bq_km:{result:"BigQuery ML: kmeans",why:"Unsupervised clustering for customer segmentation.",color:"#16a34a"},
  bq_mf:{result:"BigQuery ML: matrix_factorization",why:"Collaborative filtering recommendations from user-item interactions.",color:"#16a34a"},
  bq_ts:{result:"BigQuery ML: arima_plus",why:"Time-series forecasting with seasonality and holidays, plus anomaly detection.",color:"#16a34a"},
  automl:{result:"Vertex AI AutoML",why:"Google trains and tunes a custom model on your labelled data (tabular, image, text, video) with minimal code.",keys:"custom model, little ML expertise",color:"#4f46e5"},
  vtx:{result:"Vertex AI custom training (+ Pipelines)",why:"Your own code and containers, distributed training on GPUs/TPUs, hyperparameter tuning, and Pipelines for repeatability.",keys:"full control, TensorFlow/PyTorch",color:"#4f46e5"}
 }};

const Q=(id,topic,q,opts,ans,tip,mock)=>({id,d:"d4",topic,q,opts:opts.map(([t,w])=>({t,w})),ans:Array.isArray(ans)?ans:[ans],tip,mock:!!mock});
PDE.questions.push(
Q("d4q01","BI performance","Executives run the same daily revenue-by-region aggregation on a 20 TB fact table dozens of times a day. You want to cut cost and latency without changing their queries. What should you create?",[
 ["A logical view","Saved SQL that re-runs the full scan every time."],
 ["A materialized view with the aggregation","Correct. Precomputed, auto-refreshed, and BigQuery can rewrite queries on the base table to use it."],
 ["A table copy refreshed manually","Manual and stale."],
 ["More slots","Faster, but you still pay for the full scans."]],1,"Repeated aggregations → materialized view."),
Q("d4q02","BI performance","Hundreds of users interact with a Looker Studio dashboard on BigQuery, and every filter click takes several seconds. What gives the biggest improvement with the least effort?",[
 ["Reserve BI Engine capacity","Correct. In-memory acceleration designed for BI tools and concurrency."],
 ["Move the data to Cloud SQL","Not built for this analytical volume."],
 ["Rewrite the dashboard in custom JavaScript","High effort."],
 ["Disable the query cache","Makes it slower."]],0,"Interactive BI speed → BI Engine."),
Q("d4q03","BI tools","Different teams calculate \"active customer\" differently, so their dashboards disagree. Leadership wants one governed definition used everywhere. What should you use?",[
 ["Looker with metrics defined in LookML","Correct. A semantic layer defines metrics once for every dashboard."],
 ["More Looker Studio reports","Each report would still define the metric its own way."],
 ["A shared spreadsheet of definitions","Not enforced."],
 ["BI Engine","Speeds queries up but doesn't govern definitions."]],0,"Consistent metrics → Looker semantic layer (LookML)."),
Q("d4q04","BI tools","A Looker Studio report on BigQuery doesn't show orders from the last hour, although the BigQuery table has them. What should you do?",[
 ["Re-load the BigQuery table","The table is already up to date."],
 ["Adjust the report's data freshness (cache) setting or refresh the data source","Correct. The report is serving cached results."],
 ["Clear your browser history","The cache isn't in the browser."],
 ["Partition the table by hour","Unrelated to report caching."]],1,"Stale dashboard, fresh table → BI tool cache settings."),
Q("d4q05","Query tuning","An analyst's query uses SELECT * with LIMIT 10 on a 30 TB table to \"peek\" at data, and the bill is high. What should you recommend?",[
 ["Keep LIMIT; it already limits cost","LIMIT doesn't reduce bytes scanned."],
 ["Use the table preview in the console, or select specific columns with a partition filter","Correct. Preview is free, and fewer columns plus partition pruning cut bytes."],
 ["Increase the slot reservation","Doesn't reduce on-demand bytes."],
 ["Copy the table to a smaller dataset","Unnecessary."]],1,"Peek at data → preview; LIMIT ≠ cheaper."),
Q("d4q06","Query tuning","A query that joins a large orders table to a customers table is slow. The execution graph shows one worker processing far more data than the others in the join stage, because one customer_id has millions of rows. What is this, and what helps?",[
 ["Data skew. Filter early, pre-aggregate the heavy key, or handle the outlier separately","Correct. Skew means one key overloads one worker."],
 ["A cross join. Add LIMIT","LIMIT doesn't fix the join pattern."],
 ["Not enough storage. Enable long-term storage","Unrelated."],
 ["A caching problem. Disable the cache","Unrelated."]],0,"Uneven stage work → skew."),
Q("d4q07","Query tuning","You need the number of distinct users per day over 2 billion rows for a dashboard, and ±1% accuracy is acceptable. What's the most efficient function?",[
 ["COUNT(DISTINCT user_id)","Exact, but more expensive and slower at this scale."],
 ["APPROX_COUNT_DISTINCT(user_id)","Correct. HyperLogLog-based, fast and approximate."],
 ["ARRAY_AGG(user_id)","Builds huge arrays."],
 ["SELECT * then count in the BI tool","Moves far too much data."]],1,"Approximate is fine → APPROX_ functions."),
Q("d4q08","Security","Country managers must only see rows for their own country in a single shared sales table, and you don't want to maintain one view per country. What should you use?",[
 ["Row-level access policies on the table, one per country group","Correct. Rows are filtered automatically by the user's group."],
 ["A separate dataset per country","Duplicates data and maintenance."],
 ["Policy tags on the country column","Hides the column, it doesn't filter rows."],
 ["An authorized view per country","Works, but it's the high-maintenance pattern the question rules out."]],0,"Filter rows per user → row-level access policy."),
Q("d4q09","Security","The salary column in an HR table must be hidden from everyone except the payroll group, while other columns stay visible to all analysts. What should you do?",[
 ["Apply a policy tag to the salary column and grant Fine-Grained Reader only to payroll","Correct. Column-level security through policy tags."],
 ["Create a separate table without salary for analysts","Duplication."],
 ["Row-level access policy","Restricts rows, not columns."],
 ["Encrypt the column with CMEK","CMEK is table/dataset level, and everyone with access can still read it."]],0,"Hide a column → policy tags."),
Q("d4q10","Security","A partner should query only aggregated results from your raw transactions dataset, without any access to the raw tables. What's the standard approach?",[
 ["Grant dataViewer on the raw dataset","Exposes the raw tables."],
 ["Create an authorized view in a separate dataset, authorize it on the raw dataset, and grant the partner access to the view's dataset","Correct. Users see results, not sources."],
 ["Export results to CSV daily","Manual and stale."],
 ["Row-level policy on raw tables","Still exposes raw rows."]],1,"Share results, not sources → authorized view."),
Q("d4q11","Security","Support agents need to search by customer phone number but must only see the last 4 digits, while fraud investigators see full numbers. All of them query the same table. What should you configure?",[
 ["Dynamic data masking with a \"last four characters\" rule on a policy tag, and Fine-Grained Reader for investigators","Correct. Masked for most users, full values for authorized ones, all in one table."],
 ["Two tables","Duplication and drift."],
 ["Redact phone numbers with DLP at load","Investigators would lose the real values."],
 ["VPC Service Controls","Not a column control."]],0,"Masked values for some users → dynamic data masking."),
Q("d4q12","ML basics","A fraud model reports 99.5% accuracy, but it never flags any fraud. Fraud is 0.5% of transactions. What should you do?",[
 ["Deploy it; 99.5% is great","It predicts \"not fraud\" for everything."],
 ["Evaluate with precision/recall (or PR-AUC), and rebalance the training data by downsampling the majority class or upweighting fraud","Correct. Accuracy is misleading on imbalanced data."],
 ["Add more non-fraud examples","Worsens the imbalance."],
 ["Increase the learning rate","Unrelated to imbalance."]],1,"Imbalanced → precision/recall + rebalance."),
Q("d4q13","ML basics","A medical screening model must miss as few sick patients as possible, even if that means more false alarms. Which metric should you optimize?",[
 ["Precision","Penalizes false alarms, but the priority is not missing cases."],
 ["Recall","Correct. Recall is the share of actual positives that you catch."],
 ["Accuracy","Misleading for rare conditions."],
 ["RMSE","For regression."]],1,"Don't miss positives → recall."),
Q("d4q14","ML basics","A model has thousands of sparse features, many of them irrelevant. You want the model to automatically ignore useless features. Which technique fits best?",[
 ["L1 regularization","Correct. L1 drives irrelevant weights to exactly zero (feature selection)."],
 ["L2 regularization","Shrinks weights but rarely to zero."],
 ["Increasing the batch size","Unrelated."],
 ["Removing the test set","Never."]],0,"Sparse feature selection → L1."),
Q("d4q15","ML basics","A product recommendation model performs well in offline tests but poorly in production. You find that training used normalized prices, while the serving code sends raw prices. What is this, and how do you prevent it?",[
 ["Overfitting. Add dropout","The model is fine, the inputs differ."],
 ["Training-serving skew. Use the same preprocessing at serving time (e.g. BigQuery ML TRANSFORM or a shared feature pipeline / Feature Store)","Correct."],
 ["Data leakage. Remove the price feature","The feature is fine, its preprocessing differs."],
 ["Underfitting. Use a bigger model","No."]],1,"Different preprocessing in prod → training-serving skew."),
Q("d4q16","ML basics","A feature is user_id with 20 million distinct values. One-hot encoding makes the model enormous. What's a better representation?",[
 ["Keep one-hot","Huge and sparse."],
 ["An embedding (or hash buckets)","Correct. A dense, low-dimensional representation for high-cardinality categories."],
 ["Drop all categorical features","Loses signal."],
 ["Convert IDs to floats","Implies a meaningless order."]],1,"High cardinality → embeddings / hashing."),
Q("d4q17","ML basics","Customer fashion preferences shift every season. How should you keep a recommendation model accurate over time?",[
 ["Train once on all historical data","Goes stale."],
 ["Retrain continuously on a combination of historical and new data, and evaluate on recent data","Correct. Learns new trends without forgetting stable patterns."],
 ["Train only on the newest week","Too little data, and it forgets stable behaviour."],
 ["Use the newest data as the test set and never retrain","Never adapts."]],1,"Changing behaviour → retrain on old + new."),
Q("d4q18","BigQuery ML","An analyst team wants to forecast daily sales for 2,000 stores for the next 30 days, including seasonality and holidays, using SQL in BigQuery. Which model type?",[
 ["linear_reg","Not built for time series."],
 ["arima_plus","Correct. Time-series forecasting with seasonality and holiday effects in BigQuery ML."],
 ["kmeans","Clustering."],
 ["matrix_factorization","Recommendations."]],1,"Forecasting in BigQuery → ARIMA_PLUS."),
Q("d4q19","BigQuery ML","You trained a BigQuery ML model with feature scaling and bucketizing written in the training SELECT. Predictions on new data look wrong. What's the best fix?",[
 ["Move the preprocessing into the TRANSFORM clause of CREATE MODEL","Correct. TRANSFORM applies the same preprocessing automatically at prediction time."],
 ["Retrain with more epochs","The issue is inconsistent preprocessing."],
 ["Export to Vertex AI","Doesn't fix the mismatch."],
 ["Use a different model type","Unrelated."]],0,"Consistent preprocessing in BQML → TRANSFORM."),
Q("d4q20","ML tools","A retailer wants to automatically tag product photos with labels like \"shoe\" and \"red\". They have no data scientists. What's the quickest approach?",[
 ["Vision API label detection","Correct. Pre-trained, no training needed."],
 ["Vertex AI custom training","Needs ML expertise."],
 ["BigQuery ML kmeans on pixels","Not appropriate."],
 ["Dataproc Spark MLlib","Needs a lot of effort."]],0,"Common vision task, no ML team → Vision API."),
Q("d4q21","ML tools","A manufacturer has 50,000 labelled images of its own specific circuit-board defects, which generic APIs don't recognize. It has limited ML expertise. What should it use?",[
 ["Vision API label detection","Generic labels won't know these custom defects."],
 ["Vertex AI AutoML image classification","Correct. A custom model trained on your labels with minimal code."],
 ["BigQuery ML logistic regression","Not for images."],
 ["Hand-written rules","Brittle."]],1,"Custom labels, little ML skill → AutoML."),

{id:"d5-l1",title:"BigQuery pricing: on-demand vs Editions",mins:5,
 opener:{q:"A company's BigQuery on-demand bill is large and swings wildly month to month, while the workload is steady. Finance wants predictable spend. What should you recommend?",
  opts:["Buy flat-rate slots","Move to BigQuery Editions with a reservation: a baseline sized for the steady load plus autoscaling, optionally a commitment","Add LIMIT to queries","Switch all queries to batch priority"],ans:1,
  why:"Capacity pricing (Editions) makes compute spend predictable. Flat-rate was retired and replaced by Editions. LIMIT and batch priority don't change billing."},
 cards:[
  {h:"Two ways to pay for compute",b:`<table><tr><th>Model</th><th>How</th><th>Good for</th></tr><tr><td><b>On-demand</b></td><td>Per TiB scanned (shared slot pool, about 2,000 slots per project)</td><td>Spiky or small workloads</td></tr><tr><td><mark>Editions</mark> (Standard / Enterprise / Enterprise Plus)</td><td>Per slot-hour: <b>reservations</b> with a <b>baseline</b> + <b>autoscaling</b> up to a max, optional 1/3-year <b>commitments</b></td><td>Steady heavy workloads, predictable budgets, isolation</td></tr></table><div class="box trap"><div class="l">Old fact</div><mark>Flat-rate is retired.</mark> When old questions say flat-rate, think Editions + reservations.</div>`},
  {h:"Reservations & guardrails",b:`<ul><li>Create reservations (<code>etl</code>, <code>bi</code>, <code>adhoc</code>) and <b>assign</b> projects/folders to them, <mark>so ETL can't starve dashboards</mark>. Idle slots can be shared.</li><li>Enterprise Plus adds things like <b>managed disaster recovery</b>.</li><li>Guardrails: <mark>custom quotas</mark> (bytes per user/project per day), <b>maximum bytes billed</b> per query, dry runs, budgets + alerts, billing export to BigQuery.</li><li>Storage: long-term pricing after 90 days unmodified, plus partition/table expiration.</li></ul>`}
 ],
 keys:["Predictable compute → Editions reservations (baseline + autoscaling)","Isolate ETL vs BI → separate reservations","Stop runaway queries → custom quotas + max bytes billed"]},

{id:"d5-l2",title:"Cost levers across services",mins:4,
 opener:{q:"Which change reduces Dataproc cost the most for nightly batch jobs without risking data loss?",
  opts:["Keep a persistent cluster with bigger machines","Ephemeral clusters reading/writing GCS, with Spot secondary workers and autoscaling","Use Spot VMs for the master node","Store data on cluster HDFS"],ans:1,
  why:"Pay only while jobs run, keep data in GCS, and put cheap Spot capacity on compute-only secondary workers."},
 cards:[
  {h:"Per-service levers",b:`<table><tr><th>Service</th><th>Levers</th></tr><tr><td>Dataproc</td><td><mark>Ephemeral clusters</mark>, Spot secondaries, autoscaling, scheduled deletion. Persistent only for constant/interactive use</td></tr><tr><td>Dataflow</td><td>Max workers cap, right-sized machines, <mark>FlexRS</mark> for non-urgent batch, Streaming Engine</td></tr><tr><td>Cloud Storage</td><td>Lifecycle rules, Autoclass, avoid frequent cold reads</td></tr><tr><td>Bigtable / Spanner</td><td>Autoscaling, HDD for cold big data (Bigtable)</td></tr><tr><td>All</td><td><b>Labels</b> + billing export to BigQuery to see who spends what</td></tr></table>`},
  {h:"Keep critical jobs safe",b:`<ul><li>Dedicated BigQuery <b>reservations</b> for critical pipelines.</li><li>Separate Bigtable clusters/app profiles for serving vs batch.</li><li>Composer pools/priorities for critical tasks.</li></ul>`}
 ],
 keys:["Dataproc → ephemeral + Spot secondaries","Dataflow batch that can wait → FlexRS","Who spends what → labels + billing export"]},

{id:"d5-l3",title:"Automation with Composer",mins:5,
 opener:{q:"Re-running yesterday's Composer DAG doubled yesterday's rows in a BigQuery table. What design change prevents this?",
  opts:["Never re-run DAGs","Make tasks idempotent: write each run's partition with WRITE_TRUNCATE (e.g. table$YYYYMMDD) or use MERGE","Add more Composer workers","Use a bigger machine type"],ans:1,
  why:"Idempotent tasks produce the same result no matter how many times they run. Overwriting the run's partition or MERGEing prevents duplicates on retries and backfills."},
 cards:[
  {h:"Good DAG habits",b:`<ul><li><mark>Idempotent tasks</mark>: <code>WRITE_TRUNCATE</code> per partition or <code>MERGE</code>, never blind appends.</li><li>Parameterize by logical date (<code>{{ ds }}</code>) so <mark>backfills</mark> and reruns work.</li><li><b>Sensors</b> wait for conditions (file in GCS, upstream DAG). <b>Retries</b> with delays, plus <b>SLAs</b> and failure alerts.</li><li>Keep heavy work in BigQuery/Dataflow/Dataproc operators. Composer orchestrates, it doesn't crunch data.</li><li>DAG files are deployed to the environment's GCS <code>dags/</code> folder, ideally via CI/CD.</li></ul>`},
  {h:"Environment health",b:`<ul><li>Tasks stuck <b>queued</b> → not enough worker capacity or concurrency → scale workers / adjust parallelism.</li><li>Scheduler lagging → too many or too heavy DAG files at parse time. Keep top-level DAG code light.</li></ul>`}
 ],
 keys:["Idempotent + date-parameterized DAGs","Queued tasks → scale the environment","Composer orchestrates; services do the work"]},

{id:"d5-l4",title:"Organizing workloads",mins:3,
 opener:{q:"Hundreds of non-urgent ad-hoc reports run at 9:00 and hit BigQuery's concurrent interactive query limit, delaying urgent queries. What's a simple fix?",
  opts:["Run the non-urgent reports with batch priority","Delete old tables","Use LIMIT","Switch to Cloud SQL"],ans:0,
  why:"Batch-priority queries wait for idle resources and don't count toward the concurrent interactive limit, so urgent queries get through first."},
 cards:[
  {h:"Interactive vs batch, isolation",b:`<ul><li><b>Interactive</b> (default): runs ASAP and counts toward concurrency.</li><li><mark>Batch</mark>: queued until resources are free. Fine for non-urgent work.</li><li><mark>Workload isolation</mark>: separate reservations for ETL / BI / data science, and separate projects for billing visibility.</li><li>Capacity planning: watch slot usage over time (<code>INFORMATION_SCHEMA.JOBS</code>, admin resource charts) to size the baseline vs autoscaling.</li></ul>`}
 ],
 keys:["Non-urgent queries → batch priority","Different teams/workloads → separate reservations"]},

{id:"d5-l5",title:"Monitoring & troubleshooting",mins:5,
 opener:{q:"Your BigQuery bill doubled last week. What's the fastest way to find which users and queries caused it?",
  opts:["Ask every team","Query INFORMATION_SCHEMA.JOBS (or the admin resource charts) for bytes billed by user and query","Check Pub/Sub metrics","Read Dataflow logs"],ans:1,
  why:"INFORMATION_SCHEMA.JOBS records every job with its user, bytes billed and slot usage, so it's the right forensic source."},
 cards:[
  {h:"The observability toolbox",b:`<table><tr><th>Tool</th><th>Use</th></tr><tr><td>Cloud Monitoring</td><td>Metrics, dashboards, <mark>alerting policies</mark> (Dataflow system lag/data freshness, Pub/Sub oldest unacked age, BigQuery slots)</td></tr><tr><td>Cloud Logging</td><td>Logs, <mark>log-based metrics</mark>, <mark>log sinks</mark> → BigQuery / GCS / Pub/Sub</td></tr><tr><td>Audit logs</td><td>Who did what, when</td></tr><tr><td><mark>INFORMATION_SCHEMA.JOBS</mark></td><td>Expensive queries, users, errors, queueing</td></tr><tr><td>Billing export</td><td>Cost trends by project and label</td></tr></table>`},
  {h:"Common errors",b:`<ul><li><b>429 / quotaExceeded / rateLimitExceeded</b> → <mark>retry with exponential backoff</mark>, and request a quota increase if it's sustained.</li><li><b>Resources exceeded</b> (BigQuery) → reduce data early, avoid a global ORDER BY on huge results, break the query up.</li><li><b>Permission denied</b> on a job → check the job's <mark>service account</mark>, not your own user.</li><li>Dataflow OOM → bigger machines, fix hot keys, smaller side inputs.</li></ul>`}
 ],
 keys:["Alert on lag/backlog metrics","Cost forensics → INFORMATION_SCHEMA.JOBS","Rate/quota errors → exponential backoff"]},

{id:"d5-l6",title:"Designing for failure",mins:5,
 opener:{q:"A teammate accidentally dropped a BigQuery table 2 hours ago. What's the fastest recovery?",
  opts:["Restore from a monthly export","Recover it with time travel (e.g. restore a snapshot of the table as of before the drop)","Open a ticket for fail-safe","Rebuild it from source systems"],ans:1,
  why:"Deleted tables can be recovered within the time-travel window (up to 7 days). Fail-safe needs Google support and applies after the time-travel window has passed."},
 cards:[
  {h:"Per-service recovery",b:`<table><tr><th>Service</th><th>Tools</th></tr><tr><td>BigQuery</td><td><mark>Time travel</mark> (≤7 d) + fail-safe, snapshots, cross-region replication, managed DR (Enterprise Plus)</td></tr><tr><td>Cloud Storage</td><td>Dual/multi-region, turbo replication, versioning, soft delete</td></tr><tr><td>Pub/Sub</td><td><mark>Seek</mark> to snapshot/timestamp, dead-letter topics</td></tr><tr><td>Dataflow</td><td>Drain/update, snapshots, restart in another region, dead-letter outputs</td></tr><tr><td>Dataproc</td><td>Data in GCS, HA mode, just recreate the cluster</td></tr><tr><td>Bigtable</td><td>Replication + multi-cluster routing, backups</td></tr><tr><td>Cloud SQL</td><td>HA (zone), <mark>cross-region replica</mark> (region), PITR</td></tr><tr><td>Spanner</td><td>Multi-region configs, PITR, backups</td></tr></table>`},
  {h:"Bad or missing data",b:`<ul><li>Validate at ingest: schemas, Dataplex quality, Dataform assertions.</li><li>Route bad records to <mark>dead-letter</mark> instead of failing everything.</li><li>Keep <mark>immutable raw copies</mark> in GCS so you can reprocess.</li><li>Idempotent pipelines make replays safe.</li></ul>`}
 ],
 keys:["Oops in BigQuery → time travel","Replay messages → Pub/Sub seek","Keep raw data + idempotent pipelines = safe reprocessing"]}
];
