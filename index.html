/* ===== d3-l2 Cloud Storage ===== */
dd("d3-l2",[
`<p>Companies keep enormous amounts of files: raw exports from databases, logs, images, backups, archived records that law requires them to keep for years. Storing all of that on normal disks is expensive and fragile, and paying "hot storage" prices for files nobody opens is wasteful.</p><p>Cloud Storage (GCS) solves this: unlimited, extremely durable file storage, with <mark>price tiers based on how often you read the data</mark>, automatic rules to move or delete old files, and locks that make files undeletable when regulations demand it.</p>`,
`<ul><li><b>Object</b>: one file plus its metadata. GCS doesn't care about the format.</li><li><b>Bucket</b>: a named container for objects. Settings like location, default class, retention and IAM live on the bucket.</li><li><b>Storage class</b>: a price tier. <mark>Standard</mark> (no minimum), <mark>Nearline</mark> (30-day minimum, ≈monthly access), <mark>Coldline</mark> (90-day minimum, ≈quarterly), <mark>Archive</mark> (365-day minimum, &lt;yearly). Colder = cheaper to store, more expensive to read, with early-deletion charges if you remove data before the minimum.</li><li><b>Location type</b>: <b>region</b> (one region, cheapest, closest to compute), <b>dual-region</b> (two specific regions), <b>multi-region</b> (e.g. US, EU, ASIA).</li><li><b>Lifecycle rule</b>: "after N days, change class / delete". <b>Autoclass</b>: GCS decides the class per object based on real access.</li><li><b>Retention policy</b>: objects can't be deleted or replaced before a certain age. <b>Bucket Lock</b> makes that policy permanent (WORM: write once, read many).</li></ul>`,
`<ol><li>Create a bucket and choose its location (e.g. <code>asia-southeast2</code>, Jakarta) and default class.</li><li>Upload objects (console, <code>gcloud storage cp</code>, Storage Transfer Service, pipelines).</li><li>Reads return in milliseconds for <b>every</b> class, even Archive. You never "restore" or "thaw" data.</li><li>Lifecycle rules run in the background: e.g. at age 30 days move Standard → Coldline, at 365 days delete.</li><li>If a retention policy is set, delete requests fail until the object is old enough. Once the policy is <b>locked</b>, not even a project owner can shorten or remove it.</li><li>Access is controlled with IAM (uniform bucket-level access recommended). For someone without a Google account, generate a <b>signed URL</b> that expires.</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>Think of your house: the <b>living room</b> (Standard) holds things you use daily, the <b>garage</b> (Nearline) holds monthly stuff, the <b>attic</b> (Coldline) holds the Lebaran decorations, and a <b>rented storage unit</b> (Archive) holds old tax documents. Everything can be reached quickly, but each trip further away costs more. A <b>lifecycle rule</b> is a helper who moves boxes to the attic automatically after 3 months. <b>Bucket Lock</b> is sealing the tax box with a government seal that nobody may break for 10 years.</div>`,
`<p>A fintech stores daily database backups of 200 GB. They restore one backup per month for testing and must keep each backup 1 year.</p><ul><li>Accessed about monthly → <b>Nearline</b>.</li><li>Lifecycle rule: delete at 365 days.</li><li>Storage over a year: about 365 × 200 GB ≈ 73 TB kept at any time. In Standard you'd pay the hot price for all of it; in Nearline you pay a lower storage price plus a small retrieval fee for one 200 GB restore per month.</li></ul><p>Now a different case: trade records "must not be deleted for 7 years, even by administrators, and are almost never read". → <b>Archive</b> bucket + 7-year <b>retention policy</b>, then <b>lock</b> it.</p>`,
`<div class="box trap"><div class="l">Traps</div><ul><li>"Archive data takes hours to restore": <mark>false on GCS</mark>; all classes are millisecond access.</li><li>Removing IAM delete permission is not WORM; an admin can add it back. <mark>Only a locked retention policy</mark> prevents deletion.</li><li>Object versioning keeps old versions but doesn't stop deletion.</li><li>Putting hot, frequently-read data in Coldline/Archive costs more because of retrieval fees.</li><li>Pattern known → lifecycle rule. Pattern unknown → Autoclass.</li><li>Temporary access for outsiders → signed URL, not making the object public.</li></ul></div>`,
`<p>Cloud Storage stores files as objects in buckets, with four classes whose minimum durations are 0, 30, 90 and 365 days and which all read in milliseconds. Lifecycle rules or Autoclass move data to cheaper classes and delete it over time. A retention policy with Bucket Lock makes objects undeletable (WORM), and signed URLs give temporary access to people without Google accounts.</p>`
],[
`<p>Perusahaan menyimpan file dalam jumlah sangat besar: hasil export database, log, gambar, backup, arsip yang wajib disimpan bertahun-tahun karena aturan hukum. Menyimpan semua itu di disk biasa mahal dan rawan, dan membayar harga "storage panas" untuk file yang tidak pernah dibuka itu boros.</p><p>Cloud Storage (GCS) menyelesaikan ini: penyimpanan file tanpa batas yang sangat awet, dengan <mark>tingkat harga berdasarkan seberapa sering datanya dibaca</mark>, aturan otomatis untuk memindahkan atau menghapus file lama, dan kunci yang membuat file tidak bisa dihapus kalau regulasi mewajibkan.</p>`,
`<ul><li><b>Object</b>: satu file beserta metadatanya. GCS tidak peduli formatnya.</li><li><b>Bucket</b>: wadah bernama untuk object. Pengaturan seperti lokasi, kelas default, retensi dan IAM ada di level bucket.</li><li><b>Storage class</b>: tingkat harga. <mark>Standard</mark> (tanpa minimum), <mark>Nearline</mark> (minimum 30 hari, akses ≈bulanan), <mark>Coldline</mark> (minimum 90 hari, ≈kuartalan), <mark>Archive</mark> (minimum 365 hari, &lt;tahunan). Makin dingin = makin murah simpan, makin mahal baca, dan ada biaya kalau dihapus sebelum masa minimum.</li><li><b>Tipe lokasi</b>: <b>region</b> (satu region, termurah, dekat dengan compute), <b>dual-region</b> (dua region tertentu), <b>multi-region</b> (misalnya US, EU, ASIA).</li><li><b>Lifecycle rule</b>: "setelah N hari, ganti kelas / hapus". <b>Autoclass</b>: GCS memilih kelas per objek sesuai akses sebenarnya.</li><li><b>Retention policy</b>: objek tidak bisa dihapus atau ditimpa sebelum mencapai umur tertentu. <b>Bucket Lock</b> membuat policy itu permanen (WORM: write once, read many).</li></ul>`,
`<ol><li>Buat bucket dan pilih lokasinya (misalnya <code>asia-southeast2</code>, Jakarta) serta kelas default-nya.</li><li>Upload objek (console, <code>gcloud storage cp</code>, Storage Transfer Service, pipeline).</li><li>Membaca data kembali dalam hitungan milidetik untuk <b>semua</b> kelas, termasuk Archive. Tidak ada proses "restore" atau "mencairkan" data.</li><li>Lifecycle rule berjalan di belakang layar: misalnya di umur 30 hari pindah Standard → Coldline, di 365 hari dihapus.</li><li>Kalau ada retention policy, permintaan hapus akan gagal sampai objeknya cukup tua. Setelah policy-nya <b>dikunci</b>, bahkan project owner pun tidak bisa memperpendek atau menghapusnya.</li><li>Akses diatur dengan IAM (disarankan uniform bucket-level access). Untuk orang tanpa akun Google, buat <b>signed URL</b> yang kedaluwarsa.</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Bayangkan rumahmu: <b>ruang tamu</b> (Standard) untuk barang yang dipakai tiap hari, <b>garasi</b> (Nearline) untuk barang bulanan, <b>loteng</b> (Coldline) untuk hiasan Lebaran, dan <b>gudang sewaan</b> (Archive) untuk dokumen pajak lama. Semua bisa diambil dengan cepat, tapi makin jauh tempatnya, makin mahal ongkos tiap perjalanan. <b>Lifecycle rule</b> adalah asisten yang otomatis memindahkan kardus ke loteng setelah 3 bulan. <b>Bucket Lock</b> adalah menyegel kardus pajak dengan segel resmi yang tidak boleh dibuka siapa pun selama 10 tahun.</div>`,
`<p>Sebuah fintech menyimpan backup database harian sebesar 200 GB. Satu backup di-restore sebulan sekali untuk testing, dan setiap backup wajib disimpan 1 tahun.</p><ul><li>Diakses sekitar sebulan sekali → <b>Nearline</b>.</li><li>Lifecycle rule: hapus di hari ke-365.</li><li>Total storage dalam setahun: sekitar 365 × 200 GB ≈ 73 TB yang tersimpan bersamaan. Di Standard kamu bayar harga panas untuk semuanya; di Nearline kamu bayar harga simpan lebih rendah plus biaya baca kecil untuk satu restore 200 GB per bulan.</li></ul><p>Kasus lain: catatan transaksi saham "tidak boleh dihapus selama 7 tahun, bahkan oleh admin, dan hampir tidak pernah dibaca". → bucket <b>Archive</b> + <b>retention policy</b> 7 tahun, lalu <b>dikunci</b>.</p>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li>"Data Archive butuh berjam-jam untuk di-restore": <mark>salah untuk GCS</mark>; semua kelas bisa diakses dalam milidetik.</li><li>Mencabut izin delete di IAM bukan WORM; admin bisa menambahkannya lagi. <mark>Hanya retention policy yang dikunci</mark> yang mencegah penghapusan.</li><li>Object versioning menyimpan versi lama tapi tidak mencegah penghapusan.</li><li>Menaruh data panas yang sering dibaca di Coldline/Archive justru lebih mahal karena biaya baca.</li><li>Pola akses diketahui → lifecycle rule. Tidak diketahui → Autoclass.</li><li>Akses sementara untuk orang luar → signed URL, bukan membuat objek jadi public.</li></ul></div>`,
`<p>Cloud Storage menyimpan file sebagai objek di dalam bucket, dengan empat kelas yang masa minimumnya 0, 30, 90 dan 365 hari, dan semuanya bisa dibaca dalam milidetik. Lifecycle rule atau Autoclass memindahkan data ke kelas yang lebih murah dan menghapusnya seiring waktu. Retention policy dengan Bucket Lock membuat objek tidak bisa dihapus (WORM), dan signed URL memberi akses sementara ke orang tanpa akun Google.</p>`
]);

/* ===== d3-l3 partitioning & clustering ===== */
dd("d3-l3",[
`<p>BigQuery can scan petabytes, but with on-demand pricing <mark>you pay for every byte a query reads</mark>. A careless dashboard that scans a 40 TB table 50 times a day can cost more than the whole team's laptops. Queries also get slower as tables grow.</p><p>Most queries only need a small slice: "yesterday", "this customer", "this store". Partitioning and clustering let BigQuery skip everything else, so you read (and pay for) only the slice you need.</p>`,
`<ul><li><b>Columnar storage</b>: BigQuery stores each column separately. A query reading 3 of 80 columns only pays for those 3. <code>SELECT *</code> reads them all.</li><li><b>Partition</b>: a table split into chunks by one column. Options: a <b>time-unit column</b> (DATE/TIMESTAMP/DATETIME by hour, day, month or year), <b>ingestion time</b> (pseudo-column <code>_PARTITIONTIME</code>), or an <b>integer range</b>.</li><li><b>Partition pruning</b>: when your WHERE clause filters on the partition column, BigQuery skips the other partitions entirely.</li><li><b>Clustering</b>: inside each partition, rows are sorted by up to 4 columns. Filters on those columns let BigQuery skip storage blocks.</li><li><b>require_partition_filter</b>: a table option that rejects queries without a partition filter.</li><li><b>Partition expiration</b>: automatically delete partitions older than N days.</li></ul>`,
`<ol><li>Create the table with <code>PARTITION BY DATE(event_ts)</code> and <code>CLUSTER BY customer_id, store_id</code>.</li><li>When data loads, each row is written into its day's partition and sorted by the clustering columns.</li><li>A query with <code>WHERE DATE(event_ts) = '2026-11-01' AND customer_id = 123</code> first prunes to one partition, then reads only the blocks whose customer_id range includes 123.</li><li>Run a <b>dry run</b> to see estimated bytes before running (free).</li><li>BigQuery re-clusters in the background automatically, at no cost.</li></ol><p>You <b>can't</b> convert an existing non-partitioned table in place. Create a new one with <code>CREATE TABLE new PARTITION BY … AS SELECT * FROM old</code> (CTAS).</p>`,
`<div class="box pic"><div class="l">Analogy</div>The library charges you for every shelf you walk past. <b>Partitioning</b> splits it into one room per day: you only enter the room for the date you need. <b>Clustering</b> sorts the books inside each room alphabetically by customer name: you stop walking as soon as you pass the name. <b>Selecting fewer columns</b> is visiting fewer aisles. <b>LIMIT</b> is only asking for 10 books after walking past every shelf anyway, so it doesn't save the entrance fee.</div>`,
`<p>An events table holds 3 years of data, 40 TB total (≈ 36 GB per day), with 50 columns of similar size.</p><table><tr><th>Query design</th><th>Approx. bytes read</th></tr><tr><td><code>SELECT *</code>, no filter</td><td>40 TB</td></tr><tr><td><code>SELECT *</code> + filter on yesterday (partitioned by day)</td><td>≈ 36 GB</td></tr><tr><td>3 columns + filter on yesterday</td><td>≈ 36 GB × 3/50 ≈ 2.2 GB</td></tr><tr><td>Same + clustered by customer_id, filter one customer</td><td>often a few hundred MB</td></tr></table><p>Going from 40 TB to ~2 GB is roughly a 20,000× reduction in bytes billed for the same answer.</p>`,
`<div class="box trap"><div class="l">Traps</div><ul><li><mark>LIMIT doesn't reduce bytes scanned</mark> on normal tables.</li><li>Buying more slots makes queries faster but doesn't reduce on-demand bytes.</li><li>A logical view that filters "today" doesn't change storage layout; users can still query the base table.</li><li>Partitioning by a high-cardinality ID is wrong; that's what clustering is for. Partition by the date you filter on.</li><li>Don't create hourly partitions spanning many years: there's a limit on partitions per table (thousands).</li><li>Date-sharded tables (<code>events_20261101</code>…) are the old pattern; one partitioned table is better.</li></ul></div>`,
`<p>On-demand BigQuery bills the bytes a query reads, so the cheapest query is the one that reads the fewest columns and partitions. Partition by the date you filter on (with require_partition_filter), and cluster by up to 4 high-cardinality filter columns such as customer_id. LIMIT doesn't save money, and existing tables are converted with CREATE TABLE … PARTITION BY … AS SELECT.</p>`
],[
`<p>BigQuery sanggup men-scan petabyte, tapi dengan harga on-demand <mark>kamu bayar setiap byte yang dibaca query</mark>. Dashboard yang ceroboh dan men-scan tabel 40 TB sebanyak 50 kali sehari bisa lebih mahal dari harga laptop satu tim. Query juga makin lambat seiring tabel membesar.</p><p>Padahal kebanyakan query hanya butuh potongan kecil: "kemarin", "customer ini", "toko ini". Partitioning dan clustering membuat BigQuery bisa melewati sisanya, sehingga kamu hanya membaca (dan membayar) potongan yang dibutuhkan.</p>`,
`<ul><li><b>Columnar storage</b>: BigQuery menyimpan setiap kolom secara terpisah. Query yang membaca 3 dari 80 kolom hanya membayar 3 kolom itu. <code>SELECT *</code> membaca semuanya.</li><li><b>Partition</b>: tabel dipecah jadi potongan berdasarkan satu kolom. Pilihannya: <b>time-unit column</b> (DATE/TIMESTAMP/DATETIME per jam, hari, bulan atau tahun), <b>ingestion time</b> (pseudo-column <code>_PARTITIONTIME</code>), atau <b>integer range</b>.</li><li><b>Partition pruning</b>: kalau klausa WHERE memfilter kolom partisi, BigQuery melewati partisi lain sepenuhnya.</li><li><b>Clustering</b>: di dalam setiap partisi, baris diurutkan berdasarkan sampai 4 kolom. Filter di kolom itu membuat BigQuery bisa melewati blok storage.</li><li><b>require_partition_filter</b>: opsi tabel yang menolak query tanpa filter partisi.</li><li><b>Partition expiration</b>: otomatis menghapus partisi yang lebih tua dari N hari.</li></ul>`,
`<ol><li>Buat tabel dengan <code>PARTITION BY DATE(event_ts)</code> dan <code>CLUSTER BY customer_id, store_id</code>.</li><li>Saat data masuk, setiap baris ditulis ke partisi harinya dan diurutkan berdasarkan kolom clustering.</li><li>Query dengan <code>WHERE DATE(event_ts) = '2026-11-01' AND customer_id = 123</code> pertama memangkas ke satu partisi, lalu hanya membaca blok yang rentang customer_id-nya mencakup 123.</li><li>Jalankan <b>dry run</b> untuk melihat perkiraan byte sebelum menjalankan query (gratis).</li><li>BigQuery melakukan re-clustering otomatis di belakang layar, tanpa biaya.</li></ol><p>Tabel lama yang tidak dipartisi <b>tidak bisa</b> diubah langsung. Buat tabel baru dengan <code>CREATE TABLE baru PARTITION BY … AS SELECT * FROM lama</code> (CTAS).</p>`,
`<div class="box pic"><div class="l">Analogi</div>Perpustakaan menagihmu untuk setiap rak yang kamu lewati. <b>Partitioning</b> membaginya jadi satu ruangan per hari: kamu hanya masuk ke ruangan tanggal yang dibutuhkan. <b>Clustering</b> mengurutkan buku di setiap ruangan berdasarkan nama customer: kamu berhenti berjalan begitu melewati nama itu. <b>Memilih sedikit kolom</b> = mengunjungi lebih sedikit lorong. <b>LIMIT</b> itu cuma minta 10 buku setelah tetap berjalan melewati semua rak, jadi biaya masuknya tidak berkurang.</div>`,
`<p>Sebuah tabel event berisi data 3 tahun, total 40 TB (≈ 36 GB per hari), dengan 50 kolom yang ukurannya mirip.</p><table><tr><th>Desain query</th><th>Perkiraan byte dibaca</th></tr><tr><td><code>SELECT *</code>, tanpa filter</td><td>40 TB</td></tr><tr><td><code>SELECT *</code> + filter kemarin (partisi per hari)</td><td>≈ 36 GB</td></tr><tr><td>3 kolom + filter kemarin</td><td>≈ 36 GB × 3/50 ≈ 2,2 GB</td></tr><tr><td>Sama + cluster by customer_id, filter satu customer</td><td>sering hanya beberapa ratus MB</td></tr></table><p>Dari 40 TB jadi ~2 GB, kira-kira 20.000× lebih sedikit byte yang ditagih untuk jawaban yang sama.</p>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li><mark>LIMIT tidak mengurangi byte yang di-scan</mark> di tabel biasa.</li><li>Membeli slot tambahan membuat query lebih cepat, tapi tidak mengurangi byte on-demand.</li><li>Logical view yang memfilter "hari ini" tidak mengubah tata letak storage; user tetap bisa meng-query tabel aslinya.</li><li>Partisi berdasarkan ID dengan cardinality tinggi itu salah; itu tugas clustering. Partisi berdasarkan tanggal yang difilter.</li><li>Jangan membuat partisi per jam selama bertahun-tahun: ada batas jumlah partisi per tabel (ribuan).</li><li>Tabel date-sharded (<code>events_20261101</code>…) adalah pola lama; satu tabel partitioned lebih baik.</li></ul></div>`,
`<p>BigQuery on-demand menagih byte yang dibaca query, jadi query termurah adalah yang membaca kolom dan partisi paling sedikit. Partisi berdasarkan tanggal yang sering difilter (dengan require_partition_filter), dan cluster berdasarkan sampai 4 kolom filter ber-cardinality tinggi seperti customer_id. LIMIT tidak menghemat biaya, dan tabel lama diubah dengan CREATE TABLE … PARTITION BY … AS SELECT.</p>`
]);
})();

/* ===== d3-l4 schema design & loading ===== */
dd("d3-l4",[
`<p>In an OLTP database you normalise: orders in one table, order items in another, customers in a third, all linked by IDs. That's perfect for small, frequent updates. But in a warehouse, a report like "revenue per product category per city" has to join billions of rows across those tables, and <mark>big joins are the slowest, most expensive part of analytics</mark>.</p><p>On top of that, data has to get <i>into</i> BigQuery somehow: daily files, real-time events, or data sitting in other systems. The wrong loading method can be slow, costly or create duplicates.</p>`,
`<ul><li><b>Normalised</b>: data split into many tables to avoid repetition. <b>Denormalised</b>: data combined into wider tables to avoid joins.</li><li><b>Nested field (STRUCT)</b>: a column that contains sub-fields, e.g. <code>address.city</code>.</li><li><b>Repeated field (ARRAY)</b>: a column that contains a list, e.g. all line items of an order inside the order row.</li><li><b>Star schema</b>: a big fact table (events) plus small dimension tables (customer, product). Still fine in BigQuery.</li><li><b>Load job</b>: bulk import of files from GCS. Free (shared slot pool).</li><li><b>Streaming</b>: rows arrive continuously via the <b>Storage Write API</b> (recommended) or the legacy <code>insertAll</code>, or a Pub/Sub <b>BigQuery subscription</b>.</li><li><b>External / federated</b>: query data where it lives (GCS files, Sheets, Bigtable, or Cloud SQL via <code>EXTERNAL_QUERY</code>) without copying.</li><li>File formats: <b>Avro</b> (binary, schema inside, compressed blocks readable in parallel), <b>Parquet/ORC</b> (columnar), CSV/JSON (text, slowest).</li></ul>`,
`<ol><li><b>Model for the questions.</b> If reports always read orders with their items, store items as <code>ARRAY&lt;STRUCT&lt;sku STRING, qty INT64, price NUMERIC&gt;&gt;</code> inside the order row. The "join" disappears because the data is already together.</li><li>Query nested data with <code>UNNEST(items)</code> when you need item-level detail.</li><li>Keep small dimensions as separate tables if that's simpler; joining a big fact to a small dimension is cheap.</li><li><b>Batch files</b> (daily exports): write Avro or Parquet to GCS, then a load job (or BigQuery Data Transfer Service for GCS) on a schedule.</li><li><b>Real-time events</b>: Storage Write API from your app/Dataflow, or a Pub/Sub BigQuery subscription when no transformation is needed.</li><li><b>Data that must stay in another system</b>: federated query or external table.</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>A normalised design is like keeping receipts in one folder and the list of items for each receipt in another folder; every time you want a full receipt you must match them up. A nested/repeated design is the real receipt: <b>the items are printed on the same piece of paper</b>. Load jobs are a delivery truck unloading boxes at the warehouse once a day; the Storage Write API is a conveyor belt that never stops.</div>`,
`<p>A marketplace has 2 billion orders and 9 billion order items. The daily report "GMV per category per city" joined them every morning and took 8 minutes, scanning 6 TB.</p><p>Redesign: one <code>orders</code> table, partitioned by <code>order_date</code>, with a repeated <code>items</code> field. The report becomes:</p><p><code>SELECT city, i.category, SUM(i.qty*i.price) FROM orders, UNNEST(items) i WHERE order_date = CURRENT_DATE()-1 GROUP BY 1,2</code></p><p>It reads one day's partition and only the needed columns: a few GB, finishing in seconds, with no join. Loading: the source system exports Avro files hourly to GCS and a scheduled load job imports them for free.</p>`,
`<div class="box trap"><div class="l">Traps</div><ul><li>"Normalise further into 3NF" adds joins: wrong direction for analytics.</li><li>Moving analytics to Cloud SQL "because it supports joins" fails at warehouse scale.</li><li>Gzipped CSV can't be split, so loads are slow; <mark>Avro is the fastest load format</mark>.</li><li>Legacy streaming (<code>insertAll</code>) costs more and can duplicate rows on retries; <mark>Storage Write API</mark> is the modern answer.</li><li>A daily file with no transformation doesn't need Dataflow; a load job is enough.</li><li>Don't use date-sharded tables; use one partitioned table.</li></ul></div>`,
`<p>BigQuery prefers denormalised data: store children inside the parent row with nested and repeated fields so expensive joins disappear, while small dimension joins remain fine. Load batches with free load jobs (Avro is fastest) and stream with the Storage Write API or a Pub/Sub BigQuery subscription. When data must stay elsewhere, query it in place with external tables or federated queries.</p>`
],[
`<p>Di database OLTP kita melakukan normalisasi: order di satu tabel, item order di tabel lain, customer di tabel ketiga, semuanya terhubung lewat ID. Itu sempurna untuk update kecil yang sering. Tapi di warehouse, laporan seperti "pendapatan per kategori produk per kota" harus men-join miliaran baris lintas tabel itu, dan <mark>join besar adalah bagian paling lambat dan paling mahal dari analitik</mark>.</p><p>Selain itu, data juga harus <i>masuk</i> ke BigQuery dengan cara tertentu: file harian, event real-time, atau data yang ada di sistem lain. Cara loading yang salah bisa lambat, mahal, atau membuat duplikat.</p>`,
`<ul><li><b>Normalized</b>: data dipecah ke banyak tabel supaya tidak berulang. <b>Denormalized</b>: data digabung ke tabel yang lebih lebar supaya tidak perlu join.</li><li><b>Nested field (STRUCT)</b>: kolom yang berisi sub-field, misalnya <code>address.city</code>.</li><li><b>Repeated field (ARRAY)</b>: kolom yang berisi daftar, misalnya semua line item sebuah order di dalam baris order.</li><li><b>Star schema</b>: satu tabel fact besar (event) plus tabel dimension kecil (customer, produk). Tetap oke di BigQuery.</li><li><b>Load job</b>: impor file secara massal dari GCS. Gratis (pakai pool slot bersama).</li><li><b>Streaming</b>: baris masuk terus-menerus lewat <b>Storage Write API</b> (disarankan) atau <code>insertAll</code> versi lama, atau <b>BigQuery subscription</b> Pub/Sub.</li><li><b>External / federated</b>: query data di tempat asalnya (file GCS, Sheets, Bigtable, atau Cloud SQL lewat <code>EXTERNAL_QUERY</code>) tanpa menyalin.</li><li>Format file: <b>Avro</b> (biner, schema di dalam file, blok terkompresi yang bisa dibaca paralel), <b>Parquet/ORC</b> (kolumnar), CSV/JSON (teks, paling lambat).</li></ul>`,
`<ol><li><b>Modelkan sesuai pertanyaan.</b> Kalau laporan selalu membaca order beserta itemnya, simpan item sebagai <code>ARRAY&lt;STRUCT&lt;sku STRING, qty INT64, price NUMERIC&gt;&gt;</code> di dalam baris order. "Join"-nya hilang karena datanya sudah bersama.</li><li>Query data nested dengan <code>UNNEST(items)</code> kalau butuh detail per item.</li><li>Dimensi kecil boleh tetap jadi tabel terpisah kalau lebih sederhana; join fact besar ke dimensi kecil itu murah.</li><li><b>File batch</b> (export harian): tulis Avro atau Parquet ke GCS, lalu load job (atau BigQuery Data Transfer Service untuk GCS) terjadwal.</li><li><b>Event real-time</b>: Storage Write API dari app/Dataflow, atau BigQuery subscription Pub/Sub kalau tidak perlu transformasi.</li><li><b>Data yang harus tetap di sistem lain</b>: federated query atau external table.</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Desain normalized itu seperti menyimpan struk di satu map dan daftar barang tiap struk di map lain; setiap kali butuh struk lengkap, kamu harus mencocokkan keduanya. Desain nested/repeated adalah struk aslinya: <b>daftar barang tercetak di kertas yang sama</b>. Load job adalah truk yang membongkar kardus di gudang sekali sehari; Storage Write API adalah ban berjalan yang tidak pernah berhenti.</div>`,
`<p>Sebuah marketplace punya 2 miliar order dan 9 miliar item order. Laporan harian "GMV per kategori per kota" men-join keduanya setiap pagi, butuh 8 menit dan men-scan 6 TB.</p><p>Desain ulang: satu tabel <code>orders</code>, dipartisi berdasarkan <code>order_date</code>, dengan field repeated <code>items</code>. Laporannya menjadi:</p><p><code>SELECT city, i.category, SUM(i.qty*i.price) FROM orders, UNNEST(items) i WHERE order_date = CURRENT_DATE()-1 GROUP BY 1,2</code></p><p>Query ini hanya membaca partisi satu hari dan kolom yang dibutuhkan: beberapa GB, selesai dalam hitungan detik, tanpa join. Loading-nya: sistem sumber mengekspor file Avro per jam ke GCS, lalu load job terjadwal mengimpornya secara gratis.</p>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li>"Normalisasi lebih jauh ke 3NF" justru menambah join: arah yang salah untuk analitik.</li><li>Memindahkan analitik ke Cloud SQL "karena mendukung join" gagal di skala warehouse.</li><li>CSV yang di-gzip tidak bisa dipecah, jadi load-nya lambat; <mark>Avro adalah format load tercepat</mark>.</li><li>Streaming lama (<code>insertAll</code>) lebih mahal dan bisa membuat baris duplikat saat retry; <mark>Storage Write API</mark> adalah jawaban modernnya.</li><li>File harian tanpa transformasi tidak butuh Dataflow; load job sudah cukup.</li><li>Jangan pakai tabel date-sharded; pakai satu tabel partitioned.</li></ul></div>`,
`<p>BigQuery lebih suka data yang didenormalisasi: simpan data anak di dalam baris induk dengan nested dan repeated fields supaya join yang mahal hilang, sementara join ke dimensi kecil tetap oke. Muat data batch dengan load job yang gratis (Avro paling cepat) dan streaming dengan Storage Write API atau BigQuery subscription Pub/Sub. Kalau data harus tetap di tempat lain, query di tempatnya dengan external table atau federated query.</p>`
]);

/* ===== d3-l5 backup, recovery, storage cost ===== */
dd("d3-l5",[
`<p>Sooner or later someone runs <code>UPDATE … SET price = 0</code> without a WHERE clause, or a buggy pipeline overwrites last night's data. In a traditional warehouse you'd restore from last week's tape and lose days of work.</p><p>BigQuery also keeps growing, and storage costs add up. You need cheap ways to <mark>undo mistakes, keep long-term backups, give testers safe copies, and stop paying full price for data nobody touches</mark>.</p>`,
`<ul><li><b>Time travel</b>: BigQuery keeps every change for a window of 2 to 7 days (default 7, configurable per dataset). You can query <code>FOR SYSTEM_TIME AS OF</code> a past timestamp, or restore a deleted table.</li><li><b>Fail-safe</b>: 7 more days after the time-travel window, only recoverable through Google support.</li><li><b>Table snapshot</b>: a read-only, point-in-time copy. You only pay for data that later differs from the base table. Keep it as long as you like (you can set an expiration).</li><li><b>Table clone</b>: a <i>writable</i> lightweight copy, also billed only for changes. Great for testing.</li><li><b>Long-term storage</b>: a table or partition not modified for 90 days automatically costs about half.</li><li><b>Table / partition expiration</b>: automatic deletion after N days.</li><li><b>Storage billing model</b>: logical (uncompressed) or physical (compressed) bytes, set per dataset.</li><li><b>Dataset location</b>: fixed when the dataset is created.</li></ul>`,
`<ol><li><b>Undo a recent mistake</b>: find the time just before it, then <code>CREATE OR REPLACE TABLE t AS SELECT * FROM t FOR SYSTEM_TIME AS OF TIMESTAMP '2026-11-10 09:59:00+07'</code>.</li><li><b>Long-term backups</b> (e.g. monthly for a year): schedule <code>CREATE SNAPSHOT TABLE … CLONE source</code> with an expiration of 365 days.</li><li><b>Test copy</b>: <code>CREATE TABLE sandbox.t CLONE prod.t</code>, experiment freely, and pay only for what you change.</li><li><b>Temporary/staging data</b>: set table or partition expiration so it cleans itself.</li><li><b>Cold history</b>: do nothing; partitions untouched for 90 days switch to long-term pricing automatically.</li><li><b>Region-level DR</b>: cross-region dataset replication (managed disaster recovery in Enterprise Plus).</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div><b>Time travel</b> is the undo history of a Google Doc that only remembers the last week. <b>Fail-safe</b> is calling Google to dig through their own backup for a few more days. A <b>snapshot</b> is taking a photo of a whiteboard before erasing it, so you can look at it whenever you want. A <b>clone</b> is a photocopy you're allowed to scribble on. <b>Long-term storage</b> is a discount on boxes you haven't opened in 3 months.</div>`,
`<p>At 10:00 a teammate deletes all rows of <code>sales</code> by mistake. You notice at 13:00.</p><ul><li>Time travel still has the data (3 hours &lt; 7 days). Restore with <code>FOR SYSTEM_TIME AS OF '…09:59…'</code>: done in minutes.</li><li>If you had only noticed 12 days later: time travel (7 days) is over, fail-safe (days 8–14) may still help via support, but that's slow. Monthly snapshots would have given you a self-service restore point.</li></ul><p>Cost side: a 20 TB history table where only the last 30 daily partitions change each month. Partitions older than 90 days are billed at the long-term rate automatically, so most of the table costs about half without you doing anything.</p>`,
`<div class="box trap"><div class="l">Traps</div><ul><li>"Open a support case for fail-safe" is <mark>not</mark> the first step when the mistake is within the time-travel window.</li><li>Time travel only reaches 7 days. Long-term retention needs snapshots (or exports).</li><li>Snapshots are read-only; for a writable cheap copy use a <mark>clone</mark>.</li><li>CTAS into a new table makes a <i>full</i> copy, billed fully.</li><li>Table expiration deletes the whole table; partition expiration deletes old partitions only.</li><li>You can't change a dataset's location; copy to a new dataset instead.</li></ul></div>`,
`<p>Time travel lets you query or restore any table state from the last 2–7 days, followed by 7 days of support-only fail-safe. Snapshots (read-only) and clones (writable) are cheap copies billed only for differences, so they're the tools for long-term backups and test copies. Data untouched for 90 days gets long-term pricing automatically, and expiration settings clean up temporary data.</p>`
],[
`<p>Cepat atau lambat ada yang menjalankan <code>UPDATE … SET price = 0</code> tanpa WHERE, atau pipeline yang bug menimpa data semalam. Di warehouse tradisional, kamu harus restore dari backup tape minggu lalu dan kehilangan kerja beberapa hari.</p><p>BigQuery juga terus membesar, dan biaya storage ikut naik. Kamu butuh cara murah untuk <mark>membatalkan kesalahan, menyimpan backup jangka panjang, memberi salinan aman untuk tester, dan berhenti membayar harga penuh untuk data yang tidak pernah disentuh</mark>.</p>`,
`<ul><li><b>Time travel</b>: BigQuery menyimpan setiap perubahan selama 2 sampai 7 hari (default 7, bisa diatur per dataset). Kamu bisa query <code>FOR SYSTEM_TIME AS OF</code> waktu tertentu di masa lalu, atau mengembalikan tabel yang terhapus.</li><li><b>Fail-safe</b>: 7 hari tambahan setelah masa time travel habis, hanya bisa dipulihkan lewat Google support.</li><li><b>Table snapshot</b>: salinan read-only pada satu titik waktu. Kamu hanya bayar data yang nantinya berbeda dari tabel aslinya. Bisa disimpan selama yang kamu mau (expiration bisa diatur).</li><li><b>Table clone</b>: salinan ringan yang <i>bisa diubah</i>, juga hanya ditagih untuk perubahannya. Cocok untuk testing.</li><li><b>Long-term storage</b>: tabel atau partisi yang tidak diubah selama 90 hari otomatis sekitar setengah harga.</li><li><b>Table / partition expiration</b>: penghapusan otomatis setelah N hari.</li><li><b>Model penagihan storage</b>: byte logical (tidak terkompresi) atau physical (terkompresi), diatur per dataset.</li><li><b>Lokasi dataset</b>: ditentukan saat dataset dibuat dan tidak bisa diubah.</li></ul>`,
`<ol><li><b>Membatalkan kesalahan yang baru terjadi</b>: cari waktu tepat sebelum kesalahan, lalu <code>CREATE OR REPLACE TABLE t AS SELECT * FROM t FOR SYSTEM_TIME AS OF TIMESTAMP '2026-11-10 09:59:00+07'</code>.</li><li><b>Backup jangka panjang</b> (misalnya bulanan selama setahun): jadwalkan <code>CREATE SNAPSHOT TABLE … CLONE sumber</code> dengan expiration 365 hari.</li><li><b>Salinan untuk testing</b>: <code>CREATE TABLE sandbox.t CLONE prod.t</code>, bebas bereksperimen, dan hanya bayar yang kamu ubah.</li><li><b>Data sementara/staging</b>: atur table atau partition expiration supaya terhapus sendiri.</li><li><b>Riwayat yang jarang disentuh</b>: tidak perlu apa-apa; partisi yang tidak diubah 90 hari otomatis pindah ke harga long-term.</li><li><b>DR tingkat region</b>: cross-region dataset replication (managed disaster recovery di Enterprise Plus).</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div><b>Time travel</b> adalah riwayat undo Google Docs yang hanya ingat seminggu terakhir. <b>Fail-safe</b> adalah menelepon Google supaya mereka mencarikan dari backup mereka sendiri untuk beberapa hari lagi. <b>Snapshot</b> adalah memotret papan tulis sebelum dihapus, jadi bisa dilihat kapan saja. <b>Clone</b> adalah fotokopi yang boleh kamu coret-coret. <b>Long-term storage</b> adalah diskon untuk kardus yang tidak dibuka 3 bulan.</div>`,
`<p>Jam 10:00 seorang rekan tidak sengaja menghapus semua baris tabel <code>sales</code>. Kamu baru sadar jam 13:00.</p><ul><li>Time travel masih menyimpan datanya (3 jam &lt; 7 hari). Restore dengan <code>FOR SYSTEM_TIME AS OF '…09:59…'</code>: selesai dalam beberapa menit.</li><li>Kalau baru sadar 12 hari kemudian: time travel (7 hari) sudah lewat, fail-safe (hari 8–14) mungkin masih bisa lewat support, tapi lambat. Snapshot bulanan akan memberimu titik restore mandiri.</li></ul><p>Dari sisi biaya: tabel riwayat 20 TB yang hanya 30 partisi hariannya berubah setiap bulan. Partisi yang lebih tua dari 90 hari otomatis ditagih harga long-term, jadi sebagian besar tabel hanya sekitar setengah harga tanpa kamu melakukan apa pun.</p>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li>"Buka tiket support untuk fail-safe" <mark>bukan</mark> langkah pertama kalau kesalahannya masih dalam masa time travel.</li><li>Time travel hanya sampai 7 hari. Retensi jangka panjang butuh snapshot (atau export).</li><li>Snapshot itu read-only; untuk salinan murah yang bisa diubah pakai <mark>clone</mark>.</li><li>CTAS ke tabel baru membuat salinan <i>penuh</i>, ditagih penuh.</li><li>Table expiration menghapus seluruh tabel; partition expiration hanya menghapus partisi lama.</li><li>Lokasi dataset tidak bisa diubah; salin ke dataset baru.</li></ul></div>`,
`<p>Time travel memungkinkan query atau restore kondisi tabel mana pun dalam 2–7 hari terakhir, ditambah 7 hari fail-safe yang hanya lewat support. Snapshot (read-only) dan clone (bisa diubah) adalah salinan murah yang hanya ditagih untuk perbedaannya, jadi itulah alat untuk backup jangka panjang dan salinan testing. Data yang tidak disentuh 90 hari otomatis dapat harga long-term, dan pengaturan expiration membersihkan data sementara.</p>`

/* ===== d3-l6 Bigtable model & row keys ===== */
dd("d3-l6",[
`<p>Imagine 500,000 sensors each sending a reading every second: that's 500,000 writes per second, forever, and an app that must show any sensor's latest values in under 10 ms. A relational database on one machine can't absorb that write rate, and BigQuery is built for big scans, not millisecond lookups.</p><p>Bigtable is built exactly for this: <mark>massive write throughput and single-digit-millisecond reads by key, at TB–PB scale</mark>. The price is that you can only look data up by one thing, the row key, so designing that key is everything.</p>`,
`<ul><li><b>Wide-column NoSQL</b>: no SQL joins, no fixed schema per row. Each row can have different columns.</li><li><b>Row key</b>: a string that identifies a row. Rows are stored <b>sorted lexicographically by row key</b>. It is the only index.</li><li><b>Column family</b>: a named group of columns (e.g. <code>m</code> for measurements). Settings like garbage collection apply per family.</li><li><b>Cell</b>: the value at row × column, with a <b>timestamp</b>; a cell can keep several versions.</li><li><b>Sparse</b>: empty cells take no space.</li><li><b>Tablets &amp; nodes</b>: the key space is split into contiguous ranges (tablets) served by nodes. More nodes = more throughput, roughly linear.</li><li><b>Hotspot</b>: many requests on one key range, so one node is overloaded.</li><li>Atomicity is guaranteed only <b>within a single row</b>.</li></ul>`,
`<ol><li>Write down the <b>main query</b>: e.g. "latest 50 readings for one sensor" or "all events for a user between two dates".</li><li>Put the thing you look up by <b>first</b> in the key: <code>sensor_id#…</code> or <code>user_id#…</code>. This groups each entity's rows together and spreads different entities across nodes (<b>field promotion</b>).</li><li>Add time after it. Use a <b>reverse timestamp</b> (<code>MAX_LONG − ts</code>) if you usually want newest-first, so the latest rows come first in a prefix scan.</li><li>Store one event per row ("<b>tall and narrow</b>"), not an ever-growing row.</li><li>Keep keys short; group columns read together in one family.</li><li>If writes still concentrate, add a small hash prefix (<b>salting</b>), knowing it complicates range scans.</li><li>Diagnose uneven load with <b>Key Visualizer</b>.</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>Bigtable is a giant phone book sorted only by the name on each line. Finding "Santoso, Budi" is instant. Finding "everyone who lives on Jalan Sudirman" means reading the whole book. Now imagine all new entries are named after the current time: everyone writes on the very last page at once, and that page tears. That's a hotspot. Putting the person's name first spreads new entries across the whole book.</div>`,
`<p>Fleet app: 80,000 trucks send GPS every 5 seconds (16,000 writes/sec). The main screen shows the 50 newest positions for one truck.</p><table><tr><th>Row key</th><th>Result</th></tr><tr><td><code>2026-11-10T09:00:05#T123</code></td><td>All current writes hit the end of the key range → one node at 100% CPU (hotspot).</td></tr><tr><td><code>T123#2026-11-10T09:00:05</code></td><td>Writes spread across trucks. But the newest rows are at the <i>end</i> of each truck's range.</td></tr><tr><td><code>T123#(9999999999−epoch)</code></td><td>Writes spread, and a prefix scan on <code>T123#</code> returns the newest 50 first. ✓</td></tr><tr><td>random UUID</td><td>Spread, but "one truck's latest" becomes a full-table scan.</td></tr></table>`,
`<div class="box trap"><div class="l">Traps</div><ul><li><mark>Never start a row key with a timestamp</mark> or a sequential ID.</li><li>Adding nodes doesn't fix a hotspot; redesign the key.</li><li>Field promotion first, salting only if needed (salting breaks simple range scans).</li><li>Bigtable can't search by arbitrary attributes, can't join, and has no multi-row transactions.</li><li>Bigtable for small data (well under 1 TB) is overkill.</li><li>For realistic performance tests, use ≥300 GB and run 10+ minutes; Bigtable rebalances over time.</li></ul></div>`,
`<p>Bigtable is a wide-column NoSQL store that delivers huge write throughput and millisecond reads, but its only index is the row key, sorted lexicographically. Design the key from your main query: entity first (field promotion), then time, using a reverse timestamp for newest-first and one event per row. Timestamp-first or sequential keys create hotspots that extra nodes can't fix.</p>`
],[
`<p>Bayangkan 500.000 sensor yang masing-masing mengirim data setiap detik: itu 500.000 write per detik, terus-menerus, ditambah app yang harus menampilkan data terbaru sensor mana pun dalam waktu di bawah 10 ms. Database relasional di satu mesin tidak sanggup menampung laju write sebesar itu, dan BigQuery dibuat untuk scan besar, bukan lookup dalam milidetik.</p><p>Bigtable dibuat tepat untuk ini: <mark>throughput write raksasa dan read per key dalam hitungan milidetik, di skala TB–PB</mark>. Harganya, kamu hanya bisa mencari data berdasarkan satu hal, yaitu row key, jadi desain key itu segalanya.</p>`,
`<ul><li><b>NoSQL wide-column</b>: tidak ada SQL join, tidak ada schema tetap per baris. Setiap baris boleh punya kolom berbeda.</li><li><b>Row key</b>: string yang mengidentifikasi sebuah baris. Baris disimpan <b>terurut secara leksikografis berdasarkan row key</b>. Ini satu-satunya index.</li><li><b>Column family</b>: kelompok kolom bernama (misalnya <code>m</code> untuk measurement). Pengaturan seperti garbage collection berlaku per family.</li><li><b>Cell</b>: nilai di perpotongan baris × kolom, dengan <b>timestamp</b>; satu cell bisa menyimpan beberapa versi.</li><li><b>Sparse</b>: cell kosong tidak memakan tempat.</li><li><b>Tablet &amp; node</b>: rentang key dipecah jadi potongan berurutan (tablet) yang dilayani node. Node lebih banyak = throughput lebih tinggi, kira-kira linear.</li><li><b>Hotspot</b>: banyak request jatuh di satu rentang key, sehingga satu node kewalahan.</li><li>Atomicity hanya dijamin <b>di dalam satu baris</b>.</li></ul>`,
`<ol><li>Tulis dulu <b>query utamanya</b>: misalnya "50 data terbaru untuk satu sensor" atau "semua event seorang user di antara dua tanggal".</li><li>Taruh hal yang kamu cari <b>di depan</b> key: <code>sensor_id#…</code> atau <code>user_id#…</code>. Ini mengelompokkan baris setiap entitas dan menyebarkan entitas yang berbeda ke berbagai node (<b>field promotion</b>).</li><li>Tambahkan waktu setelahnya. Pakai <b>reverse timestamp</b> (<code>MAX_LONG − ts</code>) kalau biasanya butuh data terbaru dulu, supaya baris terbaru muncul pertama dalam prefix scan.</li><li>Simpan satu event per baris ("<b>tall and narrow</b>"), bukan satu baris yang terus memanjang.</li><li>Buat key sependek mungkin; kelompokkan kolom yang dibaca bersamaan dalam satu family.</li><li>Kalau write masih menumpuk, tambahkan prefix hash kecil (<b>salting</b>), dengan konsekuensi range scan jadi lebih rumit.</li><li>Diagnosis beban yang tidak merata dengan <b>Key Visualizer</b>.</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Bigtable adalah buku telepon raksasa yang hanya diurutkan berdasarkan nama di setiap baris. Mencari "Santoso, Budi" langsung ketemu. Mencari "semua orang yang tinggal di Jalan Sudirman" berarti membaca seluruh buku. Sekarang bayangkan semua entri baru diberi nama berdasarkan jam saat ini: semua orang menulis di halaman paling belakang bersamaan, dan halaman itu robek. Itulah hotspot. Menaruh nama orangnya di depan membuat entri baru tersebar ke seluruh buku.</div>`,
`<p>App armada: 80.000 truk mengirim GPS setiap 5 detik (16.000 write/detik). Layar utama menampilkan 50 posisi terbaru untuk satu truk.</p><table><tr><th>Row key</th><th>Hasil</th></tr><tr><td><code>2026-11-10T09:00:05#T123</code></td><td>Semua write saat ini jatuh di ujung rentang key → satu node CPU 100% (hotspot).</td></tr><tr><td><code>T123#2026-11-10T09:00:05</code></td><td>Write tersebar ke banyak truk. Tapi baris terbaru ada di <i>ujung</i> rentang setiap truk.</td></tr><tr><td><code>T123#(9999999999−epoch)</code></td><td>Write tersebar, dan prefix scan <code>T123#</code> langsung mengembalikan 50 data terbaru. ✓</td></tr><tr><td>UUID acak</td><td>Tersebar, tapi "data terbaru satu truk" berubah jadi scan seluruh tabel.</td></tr></table>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li><mark>Jangan pernah mengawali row key dengan timestamp</mark> atau ID yang berurutan.</li><li>Menambah node tidak menyelesaikan hotspot; desain ulang key-nya.</li><li>Field promotion dulu, salting hanya kalau perlu (salting merusak range scan sederhana).</li><li>Bigtable tidak bisa mencari berdasarkan atribut sembarang, tidak bisa join, dan tidak punya transaksi multi-baris.</li><li>Bigtable untuk data kecil (jauh di bawah 1 TB) itu berlebihan.</li><li>Untuk tes performa yang realistis, pakai ≥300 GB dan jalankan 10+ menit; Bigtable menyeimbangkan beban seiring waktu.</li></ul></div>`,
`<p>Bigtable adalah storage NoSQL wide-column dengan throughput write raksasa dan read dalam milidetik, tapi satu-satunya index adalah row key yang diurutkan secara leksikografis. Desain key dari query utama: entitas di depan (field promotion), lalu waktu, pakai reverse timestamp untuk data terbaru duluan, dan satu event per baris. Key yang diawali timestamp atau berurutan membuat hotspot yang tidak bisa diatasi dengan menambah node.</p>`
]);

/* ===== d3-l7 Bigtable replication & operations ===== */
dd("d3-l7",[
`<p>Once Bigtable is running a production app, new questions appear. What if the zone goes down? How do analysts run heavy batch jobs without slowing the app's 5 ms reads? How do we handle traffic that doubles at lunchtime? How do we keep old data from piling up forever?</p><p>This lesson is about running Bigtable well: <mark>replication, app profiles, scaling, garbage collection and backups</mark>.</p>`,
`<ul><li><b>Instance → clusters → nodes</b>. An instance can have several clusters, each in a different zone or region. Data is replicated between them automatically.</li><li>Replication is <b>eventually consistent</b> between clusters (usually seconds).</li><li><b>App profile</b>: tells Bigtable how a client's requests are routed. <b>Single-cluster routing</b> sends traffic to one cluster (needed for single-row transactions, and to isolate workloads). <b>Multi-cluster routing</b> sends to the nearest available cluster with automatic failover.</li><li><b>Autoscaling</b>: Bigtable adds/removes nodes to stay near a CPU and storage target you set.</li><li><b>Storage type</b>: SSD (default, low latency) or HDD (cheaper, only for large, rarely-read, latency-tolerant data). Chosen at cluster creation.</li><li><b>Garbage collection (GC) policy</b>: per column family, keep only N versions or data younger than X days.</li><li><b>Backups</b>: managed table backups, restorable to a new table.</li><li><b>Data Boost</b>: serverless compute for batch/analytic reads that doesn't use your cluster's nodes.</li></ul>`,
`<ol><li><b>Need high availability?</b> Add a second cluster in another zone (or region for DR) and use a multi-cluster routing app profile for serving traffic.</li><li><b>Need workload isolation?</b> Create two app profiles with single-cluster routing: serving → cluster A, batch/analytics → cluster B. Batch jobs can no longer slow the app. Data Boost is another option for batch reads.</li><li><b>Variable load?</b> Turn on autoscaling with min/max nodes and a CPU target.</li><li><b>Unbounded growth?</b> Set GC rules, e.g. <code>maxage=30d</code> or <code>maxversions=1</code>.</li><li><b>Protection from bad writes?</b> Schedule backups (replication copies mistakes too).</li><li>Monitor with Cloud Monitoring and <b>Key Visualizer</b>; keep CPU within recommended limits.</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>A restaurant chain with two kitchens in different buildings, both cooking from the same recipes (replication). App profiles are the host at the door: "dine-in guests go to kitchen A, catering orders go to kitchen B", so a 300-portion catering order doesn't delay table 4's dinner. Multi-cluster routing is "go to whichever kitchen is open". Autoscaling is calling in more cooks at lunch. GC is throwing out food older than its expiry date.</div>`,
`<p>A ride-hailing app stores driver locations in Bigtable. Each night a Dataflow job reads the whole table for analytics, and the app's p99 latency jumps from 6 ms to 80 ms.</p><ul><li>Add a second cluster (another zone) → replication.</li><li>App profile <code>serving</code>: single-cluster routing to cluster A (or multi-cluster for failover).</li><li>App profile <code>batch</code>: single-cluster routing to cluster B, used by the Dataflow job. Or use Data Boost.</li><li>GC on the <code>loc</code> family: <code>maxage=7d</code>, because only a week of history is needed in Bigtable.</li><li>Autoscaling min 3, max 12 nodes for rush hours.</li></ul><p>Result: the app stays at 6 ms during the nightly job and survives a zone outage.</p>`,
`<div class="box trap"><div class="l">Traps</div><ul><li>Batch slowing serving → <mark>separate clusters + app profiles</mark>, not "add more nodes to the one cluster".</li><li>Replication is not a backup: a bad delete is replicated too. Use backups.</li><li>Single-row transactions (read-modify-write, check-and-mutate) need single-cluster routing.</li><li>HDD is only for large, cold, latency-tolerant data; never for user-facing reads.</li><li>Expecting strong consistency across clusters is wrong; it's eventual.</li><li>Changing storage type needs a new cluster/instance and moving data.</li></ul></div>`,
`<p>Bigtable instances can have multiple clusters that replicate eventually, giving high availability and a way to isolate workloads. App profiles route traffic: single-cluster to isolate batch from serving, multi-cluster for automatic failover. Autoscaling handles load changes, GC policies limit growth, and backups (not replication) protect against bad writes.</p>`
],[
`<p>Begitu Bigtable menjalankan app produksi, muncul pertanyaan baru. Bagaimana kalau zone-nya mati? Bagaimana analis menjalankan batch job berat tanpa memperlambat read 5 ms milik app? Bagaimana menghadapi traffic yang naik dua kali lipat saat jam makan siang? Bagaimana supaya data lama tidak menumpuk selamanya?</p><p>Pelajaran ini tentang menjalankan Bigtable dengan benar: <mark>replication, app profile, scaling, garbage collection, dan backup</mark>.</p>`,
`<ul><li><b>Instance → cluster → node</b>. Satu instance bisa punya beberapa cluster, masing-masing di zone atau region berbeda. Data otomatis direplikasi di antara mereka.</li><li>Replication antar cluster bersifat <b>eventually consistent</b> (biasanya hitungan detik).</li><li><b>App profile</b>: memberi tahu Bigtable bagaimana request dari sebuah client diarahkan. <b>Single-cluster routing</b> mengirim traffic ke satu cluster (wajib untuk transaksi satu baris, dan untuk memisahkan beban kerja). <b>Multi-cluster routing</b> mengirim ke cluster terdekat yang tersedia dengan failover otomatis.</li><li><b>Autoscaling</b>: Bigtable menambah/mengurangi node supaya tetap dekat target CPU dan storage yang kamu tentukan.</li><li><b>Tipe storage</b>: SSD (default, latensi rendah) atau HDD (lebih murah, hanya untuk data besar yang jarang dibaca dan tidak sensitif latensi). Dipilih saat membuat cluster.</li><li><b>Garbage collection (GC) policy</b>: per column family, simpan hanya N versi atau data yang lebih muda dari X hari.</li><li><b>Backup</b>: backup tabel terkelola, bisa di-restore ke tabel baru.</li><li><b>Data Boost</b>: compute serverless untuk read batch/analitik yang tidak memakai node cluster kamu.</li></ul>`,
`<ol><li><b>Butuh high availability?</b> Tambahkan cluster kedua di zone lain (atau region lain untuk DR) dan pakai app profile multi-cluster routing untuk traffic serving.</li><li><b>Butuh isolasi beban kerja?</b> Buat dua app profile dengan single-cluster routing: serving → cluster A, batch/analitik → cluster B. Batch job tidak bisa lagi memperlambat app. Data Boost juga pilihan untuk read batch.</li><li><b>Beban naik-turun?</b> Aktifkan autoscaling dengan min/max node dan target CPU.</li><li><b>Data terus membesar?</b> Atur aturan GC, misalnya <code>maxage=30d</code> atau <code>maxversions=1</code>.</li><li><b>Perlindungan dari write yang salah?</b> Jadwalkan backup (replication ikut menyalin kesalahan).</li><li>Pantau dengan Cloud Monitoring dan <b>Key Visualizer</b>; jaga CPU di bawah batas yang disarankan.</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Jaringan restoran dengan dua dapur di gedung berbeda, keduanya memasak dari resep yang sama (replication). App profile adalah petugas di pintu: "tamu dine-in ke dapur A, pesanan katering ke dapur B", jadi pesanan katering 300 porsi tidak membuat makan malam meja 4 terlambat. Multi-cluster routing berarti "pergi ke dapur mana saja yang buka". Autoscaling adalah memanggil koki tambahan saat jam makan siang. GC adalah membuang makanan yang sudah lewat tanggal kedaluwarsa.</div>`,
`<p>Sebuah app ojek online menyimpan lokasi driver di Bigtable. Setiap malam job Dataflow membaca seluruh tabel untuk analitik, dan latensi p99 app melonjak dari 6 ms ke 80 ms.</p><ul><li>Tambah cluster kedua (zone lain) → replication.</li><li>App profile <code>serving</code>: single-cluster routing ke cluster A (atau multi-cluster untuk failover).</li><li>App profile <code>batch</code>: single-cluster routing ke cluster B, dipakai job Dataflow. Atau pakai Data Boost.</li><li>GC di family <code>loc</code>: <code>maxage=7d</code>, karena di Bigtable hanya butuh riwayat seminggu.</li><li>Autoscaling min 3, max 12 node untuk jam sibuk.</li></ul><p>Hasilnya: app tetap 6 ms selama job malam berjalan dan tetap hidup saat satu zone mati.</p>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li>Batch memperlambat serving → <mark>cluster terpisah + app profile</mark>, bukan "tambah node di cluster yang sama".</li><li>Replication bukan backup: penghapusan yang salah ikut direplikasi. Pakai backup.</li><li>Transaksi satu baris (read-modify-write, check-and-mutate) butuh single-cluster routing.</li><li>HDD hanya untuk data besar, dingin, dan tidak sensitif latensi; jangan untuk read yang dilihat user.</li><li>Mengharapkan strong consistency antar cluster itu salah; sifatnya eventual.</li><li>Mengganti tipe storage butuh cluster/instance baru dan memindahkan data.</li></ul></div>`,
`<p>Instance Bigtable bisa punya beberapa cluster yang direplikasi secara eventual, memberi high availability sekaligus cara memisahkan beban kerja. App profile mengarahkan traffic: single-cluster untuk memisahkan batch dari serving, multi-cluster untuk failover otomatis. Autoscaling menangani perubahan beban, GC policy membatasi pertumbuhan data, dan backup (bukan replication) melindungi dari write yang salah.</p>`
]);

/* ===== d3-l8 Spanner ===== */
dd("d3-l8",[
`<p>Some apps need two things that usually fight each other: <b>full relational transactions</b> (a payment must debit one account and credit another, exactly once) and <b>huge, global scale</b> (millions of users on several continents, writes everywhere, 99.999% uptime). Cloud SQL gives you transactions but on one primary machine with a size ceiling. Bigtable scales but has no multi-row transactions or SQL joins.</p><p><mark>Spanner gives both: SQL, ACID transactions and strong consistency, scaled horizontally and even globally</mark>.</p>`,
`<ul><li><b>Relational + SQL</b> (GoogleSQL or PostgreSQL dialect), with schemas, secondary indexes and joins.</li><li><b>Horizontal scaling</b>: capacity is bought in <b>nodes or processing units</b> (1 node = 1000 PU). Data is split automatically into <b>splits</b> by primary key range.</li><li><b>External consistency</b>: the strongest form of consistency, made possible by TrueTime (synchronised atomic clocks/GPS).</li><li><b>Regional</b> config (up to 99.99% SLA) or <b>multi-region</b> config (up to 99.999%).</li><li><b>Interleaved tables</b>: store child rows physically next to their parent (e.g. order items inside their order) for fast parent-child reads.</li><li><b>Primary key design</b> matters, like Bigtable: avoid monotonically increasing keys.</li><li><b>Stale reads</b>: read slightly old data (e.g. 15 s) for lower latency.</li><li><b>Change streams</b> for CDC; <b>Data Boost</b> and federated queries from BigQuery for analytics.</li></ul>`,
`<ol><li>Choose regional (one region, HA across zones) or multi-region (survive a region outage, writes accepted globally).</li><li>Design primary keys: use a UUIDv4, a hashed prefix, or bit-reversed sequence, <b>not</b> an auto-increment or timestamp, so writes spread across splits.</li><li>Interleave children under parents when you mostly read them together: <code>CREATE TABLE Items (...) PRIMARY KEY (OrderId, ItemId), INTERLEAVE IN PARENT Orders</code>.</li><li>Add secondary indexes for other lookups.</li><li>Size capacity with processing units; turn on managed autoscaling for variable load.</li><li>Use read-only transactions or stale reads for reporting traffic; push analytics to BigQuery (federated query, Data Boost, or change streams → Dataflow).</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>Imagine one bank ledger that is open in Jakarta, Tokyo and Frankfurt at once, where every clerk sees exactly the same balance at the same moment, and two clerks can never spend the same money twice. Normally that's impossible because the clocks in each city disagree. Spanner solves it with very precise clocks (TrueTime), so it always knows which transaction really happened first.</div>`,
`<p>A fintech wallet operates in Indonesia, Singapore and Australia. Requirements: transfers must be exactly-once with balances always correct, 99.999% availability, users read their balance from the nearest region, expected growth to 50 TB.</p><ul><li>Cloud SQL: single primary, can't take writes in all regions → ✗.</li><li>Bigtable: no multi-row ACID transfers → ✗.</li><li>Firestore: transactions yes, but this is a relational ledger with heavy SQL reporting → weaker fit.</li><li><b>Spanner multi-region</b>: ACID transfers across rows, strong consistency, 99.999% → ✓.</li></ul><p>Keys: <code>AccountId</code> as a UUID; <code>Transactions</code> interleaved in <code>Accounts</code>. Nightly reporting through BigQuery federated queries with Data Boost, so serving isn't affected.</p>`,
`<div class="box trap"><div class="l">Traps</div><ul><li>Keywords "global", "horizontal scale", "strong consistency", "relational", "99.999%" → <mark>Spanner</mark>.</li><li>Spanner for a small regional app is overkill; Cloud SQL is cheaper.</li><li>Auto-increment / timestamp primary keys cause hotspots, same as Bigtable.</li><li>Spanner is not a warehouse; analytics go to BigQuery.</li><li>"Lift-and-shift MySQL with minimal changes" → Cloud SQL, not Spanner.</li><li>Read-heavy and scaling reads only → Cloud SQL read replicas may be enough.</li></ul></div>`,
`<p>Spanner is a relational, SQL database with ACID transactions and strong (external) consistency that scales horizontally, regionally or across continents, with up to 99.999% availability. Design primary keys that spread writes, and interleave child tables for fast parent-child access. Pick it when you need both global scale and transactions; otherwise Cloud SQL is simpler and cheaper.</p>`
],[
`<p>Beberapa app butuh dua hal yang biasanya saling bertentangan: <b>transaksi relasional penuh</b> (pembayaran harus mendebit satu akun dan mengkredit akun lain, tepat sekali) dan <b>skala global yang sangat besar</b> (jutaan user di beberapa benua, write di mana-mana, uptime 99,999%). Cloud SQL memberi transaksi tapi di satu mesin primary dengan batas ukuran. Bigtable bisa scale tapi tidak punya transaksi multi-baris atau SQL join.</p><p><mark>Spanner memberi keduanya: SQL, transaksi ACID, dan strong consistency, yang di-scale secara horizontal bahkan global</mark>.</p>`,
`<ul><li><b>Relasional + SQL</b> (dialek GoogleSQL atau PostgreSQL), dengan schema, secondary index, dan join.</li><li><b>Horizontal scaling</b>: kapasitas dibeli dalam satuan <b>node atau processing unit</b> (1 node = 1000 PU). Data otomatis dipecah menjadi <b>split</b> berdasarkan rentang primary key.</li><li><b>External consistency</b>: bentuk consistency paling kuat, dimungkinkan oleh TrueTime (jam atom/GPS yang tersinkronisasi).</li><li>Konfigurasi <b>regional</b> (SLA sampai 99,99%) atau <b>multi-region</b> (sampai 99,999%).</li><li><b>Interleaved table</b>: menyimpan baris anak secara fisik di sebelah induknya (misalnya item order di dalam order-nya) supaya read induk-anak cepat.</li><li><b>Desain primary key</b> itu penting, sama seperti Bigtable: hindari key yang terus naik.</li><li><b>Stale read</b>: membaca data yang sedikit lama (misal 15 detik) demi latensi lebih rendah.</li><li><b>Change streams</b> untuk CDC; <b>Data Boost</b> dan federated query dari BigQuery untuk analitik.</li></ul>`,
`<ol><li>Pilih regional (satu region, HA lintas zone) atau multi-region (tahan region mati, write diterima secara global).</li><li>Desain primary key: pakai UUIDv4, prefix hash, atau bit-reversed sequence, <b>bukan</b> auto-increment atau timestamp, supaya write tersebar ke banyak split.</li><li>Interleave tabel anak di bawah induknya kalau biasanya dibaca bersama: <code>CREATE TABLE Items (...) PRIMARY KEY (OrderId, ItemId), INTERLEAVE IN PARENT Orders</code>.</li><li>Tambahkan secondary index untuk pencarian lain.</li><li>Atur kapasitas dengan processing unit; aktifkan managed autoscaling untuk beban yang naik-turun.</li><li>Pakai read-only transaction atau stale read untuk traffic laporan; kirim analitik ke BigQuery (federated query, Data Boost, atau change streams → Dataflow).</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Bayangkan satu buku besar bank yang terbuka di Jakarta, Tokyo, dan Frankfurt sekaligus, di mana setiap teller melihat saldo yang persis sama pada saat yang sama, dan dua teller tidak mungkin memakai uang yang sama dua kali. Biasanya itu mustahil karena jam di setiap kota tidak sama persis. Spanner menyelesaikannya dengan jam yang sangat presisi (TrueTime), jadi selalu tahu transaksi mana yang benar-benar terjadi lebih dulu.</div>`,
`<p>Sebuah dompet digital fintech beroperasi di Indonesia, Singapura, dan Australia. Kebutuhan: transfer harus tepat sekali dengan saldo selalu benar, availability 99,999%, user membaca saldo dari region terdekat, perkiraan tumbuh sampai 50 TB.</p><ul><li>Cloud SQL: satu primary, tidak bisa menerima write di semua region → ✗.</li><li>Bigtable: tidak ada transfer ACID multi-baris → ✗.</li><li>Firestore: ada transaksi, tapi ini buku besar relasional dengan laporan SQL berat → kurang cocok.</li><li><b>Spanner multi-region</b>: transfer ACID lintas baris, strong consistency, 99,999% → ✓.</li></ul><p>Key: <code>AccountId</code> berupa UUID; <code>Transactions</code> di-interleave di dalam <code>Accounts</code>. Laporan malam lewat BigQuery federated query dengan Data Boost, jadi serving tidak terganggu.</p>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li>Kata kunci "global", "horizontal scale", "strong consistency", "relasional", "99,999%" → <mark>Spanner</mark>.</li><li>Spanner untuk app regional kecil itu berlebihan; Cloud SQL lebih murah.</li><li>Primary key auto-increment / timestamp menyebabkan hotspot, sama seperti Bigtable.</li><li>Spanner bukan warehouse; analitik tetap ke BigQuery.</li><li>"Lift-and-shift MySQL dengan perubahan minimal" → Cloud SQL, bukan Spanner.</li><li>Kalau hanya berat di read dan butuh scale read → read replica Cloud SQL mungkin sudah cukup.</li></ul></div>`,
`<p>Spanner adalah database relasional SQL dengan transaksi ACID dan strong (external) consistency yang di-scale secara horizontal, regional maupun lintas benua, dengan availability sampai 99,999%. Desain primary key yang menyebarkan write, dan interleave tabel anak untuk akses induk-anak yang cepat. Pilih Spanner kalau butuh skala global sekaligus transaksi; selain itu Cloud SQL lebih sederhana dan murah.</p>`
]);

/* ===== d3-l9 Cloud SQL & AlloyDB ===== */
dd("d3-l9",[
`<p>Most business apps (an HR system, an inventory app, a website backend) just need a normal relational database: MySQL, PostgreSQL or SQL Server. Running it yourself on a VM means patching, backups, failover and disk management, all on you.</p><p>Cloud SQL and AlloyDB are <mark>managed relational databases</mark>: Google handles the boring operations. The exam tests when to pick them, how to make them highly available, how to scale reads, and when PostgreSQL workloads should move up to AlloyDB.</p>`,
`<ul><li><b>Cloud SQL</b>: managed MySQL, PostgreSQL, SQL Server. One <b>primary</b> instance takes writes; scales <b>vertically</b> (bigger machine). Storage up to tens of TB.</li><li><b>High availability (HA)</b>: a standby in another zone of the same region with synchronous replication and automatic failover.</li><li><b>Read replica</b>: an asynchronous copy for read traffic (same or another region). It does <i>not</i> give automatic failover; a <b>cross-region replica</b> can be promoted for DR.</li><li><b>Backups &amp; PITR</b>: automated daily backups plus point-in-time recovery via logs.</li><li><b>AlloyDB for PostgreSQL</b>: PostgreSQL-compatible, much faster for transactions, with a built-in <b>columnar engine</b> that accelerates analytical queries (HTAP), read pool instances, and 99.99% SLA. AlloyDB Omni runs it anywhere.</li><li><b>Database Migration Service (DMS)</b>: migrates MySQL/PostgreSQL/SQL Server (and Oracle → PostgreSQL) with minimal downtime using continuous replication.</li></ul>`,
`<ol><li><b>Is it relational, regional, and fits on one primary?</b> → Cloud SQL. Need global writes or unlimited horizontal scale → Spanner instead.</li><li>Turn on <b>HA</b> for production (zonal failure protection).</li><li>Reads too heavy? Add <b>read replicas</b> and point reporting/reads to them.</li><li>Region-level DR? Add a <b>cross-region read replica</b> and promote it if the region fails.</li><li>Enable automated backups + PITR for "undo a bad DELETE".</li><li>PostgreSQL that needs more throughput or fast analytics on live data → <b>AlloyDB</b>.</li><li>Migrating from on-prem → <b>DMS</b> with continuous replication, then a short cutover.</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>Cloud SQL is renting a fully serviced apartment: same furniture you know (MySQL/Postgres), but cleaning and repairs are done for you. HA is a backup apartment next door with the lights already on: if a pipe bursts you move in seconds. Read replicas are photocopies of your notebook that friends can read so they stop bothering you. AlloyDB is the premium apartment of the same layout, with a faster kitchen and a built-in reading room for analysis.</div>`,
`<p>An e-commerce PostgreSQL database (2 TB) on-prem must move to GCP with under 10 minutes downtime. Afterwards, the finance team's heavy reports slow down checkout.</p><ul><li>Migration: <b>DMS</b> continuous replication to Cloud SQL for PostgreSQL; cutover at night → a few minutes downtime.</li><li>Production: HA enabled; automated backups + PITR.</li><li>Reports: point finance to a <b>read replica</b> → checkout is no longer affected.</li><li>Later, finance wants near-real-time dashboards on live orders with complex aggregations → <b>AlloyDB</b> with its columnar engine, or replicate to BigQuery with Datastream for true warehouse analytics.</li></ul>`,
`<div class="box trap"><div class="l">Traps</div><ul><li><mark>Read replicas ≠ HA</mark>. HA = standby + automatic failover; replicas = read scaling.</li><li>HA standby is in the same region; it doesn't protect from a regional outage.</li><li>"Global consistency / unlimited scale" → Spanner, not Cloud SQL.</li><li>"Minimal downtime migration of MySQL/PostgreSQL" → DMS.</li><li>Cloud SQL for multi-TB analytics → BigQuery instead.</li><li>"PostgreSQL compatible + much faster + analytics on operational data" → AlloyDB.</li></ul></div>`,
`<p>Cloud SQL is managed MySQL, PostgreSQL or SQL Server for regional relational apps that fit on one primary; turn on HA for automatic zonal failover and use read replicas to scale reads or as cross-region DR. AlloyDB is a faster PostgreSQL-compatible option with a columnar engine for analytics on live data. Use Database Migration Service for low-downtime migrations into either.</p>`
],[
`<p>Sebagian besar app bisnis (sistem HR, app inventori, backend website) hanya butuh database relasional biasa: MySQL, PostgreSQL, atau SQL Server. Menjalankannya sendiri di VM berarti patching, backup, failover, dan urusan disk semua jadi tanggunganmu.</p><p>Cloud SQL dan AlloyDB adalah <mark>database relasional terkelola</mark>: Google mengurus operasi yang membosankan. Ujian menguji kapan memilihnya, cara membuatnya high availability, cara scale read, dan kapan workload PostgreSQL sebaiknya naik ke AlloyDB.</p>`,
`<ul><li><b>Cloud SQL</b>: MySQL, PostgreSQL, SQL Server terkelola. Satu instance <b>primary</b> menerima write; scale secara <b>vertikal</b> (mesin lebih besar). Storage sampai puluhan TB.</li><li><b>High availability (HA)</b>: standby di zone lain dalam region yang sama dengan replikasi sinkron dan failover otomatis.</li><li><b>Read replica</b>: salinan asinkron untuk traffic read (region sama atau lain). Ini <i>tidak</i> memberi failover otomatis; <b>cross-region replica</b> bisa di-promote untuk DR.</li><li><b>Backup &amp; PITR</b>: backup harian otomatis plus point-in-time recovery lewat log.</li><li><b>AlloyDB for PostgreSQL</b>: kompatibel PostgreSQL, jauh lebih cepat untuk transaksi, dengan <b>columnar engine</b> bawaan yang mempercepat query analitik (HTAP), instance read pool, dan SLA 99,99%. AlloyDB Omni bisa dijalankan di mana saja.</li><li><b>Database Migration Service (DMS)</b>: memigrasi MySQL/PostgreSQL/SQL Server (dan Oracle → PostgreSQL) dengan downtime minimal memakai replikasi berkelanjutan.</li></ul>`,
`<ol><li><b>Relasional, regional, dan muat di satu primary?</b> → Cloud SQL. Butuh write global atau scale horizontal tanpa batas → Spanner.</li><li>Aktifkan <b>HA</b> untuk produksi (perlindungan dari kegagalan zone).</li><li>Read terlalu berat? Tambahkan <b>read replica</b> dan arahkan laporan/read ke sana.</li><li>DR tingkat region? Tambahkan <b>cross-region read replica</b> dan promote kalau region-nya gagal.</li><li>Aktifkan backup otomatis + PITR untuk "membatalkan DELETE yang salah".</li><li>PostgreSQL yang butuh throughput lebih tinggi atau analitik cepat di data live → <b>AlloyDB</b>.</li><li>Migrasi dari on-prem → <b>DMS</b> dengan replikasi berkelanjutan, lalu cutover singkat.</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Cloud SQL itu seperti menyewa apartemen dengan layanan lengkap: perabotnya sama seperti yang kamu kenal (MySQL/Postgres), tapi bersih-bersih dan perbaikan diurus orang lain. HA adalah apartemen cadangan di sebelah yang lampunya sudah menyala: kalau pipa bocor, kamu pindah dalam hitungan detik. Read replica adalah fotokopi buku catatanmu yang bisa dibaca teman supaya mereka berhenti mengganggumu. AlloyDB adalah apartemen premium dengan tata letak yang sama, dapurnya lebih cepat, plus ruang baca untuk analisis.</div>`,
`<p>Database PostgreSQL e-commerce (2 TB) on-prem harus pindah ke GCP dengan downtime di bawah 10 menit. Setelahnya, laporan berat tim finance memperlambat checkout.</p><ul><li>Migrasi: <b>DMS</b> dengan replikasi berkelanjutan ke Cloud SQL for PostgreSQL; cutover malam hari → downtime beberapa menit.</li><li>Produksi: HA aktif; backup otomatis + PITR.</li><li>Laporan: arahkan finance ke <b>read replica</b> → checkout tidak terganggu lagi.</li><li>Kemudian finance ingin dashboard hampir real-time di order live dengan agregasi kompleks → <b>AlloyDB</b> dengan columnar engine-nya, atau replikasi ke BigQuery dengan Datastream untuk analitik warehouse yang sesungguhnya.</li></ul>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li><mark>Read replica ≠ HA</mark>. HA = standby + failover otomatis; replica = scale read.</li><li>Standby HA ada di region yang sama; tidak melindungi dari region yang mati.</li><li>"Konsistensi global / scale tanpa batas" → Spanner, bukan Cloud SQL.</li><li>"Migrasi MySQL/PostgreSQL dengan downtime minimal" → DMS.</li><li>Cloud SQL untuk analitik multi-TB → pakai BigQuery.</li><li>"Kompatibel PostgreSQL + jauh lebih cepat + analitik di data operasional" → AlloyDB.</li></ul></div>`,
`<p>Cloud SQL adalah MySQL, PostgreSQL, atau SQL Server terkelola untuk app relasional regional yang muat di satu primary; aktifkan HA untuk failover zone otomatis dan pakai read replica untuk scale read atau sebagai DR lintas region. AlloyDB adalah pilihan kompatibel PostgreSQL yang lebih cepat dengan columnar engine untuk analitik di data live. Pakai Database Migration Service untuk migrasi dengan downtime rendah ke keduanya.</p>`
]);
