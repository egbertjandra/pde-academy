{id:"d2-l1",title:"The pipeline map & picking an engine",mins:4,
 opener:{q:"A company runs 300 existing Spark jobs on-prem and wants to move them to Google Cloud quickly with minimal code changes. Which service?",
  opts:["Dataflow","Dataproc","Cloud Data Fusion","BigQuery scheduled queries"],ans:1,
  why:"\"Existing Spark/Hadoop + minimal changes\" is Dataproc's signature: managed Spark and Hadoop. Dataflow would mean rewriting the jobs in Apache Beam."},
 cards:[
  {h:"The canonical pipelines",b:`<p><b>Streaming:</b> <mark>Pub/Sub → Dataflow → BigQuery</mark> (analytics) and/or Bigtable (low-latency serving).</p><p><b>Batch:</b> GCS → Dataflow / Dataproc → BigQuery. Or simply <mark>GCS → BigQuery load job → SQL (ELT)</mark>, often the simplest correct answer.</p><div class="box pic"><div class="l">Picture it</div>Sources are farms, Pub/Sub is the truck depot, Dataflow is the factory, BigQuery is the warehouse, and Looker is the shop window.</div>`},
  {h:"Which engine?",b:`<table><tr><th>Scenario says…</th><th>Pick</th></tr><tr><td>Existing Spark/Hadoop, minimal changes</td><td><mark>Dataproc</mark></td></tr><tr><td>New batch + streaming, serverless, autoscaling</td><td><mark>Dataflow</mark></td></tr><tr><td>Data already in BigQuery, SQL transforms</td><td>BigQuery SQL / Dataform</td></tr><tr><td>No-code, visual, many connectors</td><td><mark>Data Fusion</mark></td></tr><tr><td>Analysts clean messy files visually</td><td>Dataprep</td></tr><tr><td>React to one event with small logic</td><td>Cloud Run functions</td></tr><tr><td>Spark without managing clusters</td><td>Serverless for Apache Spark</td></tr></table>`}
 ],
 keys:["Lift & shift Spark/Hadoop → Dataproc; new serverless pipelines → Dataflow","Data already in BigQuery → ELT with SQL/Dataform","No-code → Data Fusion"]},

{id:"d2-l2",title:"Pub/Sub fundamentals",mins:5,
 opener:{q:"Two teams each need every message from the same Pub/Sub topic: the fraud team and the analytics team. What should you set up?",
  opts:["One subscription shared by both teams' consumers","One subscription per team","Two topics with the publisher writing to both","A push subscription with two endpoints"],ans:1,
  why:"Each subscription gets its own copy of every message. Consumers sharing one subscription split the messages between them (load balancing), so each team would only see part of the stream."},
 cards:[
  {h:"The post office",b:`<div class="box pic"><div class="l">Picture it</div>Publishers drop letters into a <b>topic</b>. Every <b>subscription</b> is a separate delivery route with its <b>own copy</b> of every letter. The subscriber must sign for (<b>ack</b>) each letter before the <b>ack deadline</b>, or it gets delivered again.</div><ul><li>Global, serverless, autoscaling. No brokers or partitions to manage.</li><li><mark>Two apps that both need all messages → two subscriptions.</mark> Workers sharing load → one subscription.</li></ul>`},
  {h:"Delivery rules",b:`<ul><li><mark>At-least-once</mark> by default, so <b>duplicates can happen</b>. <b>Exactly-once delivery</b> can be enabled on pull subscriptions (regional).</li><li><mark>Order isn't guaranteed</mark> unless you use <b>ordering keys</b> (per key, e.g. per customer).</li><li><b>Pull</b>: subscriber asks for messages. High throughput, and Dataflow uses this. <b>Push</b>: Pub/Sub POSTs to an HTTPS endpoint (Cloud Run, webhooks).</li><li>Unacked messages are retained 7 days by default. Topics can also retain messages (up to 31 days).</li></ul>`},
  {h:"Why you get duplicates",b:`<div class="box trap"><div class="l">Trap</div><mark>Lots of duplicates = the subscriber isn't acking before the deadline</mark> (slow processing). Fix: ack faster / extend the ack deadline, and make processing idempotent (dedupe on a unique ID). "Add more subscriptions" makes it worse.</div>`}
 ],
 keys:["Topic → many subscriptions; each subscription gets every message","At-least-once by default; ordering keys for per-key order","Duplicates usually mean slow acks"]},

{id:"d2-l3",title:"Pub/Sub in production",mins:4,
 opener:{q:"You're about to deploy a new version of a Pub/Sub subscriber that might have a bug. If it does, you want to reprocess every message it handled. What should you do before deploying?",
  opts:["Increase the ack deadline","Create a snapshot of the subscription, and seek back to it if needed","Create a second topic","Enable message ordering"],ans:1,
  why:"A snapshot records the subscription's acknowledgment state. Seeking to it makes Pub/Sub redeliver everything acked since then. You can also seek to a timestamp if acked messages are retained."},
 cards:[
  {h:"Replay & failure handling",b:`<ul><li><mark>Seek</mark> a subscription to a <b>snapshot</b> or a <b>timestamp</b> to reprocess messages (e.g. after a bad deploy).</li><li><mark>Dead-letter topic</mark>: after N failed delivery attempts the message is moved aside, so one poison message doesn't block everything.</li><li><b>Schemas</b> (Avro/Protobuf) on a topic reject malformed messages at publish time.</li></ul>`},
  {h:"No-code sinks",b:`<ul><li><mark>BigQuery subscription</mark>: writes messages straight into a table, with no Dataflow.</li><li><b>Cloud Storage subscription</b>: writes batches of messages to files.</li><li>Use them when there's <b>no transformation</b>. Need windows, joins or enrichment? → Dataflow.</li></ul>`},
  {h:"Watching the backlog",b:`<ul><li><code>num_undelivered_messages</code> and <mark>oldest_unacked_message_age</mark> rising means consumers can't keep up.</li><li>Fix the consumer: more workers (Dataflow max workers), faster processing, correct acking.</li><li>Pub/Sub Lite has been shut down. If old questions mention it, think Pub/Sub or Managed Kafka.</li></ul><div class="box brain"><div class="l">Kafka on GCP</div>Existing Kafka apps, minimal changes → <b>Managed Service for Apache Kafka</b>. Open to change, least ops → <b>Pub/Sub</b>.</div>`}
 ],
 keys:["Replay → seek to snapshot/timestamp","Poison messages → dead-letter topic","No transform needed → BigQuery subscription"]},

{id:"d2-l4",title:"Apache Beam building blocks",mins:5,
 opener:{q:"Each streaming transaction must be enriched with the customer's tier from a 5 MB reference table that changes daily. What's the idiomatic Beam approach?",
  opts:["Call Cloud SQL for every element","Load the table as a side input","CoGroupByKey the stream with the table","Write the stream to BigQuery and join later"],ans:1,
  why:"A side input broadcasts a small dataset to every worker, which is perfect for a small lookup table. Per-element database calls are slow and fragile."},
 cards:[
  {h:"The vocabulary",b:`<table><tr><th>Term</th><th>Meaning</th></tr><tr><td>Pipeline</td><td>Read → transform → write</td></tr><tr><td>PCollection</td><td>Distributed dataset. Bounded = batch, unbounded = stream</td></tr><tr><td>ParDo / DoFn</td><td>Per-element map / filter / flatMap</td></tr><tr><td>GroupByKey</td><td>Group values by key</td></tr><tr><td><mark>Combine</mark></td><td>Efficient aggregation (sum, count, mean) with partial pre-aggregation</td></tr><tr><td><mark>CoGroupByKey</mark></td><td>Join two PCollections by key</td></tr><tr><td>Flatten / Partition</td><td>Merge / split PCollections</td></tr></table>`},
  {h:"Patterns the exam loves",b:`<ul><li><mark>Side input</mark>: small lookup data available to every worker (rates, tiers, config).</li><li><mark>Multiple (tagged) outputs</mark>: valid rows → BigQuery, invalid → a <b>dead-letter</b> table/GCS. Bad records shouldn't fail the whole job.</li><li><b>Combine instead of GroupByKey + manual sum</b>: less shuffle, faster.</li><li>Runners: DataflowRunner (cloud), <b>DirectRunner</b> (local testing). Beam also runs on Flink and Spark (portability).</li></ul>`}
 ],
 keys:["Small lookup → side input; join two streams → CoGroupByKey","Bad records → tagged dead-letter output","Aggregations → Combine"]},

{id:"d2-l5",title:"Event time, watermarks & windows",mins:6,
 opener:{q:"A mobile game sends events that can be delayed by hours when phones are offline. You need accurate hourly totals based on when events actually happened. What should you window on?",
  opts:["Processing time (arrival time)","Event time from a timestamp inside each event","Pub/Sub publish time","The Dataflow job start time"],ans:1,
  why:"Event time is when the thing happened. Windowing on processing time would put a delayed 09:55 event into the 13:00 hour. Assign timestamps from the payload and window on event time."},
 cards:[
  {h:"Two clocks",b:`<div class="box pic"><div class="l">Picture it</div>You take photos in Bali on Monday, but upload them from Jakarta on Friday. <b>Event time</b> = Monday (when it happened). <b>Processing time</b> = Friday (when the server saw it). <mark>Correct analytics group by event time.</mark></div><p>The <mark>watermark</mark> is Dataflow's running estimate of "I've probably seen all events up to time T". When the watermark passes the end of a window, the window can produce its result.</p>`},
  {h:"Four window types",b:`<table><tr><th>Window</th><th>Shape</th><th>Phrase</th></tr><tr><td><mark>Fixed</mark> (tumbling)</td><td>Equal, non-overlapping</td><td>"every 5 minutes"</td></tr><tr><td><mark>Sliding</mark> (hopping)</td><td>Overlapping: size + period</td><td>"last hour, updated every 5 min", moving average</td></tr><tr><td><mark>Session</mark></td><td>Per key, closes after an inactivity <b>gap</b></td><td>"user sessions", "until idle 30 min"</td></tr><tr><td>Global</td><td>One window forever (default)</td><td>Needs triggers on streams</td></tr></table><p>Open the <b>Window Playground</b> tool to see each type group the same events.</p>`}
 ],
 keys:["Window on event time, not arrival time","Watermark = estimate of completeness","Fixed = every N · sliding = last N every M · session = until idle"]},

{id:"d2-l6",title:"Triggers, lateness & accumulation",mins:5,
 opener:{q:"Late events (up to 30 minutes late) are silently missing from your Dataflow window results. Event-time windows are configured correctly. What's the most likely cause?",
  opts:["Pub/Sub is dropping messages","Allowed lateness is 0 (the default), so late data is discarded","The pipeline uses fixed windows","Autoscaling is disabled"],ans:1,
  why:"By default allowed lateness is zero: data arriving after the watermark has passed the window's end is dropped. Set allowed lateness to cover how late data can arrive."},
 cards:[
  {h:"When results come out",b:`<ul><li><b>Trigger</b> = <i>when</i> a window emits. Default: once when the <mark>watermark passes the window end</mark> (then again for late data, if allowed).</li><li><b>Event-time</b> (<code>AfterWatermark</code>) · <b>processing-time</b> (<code>AfterProcessingTime</code>, e.g. "early results every minute") · <b>data-driven</b> (<code>AfterCount</code>) · <b>composite</b>.</li></ul>`},
  {h:"Late data",b:`<ul><li><mark>Allowed lateness</mark>: how long after the watermark you still accept data into a window. Default is 0, so late data is dropped.</li><li><mark>Accumulating</mark>: each firing emits the full updated result. <b>Discarding</b>: each firing emits only the new part.</li></ul><div class="box brain"><div class="l">Exam brain</div>"Dashboards need fast early estimates, then corrected totals when late data arrives" → <b>early processing-time trigger + watermark trigger + allowed lateness, accumulating mode</b>.</div>`}
 ],
 keys:["Late data dropped → set allowed lateness","Early results → processing-time trigger","Corrected totals → accumulating mode"]},

{id:"d2-l7",title:"Dataflow in production",mins:6,
 opener:{q:"You need to stop a streaming Dataflow job to deploy an incompatible change, without losing any data that's already been read. What do you do?",
  opts:["Cancel the job","Drain the job, then start the new one","Update the job with --update","Delete the Pub/Sub subscription"],ans:1,
  why:"Drain stops reading new data but finishes processing everything in flight, so nothing is lost. Cancel stops immediately and drops in-flight data. --update only works for compatible changes."},
 cards:[
  {h:"Deploying & stopping",b:`<table><tr><th>Action</th><th>Effect</th></tr><tr><td><mark>Update</mark> (<code>--update</code>, same job name)</td><td>Replace code in place, <b>keeps state</b>. Only for compatible changes (rename transforms with a transform mapping).</td></tr><tr><td><mark>Drain</mark></td><td>Stop reading, <b>finish in-flight data</b>, no loss</td></tr><tr><td><mark>Cancel</mark></td><td>Stop now, <b>in-flight data lost</b></td></tr><tr><td>Snapshot</td><td>Save streaming state to restart or roll back</td></tr></table>`},
  {h:"Scaling & cost",b:`<ul><li><b>Autoscaling</b> with a <b>max workers</b> cap. <b>Streaming Engine</b> moves state off workers. <b>Dataflow Shuffle</b> for batch.</li><li><mark>FlexRS</mark>: cheaper batch for jobs that can wait (delayed start, preemptible capacity).</li><li><mark>Flex Templates</mark>: package a pipeline so others can launch it with parameters, no code needed. Google-provided templates exist (Pub/Sub → BigQuery…).</li><li>Exactly-once processing inside the pipeline. Use the <b>BigQuery Storage Write API</b> sink for exactly-once writes.</li></ul>`},
  {h:"Troubleshooting",b:`<ul><li><mark>System lag / data freshness rising</mark> = falling behind. Check max workers, hot keys and slow external calls.</li><li><mark>Hot key</mark> (one key with most data) → <code>Combine.perKey().withHotKeyFanout()</code>.</li><li>Per-element API calls are slow → batch them (<code>GroupIntoBatches</code>), or cache / use a side input.</li><li>Workers out of memory → bigger machine type, fix hot keys, smaller side inputs.</li><li><b>Security</b>: a dedicated worker service account (<code>roles/dataflow.worker</code>), <mark>private IPs (<code>--no_use_public_ips</code>) + Private Google Access</mark>, CMEK if required.</li></ul>`}
 ],
 keys:["Compatible change → update · incompatible → drain + new job · cancel loses data","Non-developers launch pipelines → Flex Templates","Lag → max workers, hot keys, external calls"]},

{id:"d2-l8",title:"Dataproc done right",mins:5,
 opener:{q:"Your Dataproc cluster runs nightly Spark jobs for 2 hours but stays up 24/7, and costs are high. What's the Google-recommended pattern?",
  opts:["Keep the cluster but use smaller machines","Use ephemeral job-scoped clusters with data in Cloud Storage","Move the data to HDFS on persistent disks","Switch all workers to Spot VMs, including primaries"],ans:1,
  why:"Create a cluster per job, run it, delete it. That only works when data lives in GCS, not on the cluster's HDFS. Spot VMs for primary workers risks losing HDFS and the job itself."},
 cards:[
  {h:"Rent a car per trip",b:`<div class="box pic"><div class="l">Picture it</div>Old Hadoop is buying a car and maintaining it forever. Dataproc lets you <b>rent a car per trip</b>, and your luggage stays at home in <b>Cloud Storage</b> instead of in the car's boot (HDFS).</div><ul><li>Clusters start in about 90 s. Billed <b>per second</b> (1-min minimum).</li><li><mark>Use GCS, not HDFS</mark> (<code>gs://</code>): storage separate from compute.</li><li><mark>Ephemeral clusters</mark> + <b>workflow templates</b> (create → run → delete) + <b>scheduled deletion</b> (idle timeout).</li></ul>`},
  {h:"Cost & customization",b:`<ul><li><mark>Secondary workers as Spot/preemptible VMs</mark> (compute only). Keep primary workers standard.</li><li><b>Autoscaling policies</b> for variable load.</li><li><mark>Initialization actions</mark>: install packages on every node at creation. <b>Cluster properties</b> set config files.</li><li><b>Dataproc Metastore</b>: shared Hive metastore across ephemeral clusters.</li><li><b>Component Gateway</b>: secure UI access (YARN, Spark, Jupyter).</li><li><b>High-availability mode</b>: 3 master nodes.</li><li><mark>Serverless for Apache Spark</mark>: run Spark batches with no cluster.</li></ul>`}
 ],
 keys:["Ephemeral clusters + GCS + Spot secondary workers","Install libraries → initialization actions","No cluster at all → Serverless for Apache Spark"]},

{id:"d2-l9",title:"Data Fusion, Dataprep, Dataform, Datastream",mins:4,
 opener:{q:"You need near-real-time replication of changes from an on-prem MySQL database into BigQuery for analytics, with minimal custom code. Which service?",
  opts:["Database Migration Service","Datastream","Storage Transfer Service","A nightly mysqldump to GCS"],ans:1,
  why:"Datastream is serverless change data capture (CDC) straight into BigQuery. DMS migrates databases to Cloud SQL/AlloyDB. STS copies files. Nightly dumps aren't near real time."},
 cards:[
  {h:"Tool picker",b:`<table><tr><th>Tool</th><th>Pick when</th></tr><tr><td><mark>Cloud Data Fusion</mark></td><td>Visual no-code ETL, 150+ connectors, hybrid sources. Runs on Dataproc.</td></tr><tr><td>Dataprep</td><td>Analysts visually explore and clean files</td></tr><tr><td><mark>Dataform</mark></td><td>SQL ELT in BigQuery with dependencies, <b>assertions</b> (tests), git</td></tr><tr><td><mark>Datastream</mark></td><td>CDC from MySQL/Postgres/Oracle/SQL Server → BigQuery/GCS</td></tr><tr><td>BigQuery continuous queries</td><td>SQL over streaming data, out to Pub/Sub/Bigtable</td></tr><tr><td>Managed Kafka</td><td>Existing Kafka apps, minimal change</td></tr></table>`},
  {h:"Simple beats clever",b:`<div class="box brain"><div class="l">Exam brain</div>"Daily CSV lands in GCS, load it into BigQuery" → a plain <b>load job</b> (or BigQuery Data Transfer Service from GCS), not a Dataflow pipeline. Pick Dataflow only when you need real transformation, streaming or complex logic.</div>`}
 ],
 keys:["CDC to BigQuery → Datastream","No-code ETL → Data Fusion; SQL ELT with tests → Dataform","Simple file load → BigQuery load job"]},

{id:"d2-l10",title:"Orchestration & CI/CD",mins:5,
 opener:{q:"Every night you must run a Dataproc job, then load the results into BigQuery, then run quality checks, with retries and an email on failure. What should orchestrate this?",
  opts:["Cloud Scheduler","Cloud Composer","A cron job on a VM","Pub/Sub"],ans:1,
  why:"Multi-step dependencies across services with retries, alerting and backfills are what Composer (managed Airflow) is for. Scheduler only fires one thing on a schedule."},
 cards:[
  {h:"Three orchestrators",b:`<table><tr><th>Tool</th><th>Best for</th></tr><tr><td><mark>Cloud Composer</mark></td><td>Managed Airflow: complex DAGs, dependencies, retries, backfills, SLAs, sensors. DAGs live in the environment's GCS <code>dags/</code> folder.</td></tr><tr><td><mark>Workflows</mark></td><td>Serverless, cheap chains of API/service calls in YAML</td></tr><tr><td>Cloud Scheduler</td><td>Cron: trigger one thing on a schedule</td></tr><tr><td>Eventarc</td><td>Event-driven (GCS object finalized → Cloud Run / Workflows)</td></tr></table>`},
  {h:"Event-driven & CI/CD",b:`<ul><li>"Start processing as soon as a file lands" → <b>Eventarc / Cloud Run function</b> launching a Dataflow template, or a Composer GCS sensor.</li><li><b>CI/CD</b>: git → <b>Cloud Build</b> (tests) → images in <b>Artifact Registry</b> → deploy Flex Templates / sync DAGs / Dataform releases → separate <b>dev/test/prod projects</b>. Infra as code with Terraform.</li></ul><div class="box brain"><div class="l">Exam brain</div>Composer = complex DAG · Workflows = light API chain · Scheduler = cron · scheduled query = one SQL statement.</div>`}
 ],
 keys:["Multi-step pipelines with retries → Composer","Light serverless API chains → Workflows","File-arrival trigger → Eventarc / Cloud Run function"]}
];

/* Window Playground tool */
PDE.tools.windows = {title:"Window Playground",sub:"See fixed, sliding and session windows group the same events",
 intro:"Twelve clickstream events from two users (A and B) on a 60-minute event-time axis. Pick a window type and an allowed lateness. Events that arrive after the watermark has passed their window are late; past the allowed lateness they're dropped."};
})();

(function(){
const Q = (id,topic,q,opts,ans,tip,mock)=>({id,d:"d2",topic,q,opts:opts.map(([t,w])=>({t,w})),ans:Array.isArray(ans)?ans:[ans],tip,mock:!!mock});
PDE.questions.push(
Q("d2q01","Choosing an engine","A startup is building a new pipeline that must process both a nightly batch of files and a live event stream with the same business logic. The team is small and doesn't want to manage clusters. Which service?",[
 ["Dataproc with Spark Streaming","Works, but you manage clusters, which the team wants to avoid."],
 ["Dataflow (Apache Beam)","Correct. One Beam codebase runs in batch and streaming, and Dataflow is serverless with autoscaling."],
 ["Cloud Data Fusion","Fine for visual ETL, but complex shared streaming logic is a better fit for Beam code."],
 ["Compute Engine VMs running custom code","Maximum operational overhead."]],1,
 "Same logic for batch + streaming, serverless → Dataflow."),
Q("d2q02","Choosing an engine","An ETL team with no programming experience needs to build pipelines pulling from Salesforce, on-prem Oracle and SFTP into BigQuery, using a visual interface. Which service fits best?",[
 ["Dataflow with Java SDK","Needs coding skills."],
 ["Cloud Data Fusion","Correct. Visual, no-code pipelines with a large connector library, including hybrid and on-prem sources."],
 ["Dataproc","Needs Spark/Hadoop coding and cluster knowledge."],
 ["BigQuery scheduled queries","Can't pull from Salesforce, Oracle or SFTP by itself."]],1,
 "No-code + many connectors → Data Fusion."),
Q("d2q03","Choosing an engine","A partner drops one CSV file per day into a Cloud Storage bucket. You need it in a BigQuery table each morning with no transformation. What's the simplest solution?",[
 ["A streaming Dataflow pipeline reading from GCS","Overkill for a daily file with no transformation."],
 ["A Dataproc Spark job triggered by Cloud Scheduler","Cluster management for a simple load."],
 ["A scheduled BigQuery load job (e.g. via BigQuery Data Transfer Service for Cloud Storage)","Correct. Native batch loads are free and need no pipeline code."],
 ["Pub/Sub notifications to a BigQuery subscription","GCS notifications contain object metadata, not the file contents."]],2,
 "Simple file → BigQuery, no transform → load job / DTS."),
Q("d2q04","Pub/Sub","Your subscriber takes about 90 seconds to process each Pub/Sub message, and you see many duplicate messages. The ack deadline is the default. What's the most likely cause and fix?",[
 ["Pub/Sub is broken; open a support case","Duplicates are expected behaviour when acks are late."],
 ["Messages aren't acked before the deadline. Extend the ack deadline (or modify it during processing) and make processing idempotent.","Correct. With the default 10-second deadline, a 90-second job causes redelivery. Extend the deadline and dedupe on a unique ID."],
 ["Add a second subscription","A second subscription gets its own full copy, which means more processing, not fewer duplicates."],
 ["Enable message ordering","Ordering doesn't prevent redelivery."]],1,
 "Duplicates = late acks. Extend the deadline, dedupe on an ID."),
Q("d2q05","Pub/Sub","Orders for the same customer must be processed in the order they were published, but there are millions of customers and throughput must stay high. What should you do?",[
 ["Use a single subscriber with one thread","Destroys throughput."],
 ["Publish with an ordering key = customer_id and enable message ordering on the subscription","Correct. Ordering keys guarantee per-key order while different keys are still processed in parallel."],
 ["Sort messages by publish time in BigQuery later","Doesn't help real-time processing order."],
 ["Use one topic per customer","Millions of topics is an anti-pattern."]],1,
 "Per-entity order → ordering keys."),
Q("d2q06","Pub/Sub","A small number of malformed messages cause your subscriber to crash and retry endlessly, blocking other messages. What should you configure?",[
 ["A dead-letter topic with a maximum number of delivery attempts","Correct. After N failed attempts the message is forwarded to the dead-letter topic for later inspection."],
 ["A longer message retention duration","Keeps the poison messages around longer."],
 ["Exactly-once delivery","Doesn't help with messages that always fail."],
 ["A push subscription","The delivery method doesn't solve poison messages."]],0,
 "Poison messages → dead-letter topic."),
Q("d2q07","Pub/Sub","You want events from a Pub/Sub topic written directly into a BigQuery table as they arrive. No transformations are needed, and you want the least operational overhead. What should you use?",[
 ["A Dataflow Pub/Sub-to-BigQuery template","Works, but it runs a pipeline you don't need."],
 ["A BigQuery subscription on the topic","Correct. Pub/Sub writes straight to BigQuery, with no pipeline to manage."],
 ["A Cloud Run service that pulls and inserts rows","Custom code to maintain."],
 ["A Cloud Storage subscription, then load jobs","Two steps and added latency."]],1,
 "No transform → BigQuery subscription."),
Q("d2q08","Pub/Sub","A Cloud Run service should receive each Pub/Sub message as an HTTPS request, with no polling code. Which subscription type should you use?",[
 ["Pull","The subscriber would have to poll."],
 ["Push","Correct. Pub/Sub POSTs each message to the HTTPS endpoint."],
 ["BigQuery subscription","Writes to a table, not to your service."],
 ["Cloud Storage subscription","Writes files, not HTTP requests."]],1,
 "HTTPS endpoint, no polling → push. High-throughput workers / Dataflow → pull."),
Q("d2q09","Pub/Sub","The oldest unacked message age on a subscription keeps rising during peak hours. The Dataflow job reading it is pinned at its maximum worker count. What should you do first?",[
 ["Increase the topic's retention","Hides the symptom, but the backlog still grows."],
 ["Raise the Dataflow max workers (and check for slow steps or hot keys)","Correct. The consumer can't keep up. Give it capacity and look for bottlenecks."],
 ["Create another topic","Doesn't speed up consumption."],
 ["Switch to a push subscription","Doesn't add processing capacity."]],1,
 "Growing backlog → consumer too slow: scale it or fix bottlenecks."),
Q("d2q10","Beam","In a Dataflow pipeline you must join a stream of orders with a stream of payments on order_id within the same window. Which transform should you use?",[
 ["Flatten","Merges PCollections of the same type. It isn't a join."],
 ["CoGroupByKey","Correct. Groups values from multiple keyed PCollections by key, which is Beam's join."],
 ["Side input","For a small, mostly static dataset, not for joining two large streams."],
 ["Partition","Splits one PCollection into several."]],1,
 "Join two keyed PCollections → CoGroupByKey."),
Q("d2q11","Beam","About 0.1% of incoming records fail parsing, and today the whole Dataflow job fails when that happens. You need valid data to keep flowing, with bad records kept for later analysis. What should you do?",[
 ["Wrap parsing in try/catch and silently drop failures","Loses the bad records you need to investigate."],
 ["Send failed records to a tagged side output written to a dead-letter table or bucket","Correct. The dead-letter pattern keeps the main pipeline healthy and preserves failures."],
 ["Set max_bad_records in BigQuery","Only applies to load jobs, and it silently drops rows."],
 ["Increase worker memory","Parsing errors aren't a memory problem."]],1,
 "Bad records → dead-letter output, not job failure."),
Q("d2q12","Beam","A pipeline computes total sales per store using GroupByKey followed by a ParDo that sums the values. It's slow and shuffles a lot of data. What change helps most?",[
 ["Use Combine.perKey (Sum) instead","Correct. Combine pre-aggregates on each worker before the shuffle, which cuts data movement."],
 ["Use a side input of all sales","Side inputs are for small lookups."],
 ["Switch to a global window","Doesn't reduce shuffle volume."],
 ["Add more GroupByKey steps","More shuffles."]],0,
 "Aggregations → Combine (partial aggregation), not GroupByKey + manual sum."),
Q("d2q13","Windowing","Operations wants the number of failed logins counted in separate, non-overlapping 5-minute buckets. Which window?",[
 ["Fixed windows of 5 minutes","Correct. Tumbling, non-overlapping, equal-size windows."],
 ["Sliding windows of 5 minutes every 1 minute","These overlap, so each event is counted in several windows."],
 ["Session windows with a 5-minute gap","Closes on inactivity per key, not fixed buckets."],
 ["Global window","Never closes without a trigger."]],0,
 "\"Every N minutes\" → fixed."),
Q("d2q14","Windowing","A trading dashboard shows the average price over the last 30 minutes, updated every minute. Which window?",[
 ["Fixed 30-minute windows","Only updates every 30 minutes."],
 ["Sliding windows: 30-minute size, 1-minute period","Correct. Overlapping windows give a moving average."],
 ["Session windows","Activity-based, not a rolling time range."],
 ["Global window with a count trigger","No rolling time boundary."]],1,
 "\"Last N, updated every M\" → sliding."),
Q("d2q15","Windowing","A streaming app needs to group each user's clicks into visits, where a visit ends after 20 minutes without activity. Which window?",[
 ["Fixed 20-minute windows","Cuts visits at arbitrary boundaries."],
 ["Sliding windows of 20 minutes","Overlapping fixed ranges, not activity-based."],
 ["Session windows with a 20-minute gap duration, keyed by user","Correct. Session windows close after an inactivity gap, per key."],
 ["Global window","No visit boundaries."]],2,
 "\"Until inactive for X\" → session windows."),
Q("d2q16","Event time","Sensor readings are buffered on devices and can reach Pub/Sub up to 2 hours late. Your hourly averages must reflect when readings were taken. Which TWO settings are needed?",[
 ["Use the reading's own timestamp as the element's event time","Correct. Window on when the reading happened, not when it arrived."],
 ["Window on processing time","Late readings would land in the wrong hour."],
 ["Set allowed lateness to at least 2 hours","Correct. Otherwise readings that arrive after the watermark are dropped."],
 ["Use a global window","No hourly grouping."]],[0,2],
 "Delayed data → event-time timestamps + allowed lateness."),
Q("d2q17","Triggers","A dashboard needs a rough count for each 1-hour window every minute while the hour is in progress, then the final accurate count, updated again if late data arrives. Which configuration?",[
 ["Default trigger, discarding mode","Emits only when the watermark passes, with no early results."],
 ["Early processing-time trigger every minute + watermark trigger + late firings, accumulating mode","Correct. Early speculative results, an on-time result, late corrections, and each firing shows the full updated count."],
 ["AfterCount(1) trigger, discarding","Fires per element with partial deltas only, which is noisy and incomplete."],
 ["Global window with no trigger","Never emits on an unbounded stream."]],1,
 "Early + on-time + late results with full totals → processing-time early trigger, watermark trigger, accumulating."),
Q("d2q18","Dataflow ops","You fixed a bug in a streaming Dataflow pipeline. The change is compatible (same transforms, new logic inside a DoFn). You must keep the pipeline's state and not lose data. What do you do?",[
 ["Cancel the job and start a new one","Cancel loses in-flight data and state."],
 ["Launch the new code with --update using the same job name","Correct. In-place update keeps state and preserves exactly-once processing."],
 ["Drain and start a new job","Safe, but it discards accumulated window state, and update is the better fit for compatible changes."],
 ["Create a new subscription for the new job","Loses unacknowledged history and duplicates processing."]],1,
 "Compatible change → update. Incompatible → drain + new job."),
Q("d2q19","Dataflow ops","You must replace a streaming pipeline with a version that changes the windowing strategy in an incompatible way. No data that's already been read may be lost. What should you do?",[
 ["Cancel the old job, start the new one","In-flight data is lost."],
 ["Drain the old job, then start the new job on the same subscription","Correct. Drain finishes buffered data, and the new job continues from unacked messages."],
 ["Use --update","Incompatible changes fail the compatibility check."],
 ["Delete and recreate the subscription","Unacked messages are lost."]],1,
 "Incompatible change, no loss → drain."),
Q("d2q20","Dataflow ops","Business analysts need to launch an existing Dataflow pipeline themselves, choosing input bucket and date parameters, without touching code or build tools. What should you provide?",[
 ["Grant them Dataflow Admin and share the Java source","They still need build tools and coding skills."],
 ["A Dataflow Flex Template with runtime parameters","Correct. They launch it from the console, gcloud or the API with parameters, and no code."],
 ["A Dataproc workflow template","Wrong service for a Beam pipeline."],
 ["A Cloud Composer environment for each analyst","Heavyweight for this need."]],1,
 "Launch pipelines without code → (Flex) templates."),
Q("d2q21","Dataflow ops","A streaming pipeline aggregates events per country. One country produces 70% of the traffic, and one worker is overloaded while the others idle. What should you do?",[
 ["Increase max workers","The hot key still goes to one worker."],
 ["Use Combine.perKey with withHotKeyFanout","Correct. Fanout pre-aggregates the hot key across workers before the final combine."],
 ["Switch to session windows","Doesn't change key distribution."],
 ["Use a larger Pub/Sub topic","Pub/Sub isn't the bottleneck."]],1,
 "Hot key → hot-key fanout / better key design."),
Q("d2q22","Dataflow ops","A Dataflow job calls an external REST API for every element and system lag keeps growing. The API supports batch requests. What should you change?",[
 ["Add retries","More calls, more lag."],
 ["Batch elements with GroupIntoBatches and call the batch endpoint","Correct. Far fewer round-trips, so throughput rises."],
 ["Switch to a global window","Unrelated to call overhead."],
 ["Move to a push subscription","The source isn't the bottleneck."]],1,
 "Per-element external calls → batch them / cache / side input."),
Q("d2q23","Dataflow ops","Security policy forbids public IP addresses on data-processing VMs. Your Dataflow workers still need to reach BigQuery and Cloud Storage. What should you do?",[
 ["Run Dataflow with --no_use_public_ips on a subnet with Private Google Access enabled","Correct. Workers get only internal IPs and reach Google APIs privately."],
 ["Use a Cloud NAT and keep public IPs","Still uses public IPs on the workers."],
 ["Move the pipeline to Compute Engine","Doesn't solve the requirement and adds overhead."],
 ["Disable the Dataflow API","Breaks the pipeline."]],0,
 "No public IPs → private IP workers + Private Google Access."),
Q("d2q24","Dataflow ops","A large weekly batch Dataflow job isn't time-sensitive; it just needs to finish within 6 hours of submission. You want to reduce its cost. What should you use?",[
 ["Streaming Engine","For streaming jobs."],
 ["FlexRS (Flexible Resource Scheduling)","Correct. Discounted batch execution with delayed scheduling, built for non-urgent jobs."],
 ["Bigger machine types","Usually raises cost."],
 ["Running it as a streaming job","More expensive and unnecessary."]],1,
 "Non-urgent batch, cheaper → FlexRS."),
Q("d2q25","Dataproc","Spark jobs on Dataproc read and write data on the cluster's HDFS, so the cluster can never be deleted. You want to cut costs with job-scoped clusters. What must change first?",[
 ["Store data in Cloud Storage and use gs:// paths","Correct. Separating storage from compute lets you delete clusters without losing data."],
 ["Use larger persistent disks","Still tied to the cluster."],
 ["Enable high-availability mode","Improves uptime, not cost."],
 ["Convert jobs to Hive","Doesn't separate storage."]],0,
 "Ephemeral clusters require data in GCS, not HDFS."),
Q("d2q26","Dataproc","You want to lower Dataproc costs for fault-tolerant Spark batch jobs without risking HDFS data loss or job-master failures. What should you do?",[
 ["Make all primary workers Spot VMs","Losing primaries risks HDFS data and job stability."],
 ["Add Spot (preemptible) secondary workers for extra compute","Correct. Secondary workers do compute only, so losing them is safe and cheap."],
 ["Make the master node a Spot VM","Losing the master kills the cluster."],
 ["Switch to a single-node cluster","Not enough capacity for production jobs."]],1,
 "Cheaper Dataproc → Spot secondary workers, standard primaries."),
Q("d2q27","Dataproc","Every Dataproc cluster needs a custom Python library and a config file installed on all nodes when it's created. What's the recommended approach?",[
 ["SSH into each node after creation","Manual, and lost with every new cluster."],
 ["Initialization actions stored in Cloud Storage","Correct. Scripts run on every node at creation, so they're repeatable."],
 ["Cloud Deployment Manager","Not how you customize software on Dataproc nodes."],
 ["Install the library in the Spark job at runtime on the driver only","Workers wouldn't have it."]],1,
 "Software on every node → initialization actions (or a custom image)."),
Q("d2q28","Dataproc","A data science team wants to run PySpark batch jobs but doesn't want to size, start or delete clusters at all. What should they use?",[
 ["Dataproc with autoscaling","Still a cluster to create and manage."],
 ["Serverless for Apache Spark","Correct. Submit Spark batches with no cluster management."],
 ["Dataflow","Runs Beam, not PySpark code as-is."],
 ["Compute Engine with Spark installed","Maximum overhead."]],1,
 "Spark with zero cluster management → Serverless for Apache Spark."),
Q("d2q29","Migration","A company has on-prem Kafka producers and consumers and wants to move to Google Cloud with minimal application changes and no broker management. What should they use?",[
 ["Pub/Sub","Least ops, but needs client changes from the Kafka API."],
 ["Google Cloud Managed Service for Apache Kafka","Correct. Real Kafka API compatibility without running brokers yourself."],
 ["Kafka on Compute Engine","Works, but you manage brokers, which the company wants to avoid."],
 ["Pub/Sub Lite","Shut down."]],1,
 "Keep Kafka API, no brokers → Managed Kafka. Open to change → Pub/Sub."),
Q("d2q30","Ingestion","Analysts want a BigQuery copy of an operational PostgreSQL database that stays within a few minutes of the source, with no custom code. What should you use?",[
 ["Datastream (CDC) into BigQuery","Correct. Serverless change data capture keeps BigQuery in near real time."],
 ["Nightly pg_dump to GCS + load","Up to 24 hours stale."],
 ["Database Migration Service","Migrates into Cloud SQL/AlloyDB, not BigQuery analytics replication."],
 ["Federated queries on every dashboard refresh","Puts analytical load on the production database."]],0,
 "Near-real-time DB → BigQuery replication → Datastream."),
Q("d2q31","Orchestration","A nightly workflow runs a Dataproc job, waits for it, loads the results into BigQuery, runs a Dataform release, and alerts on failure, with retries and the ability to backfill past dates. What should orchestrate it?",[
 ["Cloud Scheduler","Triggers one action, with no dependencies or backfills."],
 ["Cloud Composer","Correct. Airflow DAGs handle dependencies, retries, alerting and backfills across services."],
 ["Pub/Sub","Messaging, not orchestration."],
 ["A cron job on a VM","Fragile and unmanaged."]],1,
 "Multi-step DAG + retries + backfill → Composer."),
Q("d2q32","Orchestration","You need a lightweight, serverless way to call three Google Cloud APIs in sequence (start a BigQuery job, wait, then call a Cloud Run service) a few times a day, at minimal cost. What fits best?",[
 ["Cloud Composer","Powerful, but a heavyweight always-on environment for a simple chain."],
 ["Workflows (triggered by Cloud Scheduler)","Correct. Serverless step orchestration of API calls, paid per step."],
 ["Dataflow","A data-processing engine, not an API orchestrator."],
 ["Dataproc workflow templates","For Dataproc jobs only."]],1,
 "Light API chain → Workflows. Complex data DAGs → Composer."),
Q("d2q33","Orchestration","Processing must start as soon as a new file lands in a Cloud Storage bucket. Files arrive at unpredictable times. What's the most efficient approach?",[
 ["A Composer DAG that runs every minute to list the bucket","Polling wastes resources and adds delay."],
 ["An Eventarc trigger on object finalize that invokes a Cloud Run function to launch a Dataflow template","Correct. Event-driven: it runs only when a file arrives."],
 ["A Dataflow streaming job polling the bucket","Expensive always-on polling for sporadic files."],
 ["Cloud Scheduler every 5 minutes","Still polling, and still delayed."]],1,
 "React to file arrival → Eventarc / Cloud Run functions."),
Q("d2q34","CI/CD","Your team wants Dataflow pipeline changes to be tested automatically and promoted from dev to prod in a repeatable way. What's the recommended approach?",[
 ["Developers run pipelines from their laptops into prod","Not repeatable or controlled."],
 ["Cloud Build runs tests and builds a Flex Template image in Artifact Registry, then deploys it to dev and then to prod projects","Correct. CI/CD with the same artifact promoted through separate environments."],
 ["Edit the running job in the console","Not possible for code, and not repeatable."],
 ["Store pipeline code in a GCS bucket","No testing or promotion process."]],1,
 "CI/CD → Cloud Build + Artifact Registry + separate projects per environment."),

/* ---------- mock-only ---------- */
Q("d2m01","Architecture","A logistics company ingests GPS events from 100,000 trucks. It needs real-time per-truck lookups in under 10 ms for a tracking app and SQL analytics on history. Which architecture fits?",[
 ["Pub/Sub → Dataflow → Bigtable (serving) and BigQuery (analytics)","Correct. A streaming pipeline with the right sink for each access pattern."],
 ["Pub/Sub → Cloud SQL","Can't take this write volume, and it's poor for analytics at scale."],
 ["Cloud Storage → nightly Dataproc → BigQuery","Not real time."],
 ["Pub/Sub → BigQuery only","No sub-10 ms point lookups."]],0,null,true),
Q("d2m02","Pub/Sub","A payments service consuming from Pub/Sub must not process the same message twice, and you want Pub/Sub itself to guarantee this within a region. What should you enable?",[
 ["Message ordering","Ordering doesn't prevent redelivery."],
 ["Exactly-once delivery on the pull subscription","Correct. Pub/Sub guarantees no redelivery once a message is successfully acked."],
 ["A dead-letter topic","Handles failures, not duplicates."],
 ["A push subscription","Push doesn't support exactly-once delivery."]],1,null,true),
Q("d2m03","Dataflow ops","A streaming Dataflow pipeline writes to BigQuery and occasionally creates duplicate rows after worker restarts. You need exactly-once writes. What should you change?",[
 ["Use the BigQuery Storage Write API in exactly-once mode for the sink","Correct. It gives exactly-once semantics into BigQuery."],
 ["Deduplicate with a nightly query only","Duplicates stay visible all day."],
 ["Increase the number of workers","Doesn't affect duplicates."],
 ["Switch to batch loads every minute","Adds latency and complexity."]],0,null,true),
Q("d2m04","Dataproc","A long-running Dataproc cluster serving interactive Spark notebooks must keep working if the master node fails. What should you configure?",[
 ["High-availability mode with 3 master nodes","Correct. HA mode runs 3 masters so the cluster survives a master failure."],
 ["More secondary workers","Workers don't replace the master."],
 ["Scheduled deletion","Deletes the cluster."],
 ["Spot master nodes","Makes failures more likely."]],0,null,true),
Q("d2m05","Pub/Sub","Producers sometimes publish messages missing required fields, and downstream consumers crash. You want invalid messages rejected at publish time. What should you use?",[
 ["A Pub/Sub topic schema (Avro or Protocol Buffers)","Correct. The topic validates messages against the schema when they're published."],
 ["A dead-letter topic","Catches failures after delivery, not at publish."],
 ["Exactly-once delivery","Unrelated to validation."],
 ["Message ordering","Unrelated to validation."]],0,null,true),
Q("d2m06","Orchestration","Cloud Composer tasks are stuck in \"queued\" for long periods at peak times, although DAGs are correct. What's the most likely fix?",[
 ["Rewrite the DAGs in Workflows","Doesn't address capacity."],
 ["Scale the Composer environment (more or larger workers, higher concurrency settings)","Correct. Queued tasks mean there isn't enough worker capacity or concurrency."],
 ["Delete old DAG runs","Doesn't add capacity."],
 ["Move DAG files to a different bucket","DAG location isn't the issue."]],1,null,true),
Q("d2m07","Choosing an engine","A pipeline built in Cloud Data Fusion runs every night. Which service actually executes the pipeline under the hood?",[
 ["Dataflow","Not Data Fusion's default execution engine."],
 ["Dataproc (ephemeral clusters by default)","Correct. Data Fusion compiles pipelines to Spark and runs them on Dataproc."],
 ["BigQuery","It can push some work down, but it isn't the executor."],
 ["Cloud Run","No."]],1,null,true),
Q("d2m08","Windowing","A streaming job uses session windows with a 30-minute gap. A user clicks at 10:00, 10:20 and 11:05. How many sessions does this create?",[
 ["One","The 45-minute gap between 10:20 and 11:05 exceeds the 30-minute gap duration."],
 ["Two: [10:00–10:20] and [11:05]","Correct. The first two clicks are within 30 minutes. The third starts a new session."],
 ["Three","10:00 and 10:20 are only 20 minutes apart, so they merge."],
 ["It depends on the trigger","Triggers control when results are emitted, not how sessions are formed."]],1,null,true),
Q("d2m09","Windowing","Your team notices that events arriving more than a few seconds late never appear in Dataflow window results. Nobody configured lateness. Why?",[
 ["Pub/Sub drops late messages","It doesn't."],
 ["The default allowed lateness is zero, so data behind the watermark is dropped","Correct. Configure allowed lateness to keep late data."],
 ["Fixed windows can't accept late data","Any window type can accept late data if lateness is allowed."],
 ["Autoscaling discards slow events","No."]],1,null,true),
Q("d2m10","Dataflow ops","A Dataflow streaming job's data freshness metric has degraded steadily over an hour while input volume is flat. CPU is low on all workers. What's the most likely cause?",[
 ["Not enough workers","CPU is low, so it isn't compute starvation."],
 ["A slow external dependency (e.g. per-element API or database calls) blocking processing","Correct. Low CPU with growing lag points to waiting on I/O."],
 ["The Pub/Sub topic is too small","Topics don't have a size."],
 ["The windows are too short","Doesn't cause steadily growing lag at flat input."]],1,null,true),
Q("d2m11","Ingestion","An on-prem system produces 2 TB of log files per day. You need them in Cloud Storage daily with a managed, scheduled, resumable transfer over your 10 Gbps Interconnect. What should you use?",[
 ["Storage Transfer Service with on-prem transfer agents","Correct. Managed, scheduled, resumable transfers from on-prem file systems."],
 ["Transfer Appliance every day","The appliance is for offline bulk transfers, not daily ones."],
 ["Manual gcloud storage cp from an admin's laptop","Not managed or reliable."],
 ["Datastream","For database CDC, not files."]],0,null,true),
Q("d2m12","Beam","A Beam pipeline reads clickstream events and must enrich them with product data from a 200 GB table that changes constantly. A side input is too large. What's a better approach?",[
 ["Keep using a side input on bigger workers","200 GB is far too large for a side input."],
 ["Look up product data from a low-latency store (e.g. Bigtable) in batches with caching, or key both streams and CoGroupByKey","Correct. Large, changing reference data needs keyed lookups or a join, not broadcasting."],
 ["Load the table into every worker's memory at startup","Same problem as a side input."],
 ["Skip enrichment","Doesn't meet the requirement."]],1,null,true)
);

(function(){
const d1 = PDE.domains.find(d=>d.id==="d1");
d1.ready = true;
d1.tools = ["protect","transfer"];
d1.lessons = [
{id:"d1-l1",title:"IAM the Google way",mins:5,
 opener:{q:"Analysts must query tables in the finance dataset but must not change them. What's the least-privilege setup?",
  opts:["Project Editor for each analyst","bigquery.dataViewer on the dataset + bigquery.jobUser on the project, granted to an analysts group","bigquery.admin on the dataset","bigquery.dataOwner on the project"],ans:1,
  why:"Reading tables (dataViewer) and running queries (jobUser) are separate permissions. Grant both at the smallest scope, to a group, not to individuals."},
 cards:[
  {h:"Hierarchy & inheritance",b:`<ul><li><b>Organization → Folders → Projects → Resources</b>. Permissions are <mark>inherited downward</mark>. A child can't remove what a parent granted.</li><li>Principals: Google accounts, <mark>Google Groups (preferred)</mark>, <b>service accounts</b> (apps), Workload Identity Federation (external workloads, no keys).</li><li>Roles: <b>basic</b> (Owner/Editor/Viewer, avoid) · <mark>predefined</mark> (default choice) · custom (only if no predefined role fits).</li></ul>`},
  {h:"BigQuery roles to know",b:`<table><tr><th>Role</th><th>Use</th></tr><tr><td>dataViewer</td><td>Read tables</td></tr><tr><td>dataEditor</td><td>Read + write data (pipelines)</td></tr><tr><td>dataOwner</td><td>Manage dataset access</td></tr><tr><td><mark>jobUser</mark></td><td>Run queries in a project</td></tr><tr><td>user</td><td>Run jobs + create datasets</td></tr><tr><td>admin</td><td>Almost never the answer</td></tr></table><div class="box trap"><div class="l">Old fact</div>"BigQuery has no table-level security" is outdated. There's table IAM, row-level policies, column policy tags and masking.</div>`},
  {h:"Service accounts & org policies",b:`<ul><li>One service account per pipeline, least privilege, avoid downloaded keys.</li><li><code>iam.serviceAccountUser</code> only for people who must run jobs as that SA.</li><li><mark>Organization policies</mark> are guardrails: <code>gcp.resourceLocations</code> (data residency), disable SA key creation, restrict public IPs.</li></ul>`}
 ],
 keys:["Predefined roles → groups/service accounts → smallest scope","Analyst = dataViewer + jobUser","Residency guardrail → resource locations org policy"]},

{id:"d1-l2",title:"Encryption & key management",mins:4,
 opener:{q:"Compliance says the company must be able to revoke Google's ability to decrypt its BigQuery data at any time. What should you use?",
  opts:["Default Google-managed encryption","CMEK with Cloud KMS","CSEK","Client-side encryption only"],ans:1,
  why:"With CMEK you control the key in Cloud KMS. Disabling or destroying it makes the data unreadable. CSEK isn't supported by BigQuery, and client-side encryption would break BigQuery queries."},
 cards:[
  {h:"Who holds the key?",b:`<table><tr><th>Option</th><th>Pick when</th></tr><tr><td>Google-managed</td><td>Default, nothing special required</td></tr><tr><td><mark>CMEK (Cloud KMS)</mark></td><td>"Control rotation", "revoke access", "we must manage keys"</td></tr><tr><td>Cloud HSM</td><td>Hardware-backed keys (FIPS 140-2 L3)</td></tr><tr><td><mark>Cloud EKM</mark></td><td>Keys must stay outside Google</td></tr><tr><td>CSEK</td><td>Only GCS + Compute Engine disks</td></tr><tr><td>Client-side</td><td>Google must never see plaintext</td></tr></table>`},
  {h:"Crypto-shredding",b:`<p>Destroy or disable a CMEK key, and everything encrypted with it becomes unreadable. Useful for "delete all data for this customer/tenant" when you use a key per tenant.</p><div class="box trap"><div class="l">Trap</div><mark>CSEK is not supported in BigQuery.</mark> Any answer combining the two is wrong.</div>`}
 ],
 keys:["Control/revoke keys → CMEK","Keys outside Google → EKM","CSEK only for GCS/GCE"]},

{id:"d1-l3",title:"PII & Sensitive Data Protection",mins:5,
 opener:{q:"Analysts must join two tables on email address, but must never see real emails. Which de-identification technique?",
  opts:["Redact emails","Deterministic encryption / tokenization with Sensitive Data Protection (DLP)","Replace emails with random UUIDs per row","Bucketing"],ans:1,
  why:"Deterministic tokenization maps the same email to the same token in both tables, so joins still work. It's also reversible with the key. Redaction and random values break joins."},
 cards:[
  {h:"What DLP does",b:`<ul><li><b>Inspect</b>: finds 150+ infoTypes (cards, emails, IDs, custom regex) in BigQuery, GCS, Datastore, or streams via the API.</li><li><b>De-identify</b>, then <b>risk analysis</b> (k-anonymity, l-diversity).</li><li>Typical flow: raw → staging bucket → DLP/Dataflow de-identify → BigQuery.</li></ul>`},
  {h:"Pick the right technique",b:`<table><tr><th>Technique</th><th>Joinable?</th><th>Reversible?</th></tr><tr><td>Redaction / masking</td><td>No</td><td>No</td></tr><tr><td><mark>Deterministic encryption / FPE (tokenization)</mark></td><td>Yes</td><td>Yes (with key)</td></tr><tr><td>Crypto hash</td><td>Yes</td><td>No</td></tr><tr><td>Bucketing / date shifting</td><td>Partly</td><td>No</td></tr></table><p>Try the <b>Protect-the-data Picker</b> tool in this domain.</p>`}
 ],
 keys:["Join without exposing → deterministic tokenization / FPE","Irreversible display masking → redaction/masking","Measure re-identification risk → DLP risk analysis"]},

{id:"d1-l4",title:"Perimeters, networks & audit",mins:4,
 opener:{q:"Even with strict IAM, the CISO worries that stolen credentials could be used to copy BigQuery data to a personal project. What prevents this?",
  opts:["Stronger passwords","VPC Service Controls perimeter around the projects","CMEK","Removing the dataViewer role from everyone"],ans:1,
  why:"VPC Service Controls blocks data from leaving the perimeter even when the request has valid credentials. IAM alone can't stop someone who holds stolen credentials."},
 cards:[
  {h:"Network controls",b:`<ul><li><mark>VPC Service Controls</mark>: perimeter that stops exfiltration via Google APIs.</li><li><b>Private Google Access</b>: VMs without public IPs reach Google APIs.</li><li><b>Private Service Connect</b>: private endpoints for services.</li></ul>`},
  {h:"Audit & environments",b:`<ul><li>Audit logs: <b>Admin Activity</b> (always on) · <b>Data Access</b> (off by default for most services, <mark>on by default for BigQuery</mark>) · System Event · Policy Denied.</li><li>"Who read this table?" → Data Access logs, exported to BigQuery with a log sink.</li><li><mark>Separate projects for dev / test / prod.</mark></li><li>Dataset location is fixed at creation. Residency = choose the region + enforce it with an org policy.</li></ul>`}
 ],
 keys:["Exfiltration with valid creds → VPC-SC","Who accessed data → Data Access audit logs","Environment isolation → separate projects"]},

{id:"d1-l5",title:"Reliability, fidelity & DR",mins:4,
 opener:{q:"A pipeline's RPO is 24 hours and RTO is 2 days. Budget is tight. Which DR approach fits?",
  opts:["Spanner multi-region","Active-active in two regions","Scheduled backups/exports to another region","Cloud SQL HA only"],ans:2,
  why:"Loose RPO/RTO → the cheapest option that meets them: backups or snapshots in another region. The others cost far more than needed, and HA alone doesn't cover a region loss."},
 cards:[
  {h:"Vocabulary",b:`<ul><li><mark>RPO</mark> = how much data you can lose. <mark>RTO</mark> = how long you can be down.</li><li>Lower RPO/RTO = more cost. Pick the cheapest option that meets the stated numbers.</li><li>Patterns: multi-region storage · cross-region replicas · replication with failover · backups to another region.</li></ul>`},
  {h:"Fidelity (correct data)",b:`<ul><li><b>Dataform</b>: SQL transforms with <mark>assertions</mark> (tests) and dependencies.</li><li><b>Dataplex data quality scans</b>: rules + alerts.</li><li>Dead-letter outputs for bad records. Avoid <code>max_bad_records</code> as the "solution" (it silently drops rows).</li><li>Validate migrations with row counts and checksums, and run old and new in parallel.</li></ul>`}
 ],
 keys:["Cheapest DR that meets RPO/RTO","Data tests → Dataform assertions / Dataplex quality"]},

{id:"d1-l6",title:"Portability & multicloud",mins:3,
 opener:{q:"Iceberg tables in Cloud Storage must be queried by both BigQuery and Spark, with column-level security. What should you use?",
  opts:["External CSV tables","BigLake tables","Copy the data into native BigQuery","Bigtable"],ans:1,
  why:"BigLake provides governed tables over open formats like Iceberg, readable from BigQuery and Spark with fine-grained security."},
 cards:[
  {h:"Open & multicloud",b:`<ul><li><mark>BigQuery Omni</mark>: analytics on data in AWS/Azure without moving it.</li><li><mark>BigLake</mark>: open-format lakehouse tables (Parquet, ORC, Iceberg) with row/column security.</li><li>Portability: open formats, Beam (runs on Dataflow/Flink/Spark), containers.</li><li><b>Dataplex Universal Catalog</b>: discovery, metadata, profiling, lineage.</li></ul>`}
 ],
 keys:["Data in other clouds → Omni","Open formats + governance → BigLake"]},

{id:"d1-l7",title:"Data migrations",mins:6,
 opener:{q:"You must move 800 TB from an on-prem data center to Cloud Storage. The internet link is 200 Mbps and the project must finish within a month. What should you use?",
  opts:["gcloud storage cp","Storage Transfer Service","Transfer Appliance","Datastream"],ans:2,
  why:"800 TB at 200 Mbps takes about 400 days. Ship it physically with Transfer Appliance. Rule of thumb: 1 TB at 100 Mbps ≈ 1 day."},
 cards:[
  {h:"Pick the transfer tool",b:`<table><tr><th>Tool</th><th>When</th></tr><tr><td>gcloud storage</td><td>Small/medium copies (parallel)</td></tr><tr><td><mark>Storage Transfer Service</mark></td><td>Large, scheduled, S3/Azure/HTTP/on-prem (agents)</td></tr><tr><td><mark>Transfer Appliance</mark></td><td>Huge data + slow network (weeks or months online)</td></tr><tr><td><mark>BigQuery DTS</mark></td><td>Teradata/Redshift migration, SaaS (Ads, YouTube), scheduled queries</td></tr><tr><td><mark>Database Migration Service</mark></td><td>MySQL/Postgres/SQL Server/Oracle → Cloud SQL/AlloyDB, minimal downtime</td></tr><tr><td><mark>Datastream</mark></td><td>CDC → BigQuery/GCS, near real time</td></tr></table><p>Use the <b>Transfer Calculator</b> tool to practise the math.</p>`},
  {h:"Network & playbook",b:`<ul><li><b>Cloud VPN</b>: quick, encrypted over the internet, moderate bandwidth. <b>Dedicated Interconnect</b>: private 10/100 Gbps. <b>Partner Interconnect</b>: via a provider.</li><li>Playbook: <b>assess → plan → migrate → validate → optimize</b>.</li><li>Lift &amp; shift: Hadoop → Dataproc · Kafka → Managed Kafka · HBase → Bigtable · Airflow → Composer · MySQL → Cloud SQL. Modernize: → BigQuery, Dataflow, Pub/Sub.</li></ul>`}
 ],
 keys:["1 TB @100 Mbps ≈ 1 day → too slow = Transfer Appliance","Warehouse → BigQuery DTS · DB → DMS · CDC → Datastream","Private high throughput → Interconnect"]}
];

PDE.tools.protect = {title:"Protect-the-data Picker",sub:"Which security control does the scenario need?",
 intro:"Security questions are about picking the control that matches the threat. Answer as the scenario would.",
 nodes:{
  start:{q:"What's the main concern in the scenario?",opts:[["Who can access what (people/apps)","iam"],["Who holds the encryption keys","keys"],["Sensitive values (PII) inside the data","pii"],["Data leaving the company, even with valid credentials","vpcsc"],["Data must stay in a geography","resid"],["Proving who accessed data","audit"]]},
  iam:{q:"Who needs access?",opts:[["Analysts who only query","iamA"],["A pipeline / application","iamSA"],["Different users see different rows or columns","fine"]]},
  iamA:{result:"dataViewer + jobUser, to a Google Group",why:"Read on the dataset, run jobs in the project, smallest scope, managed through a group.",keys:"least privilege, analysts, query only",trap:"Basic roles (Editor/Owner) or bigquery.admin are almost never correct.",color:"#4f46e5"},
  iamSA:{result:"Dedicated service account with a predefined role",why:"One service account per pipeline, e.g. dataEditor on the target dataset. Avoid downloaded keys (use attached SAs or Workload Identity Federation).",keys:"service account, least privilege",color:"#4f46e5"},
  fine:{result:"Row-level policies / policy tags / authorized views",why:"Rows → row access policies. Columns → policy tags (+ dynamic masking). Share results only → authorized view.",keys:"fine-grained access",color:"#d97706"},
  keys:{q:"What's the key requirement?",opts:[["We must control rotation and be able to revoke","cmek"],["Keys must live in hardware (HSM)","hsm"],["Keys must never be stored in Google","ekm"],["Google must never see plaintext","cse"]]},
  cmek:{result:"CMEK (Cloud KMS)",why:"You manage the key, and disabling or destroying it makes the data unreadable (crypto-shredding).",keys:"control keys, rotate, revoke",trap:"CSEK isn't supported by BigQuery.",color:"#4f46e5"},
  hsm:{result:"Cloud HSM (CMEK in hardware)",why:"Keys are kept in FIPS 140-2 Level 3 HSMs.",color:"#4f46e5"},
  ekm:{result:"Cloud External Key Manager (EKM)",why:"Keys stay in an external key manager outside Google.",color:"#4f46e5"},
  cse:{result:"Client-side encryption",why:"Encrypt before upload. Google only ever stores ciphertext.",trap:"BigQuery can't query data it can't decrypt.",color:"#4f46e5"},
  pii:{q:"What must still be possible after protecting the values?",opts:[["Joins and counts on the protected column, and reversibility","tok"],["Nothing, just hide it for display","mask"],["Joins, but it must be one-way","hash"],["Keep the rough shape (ages, dates)","bucket"]]},
  tok:{result:"Deterministic encryption / FPE tokenization (DLP)",why:"The same input always gives the same token, so joins work and it's reversible with the key.",keys:"pseudonymize, join on PII",color:"#16a34a"},
  mask:{result:"Masking / redaction (DLP)",why:"Irreversible: ****1234 or removed entirely.",color:"#16a34a"},
  hash:{result:"Cryptographic hashing (DLP)",why:"Consistent but one-way: joinable, not reversible.",color:"#16a34a"},
  bucket:{result:"Bucketing / date shifting (DLP)",why:"Generalizes values to reduce re-identification while keeping analytic shape.",color:"#16a34a"},
  vpcsc:{result:"VPC Service Controls",why:"A service perimeter blocks data from leaving protected projects via Google APIs, even with valid credentials.",keys:"exfiltration, stolen credentials",color:"#db2777"},
  resid:{result:"Regional resources + resource locations org policy",why:"Create datasets/buckets in the allowed region and enforce it org-wide with constraints/gcp.resourceLocations.",trap:"A BigQuery dataset's location can't be changed later.",color:"#0891b2"},
  audit:{result:"Cloud Audit Logs (Data Access) → log sink to BigQuery",why:"Data Access logs record who read data (on by default for BigQuery). Export with a sink for analysis or retention.",color:"#0891b2"}
 }};

const Q=(id,topic,q,opts,ans,tip,mock)=>({id,d:"d1",topic,q,opts:opts.map(([t,w])=>({t,w})),ans:Array.isArray(ans)?ans:[ans],tip,mock:!!mock});
PDE.questions.push(
Q("d1q01","IAM","A data science team of 12 people needs to create their own datasets and run queries in a sandbox project. What should you grant?",[
 ["roles/bigquery.user on the sandbox project to the team's Google Group","Correct. bigquery.user can run jobs and create datasets, and a group makes access easy to manage."],
 ["roles/owner on the project to each person","A basic role, far too broad."],
 ["roles/bigquery.dataViewer on the project","Can read, but can't run queries or create datasets."],
 ["roles/bigquery.admin to each person individually","Too broad, and granted to individuals instead of a group."]],0,"Self-service analysts → bigquery.user, to a group."),
Q("d1q02","IAM","A Dataflow pipeline must read from Pub/Sub and write to one BigQuery dataset. What's the best identity setup?",[
 ["Run it as a developer's user account","Personal accounts break when people leave, and they're over-privileged."],
 ["A dedicated worker service account with the Pub/Sub subscriber role and dataEditor on the target dataset only","Correct. One SA per pipeline with least privilege."],
 ["The Compute Engine default service account with Editor","Editor is far too broad."],
 ["A service account key file stored in the code repository","Leaked keys are a major risk."]],1,"Pipelines → dedicated service account, least privilege."),
Q("d1q03","IAM","Your organization must ensure that no one can create resources outside Europe, in any project. What should you do?",[
 ["Tell teams to choose EU regions","Not enforced."],
 ["Set the resource locations organization policy (constraints/gcp.resourceLocations) to EU locations at the organization level","Correct. Enforced for every project in the organization."],
 ["Remove Editor roles from developers","Doesn't control location."],
 ["Use VPC Service Controls","Controls data exfiltration, not where resources are created."]],1,"Residency guardrail → resource locations org policy."),
Q("d1q04","IAM","An external CI system on GitHub Actions must deploy Dataflow templates to your project. Security forbids long-lived service account keys. What should you use?",[
 ["Create a service account key and store it as a GitHub secret","A long-lived key, which is exactly what's forbidden."],
 ["Workload Identity Federation with GitHub's OIDC provider, impersonating a deploy service account","Correct. Short-lived credentials with no keys."],
 ["Grant the GitHub organization Owner on the project","Wildly over-privileged."],
 ["Have a developer deploy manually","Not CI/CD."]],1,"External workloads, no keys → Workload Identity Federation."),
Q("d1q05","Encryption","A healthcare company requires that encryption keys for its BigQuery and Cloud Storage data be rotated every 90 days under its own control, and that access can be revoked instantly. What should you configure?",[
 ["CMEK with Cloud KMS keys and a 90-day rotation schedule","Correct. You control rotation, and disabling the key revokes access."],
 ["Default encryption","Google manages it, so you have no control."],
 ["CSEK for both services","CSEK isn't supported by BigQuery."],
 ["Client-side encryption for BigQuery","BigQuery can't query data it can't decrypt."]],0,"Control + rotate + revoke → CMEK."),
Q("d1q06","Encryption","A government customer requires that encryption keys are held in their own key management system outside Google Cloud. Which option meets this?",[
 ["Cloud KMS software keys","Stored in Google."],
 ["Cloud HSM","Hardware, but still within Google."],
 ["Cloud External Key Manager (EKM)","Correct. Keys stay in an external, partner-hosted or on-prem key manager."],
 ["Google-managed keys","Fully Google-held."]],2,"Keys outside Google → EKM."),
Q("d1q07","Encryption","A SaaS platform stores each tenant's data in its own BigQuery dataset. When a tenant leaves, all of their data must become unrecoverable immediately, including backups. What design supports this best?",[
 ["Delete the dataset and rely on time travel expiring","Time travel and fail-safe keep data recoverable for days."],
 ["A separate CMEK key per tenant; destroy the tenant's key when they leave","Correct. Crypto-shredding makes every copy encrypted with that key unreadable."],
 ["Row-level security per tenant","Controls access, but doesn't destroy data."],
 ["Export tenant data to GCS, then delete it","Doesn't address backups."]],1,"Immediate unrecoverable deletion → per-tenant CMEK + crypto-shredding."),
Q("d1q08","DLP","Customer support transcripts in Cloud Storage may contain credit card numbers and phone numbers. Before loading them into BigQuery, these must be found and masked automatically. What should you use?",[
 ["Regular expressions in a BigQuery view","Fragile, and the raw data still lands in BigQuery."],
 ["Sensitive Data Protection (DLP) inspection + de-identification in the pipeline (e.g. Dataflow) before loading","Correct. DLP detects infoTypes and masks them before the data is stored."],
 ["Column-level security on the transcript column","Hides the whole column, doesn't mask values inside the text."],
 ["CMEK on the bucket","Encryption doesn't remove PII."]],1,"Find + mask PII in content → DLP."),
Q("d1q09","DLP","Researchers need patient records where exact ages and dates of birth are hidden, but they still want age-group trends and the time intervals between visits. Which TWO techniques fit?",[
 ["Bucketing ages into ranges","Correct. Keeps trends while hiding exact values."],
 ["Date shifting by a consistent random offset per patient","Correct. Hides real dates but preserves intervals."],
 ["Redacting ages and dates entirely","Destroys the trends the researchers need."],
 ["Storing the data in Archive class","Unrelated to de-identification."]],[0,1],"Keep shape, hide exact values → bucketing / date shifting."),
Q("d1q10","DLP","Analysts in two departments join their tables on customer national ID. Policy says they must not see real IDs, but the compliance team must be able to recover real IDs during audits. Which technique?",[
 ["Redaction","Breaks joins and can't be recovered."],
 ["SHA-256 hashing","Joinable, but not recoverable."],
 ["Deterministic encryption (or FPE) with a key in Cloud KMS","Correct. Joinable and reversible by authorized key holders."],
 ["Random token per row","Breaks joins."]],2,"Joinable + reversible → deterministic encryption / FPE."),
Q("d1q11","Perimeter","A bank wants to ensure that BigQuery data in its analytics projects can't be copied to any project outside the company, even if an employee's credentials are compromised. What should you implement?",[
 ["VPC Service Controls service perimeter around the analytics projects","Correct. Blocks API-based exfiltration across the perimeter boundary."],
 ["Firewall rules","Don't control Google API data movement."],
 ["CMEK","The copy would still be readable by the attacker's project if the key permissions allow it, so this doesn't stop copying."],
 ["Two-factor authentication only","Helps, but doesn't stop misuse of valid sessions."]],0,"Exfiltration even with valid creds → VPC-SC."),
Q("d1q12","Network","Dataproc clusters run on VMs without external IP addresses, but jobs fail to read from Cloud Storage. What should you enable?",[
 ["Public IPs on all workers","Violates the no-external-IP design."],
 ["Private Google Access on the cluster's subnet","Correct. Internal-only VMs can reach Google APIs."],
 ["VPC Service Controls","A perimeter doesn't provide connectivity."],
 ["A Cloud VPN to Google","Not needed to reach Google APIs from inside the VPC."]],1,"No external IPs + Google APIs → Private Google Access."),
Q("d1q13","Audit","Security asks for a monthly report of every user who read the salaries table in BigQuery, kept for 3 years. What should you do?",[
 ["Enable Admin Activity logs","They record config changes, not data reads (and they're always on)."],
 ["Use BigQuery Data Access audit logs and route them with a log sink to a BigQuery dataset (or GCS) with 3-year retention","Correct. Data access is logged for BigQuery by default, and a sink keeps it for analysis and retention."],
 ["Ask users to self-report","Not reliable."],
 ["Query INFORMATION_SCHEMA.JOBS only","Retention is limited (about 180 days), so it doesn't meet 3 years."]],1,"Who read the data → Data Access audit logs + sink."),
Q("d1q14","Environments","Developers occasionally break production tables while testing pipeline changes. What's the Google-recommended structural fix?",[
 ["Ask developers to be careful","Not a control."],
 ["Separate projects for dev, test and prod, with different IAM, and promote changes via CI/CD","Correct. Isolation by project is the standard pattern."],
 ["Prefix test tables with test_","Same permissions, so the same risk."],
 ["Give developers Viewer on prod and Owner on dev in the same project","Roles are per project, and mixing environments in one project defeats the purpose."]],1,"Environment isolation → separate projects."),
Q("d1q15","Residency","A dataset was created in the US multi-region by mistake. It must now be in europe-west3. What should you do?",[
 ["Edit the dataset location","Dataset location can't be changed after creation."],
 ["Create a new dataset in europe-west3 and copy the tables (e.g. dataset copy / cross-region copy), then delete the old one","Correct. Location is fixed at creation, so copy into a new dataset."],
 ["Set an org policy","Prevents future mistakes but doesn't move data."],
 ["Use VPC Service Controls","Unrelated to location."]],1,"Wrong location → new dataset + copy."),
Q("d1q16","Reliability","Your transformation SQL in BigQuery occasionally produces duplicate order IDs, which nobody notices for days. You want the pipeline to fail fast when this happens. What should you add?",[
 ["Dataform assertions (uniqueness) on the output table","Correct. Assertions run with the transformation and fail on bad data."],
 ["max_bad_records on load jobs","Silently drops rows, the opposite of failing fast."],
 ["A larger reservation","Unrelated."],
 ["Clustering by order_id","Organizes storage, doesn't validate."]],0,"Data tests in SQL pipelines → Dataform assertions (or Dataplex quality)."),
Q("d1q17","DR","An analytics dataset feeds a non-critical weekly report. Requirements: RPO 7 days, RTO 3 days, minimal cost. Which DR approach is enough?",[
 ["Managed cross-region replication with failover reservations","Far more than needed."],
 ["Periodic table snapshots or exports to Cloud Storage in another region","Correct. Cheap, and meets the loose RPO/RTO."],
 ["Active-active pipelines in two regions","Expensive overkill."],
 ["No DR at all","A region loss would exceed the RTO with nothing to restore."]],1,"Loose RPO/RTO → cheapest backup that meets them."),
Q("d1q18","Portability","A company wants its pipeline code to be portable so it can run on Google Cloud today and possibly on another runner later, without a rewrite. What should they build on?",[
 ["Apache Beam (run on Dataflow)","Correct. Beam pipelines run on Dataflow, Flink or Spark runners."],
 ["BigQuery stored procedures","Tied to BigQuery."],
 ["Cloud Run functions with proprietary APIs","Not a portable data-processing model."],
 ["Dataprep recipes","Tied to the service."]],0,"Portable pipelines → Apache Beam."),
Q("d1q19","Migration","You need to move 2 PB of archived files from an on-prem NAS to Cloud Storage. The site has a 1 Gbps connection that's shared with business traffic. What should you use?",[
 ["gcloud storage cp in parallel","2 PB over a shared 1 Gbps link takes many months."],
 ["Storage Transfer Service with on-prem agents","Still bound by the same slow link."],
 ["Transfer Appliance","Correct. For PB-scale data with constrained bandwidth, ship it physically."],
 ["Datastream","For database CDC."]],2,"PB + limited bandwidth → Transfer Appliance."),
Q("d1q20","Migration","Every night, new files in an Amazon S3 bucket must be copied to Cloud Storage, with retries and no servers to manage. What should you use?",[
 ["A cron job on a Compute Engine VM running aws s3 sync","Self-managed infrastructure."],
 ["Storage Transfer Service scheduled job from S3","Correct. Managed, scheduled, incremental, with retries."],
 ["Transfer Appliance","For offline bulk transfers."],
 ["BigQuery Omni","Queries S3 data; it doesn't copy files."]],1,"Recurring cloud-to-GCS copy → Storage Transfer Service."),
Q("d1q21","Migration","A retailer is migrating its on-prem Teradata warehouse to BigQuery, including schema and historical data. Which service is designed for this?",[
 ["Storage Transfer Service","Copies files, not warehouse schemas."],
 ["BigQuery Data Transfer Service (with the migration service for Teradata)","Correct. Purpose-built for warehouse migrations into BigQuery."],
 ["Database Migration Service","Targets Cloud SQL/AlloyDB, not BigQuery."],
 ["Datastream","CDC from operational databases, not Teradata warehouse migration."]],1,"Teradata/Redshift → BigQuery DTS / migration service."),
Q("d1q22","Migration","An e-commerce MySQL database (3 TB) must move to Cloud SQL with less than 10 minutes of downtime. What should you use?",[
 ["mysqldump and restore over a weekend","Hours of downtime."],
 ["Database Migration Service with continuous replication, then a short cut-over","Correct. Minimal-downtime migration into Cloud SQL."],
 ["Datastream to BigQuery","The wrong target."],
 ["Transfer Appliance","For files, and far too slow for this."]],1,"DB → Cloud SQL, minimal downtime → DMS."),
Q("d1q23","Networking","A hybrid architecture needs a private, high-throughput (20 Gbps+) and consistent connection between an on-prem data center and Google Cloud for daily bulk transfers. What should you choose?",[
 ["Cloud VPN over the internet","Lower and less predictable bandwidth."],
 ["Dedicated Interconnect","Correct. Private physical links of 10/100 Gbps."],
 ["Public internet with TLS","Not private or consistent."],
 ["Transfer Appliance every day","Offline and impractical for daily use."]],1,"Private + high throughput → Dedicated Interconnect."),
Q("d1q24","Migration","After migrating a large table from an on-prem warehouse to BigQuery, how should you validate the migration before switching users over?",[
 ["Check that the table exists","Says nothing about correctness."],
 ["Compare row counts and aggregate checksums per partition, and run key reports on both systems in parallel","Correct. Systematic validation before cut-over."],
 ["Ask one analyst to eyeball a few rows","Not systematic."],
 ["Delete the source immediately to avoid confusion","Removes your fallback."]],1,"Validate migrations → counts, checksums, parallel runs."),
Q("d1q25","Migration","A company runs Hive and Spark on-prem and wants to move to Google Cloud quickly now, then modernize later. What's the right sequence?",[
 ["Rewrite everything in Dataflow first","Slow, and against the \"quickly now\" requirement."],
 ["Lift and shift to Dataproc with data in Cloud Storage, then modernize to BigQuery/Dataflow over time","Correct. Move fast with minimal changes, then optimize."],
 ["Move to Compute Engine VMs with Hadoop installed","Self-managed, not Google's recommendation."],
 ["Stay on-prem until a full redesign is ready","Doesn't meet the goal."]],1,"Fast migration first (Dataproc), modernize later."),
Q("d1q26","Privacy","A marketing dataset in BigQuery has an email column. Most analysts may only see a masked version, while the CRM team may see real values. Analysts should still be able to query the table. What should you use?",[
 ["Two copies of the table","Duplication and drift."],
 ["A policy tag on the column with a dynamic data masking rule, and Fine-Grained Reader for the CRM team","Correct. One table, masked for most users, real values for authorized readers."],
 ["Delete the email column","The CRM team needs it."],
 ["VPC Service Controls","Not column-level."]],1,"Mask a column for some users → policy tags + dynamic masking."),

Q("d1m07","DR","Which change lowers the RPO of a Cloud Storage bucket for a regional disaster most directly?",[

Q("d1m08","Migration","An on-prem Oracle database must stay the system of record for 6 months during a migration, while analysts query an always-up-to-date copy in BigQuery. What should you use?",[
 ["Datastream CDC from Oracle to BigQuery","Correct. Continuous near-real-time replication into BigQuery."],
