/* ===== d3-l10 Firestore & Memorystore ===== */
dd("d3-l10",[
`<p>Mobile and web apps have needs that classic databases handle awkwardly. A shopping app stores user profiles and carts whose fields keep changing, wants phones to see updates instantly, and must work offline on the train. Separately, the same app shows a product page thousands of times per second; hitting the database every time is slow and costly.</p><p><mark>Firestore</mark> is the flexible, serverless document database for app data. <mark>Memorystore</mark> is a managed in-memory cache (Redis / Valkey / Memcached) for sub-millisecond reads.</p>`,
`<ul><li><b>Firestore</b>: NoSQL <b>document</b> database. Data = <b>collections</b> of <b>documents</b> (JSON-like maps), documents can contain subcollections.</li><li>Serverless (no instances), scales automatically, strong consistency, ACID transactions, multi-region option.</li><li><b>Real-time listeners</b> and <b>offline sync</b> for mobile/web via Firebase SDKs.</li><li>Queries need <b>indexes</b>: single-field indexes are automatic, composite indexes you define.</li><li>Firestore in <b>Datastore mode</b> = the server-side successor of Cloud Datastore.</li><li><b>Memorystore</b>: managed Redis, Valkey or Memcached. Data lives in RAM → sub-ms latency. Used for caching, sessions, leaderboards, rate limiting.</li><li>Redis has richer data types, persistence options and replicas (HA); Memcached is simple key-value caching.</li><li><b>Cache-aside pattern</b>: app checks cache → if miss, read DB, store result in cache with a TTL.</li></ul>`,
`<ol><li><b>App data with flexible schema, per-user documents, mobile sync?</b> → Firestore.</li><li>Model around reads: e.g. <code>users/{uid}</code>, <code>users/{uid}/carts/{cartId}</code>. Denormalise where it saves reads.</li><li>Create composite indexes for multi-field queries; avoid sequential document IDs at very high write rates.</li><li><b>Read-heavy, same data requested over and over?</b> Put Memorystore in front of the database.</li><li>Cache-aside: <code>GET product:123</code> → miss → read Cloud SQL → <code>SET product:123 … EX 300</code>.</li><li>Choose Redis/Valkey with a replica for HA if losing the cache would hurt.</li><li>Need analytics? Export Firestore to BigQuery (managed export or extension); don't run analytics on Firestore.</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>Firestore is a filing cabinet of folders where every sheet of paper can have different fields written on it, and anyone holding a copy of the folder gets a notification the moment a sheet changes. Memorystore is the sticky note on your monitor: the answers you need fifty times a day, so you don't walk to the filing cabinet each time. If the sticky note falls off, you still have the cabinet.</div>`,
`<p>A food delivery app:</p><ul><li>User profiles, addresses, favourite restaurants, and the live order status that the customer's phone watches → <b>Firestore</b> with real-time listeners; the phone shows "driver is 3 minutes away" instantly and still shows the order offline.</li><li>Restaurant menus (read 20,000 times/sec at dinner, updated a few times a day) stored in Cloud SQL → cached in <b>Memorystore for Redis</b> with a 5-minute TTL. Database load drops by over 90%, page loads go from 40 ms to a few ms.</li><li>Weekly analysis of order behaviour → Firestore export to BigQuery.</li></ul>`,
`<div class="box trap"><div class="l">Traps</div><ul><li>Firestore is not for analytics or huge time-series throughput (that's BigQuery / Bigtable).</li><li>"Mobile app, offline sync, real-time updates, flexible schema" → <mark>Firestore</mark>.</li><li>"Sub-millisecond, cache, session store, reduce DB load" → <mark>Memorystore</mark>.</li><li>Memorystore is not durable primary storage; data can be lost (unless you configure persistence) and RAM is expensive.</li><li>Multi-field Firestore query failing → missing composite index.</li><li>Datastore questions → think Firestore in Datastore mode.</li></ul></div>`,
`<p>Firestore is a serverless NoSQL document database with strong consistency, transactions, real-time listeners and offline sync, ideal for mobile and web app data with flexible schemas. Memorystore is a managed in-memory store (Redis, Valkey, Memcached) used as a cache or session store to cut latency and database load. Neither is for analytics; export to BigQuery for that.</p>`
],[
`<p>App mobile dan web punya kebutuhan yang canggung kalau ditangani database klasik. Sebuah app belanja menyimpan profil user dan keranjang yang field-nya terus berubah, ingin HP langsung melihat update, dan harus tetap jalan offline di kereta. Di sisi lain, app yang sama menampilkan halaman produk ribuan kali per detik; kalau setiap kali harus ke database, jadi lambat dan mahal.</p><p><mark>Firestore</mark> adalah database dokumen serverless yang fleksibel untuk data app. <mark>Memorystore</mark> adalah cache in-memory terkelola (Redis / Valkey / Memcached) untuk read di bawah satu milidetik.</p>`,
`<ul><li><b>Firestore</b>: database NoSQL berbasis <b>dokumen</b>. Data = <b>collection</b> berisi <b>document</b> (map mirip JSON), dan dokumen bisa punya subcollection.</li><li>Serverless (tanpa instance), scale otomatis, strong consistency, transaksi ACID, ada opsi multi-region.</li><li><b>Real-time listener</b> dan <b>offline sync</b> untuk mobile/web lewat Firebase SDK.</li><li>Query butuh <b>index</b>: index satu field otomatis, composite index kamu definisikan sendiri.</li><li>Firestore <b>mode Datastore</b> = penerus server-side dari Cloud Datastore.</li><li><b>Memorystore</b>: Redis, Valkey, atau Memcached terkelola. Data ada di RAM → latensi di bawah 1 ms. Dipakai untuk cache, session, leaderboard, rate limiting.</li><li>Redis punya tipe data lebih kaya, opsi persistence, dan replica (HA); Memcached adalah cache key-value yang sederhana.</li><li><b>Pola cache-aside</b>: app cek cache → kalau tidak ada, baca DB, simpan hasilnya di cache dengan TTL.</li></ul>`,
`<ol><li><b>Data app dengan schema fleksibel, dokumen per user, sinkron mobile?</b> → Firestore.</li><li>Modelkan berdasarkan read: misalnya <code>users/{uid}</code>, <code>users/{uid}/carts/{cartId}</code>. Denormalisasi kalau menghemat read.</li><li>Buat composite index untuk query multi-field; hindari ID dokumen berurutan pada laju write yang sangat tinggi.</li><li><b>Read berat, data yang sama diminta berulang-ulang?</b> Taruh Memorystore di depan database.</li><li>Cache-aside: <code>GET product:123</code> → tidak ada → baca Cloud SQL → <code>SET product:123 … EX 300</code>.</li><li>Pilih Redis/Valkey dengan replica untuk HA kalau kehilangan cache akan merepotkan.</li><li>Butuh analitik? Export Firestore ke BigQuery (managed export atau extension); jangan jalankan analitik di Firestore.</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Firestore adalah lemari arsip berisi map, di mana setiap lembar kertas boleh punya isian berbeda, dan siapa pun yang memegang salinan map langsung dapat notifikasi begitu ada lembar yang berubah. Memorystore adalah sticky note di monitor: jawaban yang kamu butuhkan lima puluh kali sehari, jadi tidak perlu jalan ke lemari arsip setiap kali. Kalau sticky note-nya jatuh, lemari arsipnya masih ada.</div>`,
`<p>Sebuah app pesan-antar makanan:</p><ul><li>Profil user, alamat, restoran favorit, dan status order live yang dipantau HP customer → <b>Firestore</b> dengan real-time listener; HP langsung menampilkan "driver 3 menit lagi" dan tetap menampilkan order saat offline.</li><li>Menu restoran (dibaca 20.000 kali/detik saat makan malam, diupdate beberapa kali sehari) disimpan di Cloud SQL → di-cache di <b>Memorystore for Redis</b> dengan TTL 5 menit. Beban database turun lebih dari 90%, waktu buka halaman dari 40 ms jadi beberapa ms.</li><li>Analisis mingguan perilaku order → export Firestore ke BigQuery.</li></ul>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li>Firestore bukan untuk analitik atau throughput time-series raksasa (itu BigQuery / Bigtable).</li><li>"App mobile, offline sync, update real-time, schema fleksibel" → <mark>Firestore</mark>.</li><li>"Sub-milidetik, cache, session store, kurangi beban DB" → <mark>Memorystore</mark>.</li><li>Memorystore bukan storage utama yang tahan lama; data bisa hilang (kecuali persistence diatur) dan RAM itu mahal.</li><li>Query Firestore multi-field gagal → composite index belum dibuat.</li><li>Soal tentang Datastore → pikirkan Firestore mode Datastore.</li></ul></div>`,
`<p>Firestore adalah database dokumen NoSQL serverless dengan strong consistency, transaksi, real-time listener, dan offline sync, ideal untuk data app mobile dan web dengan schema fleksibel. Memorystore adalah storage in-memory terkelola (Redis, Valkey, Memcached) yang dipakai sebagai cache atau session store untuk memangkas latensi dan beban database. Keduanya bukan untuk analitik; export ke BigQuery untuk itu.</p>`

/* ===== d3-l11 Data warehouse modelling ===== */
dd("d3-l11",[
`<p>Analysts don't want 300 raw tables copied from source systems with cryptic column names. They want to answer questions like "sales per region last quarter vs the same quarter last year" quickly and get the <i>same number</i> as everyone else. And when a customer moves city, reports from last year should still show where they lived <i>then</i>.</p><p>Warehouse modelling is about <mark>shaping data into layers and tables that are easy, fast and consistent to query</mark>, including how to keep history.</p>`,
`<ul><li><b>Fact table</b>: events/measurements (sales, clicks), many rows, numeric measures + keys.</li><li><b>Dimension table</b>: descriptive context (customer, product, date, store).</li><li><b>Star schema</b>: one fact surrounded by dimensions. <b>Snowflake</b>: dimensions further normalised (more joins).</li><li><b>Grain</b>: what one fact row means (one order line? one daily total?). Decide it first.</li><li><b>Slowly Changing Dimension (SCD)</b>: <b>Type 1</b> overwrite (no history); <b>Type 2</b> add a new row with <code>valid_from</code>, <code>valid_to</code>, <code>is_current</code> (full history).</li><li><b>Layers</b>: raw/bronze (as landed) → cleaned/silver (typed, deduplicated) → curated/gold (business-ready marts).</li><li><b>Views</b> (saved queries), <b>materialized views</b> (precomputed, auto-refreshed), <b>authorized views</b> for sharing.</li><li><b>MERGE</b>: SQL upsert for incremental loads; <b>Dataform</b> manages these SQL transformations with dependencies, tests and version control.</li></ul>`,
`<ol><li>Land raw data unchanged in a <code>raw</code> dataset (replayable).</li><li>Clean into <code>staging</code>: cast types, dedupe (e.g. <code>QUALIFY ROW_NUMBER() OVER (PARTITION BY id ORDER BY updated_at DESC)=1</code>).</li><li>Build dimensions; for history use SCD Type 2 with <code>MERGE</code>: close the old row (<code>valid_to = now, is_current = false</code>) and insert the new version.</li><li>Build facts at a clear grain, partitioned by date, clustered by common filters; in BigQuery nested fields are fine for child detail.</li><li>Publish <code>marts</code> (gold) per business area; share via views/authorized views.</li><li>Orchestrate with Dataform (or Composer), add assertions (unique keys, not null).</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>A kitchen: raw ingredients from the market (bronze), washed and chopped prep (silver), plated dishes ready to serve (gold). The fact table is the list of every dish sold; dimensions are the menu, the tables and the waiters. SCD Type 2 is a staff list that writes "Rina, cashier, Jan–Jun" and "Rina, manager, Jul–now" instead of erasing the old job, so last spring's report still says a cashier served those customers.</div>`,
`<p>A retail chain wants "revenue by customer city" for 2025 and 2026. Customer C7 moved from Bandung to Jakarta in March 2026.</p><table><tr><th>customer_sk</th><th>id</th><th>city</th><th>valid_from</th><th>valid_to</th><th>current</th></tr><tr><td>101</td><td>C7</td><td>Bandung</td><td>2023-05-01</td><td>2026-03-14</td><td>false</td></tr><tr><td>245</td><td>C7</td><td>Jakarta</td><td>2026-03-15</td><td>9999-12-31</td><td>true</td></tr></table><p>Sales facts store <code>customer_sk</code> at the time of sale. 2025 revenue for C7 appears under Bandung, April 2026 under Jakarta: history is correct. With SCD Type 1, all of C7's past revenue would wrongly move to Jakarta.</p>`,
`<div class="box trap"><div class="l">Traps</div><ul><li>"Keep history of changing attributes" → <mark>SCD Type 2</mark>; Type 1 overwrites.</li><li>Not defining grain causes double counting.</li><li>Heavy snowflaking adds joins; in BigQuery prefer star or nested denormalised tables.</li><li>Repeated dashboards on the same aggregation → materialized view.</li><li>Keep raw data immutable so you can rebuild; don't transform in place.</li><li>SQL-based transformations with dependency management and testing in BigQuery → Dataform.</li></ul></div>`,
`<p>Model the warehouse in layers (raw → cleaned → curated) and build star schemas with a clear grain: facts for events, dimensions for context. Use SCD Type 2 when history of changing attributes matters, implemented with MERGE, and use views or materialized views to serve consistent business metrics. Dataform manages the SQL transformations, dependencies and tests in BigQuery.</p>`
],[
`<p>Analis tidak mau 300 tabel mentah hasil salinan sistem sumber dengan nama kolom yang membingungkan. Mereka ingin menjawab pertanyaan seperti "penjualan per region kuartal lalu vs kuartal yang sama tahun lalu" dengan cepat dan mendapat <i>angka yang sama</i> dengan orang lain. Dan kalau customer pindah kota, laporan tahun lalu harus tetap menunjukkan di mana dia tinggal <i>saat itu</i>.</p><p>Modelling warehouse adalah tentang <mark>membentuk data menjadi lapisan dan tabel yang mudah, cepat, dan konsisten untuk di-query</mark>, termasuk cara menyimpan riwayat.</p>`,
`<ul><li><b>Fact table</b>: event/pengukuran (penjualan, klik), barisnya banyak, berisi angka (measure) + key.</li><li><b>Dimension table</b>: konteks deskriptif (customer, produk, tanggal, toko).</li><li><b>Star schema</b>: satu fact dikelilingi dimension. <b>Snowflake</b>: dimension dinormalisasi lagi (lebih banyak join).</li><li><b>Grain</b>: arti satu baris fact (satu baris order? total harian?). Tentukan ini paling awal.</li><li><b>Slowly Changing Dimension (SCD)</b>: <b>Type 1</b> menimpa (tanpa riwayat); <b>Type 2</b> menambah baris baru dengan <code>valid_from</code>, <code>valid_to</code>, <code>is_current</code> (riwayat lengkap).</li><li><b>Lapisan</b>: raw/bronze (apa adanya) → cleaned/silver (tipe benar, tanpa duplikat) → curated/gold (mart siap pakai untuk bisnis).</li><li><b>View</b> (query yang disimpan), <b>materialized view</b> (hasil dihitung lebih dulu, refresh otomatis), <b>authorized view</b> untuk berbagi data.</li><li><b>MERGE</b>: upsert SQL untuk load inkremental; <b>Dataform</b> mengelola transformasi SQL ini lengkap dengan dependency, test, dan version control.</li></ul>`,
`<ol><li>Simpan data mentah tanpa diubah di dataset <code>raw</code> (bisa diputar ulang).</li><li>Bersihkan ke <code>staging</code>: cast tipe data, hapus duplikat (misalnya <code>QUALIFY ROW_NUMBER() OVER (PARTITION BY id ORDER BY updated_at DESC)=1</code>).</li><li>Bangun dimension; untuk riwayat pakai SCD Type 2 dengan <code>MERGE</code>: tutup baris lama (<code>valid_to = sekarang, is_current = false</code>) lalu insert versi baru.</li><li>Bangun fact dengan grain yang jelas, dipartisi per tanggal, di-cluster berdasarkan filter yang sering dipakai; di BigQuery nested field boleh untuk detail anak.</li><li>Publikasikan <code>marts</code> (gold) per area bisnis; bagikan lewat view/authorized view.</li><li>Orkestrasi dengan Dataform (atau Composer), tambahkan assertion (key unik, tidak null).</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Dapur restoran: bahan mentah dari pasar (bronze), bahan yang sudah dicuci dan dipotong (silver), hidangan yang sudah di-plating siap disajikan (gold). Fact table adalah daftar setiap hidangan yang terjual; dimension adalah menu, meja, dan pelayannya. SCD Type 2 adalah daftar karyawan yang menulis "Rina, kasir, Jan–Jun" dan "Rina, manajer, Jul–sekarang" alih-alih menghapus jabatan lama, jadi laporan musim semi lalu tetap bilang yang melayani customer adalah seorang kasir.</div>`,
`<p>Sebuah jaringan ritel ingin "pendapatan per kota customer" untuk 2025 dan 2026. Customer C7 pindah dari Bandung ke Jakarta pada Maret 2026.</p><table><tr><th>customer_sk</th><th>id</th><th>city</th><th>valid_from</th><th>valid_to</th><th>current</th></tr><tr><td>101</td><td>C7</td><td>Bandung</td><td>2023-05-01</td><td>2026-03-14</td><td>false</td></tr><tr><td>245</td><td>C7</td><td>Jakarta</td><td>2026-03-15</td><td>9999-12-31</td><td>true</td></tr></table><p>Fact penjualan menyimpan <code>customer_sk</code> yang berlaku saat transaksi. Pendapatan 2025 dari C7 tercatat di Bandung, April 2026 di Jakarta: riwayatnya benar. Dengan SCD Type 1, semua pendapatan lama C7 akan salah pindah ke Jakarta.</p>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li>"Simpan riwayat atribut yang berubah" → <mark>SCD Type 2</mark>; Type 1 menimpa.</li><li>Tidak menentukan grain menyebabkan perhitungan ganda.</li><li>Snowflake yang berlebihan menambah join; di BigQuery lebih baik star atau tabel nested yang didenormalisasi.</li><li>Dashboard yang berulang-ulang memakai agregasi sama → materialized view.</li><li>Biarkan data raw tidak berubah supaya bisa dibangun ulang; jangan transformasi di tempat.</li><li>Transformasi berbasis SQL dengan manajemen dependency dan testing di BigQuery → Dataform.</li></ul></div>`,
`<p>Modelkan warehouse dalam lapisan (raw → cleaned → curated) dan bangun star schema dengan grain yang jelas: fact untuk event, dimension untuk konteks. Pakai SCD Type 2 kalau riwayat atribut yang berubah itu penting, diimplementasikan dengan MERGE, dan pakai view atau materialized view untuk menyajikan metrik bisnis yang konsisten. Dataform mengelola transformasi SQL, dependency, dan test di BigQuery.</p>`

/* ===== d3-l12 Data lakes & Dataplex ===== */
dd("d3-l12",[
`<p>Over time a company ends up with data everywhere: CSVs and Parquet in dozens of GCS buckets, hundreds of BigQuery datasets in many projects, owned by different teams. Nobody knows which table is the "official" one, who owns it, whether it contains PII, or whether yesterday's load was complete. Security is set bucket by bucket, inconsistently.</p><p>A data lake stores everything cheaply; <mark>Dataplex (now Dataplex Universal Catalog) organises, catalogs, secures and checks the quality of data across GCS and BigQuery without moving it</mark>.</p>`,
`<ul><li><b>Data lake</b>: raw and semi-structured files in Cloud Storage (cheap, any format), often queried through BigQuery.</li><li><b>BigLake tables</b>: BigQuery tables over files in GCS (or other clouds) with <b>fine-grained security</b> (row/column level) and without giving users direct bucket access. Supports open formats like <b>Apache Iceberg</b>.</li><li><b>Lakehouse</b>: lake storage + warehouse features (SQL, governance, ACID via Iceberg).</li><li><b>Dataplex lakes → zones → assets</b>: a <i>lake</i> per domain (e.g. Sales), <i>raw</i> and <i>curated</i> zones, <i>assets</i> = the actual buckets and datasets attached.</li><li><b>Universal Catalog</b>: automatic discovery and metadata search, business glossaries, aspects (tags), <b>data lineage</b>.</li><li><b>Data profiling</b> and <b>data quality</b> scans (rules like not-null, ranges, uniqueness).</li><li>Centralised IAM per lake/zone (data mesh: domain teams own their data, central governance).</li></ul>`,
`<ol><li>Group data by business domain: create a lake per domain.</li><li>Inside, create a <b>raw zone</b> (as landed) and a <b>curated zone</b> (clean, schema-enforced).</li><li>Attach existing GCS buckets and BigQuery datasets as assets; no data is copied.</li><li>Dataplex discovery registers files as tables so they're queryable in BigQuery and searchable in the catalog.</li><li>Upgrade lake tables to <b>BigLake</b> to enforce row/column security and let analysts query without bucket permissions.</li><li>Add data quality scans on key tables and alert on failures; use lineage to see what breaks downstream.</li><li>Grant access at lake/zone level to groups.</li></ol>`,
`<div class="box pic"><div class="l">Analogy</div>A city library that grew without a plan: books in many buildings, some without labels. Dataplex is the librarian system: it doesn't move the books, but it puts every book in one searchable catalog, groups the buildings into departments (lakes) and sections (zones), marks which books are restricted, and regularly checks that no pages are missing (quality scans). BigLake is the reading room where you can read restricted books with only the allowed pages visible.</div>`,
`<p>A bank has customer data in 40 GCS buckets (Parquet from Spark jobs) and 120 BigQuery datasets across 6 projects. Auditors ask: "Where is customer PII and who can read it? Was yesterday's transaction data complete?"</p><ul><li>Dataplex lakes: <code>retail-banking</code>, <code>cards</code>, <code>risk</code>; each with raw and curated zones; buckets and datasets attached as assets.</li><li>Catalog search + Sensitive Data Protection discovery locate PII columns; tagged with aspects.</li><li>Parquet tables converted to BigLake tables with column-level security on <code>nik</code> and <code>phone</code>.</li><li>Data quality scan: <code>transaction_id</code> unique, <code>amount</code> not null, row count within 10% of last week → alert if it fails.</li><li>Lineage shows which dashboards depend on the transactions table.</li></ul>`,
`<div class="box trap"><div class="l">Traps</div><ul><li>"Govern / discover / catalog data across many buckets and datasets without moving it" → <mark>Dataplex</mark>.</li><li>"Fine-grained security on files in GCS, queried from BigQuery, without bucket access" → <mark>BigLake</mark>.</li><li>Copying everything into one project to "centralise" is the wrong answer; Dataplex governs in place.</li><li>Data Catalog's features now live in Dataplex Universal Catalog.</li><li>Data quality rules → Dataplex data quality scans (or Dataform assertions in pipelines).</li><li>Plain external tables don't give row/column security; BigLake tables do.</li></ul></div>`,
`<p>A data lake keeps raw and semi-structured data cheaply in Cloud Storage, and BigLake tables let BigQuery query it with fine-grained security and open formats like Iceberg. Dataplex Universal Catalog organises data into lakes, zones and assets without moving it, and adds discovery, search, lineage, profiling and data quality scans. Together they give a governed lakehouse across GCS and BigQuery.</p>`
],[
`<p>Lama-kelamaan perusahaan punya data di mana-mana: CSV dan Parquet di puluhan bucket GCS, ratusan dataset BigQuery di banyak project, dimiliki tim yang berbeda-beda. Tidak ada yang tahu tabel mana yang "resmi", siapa pemiliknya, apakah berisi PII, atau apakah load kemarin lengkap. Keamanan diatur per bucket, tidak konsisten.</p><p>Data lake menyimpan semuanya dengan murah; <mark>Dataplex (sekarang Dataplex Universal Catalog) mengatur, mengkatalogkan, mengamankan, dan mengecek kualitas data lintas GCS dan BigQuery tanpa memindahkannya</mark>.</p>`,
`<ul><li><b>Data lake</b>: file mentah dan semi-terstruktur di Cloud Storage (murah, format apa saja), sering di-query lewat BigQuery.</li><li><b>BigLake table</b>: tabel BigQuery di atas file di GCS (atau cloud lain) dengan <b>keamanan fine-grained</b> (level baris/kolom) tanpa memberi user akses langsung ke bucket. Mendukung format terbuka seperti <b>Apache Iceberg</b>.</li><li><b>Lakehouse</b>: storage ala lake + fitur warehouse (SQL, governance, ACID lewat Iceberg).</li><li><b>Dataplex lake → zone → asset</b>: satu <i>lake</i> per domain (misalnya Sales), zone <i>raw</i> dan <i>curated</i>, <i>asset</i> = bucket dan dataset sebenarnya yang ditautkan.</li><li><b>Universal Catalog</b>: discovery otomatis dan pencarian metadata, business glossary, aspect (tag), <b>data lineage</b>.</li><li>Scan <b>data profiling</b> dan <b>data quality</b> (aturan seperti not-null, rentang nilai, keunikan).</li><li>IAM terpusat per lake/zone (data mesh: tim domain memiliki datanya, governance tetap terpusat).</li></ul>`,
`<ol><li>Kelompokkan data per domain bisnis: buat satu lake per domain.</li><li>Di dalamnya, buat <b>raw zone</b> (apa adanya) dan <b>curated zone</b> (bersih, schema ditegakkan).</li><li>Tautkan bucket GCS dan dataset BigQuery yang sudah ada sebagai asset; tidak ada data yang disalin.</li><li>Discovery Dataplex mendaftarkan file sebagai tabel supaya bisa di-query di BigQuery dan dicari di catalog.</li><li>Upgrade tabel lake menjadi <b>BigLake</b> untuk menegakkan keamanan baris/kolom dan membiarkan analis query tanpa izin bucket.</li><li>Tambahkan data quality scan di tabel penting dan kirim alert kalau gagal; pakai lineage untuk melihat apa yang rusak di hilir.</li><li>Beri akses di level lake/zone ke group.</li></ol>`,
`<div class="box pic"><div class="l">Analogi</div>Perpustakaan kota yang tumbuh tanpa rencana: buku tersebar di banyak gedung, sebagian tanpa label. Dataplex adalah sistem pustakawannya: tidak memindahkan buku, tapi memasukkan setiap buku ke satu katalog yang bisa dicari, mengelompokkan gedung menjadi departemen (lake) dan bagian (zone), menandai buku mana yang terbatas aksesnya, dan rutin mengecek tidak ada halaman yang hilang (quality scan). BigLake adalah ruang baca tempat kamu bisa membaca buku terbatas dengan hanya halaman yang diizinkan yang terlihat.</div>`,
`<p>Sebuah bank punya data nasabah di 40 bucket GCS (Parquet dari job Spark) dan 120 dataset BigQuery di 6 project. Auditor bertanya: "Di mana PII nasabah dan siapa yang bisa membacanya? Apakah data transaksi kemarin lengkap?"</p><ul><li>Lake Dataplex: <code>retail-banking</code>, <code>cards</code>, <code>risk</code>; masing-masing dengan raw dan curated zone; bucket dan dataset ditautkan sebagai asset.</li><li>Pencarian catalog + discovery Sensitive Data Protection menemukan kolom PII; ditandai dengan aspect.</li><li>Tabel Parquet diubah jadi BigLake table dengan column-level security di <code>nik</code> dan <code>phone</code>.</li><li>Data quality scan: <code>transaction_id</code> unik, <code>amount</code> tidak null, jumlah baris dalam rentang 10% dari minggu lalu → alert kalau gagal.</li><li>Lineage menunjukkan dashboard mana yang bergantung pada tabel transaksi.</li></ul>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li>"Govern / discover / catalog data lintas banyak bucket dan dataset tanpa memindahkannya" → <mark>Dataplex</mark>.</li><li>"Keamanan fine-grained untuk file di GCS, di-query dari BigQuery, tanpa akses bucket" → <mark>BigLake</mark>.</li><li>Menyalin semua data ke satu project supaya "terpusat" itu jawaban salah; Dataplex mengatur data di tempatnya.</li><li>Fitur Data Catalog sekarang ada di Dataplex Universal Catalog.</li><li>Aturan kualitas data → Dataplex data quality scan (atau assertion Dataform di pipeline).</li><li>External table biasa tidak memberi keamanan baris/kolom; BigLake table bisa.</li></ul></div>`,
`<p>Data lake menyimpan data mentah dan semi-terstruktur dengan murah di Cloud Storage, dan BigLake table memungkinkan BigQuery meng-query-nya dengan keamanan fine-grained dan format terbuka seperti Iceberg. Dataplex Universal Catalog mengatur data menjadi lake, zone, dan asset tanpa memindahkannya, plus menambahkan discovery, pencarian, lineage, profiling, dan data quality scan. Bersama-sama, keduanya membentuk lakehouse yang ter-govern lintas GCS dan BigQuery.</p>`
]);

function domStats(d){
  const qs=quizPool(d); let seen=0,ok=0;
  qs.forEach(q=>{const r=S.quiz[q.id]; if(r){seen++; if(r.last)ok++;}});
  const ls=(dom(d).lessons||[]); const ld=ls.filter(l=>S.lessons[l.id]).length;
  return {total:qs.length,seen,ok,acc:seen?Math.round(ok/seen*100):0,lessons:ls.length,ldone:ld};
}
function readiness(d){
  const s=domStats(d); if(!s.total)return 0;
  const cover=s.seen/s.total, lesson=s.lessons?s.ldone/s.lessons:0;
  return Math.round((0.6*(s.ok/s.total)+0.25*cover+0.15*lesson)*100);
}
function record(q,correct){
  const r=S.quiz[q.id]||{a:0,c:0}; r.a++; if(correct)r.c++; r.last=correct; S.quiz[q.id]=r;
  if(!correct) S.wrong[q.id]=Date.now(); else if(S.wrong[q.id]) { r.fixed=(r.fixed||0)+1; if(r.fixed>=2) delete S.wrong[q.id]; }
  touch();
}

function strikeHint(){return (S.hintN||0)<6?`<p class="muted" style="font-size:13px;margin:-4px 0 4px">💡 ${T("Tip: long-press or tap ✕ to cross out an option","Tip: tekan lama atau ketuk ✕ untuk mencoret pilihan")}</p>`:"";}

function lpStart(e){if(e.target.closest&&e.target.closest(".gl"))return;const b=e.target.closest&&e.target.closest("[data-lp]");if(!b||b.disabled)return;LP.fired=false;clearTimeout(LP.t);
  LP.t=setTimeout(()=>{LP.fired=true;if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}PDEapp.strike(b.dataset.lp,+b.dataset.i);},450);}
function lpEnd(){clearTimeout(LP.t);}
document.addEventListener("touchstart",lpStart,{passive:true});document.addEventListener("mousedown",lpStart);
["touchend","touchmove","touchcancel","mouseup","mouseleave"].forEach(ev=>document.addEventListener(ev,lpEnd,{passive:true}));

function mockAvail(m){

function srcPool(m,d){return D.questions.filter(q=>q.d===d&&!q.case&&(m.source==="mock"?q.mock:true));}
function pickMock(m){
  if(!m.weights){return shuffle(mockPool().filter(q=>!m.domains||m.domains.includes(q.d))).slice(0,m.n);}
  let out=[];
  Object.keys(m.weights).forEach(d=>{let pool=shuffle(srcPool(m,d));
    if(m.source==="adaptive"){const rank=q=>{const r=S.quiz[q.id];if(!r)return 0;if(!r.last)return 1;return 2;};pool.sort((a,b)=>rank(a)-rank(b));}
    out=out.concat(pool.slice(0,m.weights[d]));});
  return shuffle(out);
}

/* Window Playground */
let WP={type:"fixed",late:0};
const EV=[["A",2,3],["A",7,8],["B",4,5],["A",11,12],["B",14,15],["A",24,25],["B",26,27],["B",31,33],["A",38,39],["A",41,58],["B",48,49],["B",52,70]];
function windowsFor(){
  const W=[];
  if(WP.type==="fixed"){for(let s=0;s<60;s+=10)W.push({s,e:s+10,k:null});}
  else if(WP.type==="sliding"){for(let s=-10;s<60;s+=10)W.push({s:Math.max(s,0),e:Math.min(s+20,60),rs:s,k:null});}
  else{ ["A","B"].forEach(k=>{const ts=EV.filter(x=>x[0]===k).map(x=>x[1]).sort((a,b)=>a-b);let cur=null;
      ts.forEach(t=>{if(cur&&t<=cur.last+8){cur.last=t;}else{cur={s:t,last:t,k};W.push(cur);}});});
    W.forEach(w=>{w.e=w.last+8;}); }
  return W;
}
function vWindows(){
  const tt=tl("windows");
  const W=windowsFor(), Lt=WP.late, X2=t=>16+t*5.4;
  const inW=(ev,w)=>(w.k===null||w.k===ev[0])&&ev[1]>=(w.rs!==undefined?w.rs:w.s)&&ev[1]<(w.rs!==undefined?w.rs+20:w.e);
  const status=(ev,w)=>{const wm=ev[2]-2; if(wm<=w.e)return "ok"; if(wm<=w.e+Lt)return "late"; return "drop";};
  W.forEach(w=>{w.items=EV.filter(ev=>inW(ev,w)).map(ev=>({ev,st:status(ev,w)}));});
  const evStatus=ev=>{const s=W.filter(w=>inW(ev,w)).map(w=>status(ev,w)); if(s.every(x=>x==="drop"))return "drop"; if(s.some(x=>x!=="ok"))return "late"; return "ok";};
  const rows = WP.type==="sliding"?W.length:(WP.type==="session"?2:1);
  const H=110+rows*16;
  let svg=`<svg viewBox="0 0 360 ${H}" width="100%" style="display:block">`;
  for(let t=0;t<=60;t+=10) svg+=`<line x1="${X2(t)}" y1="18" x2="${X2(t)}" y2="${H-8}" stroke="var(--line)"/><text x="${X2(t)}" y="12" font-size="9" text-anchor="middle" fill="var(--muted)">${t}m</text>`;
  W.forEach((w,i)=>{const y=WP.type==="sliding"?92+i*16:(WP.type==="session"?(w.k==="A"?92:108):92);
    const col=w.k==="B"?"#db2777":(w.k==="A"?"#4f46e5":"#16a34a");
    svg+=`<rect x="${X2(Math.max(w.rs!==undefined?w.rs:w.s,0))}" y="${y}" width="${Math.max(X2(Math.min(w.rs!==undefined?w.rs+20:w.e,60))-X2(Math.max(w.rs!==undefined?w.rs:w.s,0)),3)}" height="12" rx="4" fill="${col}" opacity=".22" stroke="${col}"/>`;});
  [["A",38],["B",66]].forEach(([k,y])=>{svg+=`<text x="2" y="${y+4}" font-size="10" font-weight="700" fill="var(--muted)">${k}</text>`;
    EV.filter(e=>e[0]===k).forEach(ev=>{const st=evStatus(ev),x=X2(ev[1]),c=k==="A"?"#4f46e5":"#db2777";
      if(st==="drop") svg+=`<text x="${x}" y="${y+5}" font-size="15" font-weight="800" text-anchor="middle" fill="#dc2626">×</text>`;
      else svg+=`<circle cx="${x}" cy="${y}" r="6" fill="${c}" ${st==="late"?'stroke="#f59e0b" stroke-width="3"':''}/>`;
      if(ev[2]-ev[1]>3) svg+=`<text x="${x}" y="${y-10}" font-size="8" text-anchor="middle" fill="#b45309">+${ev[2]-ev[1]}m</text>`;});});
  svg+=`</svg>`;
  const btn=(k,t)=>`<button class="btn ${WP.type===k?"":"ghost"}" style="flex:1;padding:10px 6px;font-size:13px" onclick="PDEapp.wp('type','${k}')">${t}</button>`;
  const lb=(v)=>`<button class="btn ${WP.late===v?"":"ghost"}" style="flex:1;padding:8px 4px;font-size:13px" onclick="PDEapp.wp('late',${v})">${v} ${T("min","mnt")}</button>`;
  const desc={fixed:T("<b>Fixed 10-min windows</b>: equal, non-overlapping buckets. Each event belongs to exactly one window.","<b>Fixed window 10 menit</b>: ember berukuran sama yang tidak saling tumpang tindih. Setiap event masuk tepat ke satu window."),
    sliding:T("<b>Sliding windows</b>: 20-min size, starting every 10 min. Windows overlap, so each event lands in two windows (moving totals).","<b>Sliding window</b>: ukuran 20 menit, mulai setiap 10 menit. Window-nya tumpang tindih, jadi setiap event masuk ke dua window (total bergerak)."),
    session:T("<b>Session windows</b> with an 8-min gap, per user. A window closes once a user is quiet for 8 minutes, so each user gets their own windows.","<b>Session window</b> dengan gap 8 menit, per user. Window ditutup setelah user diam selama 8 menit, jadi setiap user punya window sendiri.")}[WP.type];
  render(`${top(tt.title,"practice")}<p class="muted" style="font-size:14px">${tt.intro}</p>
  <div class="row" style="margin-bottom:8px">${btn("fixed","Fixed")}${btn("sliding","Sliding")}${btn("session","Session")}</div>
  <div class="card" style="padding:10px">${svg}
  <small class="muted">● ${T("on time","tepat waktu")} · <span style="color:#b45309">◯ ${T("late but accepted","telat tapi diterima")}</span> · <span style="color:#dc2626">× ${T("dropped","dibuang")}</span> · <span style="color:#b45309">+Nm</span> = ${T("arrived N min after it happened","tiba N menit setelah kejadian")}</small></div>
  <div class="card"><b>Allowed lateness</b><div class="row" style="margin-top:8px">${lb(0)}${lb(5)}${lb(15)}${lb(30)}</div>
  <p class="muted" style="font-size:13px;margin-bottom:0">${T("The watermark here trails arrival time by 2 minutes. Try 0 min (the default): the delayed events get dropped. Raise it and watch them come back.","Di sini watermark tertinggal 2 menit dari waktu tiba. Coba 0 menit (default): event yang telat dibuang. Naikkan, dan lihat event itu kembali.")}</p></div>
  <div class="box pic"><div class="l">${T("What you're seeing","Yang kamu lihat")}</div>${desc}</div>
  <div class="card"><b>${T("Window results","Hasil per window")}</b><table><tr><th>Window</th><th>${T("Events counted","Event dihitung")}</th><th>${T("Dropped","Dibuang")}</th></tr>
  ${W.map(w=>{const ok=w.items.filter(i=>i.st!=="drop").length,dr=w.items.filter(i=>i.st==="drop").length;const a=w.rs!==undefined?w.rs:w.s,b=w.rs!==undefined?w.rs+20:w.e;
    return `<tr><td>${w.k?w.k+" ":""}${a}–${b}m</td><td>${ok}${w.items.some(i=>i.st==="late")?` <span style="color:#b45309">(${T("incl. late","termasuk telat")})</span>`:""}</td><td style="color:${dr?"#dc2626":"inherit"}">${dr}</td></tr>`}).join("")}</table></div>
  <div class="box brain"><div class="l">Exam brain</div>${T('"Every N minutes" → fixed · "last N, updated every M" → sliding · "until the user goes idle" → session · "late data is missing" → raise allowed lateness.','"Setiap N menit" → fixed · "N terakhir, update tiap M" → sliding · "sampai user idle" → session · "data telat hilang" → naikkan allowed lateness.')}</div>`,"practice");
}

  try{sessionStorage.removeItem(KEY+"-mock");}catch(e){}

/* ---------- study plan & welcome ---------- */
const DORDER=["d3","d2","d1","d4","d5"];
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dplus(s,n){const d=new Date(s+"T00:00");d.setDate(d.getDate()+n);return dstr(d);}
function ddiff(a,b){return Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);}
function fmtDate(s){return new Date(s+"T00:00").toLocaleDateString(ID()?"id-ID":"en-GB",{weekday:"short",day:"numeric",month:"short"});}
function buildPlan(exam){
  const start=today(); const avail=ddiff(start,exam); if(avail<1) return null;
  const reserve = avail>=6?3:(avail>=3?2:1);
  const Ld=Math.max(avail-reserve,0);
  const units=[{t:"read",g:"d0",m:10}];
  DORDER.forEach(d=>{const dm=dom(d);
    units.push({t:"read",g:d,m:Math.round(D.guides[d].sections.length*3.5)});
    dm.lessons.forEach(l=>units.push({t:"lesson",id:l.id,d,m:l.mins+1}));
    units.push({t:"quiz",d,m:Math.round(quizPool(d).length*1.2)});
    units.push({t:"mini",id:"mini-"+d,d,m:15});});
  const days=[];
  if(Ld>0){const total=units.reduce((a,u)=>a+u.m,0), per=total/Ld; let acc=0, di=0;
    for(let i=0;i<Ld;i++) days.push({date:dplus(start,i),items:[]});
    units.forEach(u=>{ if(acc>=per*(di+1)-u.m/2 && di<Ld-1) di++; days[di].items.push(u); acc+=u.m; });
  }
  const fin=[];
  if(reserve>=3){fin.push([{t:"full",id:"full-1",m:120},{t:"weak",m:30}]);fin.push([{t:"full",id:"full-2",m:120},{t:"mistakes",m:20}]);fin.push([{t:"full",id:"full-3",m:120},{t:"pdf",m:15}]);}
  else if(reserve===2){fin.push([{t:"full",id:"full-1",m:120},{t:"weak",m:30}]);fin.push([{t:"full",id:"full-2",m:120},{t:"pdf",m:15}]);}
  else fin.push([{t:"full",id:"full-1",m:120},{t:"pdf",m:15}]);
  fin.forEach((items,k)=>days.push({date:dplus(start,Ld+k),items,final:true}));
  days.forEach(d=>d.items.push({t:"flash",m:10}));
  return {exam,start,days};
}
function ikey(it,date){return [it.t,it.id||it.g||it.d||"",it.t==="flash"||it.t==="mistakes"||it.t==="weak"||it.t==="pdf"?date:""].join(":");}
function idone(it,date){
  if(S.manual&&S.manual[ikey(it,date)]) return true;
  if(it.t==="lesson") return !!S.lessons[it.id];
  if(it.t==="read"){const Gg=D.guides[it.g];return Gg.sections.every((_,i)=>S.read[it.g+"-"+i]);}
  if(it.t==="quiz") return !!(S.qdone&&S.qdone[it.d]);
  if(it.t==="mini"||it.t==="full") return S.mocks.some(m=>m.id===it.id);
  if(it.t==="flash") return !!(S.fdays&&S.fdays[date]);
  return false;
}
function ilabel(it){
  const dm=it.d?dom(it.d):null;
  switch(it.t){
    case "read": return {h:it.g==="d0"?"#gs-d0-0":"#guide-"+it.g,t:it.g==="d0"?T("Read: How to think on exam day","Baca: Cara berpikir saat ujian"):T("Read summary: ","Baca ringkasan: ")+G(it.g).title,s:T("Read","Baca")+" · ~"+it.m+" "+T("min","menit"),c:D.guides[it.g].color,i:"❏"};
    case "lesson": {const l=dm.lessons.find(x=>x.id===it.id);return {h:"#lesson-"+it.id,t:lz(l).title,s:dShort(dm)+" · "+T("lesson","pelajaran")+" "+l.mins+" "+T("min","menit"),c:dm.color,i:dm.n};}
    case "quiz": return {h:"#quiz-"+it.d,t:T("Quiz: ","Kuis: ")+dShort(dm),s:quizPool(it.d).length+" "+T("questions · finish one session","soal · selesaikan satu sesi"),c:"#4f46e5",i:"Q"};
    case "mini": return {h:"#mockintro-"+it.id,t:"Mini mock: "+dShort(dm),s:T("10 questions · 15 min","10 soal · 15 menit"),c:"#171a26",i:"M"};
    case "full": {const m=D.mocks.find(x=>x.id===it.id);return {h:"#mockintro-"+it.id,t:mTitle(m),s:T("50 questions · 2 hours · like the real exam","50 soal · 2 jam · seperti ujian asli"),c:"#171a26",i:"★"};}
    case "weak": return {h:"#progress",t:T("Review your weakest domains","Review domain yang masih lemah"),s:T("Check mock results → re-read those chapters in Read","Lihat hasil mock → baca ulang bab-nya di Baca"),c:"#d97706",i:"↺"};
    case "mistakes": return {h:"#notebook",t:T("Clear the Mistakes notebook","Ulangi Mistakes notebook"),s:T("Until every missed question is gone","Sampai semua soal salah keluar"),c:"#dc2626",i:"✕"};
    case "pdf": return {h:"#read",t:T("Read the cheat sheet (PDF p. 38)","Baca cheat sheet (PDF hal. 38)"),s:T("Then rest. Sleep well!","Lalu istirahat. Tidur cukup!"),c:"#0f766e",i:"✓"};
    case "flash": return {h:"#flash",t:T("Today's flashcards","Flashcards hari ini"),s:T("Cards that are due","Kartu yang jatuh tempo"),c:"#0f766e",i:"FC"};
  }
}
function planToday(){
  const P=S.plan; if(!P) return null; const t=today();
  const idx=P.days.findIndex(d=>d.date===t);
  const behind=[]; P.days.forEach(d=>{if(d.date<t) d.items.forEach(it=>{if(it.t!=="flash"&&!idone(it,d.date)) behind.push({it,date:d.date});});});
  return {idx,day:idx>=0?P.days[idx]:null,behind,examIn:ddiff(t,P.exam)};

function pickRandomLesson(){

/* ---------- glossary & tap-to-explain ---------- */
const GLS = (D.glossary||[]).slice().sort((a,b)=>a.term.localeCompare(b.term));
const GLById = {}; GLS.forEach(e=>GLById[e.id]=e);
const glT = e => ID()?e.txt.id:e.txt.en;
const isCaps = a => /^[A-Z0-9][A-Z0-9\/\-\.]*$/.test(a) && /[A-Z].*[A-Z]|[A-Z][0-9]/.test(a);
const GLA = {}; /* lowercased alias -> [{a,e}] */
GLS.forEach(e=>[...new Set([e.term.replace(/\s*\(.*\)$/,""),...(e.aliases||[])])].forEach(a=>{if(!a||a.length<2)return;(GLA[a.toLowerCase()]=GLA[a.toLowerCase()]||[]).push({a,e});}));
let GLRE=null;
(function(){
  const al=Object.keys(GLA).sort((x,y)=>y.length-x.length).map(a=>a.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&"));
  const body=al.join("|");
  try{GLRE=new RegExp("(?<![A-Za-z0-9_\\-])("+body+")(?![A-Za-z0-9_])","gi");}
  catch(e){GLRE=new RegExp("\\b("+body+")\\b","gi");}
})();
function glMatch(m){const c=GLA[m.toLowerCase()];if(!c)return null;
  for(const x of c){ if(isCaps(x.a)){ if(x.a===m) return x.e; } else return x.e; } return null;}
const GLSKIP="code,pre,script,style,textarea,input,svg,.k,.gl,a.btn,.top,.no-gl,.xbtn,.flip,nav";
function glWrap(root){
  if(S.glOff||!GLRE||!root) return;
  const used=new Set(); const nodes=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!n.nodeValue||n.nodeValue.trim().length<2) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement; if(!p||p.closest(GLSKIP)) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;}});
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue; GLRE.lastIndex=0; let m, last=0, frag=null;
    while((m=GLRE.exec(t))){
      const e=glMatch(m[1]); if(!e||used.has(e.id)) continue;
      used.add(e.id); frag=frag||document.createDocumentFragment();
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      const s=document.createElement("span"); s.className="gl"; s.dataset.g=e.id; s.textContent=m[1]; frag.appendChild(s);
      last=m.index+m[1].length;
    }
    if(frag){ if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(frag,n); }
  });
}

window.addEventListener("hashchange",route);

/* ---------- actions ---------- */
window.PDEapp={
  deepDone(id){S.deepRead=S.deepRead||{};S.deepRead[id]=true;touch();toast(T("Marked as read ✓","Ditandai sudah dibaca ✓"));location.hash="lesson-"+id;},
  glToggle(){S.glOff=!S.glOff;save();route();},
  lang(k){S.lang=k;save();
    const open=document.querySelector(".modal"); if(open){open.remove();}
    if(Q&&location.hash.indexOf("quiz")>-1) vQuiz(); else if(LS&&location.hash.indexOf("lesson-")>-1) vLesson(LS.id); else if(PK&&location.hash.indexOf("tool-")>-1) vPicker(); else route();
    if(open){try{sessionStorage.removeItem(KEY+"-welcomed");}catch(e){} welcome();}},
  exam(v){S.exam=v;save();toast(T("Exam date saved","Tanggal ujian disimpan"));},
  planAsk(){const def=S.exam&&S.exam>today()?S.exam:dplus(today(),14);
    const m=sheet(`<h2>${T("When is your exam?","Kapan ujianmu?")}</h2><p class="muted">${T("I'll spread all the material across the days, then use the last 2–3 days for full mock exams (the last one the day before).","Aku bagi semua materi per hari, lalu 2–3 hari terakhir untuk full mock exam (yang terakhir di H-1).")}</p><input type="date" id="ed" value="${def}" min="${dplus(today(),1)}"><div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" id="c">${T("Cancel","Batal")}</button><button class="btn" style="flex:2" id="s">${T("Build plan","Buat jadwal")}</button></div>`);
    m.querySelector("#c").onclick=()=>m.remove();
    m.querySelector("#s").onclick=()=>{const v=m.querySelector("#ed").value;const P=buildPlan(v);if(!P){toast(T("Pick a date after today","Pilih tanggal setelah hari ini"));return;}S.exam=v;S.plan=P;save();m.remove();toast(T("Plan created: ","Jadwal dibuat: ")+P.days.length+T(" days"," hari"));location.hash="home";route();};},
  planClear(){S.plan=null;save();toast(T("Plan deleted","Jadwal dihapus"));go("home");},
  tick(k){S.manual[k]=!S.manual[k];save();route();},
  strike(mode,i){if(mode==="q"){if(Q.done)return;Q.strike[i]=!Q.strike[i];if(Q.strike[i])Q.sel=Q.sel.filter(x=>x!==i);vQuiz();}
    else{const q=qById(M.list[M.i]);M.strike=M.strike||{};let a=M.strike[q.id]||[];a=a.includes(i)?a.filter(x=>x!==i):[...a,i];M.strike[q.id]=a;
      if(a.includes(i)&&M.ans[q.id])M.ans[q.id]=M.ans[q.id].filter(x=>x!==i);try{sessionStorage.setItem(KEY+"-mock",JSON.stringify(M));}catch(e){}vMock();}},
  rl(){RL=null;},
  caseStart(id){const c=caseById(id);startQuiz(c.qs.map(qById),bl(c.title),"case-"+id,null,id);},
  caseSheet(id){const c=caseById(id);const m=sheet(`<div style="max-height:72vh;overflow:auto"><h2>${bl(c.title)}</h2>${caseBody(c)}</div><button class="btn block" style="margin-top:10px" id="c">${T("Back to the question","Kembali ke soal")}</button>`);m.querySelector("#c").onclick=()=>m.remove();},
  dq(qi,i){DQ.picks[qi]=i;touch();vDuel(DQ.id);},
  reroll(){RL=pickRandomLesson();vRandom();},
  open(i){LS.opened=i;vLesson(LS.id);},
  lstep(n){LS.step+=n;vLesson(LS.id);},
  ldone(id,d){S.lessons[id]=true;touch();toast(T("Lesson complete ✓","Pelajaran selesai ✓"));LS=null;go("d-"+d);},
  pick(i){if(LP.fired){LP.fired=false;return;}const q=qById(Q.list[Q.i]);if(Q.done||Q.strike[i])return;if(q.ans.length>1){Q.sel=Q.sel.includes(i)?Q.sel.filter(x=>x!==i):(Q.sel.length<q.ans.length?[...Q.sel,i]:Q.sel);}else Q.sel=[i];vQuiz();},
  check(){const q=qById(Q.list[Q.i]);Q.done=true;S.hintN=(S.hintN||0)+1;const c=same(Q.sel,q.ans);if(c)Q.score++;else Q.wrong.push(q.id);record(q,c);vQuiz();},
  next(){Q.i++;Q.sel=[];Q.done=false;Q.strike={};vQuiz();},
  retryWrong(){startQuiz(Q.wrong.map(qById),Q.title+" · retry",Q.back);},
  retryAll(){startQuiz(Object.keys(S.wrong).map(qById).filter(Boolean),"Mistakes retry","notebook");},
  flip(){F.flip=!F.flip;vFlash();},
  fc(ok){const id=F.list[F.i];const r=S.flash[id]||{box:0};r.box=ok?Math.min(r.box+1,INT.length-1):0;r.due=addDays(ok?INT[r.box]:1);S.flash[id]=r;S.fdays[today()]=true;if(ok)F.good++;touch();F.i++;F.flip=false;vFlash();},
  flashAll(){F={list:shuffle(D.flash.filter(c=>dom(c.d).ready)).map(c=>c.id),i:0,flip:false,good:0};vFlash();},
  pk(i){const n=D.tools[PK.t].nodes[PK.node];PK.path.push([PK.node,i]);PK.node=n.opts[i][1];vPicker();},
  pkReset(){const t=PK.t;PK={t,node:"start",path:[]};vPicker();},
  tr(k,v){TR[k]=+v;vTransfer();},
  wp(k,v){WP[k]=v;vWindows();},
  gread(g,i,next){S.read[g+"-"+i]=true;touch();if(next)location.hash="gs-"+g+"-"+(i+1);else{toast(T("All chapters done ✓","Semua bab selesai ✓"));location.hash="guide-"+g;}},
  mockStart, mpick(i){if(LP.fired){LP.fired=false;return;}const q=qById(M.list[M.i]);if(((M.strike||{})[q.id]||[]).includes(i))return;let s=M.ans[q.id]||[];if(q.ans.length>1){s=s.includes(i)?s.filter(x=>x!==i):(s.length<q.ans.length?[...s,i]:s);}else s=[i];M.ans[q.id]=s;try{sessionStorage.setItem(KEY+"-mock",JSON.stringify(M));}catch(e){}vMock();},
  mgo(i){M.i=i;vMock();}, mgrid(){vMock(true);},
  mflag(){const id=M.list[M.i];M.flag[id]=!M.flag[id];vMock();},
  msubmitAsk(){const un=M.list.filter(id=>!(M.ans[id]||[]).length).length;const fl=Object.values(M.flag).filter(Boolean).length;
    const m=sheet(`<h3>${T("Submit exam?","Submit ujian?")}</h3><p>${un?`<b>${un}</b> ${T("unanswered","belum dijawab")}. `:""}${fl?`<b>${fl}</b> ${T("flagged","ditandai")}. `:""}${T("You can't change answers after submitting.","Jawaban tidak bisa diubah setelah submit.")}</p><div class="row"><button class="btn ghost" style="flex:1" id="c">${T("Keep going","Lanjut mengerjakan")}</button><button class="btn" style="flex:1" id="s">Submit</button></div>`);
    m.querySelector("#c").onclick=()=>m.remove();m.querySelector("#s").onclick=()=>{m.remove();mockSubmit(false);};},
  backup(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const done=()=>toast(T("Backup code copied","Backup code disalin"));
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,()=>showCode(code));}else showCode(code);},
  restoreAsk(){const m=sheet(`<h3>Restore</h3><p class="muted">${T("Paste a backup code. This replaces the progress on this device.","Paste backup code. Ini akan mengganti progres di perangkat ini.")}</p><textarea id="t"></textarea><div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" id="c">${T("Cancel","Batal")}</button><button class="btn" style="flex:1" id="s">Restore</button></div>`);
    m.querySelector("#c").onclick=()=>m.remove();m.querySelector("#s").onclick=()=>{try{S=Object.assign(blank(),JSON.parse(decodeURIComponent(escape(atob(m.querySelector("#t").value.trim())))));save();m.remove();toast(T("Progress restored","Progres dipulihkan"));route();}catch(e){toast(T("That code didn't work","Kode tidak valid"));}};},
  resetAsk(){const m=sheet(`<h3>${T("Reset everything?","Reset semuanya?")}</h3><p>${T("All quiz history, lessons, flashcards and mock results on this device will be deleted.","Semua riwayat kuis, pelajaran, flashcard dan hasil mock di perangkat ini akan dihapus.")}</p><div class="row"><button class="btn ghost" style="flex:1" id="c">${T("Cancel","Batal")}</button><button class="btn bad" style="flex:1" id="s">Reset</button></div>`);
    m.querySelector("#c").onclick=()=>m.remove();m.querySelector("#s").onclick=()=>{const lg=S.lang;S=blank();S.lang=lg;save();m.remove();route();};}
};
function showCode(code){const m=sheet(`<h3>Backup code</h3><p class="muted">${T("Select all and copy it somewhere safe (e.g. a note).","Pilih semua lalu simpan di tempat aman (misalnya Notes).")}</p><textarea readonly>${esc(code)}</textarea><button class="btn block" style="margin-top:10px" id="c">${T("Done","Selesai")}</button>`);m.querySelector("#c").onclick=()=>m.remove();}

/* resume an unfinished mock after reload */
try{const s=sessionStorage.getItem(KEY+"-mock"); if(s){const o=JSON.parse(s); if(o&&!o.submitted&&o.end>Date.now()){M=o;}}}catch(e){}
route();
setTimeout(welcome,350);
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body></html>
