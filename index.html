Q("d1m09","Privacy","A dataset must be shared with a vendor for model training. Names must be removed, and ZIP codes generalized to the first 3 digits. Which approach?",[

Q("d1m10","IAM","A team needs a custom set of 5 permissions that no predefined role matches exactly, and predefined roles would grant too much. What should you do?",[
 ["Grant Editor","Far too broad."],

Q("d1m11","Network","A company needs encrypted connectivity from a small branch office to Google Cloud this week, with modest bandwidth needs. What's the fastest suitable option?",[
 ["Dedicated Interconnect","Takes weeks to provision and is meant for high bandwidth."],
 ["Cloud VPN (HA VPN)","Correct. Quick to set up, IPsec-encrypted, fine for moderate bandwidth."],
 ["Transfer Appliance","Offline data shipping."],
 ["Public IPs with firewall rules","Not a private, encrypted connection."]],1,null,true),
Q("d1m12","Reliability","Which statement about choosing a DR strategy for data workloads is correct?",[
 ["Always choose the lowest RPO/RTO available","Ignores cost."],
 ["Pick the lowest-cost option that still meets the stated RPO and RTO","Correct. Lower RPO/RTO costs more, so only buy what the requirement needs."],

PDE.guides.d1 = {title:"Designing data processing systems",color:"#4f46e5",intro:"Domain arsitek: siapa boleh akses apa, bagaimana data dilindungi, bagaimana sistem tahan gangguan, dan bagaimana memindahkan data ke Google Cloud.",
sections:[
 S("IAM: siapa boleh apa",
  "Bayangkan IAM sebagai sistem kartu akses gedung. Izin diberikan di level <b>Organization → Folder → Project → Resource</b> dan <mark>diwariskan ke bawah</mark>: izin dari level atas tidak bisa dicabut di level bawah. Berikan <b>predefined role</b> terkecil ke <b>Google Group</b> atau <b>service account</b>, jangan ke orang satu per satu.",
  [["Analis harus bisa query dataset <code>sales</code> tapi tidak boleh mengubah data.","<code>roles/bigquery.dataViewer</code> di dataset + <code>roles/bigquery.jobUser</code> di project.","Membaca tabel dan menjalankan query adalah dua izin terpisah. Ini kombinasi yang sangat sering muncul di soal."],
   ["Pipeline Dataflow perlu menulis ke BigQuery.","Buat <b>service account khusus</b> untuk pipeline itu, beri <code>dataEditor</code> di dataset tujuan.","Satu service account per aplikasi, least privilege, dan tidak pakai akun pribadi."],
   ["Perusahaan wajib menyimpan semua data hanya di region EU.","<b>Organization policy</b> <code>gcp.resourceLocations</code> yang membatasi ke region EU.","Org policy adalah pagar pembatas untuk seluruh organisasi, bukan izin per orang."]],
  [["Predefined role","Role siap pakai dari Google untuk tugas spesifik"],["Basic role","Owner/Editor/Viewer, terlalu luas, hindari"],["Service account","Identitas untuk aplikasi atau pipeline, bukan manusia"],["Workload Identity Federation","Workload luar (AWS, GitHub) bisa akses GCP tanpa file key"],["Org policy","Aturan wajib untuk seluruh organisasi (lokasi, larang public IP, dll.)"]],
  ["BigQuery sekarang bisa diatur sampai level tabel, baris (row-level) dan kolom (policy tags). Catatan lama yang bilang \"hanya level dataset\" sudah usang.","Hindari role <code>bigquery.admin</code> atau Owner di jawaban."]),
 S("Enkripsi & kunci",
  "Semua data di GCP <b>otomatis terenkripsi</b>. Pertanyaannya tinggal siapa yang memegang kuncinya. Kalau soal bilang \"kami harus mengontrol, merotasi, atau mencabut kunci\" → <mark>CMEK lewat Cloud KMS</mark>.",
  [["Auditor minta perusahaan bisa membuat data tidak terbaca kapan saja.","<b>CMEK</b>. Kalau kunci di-disable atau di-destroy, data jadi tidak terbaca (<i>crypto-shredding</i>).","Dengan CMEK, kontrol kunci ada di tanganmu."],
   ["Regulasi: kunci tidak boleh disimpan di Google sama sekali.","<b>Cloud EKM</b>: kunci di key manager eksternal.","EKM = kunci di luar Google."],
   ["Kunci harus di hardware tersertifikasi FIPS 140-2 Level 3.","<b>Cloud HSM</b>.","HSM = CMEK yang kuncinya disimpan di hardware khusus."],
   ["Google sama sekali tidak boleh melihat data mentah.","<b>Client-side encryption</b> sebelum upload.","Data sudah terenkripsi sebelum sampai ke Google."]],
  [["CMEK","Customer-managed key di Cloud KMS, pilihan paling umum"],["CSEK","Customer-supplied key, hanya untuk Cloud Storage &amp; Compute Engine"],["Crypto-shredding","Hancurkan kunci = data tidak bisa dibaca lagi"]],
  ["CSEK <b>tidak didukung BigQuery</b>, jadi jawaban yang menyebut CSEK untuk BigQuery pasti salah."]),
 S("Data pribadi (PII) & DLP",
  "<b>Sensitive Data Protection</b> (dulu Cloud DLP) mencari data sensitif (KTP, kartu kredit, email…) lalu menyamarkannya. Teknik yang dipilih menentukan apa yang masih bisa dilakukan dengan datanya.",
  [["Analis perlu JOIN dan COUNT berdasarkan nomor rekening, tapi tidak boleh melihat nomor aslinya.","<mark>Tokenization deterministik / format-preserving encryption (FPE)</mark>.","Input yang sama selalu jadi token yang sama, jadi JOIN tetap jalan. Bisa dikembalikan ke nilai asli dengan kunci."],
   ["Tampilkan kartu kredit sebagai ****1234 di laporan.","<b>Masking/redaction</b>.","Tidak bisa dikembalikan, dan nilai analitiknya hilang."],
   ["Umur pasien harus disamarkan untuk riset.","<b>Bucketing</b> (34 → 30–39) atau <b>date shifting</b>.","Mengurangi risiko identifikasi ulang, tapi pola datanya tetap ada."],
   ["Ukur seberapa mudah dataset di-identifikasi ulang.","<b>Risk analysis</b> (k-anonymity, l-diversity) di DLP.","DLP juga bisa mengukur risiko, tidak hanya menyamarkan."]],
  [["Redaction / masking","Hapus atau tutupi, permanen"],["Tokenization / FPE","Ganti dengan token yang konsisten dan bisa dibalik"],["Hashing","Konsisten tapi satu arah"],["infoType","Jenis data sensitif yang dideteksi DLP"]],
  ["Pola umum: data masuk ke bucket staging → DLP/Dataflow menyamarkan → hasil bersih ke BigQuery."]),
 S("Perimeter, network, audit & residency",
  "<mark>VPC Service Controls</mark> membuat \"pagar\" di sekitar project. Data BigQuery/GCS tidak bisa dikirim keluar pagar, <b>bahkan oleh orang yang kredensialnya valid</b> (misalnya kredensial yang dicuri).",
  [["Takut ada karyawan atau hacker yang menyalin data BigQuery ke project pribadinya.","<b>VPC Service Controls</b> perimeter.","IAM tidak cukup kalau kredensialnya bocor. VPC-SC mencegah exfiltration."],
   ["VM tanpa public IP perlu akses ke BigQuery/GCS.","<b>Private Google Access</b> di subnet tersebut.","Akses API Google lewat jaringan internal."],
   ["\"Siapa yang membaca tabel gaji minggu lalu?\"","<b>Data Access audit logs</b>, lalu export ke BigQuery lewat log sink.","Untuk BigQuery, data access log aktif secara default."],
   ["Developer tidak sengaja menulis ke tabel production.","Pisahkan <b>project dev / test / prod</b> dengan IAM berbeda.","Pemisahan environment adalah praktik standar Google."]],
  [["Exfiltration","Data dibawa keluar tanpa izin"],["Admin Activity log","Selalu aktif, mencatat perubahan konfigurasi"],["Data Access log","Mencatat siapa membaca data"]],
  ["Lokasi dataset BigQuery tidak bisa diubah setelah dibuat. Kalau perlu pindah, copy ke dataset baru."]),
 S("Reliability, kualitas data & DR",
  "Sistem yang andal tidak kehilangan data, datanya benar, dan cepat pulih kalau ada gangguan. Di soal, kenali istilah <b>RPO</b> (seberapa banyak data boleh hilang) dan <b>RTO</b> (berapa lama boleh down).",
  [["Pastikan tidak ada <code>order_total</code> negatif di tabel hasil transformasi SQL.","<b>Dataform assertions</b>, atau <b>Dataplex data quality scans</b>.","Validasi otomatis sebagai bagian dari pipeline."],
   ["Transaksi ACID global dengan 99.999% availability.","<b>Spanner</b>.","Hanya Spanner yang punya ACID + skala global."],
   ["RPO 24 jam boleh, budget minim.","Backup/snapshot ke region lain.","Paling murah, walaupun RTO-nya tinggi."],
   ["RPO mendekati nol untuk database relasional saat region mati.","Replika lintas region (Cloud SQL cross-region replica) atau Spanner multi-region.","RPO/RTO makin kecil, biayanya makin mahal."]],
  [["RPO","Recovery Point Objective: batas data yang boleh hilang"],["RTO","Recovery Time Objective: batas waktu down"],["ACID","Atomic, Consistent, Isolated, Durable: transaksi yang aman"],["Dataform","Transformasi SQL di BigQuery dengan git, dependency dan test"]],
  ["Pilih opsi DR paling murah yang tetap memenuhi angka RPO/RTO di soal."]),
 S("Portability & multicloud",
  "Google ingin datamu bisa dipakai di mana saja: format terbuka, engine open-source, dan analitik lintas cloud.",
  [["Data Parquet ada di S3 dan secara kontrak tidak boleh dipindah.","<mark>BigQuery Omni</mark> (dengan BigLake tables).","BigQuery yang jalan di AWS/Azure, dekat dengan datanya."],
   ["Lakehouse format Apache Iceberg di GCS dengan security sampai level kolom.","<b>BigLake tables</b>.","Satu lapisan governance di atas file berformat terbuka."],
   ["Tim ingin mencari semua dataset perusahaan beserta pemilik dan lineage-nya.","<b>Dataplex Universal Catalog</b>.","Katalog + metadata + lineage di satu tempat."]],
  [["BigLake","Tabel di atas file terbuka (Parquet/Iceberg) dengan security BigQuery"],["Omni","BigQuery untuk data di AWS/Azure"],["Bronze/silver/gold","Zona raw → curated → siap pakai"]],
  ["Apache Beam bisa jalan di Dataflow, Flink atau Spark. Ini juga termasuk portability."]),
 S("Migrasi data",
  "Analoginya pindahan rumah. Barang sedikit dibawa pakai mobil sendiri (<b>gcloud storage</b>). Satu rumah penuh pakai jasa pindahan terjadwal (<b>Storage Transfer Service</b>). Isi gudang besar dikirim pakai <b>kontainer</b> (<b>Transfer Appliance</b>). Kalau rumahnya masih ditinggali selama pindahan, perlu orang yang menyalin setiap perubahan (<b>Datastream / DMS</b>).",
  [["500 TB data on-prem, bandwidth hanya 100 Mbps.","<mark>Transfer Appliance</mark>.","Lewat jaringan butuh lebih dari 1 tahun. Pakai rumus: <mark>1 TB @100 Mbps ≈ 1 hari</mark>."],
   ["Sinkronisasi harian dari bucket S3 ke GCS.","<b>Storage Transfer Service</b> terjadwal.","Managed, bisa dijadwalkan, dan bisa melanjutkan kalau terputus."],
   ["Migrasi Teradata ke BigQuery.","<b>BigQuery Data Transfer Service</b> (migration).","DTS mendukung Teradata, Redshift dan SaaS seperti Google Ads."],
   ["Pindahkan MySQL production ke Cloud SQL dengan downtime minimal.","<b>Database Migration Service</b>.","Replikasi berkelanjutan, lalu cut-over."],
   ["Replikasi perubahan Oracle ke BigQuery hampir real-time untuk analitik.","<mark>Datastream</mark> (CDC).","Change data capture serverless."],
   ["Koneksi on-prem ke GCP yang privat dan ber-throughput tinggi.","<b>Dedicated Interconnect</b>. VPN untuk kebutuhan cepat dan volume sedang.","Interconnect = link fisik 10/100 Gbps."]],
  [["CDC","Change data capture: menyalin setiap perubahan database"],["Lift &amp; shift","Pindah apa adanya, minim perubahan"],["Cut-over","Momen memindahkan traffic ke sistem baru"]],
  ["Urutan migrasi: assess → plan → migrate → validate (row count, checksum) → optimize.","Hadoop → Dataproc · Kafka → Managed Kafka/Pub/Sub · HBase → Bigtable · Airflow → Composer."])
]};

PDE.guides.d2 = {title:"Ingesting & processing the data",color:"#0891b2",intro:"Domain terbesar (25%). Bagaimana data masuk (Pub/Sub, Datastream), diproses (Dataflow, Dataproc), dan diorkestrasi (Composer).",
sections:[
 S("Peta pipeline & pilih engine",
  "Pola streaming standar: <mark>Pub/Sub → Dataflow → BigQuery</mark> (analitik) dan/atau Bigtable (serving cepat). Pola batch: GCS → Dataflow/Dataproc → BigQuery, atau cukup <b>load job + SQL</b>.",
  [["300 Spark job on-prem mau dipindah cepat tanpa rewrite.","<mark>Dataproc</mark>.","Managed Spark/Hadoop, cocok untuk lift &amp; shift."],
   ["Pipeline baru, logika sama untuk batch dan streaming, tim kecil.","<mark>Dataflow</mark> (Apache Beam).","Serverless, autoscaling, satu codebase."],
   ["Tim ETL tidak bisa coding, sumbernya Salesforce, Oracle dan SFTP.","<b>Cloud Data Fusion</b>.","Drag-and-drop dengan banyak connector."],
   ["File CSV harian masuk ke GCS, cukup dimuat ke BigQuery.","<b>BigQuery load job</b> (atau DTS dari GCS).","Jangan berlebihan pakai Dataflow kalau tidak ada transformasi."]],
  [["ELT","Load dulu, transformasi di BigQuery dengan SQL"],["Serverless","Tidak perlu mengurus server atau cluster"]],
  ["Existing Spark → Dataproc · baru/serverless → Dataflow · no-code → Data Fusion · data sudah di BQ → SQL/Dataform"]),
 S("Pub/Sub",
  "Pub/Sub itu kantor pos. Publisher kirim surat ke <b>topic</b>. Setiap <b>subscription</b> dapat <b>salinan sendiri</b> dari semua surat. Subscriber harus tanda tangan (<b>ack</b>) sebelum batas waktu (<b>ack deadline</b>), kalau tidak, suratnya dikirim ulang.",
  [["Tim fraud dan tim analytics sama-sama butuh semua pesan.","<mark>Dua subscription</mark>.","Kalau satu subscription dipakai bersama, pesannya dibagi-bagi, bukan disalin."],
   ["Banyak pesan duplikat.","Subscriber terlambat ack. <b>Perpanjang ack deadline</b> dan buat proses idempotent (dedupe pakai ID).","Default-nya <mark>at-least-once</mark>, dan ack yang terlambat memicu pengiriman ulang."],
   ["Pesan per customer harus diproses berurutan.","<b>Ordering keys</b> (key = customer_id).","Urutan terjamin per key, throughput tetap tinggi."],
   ["Deploy subscriber baru yang mungkin bug, dan mau bisa proses ulang.","Buat <b>snapshot</b> dulu, lalu <mark>seek</mark> ke snapshot itu kalau perlu.","Seek ke snapshot atau timestamp = replay."],
   ["Satu pesan rusak membuat subscriber crash terus-menerus.","<b>Dead-letter topic</b>.","Setelah N kali gagal, pesan dipindah ke topic lain dan tidak memblokir."],
   ["Pesan langsung masuk ke tabel BigQuery tanpa transformasi.","<mark>BigQuery subscription</mark>.","Tidak perlu Dataflow."]],
  [["Pull","Subscriber yang mengambil pesan (Dataflow pakai ini)"],["Push","Pub/Sub POST ke endpoint HTTPS (Cloud Run)"],["Backlog","Pesan yang belum di-ack; pantau oldest_unacked_message_age"],["Managed Kafka","Kafka asli tanpa urus broker, untuk aplikasi Kafka yang sudah ada"]],
  ["Pub/Sub Lite sudah mati. Exactly-once delivery tersedia untuk pull subscription."]),
 S("Apache Beam: building blocks",
  "Dataflow menjalankan kode <b>Apache Beam</b>. Datanya disebut <b>PCollection</b>, setiap langkahnya disebut <b>transform</b>.",
  [["Setiap transaksi perlu di-enrich dengan tabel tier customer berukuran 5 MB.","<mark>Side input</mark>.","Data kecil dibagikan ke semua worker. Jangan query database untuk setiap elemen."],
   ["Join stream orders dan payments berdasarkan order_id.","<b>CoGroupByKey</b>.","Ini cara join di Beam."],
   ["0,1% record gagal di-parse dan membuat job gagal.","<mark>Tagged output → dead-letter</mark> table/bucket.","Data valid tetap jalan, yang rusak disimpan untuk dicek."],
   ["Total penjualan per toko lambat karena GroupByKey lalu dijumlah manual.","<b>Combine.perKey</b>.","Agregasi parsial sebelum shuffle, jadi lebih cepat."]],
  [["PCollection","Dataset terdistribusi (bounded = batch, unbounded = stream)"],["ParDo / DoFn","Proses per elemen"],["DirectRunner","Menjalankan pipeline secara lokal untuk testing"]],
  []),
 S("Waktu, window & trigger",
  "<b>Event time</b> = kapan kejadiannya. <b>Processing time</b> = kapan sampai di server. Untuk analitik yang benar, kelompokkan berdasarkan <mark>event time</mark>. <b>Watermark</b> adalah perkiraan Dataflow bahwa semua data sampai waktu T sudah masuk.",
  [["Hitung login gagal per 5 menit, tanpa overlap.","<mark>Fixed window</mark> 5 menit.","Kata kuncinya \"every N minutes\"."],
   ["Rata-rata harga 30 menit terakhir, di-update tiap menit.","<mark>Sliding window</mark> (size 30, period 1).","Moving average."],
   ["Kelompokkan klik user sampai dia idle 20 menit.","<mark>Session window</mark> dengan gap 20 menit.","Per key, ditutup setelah tidak ada aktivitas."],
   ["Event telat sampai 2 jam tapi hilang dari hasil.","Window berdasarkan event time + <mark>allowed lateness</mark> 2 jam.","Default allowed lateness = 0, jadi data telat dibuang."],
   ["Dashboard butuh angka sementara tiap menit, lalu angka final.","Early trigger berbasis processing time + trigger watermark, mode <b>accumulating</b>.","Accumulating = setiap update berisi total lengkap."]],
  [["Watermark","Perkiraan kelengkapan data"],["Trigger","Kapan hasil window dikeluarkan"],["Allowed lateness","Batas toleransi data telat"],["Accumulating vs discarding","Total penuh vs hanya bagian baru"]],
  ["Coba tool <b>Window Playground</b> di tab Practice."]),
 S("Dataflow di production",
  "Yang paling sering keluar di soal: cara deploy dan menghentikan job streaming tanpa kehilangan data.",
  [["Fix bug kompatibel di job streaming, state harus tetap ada.","<mark>--update</mark> dengan nama job yang sama.","Mengganti kode tanpa kehilangan state."],
   ["Perubahan tidak kompatibel (window diganti), tidak boleh ada data hilang.","<mark>Drain</mark>, lalu jalankan job baru.","Drain menyelesaikan data in-flight. Cancel membuang data in-flight."],
   ["Analis mau menjalankan pipeline sendiri dengan parameter.","<b>Flex Template</b>.","Bisa dijalankan dari console tanpa menyentuh kode."],
   ["Satu negara menghasilkan 70% traffic dan satu worker kewalahan.","<b>Hot key</b> → <code>withHotKeyFanout</code>.","Menambah worker tidak menyelesaikan masalah hot key."],
   ["Lag naik karena memanggil API eksternal per elemen.","Batch request-nya (<code>GroupIntoBatches</code>) atau pakai cache.","Round-trip jauh lebih sedikit."],
   ["Worker tidak boleh punya public IP.","<code>--no_use_public_ips</code> + Private Google Access.","Akses API Google lewat jalur privat."],
   ["Batch mingguan tidak mendesak dan mau lebih murah.","<b>FlexRS</b>.","Diskon karena jadwal mulainya fleksibel."]],
  [["System lag / data freshness","Metrik ketertinggalan pipeline"],["Streaming Engine","State dipindah dari worker ke service"],["Storage Write API","Sink BigQuery yang mendukung exactly-once"]],
  ["Update = kompatibel · Drain = aman · Cancel = data in-flight hilang"]),
 S("Dataproc",
  "Analoginya sewa mobil per perjalanan. Buat cluster untuk satu job, jalankan, lalu hapus. Barang bawaanmu (data) disimpan di rumah, yaitu <mark>Cloud Storage, bukan HDFS</mark>.",
  [["Cluster menyala 24/7 padahal job cuma 2 jam per malam.","<mark>Ephemeral cluster</mark> + workflow template / scheduled deletion.","Bayar hanya saat dipakai. Billing per detik."],
   ["Mau hemat tanpa risiko kehilangan data.","<b>Spot/preemptible secondary workers</b>. Primary worker tetap standar.","Secondary worker hanya untuk compute, jadi aman kalau hilang."],
   ["Semua node perlu library Python khusus.","<mark>Initialization actions</mark>.","Script yang otomatis jalan di setiap node saat cluster dibuat."],
   ["Tim data science mau PySpark tanpa urus cluster.","<b>Serverless for Apache Spark</b>.","Tidak ada cluster sama sekali."],
   ["Notebook interaktif harus tetap jalan kalau master node mati.","<b>High-availability mode</b> (3 master).","Cluster tetap hidup walau satu master gagal."]],
  [["HDFS","File system milik cluster, ikut hilang saat cluster dihapus"],["Metastore","Katalog Hive yang bisa dipakai bersama oleh banyak cluster"],["Component Gateway","Akses aman ke UI YARN/Spark/Jupyter"]],
  []),
 S("Tool lain & orkestrasi",
  "Pilih orkestrator sesuai kompleksitas: <mark>Composer</mark> untuk DAG kompleks, <b>Workflows</b> untuk rangkaian API yang ringan, <b>Scheduler</b> untuk cron, <b>Eventarc</b> untuk trigger berbasis event.",
  [["Setiap malam: Dataproc → load BigQuery → quality check, dengan retry, alert dan backfill.","<mark>Cloud Composer</mark> (managed Airflow).","Dependency + retry + backfill antar service."],
   ["Panggil 3 API berurutan beberapa kali sehari, semurah mungkin.","<b>Workflows</b>.","Serverless, bayar per step."],
   ["Proses harus jalan begitu ada file masuk ke bucket.","<b>Eventarc</b> → Cloud Run function → jalankan Dataflow template.","Berbasis event, tanpa polling."],
   ["Transformasi SQL di BigQuery dengan version control dan test.","<b>Dataform</b>.","SQLX + assertions + git."],
   ["Replika PostgreSQL ke BigQuery dengan lag beberapa menit.","<mark>Datastream</mark>.","CDC serverless."],
   ["Testing otomatis lalu promosi pipeline dari dev ke prod.","<b>Cloud Build</b> → Artifact Registry → deploy ke project dev lalu prod.","CI/CD dengan environment terpisah."]],
  [["DAG","Directed acyclic graph: rangkaian task beserta dependency-nya"],["Sensor","Task Airflow yang menunggu kondisi tertentu (misalnya file sudah ada)"],["Idempotent","Kalau dijalankan ulang, hasilnya tetap sama"]],
  [])
]};

PDE.guides.d3 = {title:"Storing the data",color:"#16a34a",intro:"Memilih database yang tepat adalah skill yang paling sering diuji. Kuasai pohon keputusannya, maka sepertiga ujian jadi lebih mudah.",
sections:[
 S("Pohon keputusan storage",
  "Tanyakan berurutan: file? analitik? OLTP relasional? NoSQL skala besar? dokumen app? cache?",
  [["Simpan video, log mentah, backup.","<mark>Cloud Storage</mark>.","Object storage, kapasitas tak terbatas."],
   ["SQL di atas 300 TB data untuk dashboard.","<mark>BigQuery</mark>.","Data warehouse serverless skala petabyte."],
   ["Backend aplikasi web, MySQL, satu region.","<b>Cloud SQL</b>.","OLTP relasional yang di-manage."],

/* PDE Academy — single-file offline app. Data in window.PDE (domains, lessons, questions, flashcards, tools). */
(function(){
"use strict";
const D = window.PDE;
const KEY = "pde-academy-v1";
const $ = s => document.querySelector(s);
const app = $("#app");

/* ---------- state ---------- */
let mem = null;
function blank(){return {quiz:{},lessons:{},wrong:{},flash:{},days:[],exam:"",mocks:[],flags:{},read:{}};}
function load(){
  try{const s=localStorage.getItem(KEY); if(s){const o=JSON.parse(s); return Object.assign(blank(),o);} }catch(e){}
  return mem || blank();
}
let S = load();
function save(){ mem=S; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function touch(){const t=today(); if(!S.days.includes(t)){S.days.push(t); if(S.days.length>400)S.days.shift();} save();}
function streak(){
  const set=new Set(S.days); let n=0; const d=new Date();
  if(!set.has(today())) d.setDate(d.getDate()-1);
  while(true){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(set.has(k)){n++;d.setDate(d.getDate()-1);} else break;}
  return n;
}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1900);}

/* ---------- helpers ---------- */
const dom = id => D.domains.find(d=>d.id===id);
const qById = id => D.questions.find(q=>q.id===id);
const quizPool = d => D.questions.filter(q=>q.d===d && !q.mock);
const mockPool = () => D.questions.filter(q=>q.mock);
const L = "ABCDEFGH";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function top(title,backTo){return `<div class="top"><button class="back" onclick="location.hash='${backTo}'" aria-label="Back">‹</button><div class="t">${title}</div></div>`;}
function domStats(d){
  const qs=quizPool(d); let seen=0,ok=0;
  qs.forEach(q=>{const r=S.quiz[q.id]; if(r){seen++; if(r.last)ok++;}});
  const ls=(dom(d).lessons||[]); const ld=ls.filter(l=>S.lessons[l.id]).length;
  return {total:qs.length,seen,ok,acc:seen?Math.round(ok/seen*100):0,lessons:ls.length,ldone:ld};
}
function readiness(d){
  const s=domStats(d); if(!s.total)return 0;
  const cover=s.seen/s.total, lesson=s.lessons?s.ldone/s.lessons:0;
  return Math.round((0.6*(s.ok/s.total)+0.25*cover+0.15*lesson)*100);
}
function record(q,correct){
  const r=S.quiz[q.id]||{a:0,c:0}; r.a++; if(correct)r.c++; r.last=correct; S.quiz[q.id]=r;
  if(!correct) S.wrong[q.id]=Date.now(); else if(S.wrong[q.id]) { r.fixed=(r.fixed||0)+1; if(r.fixed>=2) delete S.wrong[q.id]; }
  touch();
}
function nav(cur){
  const it=[["home","⌂","Home"],["read","❏","Read"],["learn","▤","Learn"],["practice","✎","Practice"],["notebook","✕","Mistakes"]];
  return `<nav class="bn">${it.map(([h,i,t])=>`<a href="#${h}" class="${cur===h?"on":""}"><span class="i">${i}</span>${t}</a>`).join("")}</nav>`;
}
function render(html,cur){app.innerHTML=`<main>${html}</main>${nav(cur)}`; window.scrollTo(0,0);}

/* ---------- views ---------- */
function vHome(){
  const days = S.exam ? Math.ceil((new Date(S.exam+"T09:00")-new Date())/864e5) : null;
  const wrongN=Object.keys(S.wrong).length, due=dueCards().length;
  const nextL = nextLesson();

function vQuiz(){
  if(!Q) return go("practice");
  if(Q.i>=Q.list.length) return vQuizEnd();
  const q=qById(Q.list[Q.i]); const multi=q.ans.length>1; const d=dom(q.d);
  const opts=q.opts.map((o,i)=>{
    let cls=Q.sel.includes(i)?"sel":"";

    return `<button class="opt ${cls}" ${Q.done?"disabled":""} onclick="PDEapp.pick(${i})"><span class="k">${L[i]}</span><span>${o.t}${Q.done?`<span class="why">${o.w}</span>`:""}</span></button>`;}).join("");
  const correct = Q.done && same(Q.sel,q.ans);
  render(`${top(Q.title,Q.back)}

  ${opts}

  <div class="sticky">${Q.done?`<button class="btn block" onclick="PDEapp.next()">${Q.i+1===Q.list.length?"See results":"Next question"}</button>`:
     `<button class="btn block" ${Q.sel.length===q.ans.length?"":"disabled"} onclick="PDEapp.check()">Check answer</button>`}</div>`,"practice");
}
function same(a,b){return a.length===b.length&&a.every(x=>b.includes(x));}

/* Window Playground */
let WP={type:"fixed",late:0};
const EV=[["A",2,3],["A",7,8],["B",4,5],["A",11,12],["B",14,15],["A",24,25],["B",26,27],["B",31,33],["A",38,39],["A",41,58],["B",48,49],["B",52,70]];
function windowsFor(){
  const W=[];
  if(WP.type==="fixed"){for(let s=0;s<60;s+=10)W.push({s,e:s+10,k:null});}
  else if(WP.type==="sliding"){for(let s=-10;s<60;s+=10)W.push({s:Math.max(s,0),e:Math.min(s+20,60),rs:s,k:null});}
  else{ ["A","B"].forEach(k=>{const ts=EV.filter(x=>x[0]===k).map(x=>x[1]).sort((a,b)=>a-b);let cur=null;
      ts.forEach(t=>{if(cur&&t<=cur.last+8){cur.last=t;}else{cur={s:t,last:t,k};W.push(cur);}});});
    W.forEach(w=>{w.e=w.last+8;}); }
  return W;
}
function vWindows(tool){
  const W=windowsFor(), L=WP.late, X=t=>16+t*5.4;
  const inW=(ev,w)=>(w.k===null||w.k===ev[0])&&ev[1]>=(w.rs!==undefined?w.rs:w.s)&&ev[1]<(w.rs!==undefined?w.rs+20:w.e);
  const status=(ev,w)=>{const wm=ev[2]-2; if(wm<=w.e)return "ok"; if(wm<=w.e+L)return "late"; return "drop";};
  W.forEach(w=>{w.items=EV.filter(ev=>inW(ev,w)).map(ev=>({ev,st:status(ev,w)}));});
  const evStatus=ev=>{const s=W.filter(w=>inW(ev,w)).map(w=>status(ev,w)); if(s.every(x=>x==="drop"))return "drop"; if(s.some(x=>x!=="ok"))return "late"; return "ok";};
  const rows = WP.type==="sliding"?W.length:(WP.type==="session"?2:1);
  const H=110+rows*16;
  let svg=`<svg viewBox="0 0 360 ${H}" width="100%" style="display:block">`;
  for(let t=0;t<=60;t+=10) svg+=`<line x1="${X(t)}" y1="18" x2="${X(t)}" y2="${H-8}" stroke="var(--line)"/><text x="${X(t)}" y="12" font-size="9" text-anchor="middle" fill="var(--muted)">${t}m</text>`;
  W.forEach((w,i)=>{const y=WP.type==="sliding"?92+i*16:(WP.type==="session"?(w.k==="A"?92:108):92);
    const col=w.k==="B"?"#db2777":(w.k==="A"?"#4f46e5":"#16a34a");
    svg+=`<rect x="${X(Math.max(w.rs!==undefined?w.rs:w.s,0))}" y="${y}" width="${Math.max(X(Math.min(w.rs!==undefined?w.rs+20:w.e,60))-X(Math.max(w.rs!==undefined?w.rs:w.s,0)),3)}" height="12" rx="4" fill="${col}" opacity=".22" stroke="${col}"/>`;});
  [["A",38],["B",66]].forEach(([k,y])=>{svg+=`<text x="2" y="${y+4}" font-size="10" font-weight="700" fill="var(--muted)">${k}</text>`;
    EV.filter(e=>e[0]===k).forEach(ev=>{const st=evStatus(ev),x=X(ev[1]),c=k==="A"?"#4f46e5":"#db2777";
      if(st==="drop") svg+=`<text x="${x}" y="${y+5}" font-size="15" font-weight="800" text-anchor="middle" fill="#dc2626">×</text>`;
      else svg+=`<circle cx="${x}" cy="${y}" r="6" fill="${c}" ${st==="late"?'stroke="#f59e0b" stroke-width="3"':''}/>`;
      if(ev[2]-ev[1]>3) svg+=`<text x="${x}" y="${y-10}" font-size="8" text-anchor="middle" fill="#b45309">+${ev[2]-ev[1]}m</text>`;});});
  svg+=`</svg>`;
  const btn=(k,t)=>`<button class="btn ${WP.type===k?"":"ghost"}" style="flex:1;padding:10px 6px;font-size:13px" onclick="PDEapp.wp('type','${k}')">${t}</button>`;
  const lb=(v)=>`<button class="btn ${WP.late===v?"":"ghost"}" style="flex:1;padding:8px 4px;font-size:13px" onclick="PDEapp.wp('late',${v})">${v} min</button>`;
  const desc={fixed:"<b>Fixed 10-min windows</b>: equal, non-overlapping buckets. Each event belongs to exactly one window.",sliding:"<b>Sliding windows</b>: 20-min size, starting every 10 min. Windows overlap, so each event lands in two windows (moving totals).",session:"<b>Session windows</b> with an 8-min gap, per user. A window closes once a user is quiet for 8 minutes, so each user gets their own windows."}[WP.type];
  render(`${top(tool.title,"practice")}<p class="muted" style="font-size:14px">${tool.intro}</p>
  <div class="row" style="margin-bottom:8px">${btn("fixed","Fixed")}${btn("sliding","Sliding")}${btn("session","Session")}</div>
  <div class="card" style="padding:10px">${svg}
  <small class="muted">● on time · <span style="color:#b45309">◯ late but accepted</span> · <span style="color:#dc2626">× dropped</span> · <span style="color:#b45309">+Nm</span> = arrived N min after it happened</small></div>
  <div class="card"><b>Allowed lateness</b><div class="row" style="margin-top:8px">${lb(0)}${lb(5)}${lb(15)}${lb(30)}</div>
  <p class="muted" style="font-size:13px;margin-bottom:0">The watermark here trails arrival time by 2 minutes. Try 0 min (the default): the delayed events get dropped. Raise it and watch them come back.</p></div>
  <div class="box pic"><div class="l">What you're seeing</div>${desc}</div>
  <div class="card"><b>Window results</b><table><tr><th>Window</th><th>Events counted</th><th>Dropped</th></tr>
  ${W.map(w=>{const ok=w.items.filter(i=>i.st!=="drop").length,dr=w.items.filter(i=>i.st==="drop").length;const a=w.rs!==undefined?w.rs:w.s,b=w.rs!==undefined?w.rs+20:w.e;
    return `<tr><td>${w.k?w.k+" ":""}${a}–${b}m</td><td>${ok}${w.items.some(i=>i.st==="late")?` <span style="color:#b45309">(incl. late)</span>`:""}</td><td style="color:${dr?"#dc2626":"inherit"}">${dr}</td></tr>`}).join("")}</table></div>
  <div class="box brain"><div class="l">Exam brain</div>"Every N minutes" → fixed · "last N, updated every M" → sliding · "until the user goes idle" → session · "late data is missing" → raise allowed lateness.</div>`,"practice");
}
function vPicker(tool){
  
  const n=tool.nodes[PK.node];
  if(n.result){
    return render(`${top(tool.title,"practice")}
    <div class="result" style="background:${n.color||"var(--d3)"}"><small style="opacity:.85">Your answer</small><h2>${n.result}</h2><p style="margin:0;opacity:.95">${n.why}</p></div>
    ${n.keys?`<div class="box brain"><div class="l">Exam keywords</div>${n.keys}</div>`:""}
    ${n.trap?`<div class="box trap"><div class="l">Trap</div>${n.trap}</div>`:""}
    <div class="card"><b>Your path</b><ul>${PK.path.map(p=>`<li>${p}</li>`).join("")}</ul></div>
    <button class="btn block" onclick="PDEapp.pkReset()">Try another scenario</button>`,"practice");
  }
  render(`${top(tool.title,"practice")}<p class="muted">${tool.intro}</p>
  <div class="card pk"><div class="pill">Step ${PK.path.length+1}</div><h2 style="margin-top:8px">${n.q}</h2>${n.hint?`<p class="muted">${n.hint}</p>`:""}
  ${n.opts.map((o,i)=>`<button class="opt" onclick="PDEapp.pk(${i})"><span class="k">${L[i]}</span><span>${o[0]}</span></button>`).join("")}</div>
  ${PK.path.length?`<button class="btn ghost block" onclick="PDEapp.pkReset()">Start over</button>`:""}`,"practice");
}
let TR={tb:100,mbps:1000};
function vTransfer(tool){
  const secs=TR.tb*8e12/(TR.mbps*1e6*0.8); const days=secs/86400;
  let rec,why;
  if(days>30){rec="Transfer Appliance";why="Over a month on the wire. Ship the data physically instead."}
  else if(TR.tb<1){rec="gcloud storage cp (parallel)";why="Small enough for a direct command-line copy."}
  else {rec="Storage Transfer Service";why="Manageable over the network. Use a managed, scheduled, resumable transfer."}
  render(`${top(tool.title,"practice")}<p class="muted">${tool.intro}</p>
  <div class="card"><label><b>Data size: ${TR.tb} TB</b></label><input type="range" min="0.1" max="2000" step="0.1" value="${TR.tb}" style="width:100%" oninput="PDEapp.tr('tb',this.value)">
  <label><b>Bandwidth: ${TR.mbps>=1000?(TR.mbps/1000)+" Gbps":TR.mbps+" Mbps"}</b></label><input type="range" min="10" max="100000" step="10" value="${TR.mbps}" style="width:100%" oninput="PDEapp.tr('mbps',this.value)"></div>
  <div class="result" style="background:#0891b2"><small style="opacity:.85">At ~80% link utilisation this takes</small><h2>${days<1?(days*24).toFixed(1)+" hours":days.toFixed(1)+" days"}</h2><p style="margin:0"><b>${rec}</b>: ${why}</p></div>
  <div class="box brain"><div class="l">Rule of thumb</div>1 TB over 100 Mbps ≈ 1 day. 100 TB over 100 Mbps ≈ 3 months → Transfer Appliance. Exam questions give you size + bandwidth so you'll do this math.</div>`,"practice");
}

/* mock exam engine */
let M=null, MT=null;
function vMockIntro(id){
  const m=D.mocks.find(x=>x.id===id); if(!m||!mockAvail(m)) return go("practice");
  if(M&&!M.submitted&&M.id===id) return vMock();
  const past=S.mocks.filter(x=>x.id===id);
  render(`${top(m.title,"practice")}
  <div class="card"><h2>Exam rules</h2><ul><li><b>${m.n} questions</b>, <b>${m.min} minutes</b>, timer runs even if you leave the page.</li><li>No feedback until you submit, just like the real exam.</li><li>Flag questions to come back to. Unanswered = wrong.</li><li>Results are broken down by domain at the end.</li></ul>
  ${past.length?`<p class="muted">Previous attempts: ${past.map(p=>p.pct+"%").join(", ")}</p>`:""}
  <button class="btn block" onclick="PDEapp.mockStart('${id}')">Start exam</button></div>`,"practice");
}
function mockStart(id){
  const m=D.mocks.find(x=>x.id===id);
  const pool=mockPool().filter(q=>!m.domains||m.domains.includes(q.d));
  M={id,list:shuffle(pool).slice(0,m.n).map(q=>q.id),i:0,ans:{},flag:{},end:Date.now()+m.min*60000,title:m.title,submitted:false};
  try{sessionStorage.setItem(KEY+"-mock",JSON.stringify(M));}catch(e){}
  vMock();
}
function tick(){
  if(!M||M.submitted){clearInterval(MT);MT=null;return;}
  const left=M.end-Date.now(); const el=$("#timer");
  if(left<=0){clearInterval(MT);MT=null;mockSubmit(true);return;}
  if(el){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.className="timer"+(left<300000?" low":"");}
}
function vMock(showGrid){
  if(!M) return go("practice");
  if(M.submitted) return vMockResult();
  const q=qById(M.list[M.i]); const sel=M.ans[q.id]||[]; const multi=q.ans.length>1;
  const answered=Object.keys(M.ans).filter(k=>(M.ans[k]||[]).length).length;
  render(`<div class="top"><div class="t">${M.title}</div><span id="timer" class="timer">--:--</span></div>
  <div class="qmeta"><span>Question ${M.i+1} of ${M.list.length} · ${answered} answered</span><button class="flag ${M.flag[q.id]?"on":""}" onclick="PDEapp.mflag()">${M.flag[q.id]?"⚑ Flagged":"⚐ Flag"}</button></div>
  <div class="qstem">${q.q}</div>${multi?`<p class="muted" style="margin-top:-6px"><b>Choose ${q.ans.length}.</b></p>`:""}
  ${q.opts.map((o,i)=>`<button class="opt ${sel.includes(i)?"sel":""}" onclick="PDEapp.mpick(${i})"><span class="k">${L[i]}</span><span>${o.t}</span></button>`).join("")}
  <div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" ${M.i===0?"disabled":""} onclick="PDEapp.mgo(${M.i-1})">‹ Prev</button><button class="btn ghost" style="flex:1" onclick="PDEapp.mgrid()">All</button><button class="btn" style="flex:1" ${M.i===M.list.length-1?"disabled":""} onclick="PDEapp.mgo(${M.i+1})">Next ›</button></div>
  ${showGrid?`<div class="card"><b>Jump to question</b><div class="navgrid">${M.list.map((id,i)=>`<button class="${(M.ans[id]||[]).length?"ans":""} ${M.flag[id]?"fl":""} ${i===M.i?"cur":""}" onclick="PDEapp.mgo(${i})">${i+1}</button>`).join("")}</div><small class="muted">Grey = answered · yellow = flagged</small></div>`:""}
  <button class="btn block ${answered===M.list.length?"good":"ghost"}" style="margin-top:14px" onclick="PDEapp.msubmitAsk()">Submit exam</button>`,"practice");
  if(!MT) MT=setInterval(tick,1000); tick();
}
function mockSubmit(auto){
  M.submitted=true; clearInterval(MT); MT=null;
  const by={}; let ok=0;
  M.list.forEach(id=>{const q=qById(id); const c=same(M.ans[id]||[],q.ans); if(c)ok++; by[q.d]=by[q.d]||{n:0,ok:0}; by[q.d].n++; if(c)by[q.d].ok++; record(q,c);});
  M.score=ok; M.by=by; M.pct=Math.round(ok/M.list.length*100);
  S.mocks.push({id:M.id,date:today(),pct:M.pct,ok,n:M.list.length,by}); save();
  try{sessionStorage.removeItem(KEY+"-mock");}catch(e){}
  if(auto) toast("Time's up! Exam submitted.");
  vMockResult();
}
function vMockResult(){
  const pass=M.pct>=70;
  render(`${top("Results","practice")}
  <div class="card" style="text-align:center;background:${pass?"var(--goodl)":"var(--badl)"}"><div style="font-size:54px;font-weight:800">${M.pct}%</div><p><b>${M.score}/${M.list.length}</b> correct · ${pass?"Likely pass zone (≈70%+)":"Below the ≈70% pass zone"}</p></div>
  <div class="card"><b>By domain</b>${Object.keys(M.by).map(d=>{const x=M.by[d];const p=Math.round(x.ok/x.n*100);return `<div style="margin:8px 0"><div class="row"><span style="flex:1;font-size:14px">${dom(d).n}. ${dom(d).short}</span><small>${x.ok}/${x.n}</small></div><div class="bar"><i style="width:${p}%;background:${dom(d).color}"></i></div></div>`}).join("")}</div>
  <div class="sec">Review every question</div>
  ${M.list.map((id,i)=>{const q=qById(id);const mine=M.ans[id]||[];const c=same(mine,q.ans);
    return `<details class="card"><summary><b style="color:${c?"var(--good)":"var(--bad)"}">${c?"✓":"✕"} Q${i+1}</b> <span class="muted">${q.topic}</span></summary><div class="qstem" style="margin-top:10px">${q.q}</div>
    ${q.opts.map((o,j)=>`<div class="opt ${q.ans.includes(j)?"ok":(mine.includes(j)?"no":"")}" style="cursor:default"><span class="k">${L[j]}</span><span>${o.t}<span class="why">${o.w}</span></span></div>`).join("")}
    ${q.tip?`<div class="box brain"><div class="l">Exam brain</div>${q.tip}</div>`:""}</details>`}).join("")}
  <button class="btn block" onclick="location.hash='practice'">Back to practice</button>`,"practice");
}

function sheet(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove();};document.body.appendChild(m);return m;}


/* reader */
const GORDER=["d0","d3","d2","d1","d4","d5"];
function gdone(g){const G=D.guides[g];return G.sections.filter((_,i)=>S.read[g+"-"+i]).length;}
function vRead(){
  render(`<h1>Read</h1><p class="muted">Ringkasan materi per domain dalam Bahasa Indonesia, berbasis kasus. Istilah teknis tetap English karena ujiannya English.</p>

  <div class="sec">Ringkasan + kasus (Indonesia)</div>

function vGuide(g){

  <div class="card" style="background:${G.color};color:#fff;border:none"><p style="margin:0">${G.intro}</p></div>

  <div class="row" style="margin-top:12px">

   ${i<n-1?`<button class="btn" style="flex:2" onclick="PDEapp.gread('${g}',${i},true)">Selesai, lanjut ›</button>`:`<button class="btn good" style="flex:2" onclick="PDEapp.gread('${g}',${i},false)">Selesai bab terakhir ✓</button>`}

/* ---------- router ---------- */
function go(h){location.hash=h;}
function route(){
  const h=(location.hash||"#home").slice(1);
  if(M&&!M.submitted&&!h.startsWith("mock")){ /* keep mock alive */ }
  if(h==="home")return vHome();
  if(h==="read")return vRead();
  if(h.startsWith("guide-"))return vGuide(h.slice(6));
  if(h.startsWith("gs-")){const p=h.split("-");return vGS(p[1],+p[2]);}
  if(h==="learn")return vLearn();
  if(h==="practice")return vPractice();
  if(h==="notebook")return vNotebook();
  if(h==="progress")return vProgress();
  if(h==="flash"){F=null;return vFlash();}
  if(h==="daily")return vDaily();
  if(h==="mock")return vMock();
  if(h.startsWith("d-"))return vDomain(h.slice(2));
  if(h.startsWith("lesson-")){LS=null;return vLesson(h.slice(7));}
  if(h.startsWith("quizn-")){const id=h.slice(6);const d=dom(id);return startQuiz(quizPool(id).filter(q=>!S.quiz[q.id]||!S.quiz[q.id].last),d.short+" · new & wrong","d-"+id);}
  if(h.startsWith("quiz-")){const id=h.slice(5);const d=dom(id);if(!d||!d.ready)return go("practice");return startQuiz(quizPool(id),d.short+" quiz","d-"+id);}
  if(h.startsWith("tool-")){PK=null;return vTool(h.slice(5));}
  if(h.startsWith("mockintro-"))return vMockIntro(h.slice(10));
  return vHome();
}
window.addEventListener("hashchange",route);

/* ---------- actions ---------- */
window.PDEapp={
  setExam(){const m=sheet(`<h3>When is your exam?</h3><input type="date" id="ed" value="${S.exam}"><div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" id="c">Cancel</button><button class="btn" style="flex:1" id="s">Save</button></div>`);
    m.querySelector("#c").onclick=()=>m.remove(); m.querySelector("#s").onclick=()=>{S.exam=m.querySelector("#ed").value;save();m.remove();route();};},
  exam(v){S.exam=v;save();toast("Exam date saved");},
  open(i){LS.opened=i;vLesson(LS.id);},
  lstep(n){LS.step+=n;vLesson(LS.id);},
  ldone(id,d){S.lessons[id]=true;touch();toast("Lesson complete ✓");LS=null;go("d-"+d);},
  pick(i){const q=qById(Q.list[Q.i]);if(Q.done)return;if(q.ans.length>1){Q.sel=Q.sel.includes(i)?Q.sel.filter(x=>x!==i):(Q.sel.length<q.ans.length?[...Q.sel,i]:Q.sel);}else Q.sel=[i];vQuiz();},
  check(){const q=qById(Q.list[Q.i]);Q.done=true;const c=same(Q.sel,q.ans);if(c)Q.score++;else Q.wrong.push(q.id);record(q,c);vQuiz();},
  next(){Q.i++;Q.sel=[];Q.done=false;vQuiz();},
  retryWrong(){startQuiz(Q.wrong.map(qById),Q.title+" · retry",Q.back);},
  retryAll(){startQuiz(Object.keys(S.wrong).map(qById).filter(Boolean),"Mistakes retry","notebook");},
  flip(){F.flip=!F.flip;vFlash();},
  fc(ok){const id=F.list[F.i];const r=S.flash[id]||{box:0};r.box=ok?Math.min(r.box+1,INT.length-1):0;r.due=addDays(ok?INT[r.box]:1);S.flash[id]=r;if(ok)F.good++;touch();F.i++;F.flip=false;vFlash();},
  flashAll(){F={list:shuffle(D.flash.filter(c=>dom(c.d).ready)).map(c=>c.id),i:0,flip:false,good:0};vFlash();},
  pk(i){const tool=D.tools[PK.t];const n=tool.nodes[PK.node];PK.path.push(n.q+" → "+n.opts[i][0]);PK.node=n.opts[i][1];vPicker(tool);},
  pkReset(){const t=PK.t;PK={t,node:"start",path:[]};vPicker(D.tools[t]);},
  tr(k,v){TR[k]=+v;vTransfer(D.tools.transfer);},
  wp(k,v){WP[k]=v;vWindows(D.tools.windows);},
  gread(g,i,next){S.read[g+"-"+i]=true;touch();if(next)location.hash="gs-"+g+"-"+(i+1);else{toast("Semua bab selesai ✓");location.hash="guide-"+g;}},
  mockStart, mpick(i){const q=qById(M.list[M.i]);let s=M.ans[q.id]||[];if(q.ans.length>1){s=s.includes(i)?s.filter(x=>x!==i):(s.length<q.ans.length?[...s,i]:s);}else s=[i];M.ans[q.id]=s;try{sessionStorage.setItem(KEY+"-mock",JSON.stringify(M));}catch(e){}vMock();},
  mgo(i){M.i=i;vMock();}, mgrid(){vMock(true);},
  mflag(){const id=M.list[M.i];M.flag[id]=!M.flag[id];vMock();},
  msubmitAsk(){const un=M.list.filter(id=>!(M.ans[id]||[]).length).length;const fl=Object.values(M.flag).filter(Boolean).length;
    const m=sheet(`<h3>Submit exam?</h3><p>${un?`<b>${un}</b> unanswered. `:""}${fl?`<b>${fl}</b> flagged. `:""}You can't change answers after submitting.</p><div class="row"><button class="btn ghost" style="flex:1" id="c">Keep going</button><button class="btn" style="flex:1" id="s">Submit</button></div>`);
    m.querySelector("#c").onclick=()=>m.remove();m.querySelector("#s").onclick=()=>{m.remove();mockSubmit(false);};},
  backup(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const done=()=>toast("Backup code copied");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,()=>showCode(code));}else showCode(code);},
  restoreAsk(){const m=sheet(`<h3>Restore progress</h3><p class="muted">Paste a backup code. This replaces the progress on this device.</p><textarea id="t"></textarea><div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" id="c">Cancel</button><button class="btn" style="flex:1" id="s">Restore</button></div>`);
    m.querySelector("#c").onclick=()=>m.remove();m.querySelector("#s").onclick=()=>{try{S=Object.assign(blank(),JSON.parse(decodeURIComponent(escape(atob(m.querySelector("#t").value.trim())))));save();m.remove();toast("Progress restored");route();}catch(e){toast("That code didn't work");}};},
  resetAsk(){const m=sheet(`<h3>Reset everything?</h3><p>All quiz history, lessons, flashcards and mock results on this device will be deleted.</p><div class="row"><button class="btn ghost" style="flex:1" id="c">Cancel</button><button class="btn bad" style="flex:1" id="s">Reset</button></div>`);
    m.querySelector("#c").onclick=()=>m.remove();m.querySelector("#s").onclick=()=>{S=blank();save();m.remove();route();};}
};
function showCode(code){const m=sheet(`<h3>Your backup code</h3><p class="muted">Select all and copy it somewhere safe (e.g. a note).</p><textarea readonly>${esc(code)}</textarea><button class="btn block" style="margin-top:10px" id="c">Done</button>`);m.querySelector("#c").onclick=()=>m.remove();}

/* resume an unfinished mock after reload */
try{const s=sessionStorage.getItem(KEY+"-mock"); if(s){const o=JSON.parse(s); if(o&&!o.submitted&&o.end>Date.now()){M=o;}}}catch(e){}
route();
})();
