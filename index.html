Q("d5q07","Cost","A Dataproc cluster runs constantly for a data science team that uses Jupyter notebooks interactively all day, every day. Is an ephemeral cluster per job the right choice here?",[
 ["Yes, always use ephemeral clusters","Not for constant interactive use."],
 ["No. For constant interactive use, a persistent (autoscaling) cluster can be appropriate; ephemeral fits batch jobs","Correct. Match the cluster lifecycle to the usage pattern."],
 ["Use Dataflow instead","Not a notebook Spark environment."],
 ["Turn the cluster off at noon","Disrupts users."]],1,"Persistent vs ephemeral → depends on usage pattern."),
Q("d5q08","Automation","A Composer DAG loads daily data into BigQuery. You need to reprocess the last 60 days after a logic fix. What makes this easy and safe?",[
 ["Write each task to overwrite its own date partition, parameterized by the run's logical date, then trigger a backfill","Correct. Idempotent, date-parameterized tasks make backfills safe."],
 ["Delete the table and rerun today's DAG","Only reloads today."],
 ["Run the DAG 60 times manually with today's date","All runs would process the same date."],
 ["Append results and dedupe later","Error-prone."]],0,"Backfills → idempotent + date-parameterized tasks."),
Q("d5q09","Automation","A Composer DAG must start only after a partner's file arrives in Cloud Storage, which happens at a random time between 01:00 and 05:00. What should the first task be?",[
 ["A GCS object sensor that waits for the file","Correct. Sensors wait for external conditions."],
 ["A fixed sleep of 4 hours","Wasteful and fragile."],
 ["A BashOperator that lists the bucket once","Fails if the file is late."],
 ["Cloud Scheduler at 05:00","Delays processing unnecessarily."]],0,"Wait for a condition → sensor."),
Q("d5q10","Automation","Your Composer environment shows many tasks waiting in the queued state for minutes during the nightly peak, although DAGs are correct and dependencies are met. What should you do?",[
 ["Scale out workers and raise concurrency/parallelism settings","Correct. Queued tasks mean there isn't enough execution capacity."],
 ["Rewrite all DAGs","DAGs aren't the issue."],
 ["Reduce retries","Unrelated."],
 ["Move DAG files to another folder","Unrelated."]],0,"Queued tasks → more workers/concurrency."),
Q("d5q11","Workloads","Monthly finance reports in BigQuery aren't urgent and can run any time overnight. They currently compete with interactive analyst queries. Which TWO changes help?",[
 ["Run the reports with batch priority","Correct. They wait for free capacity and don't block interactive work."],
 ["Put the reports in a separate reservation (or project) with its own capacity","Correct. Workload isolation."],
 ["Add LIMIT to the reports","Doesn't change resource use."],
 ["Disable the query cache","Makes things worse."]],[0,1],"Non-urgent work → batch priority and/or isolation."),
Q("d5q12","Monitoring","You need to be alerted when a streaming Dataflow pipeline falls more than 5 minutes behind. What should you configure?",[
 ["A Cloud Monitoring alerting policy on the job's system lag / data freshness metric","Correct. The metric directly measures how far behind the pipeline is."],
 ["A daily email from the team lead","Not automated."],
 ["An alert on CPU utilization","Indirect, and it misses I/O-bound lag."],
 ["Audit logs","Don't show lag."]],0,"Pipeline behind → alert on system lag / data freshness."),
Q("d5q13","Monitoring","You need to alert whenever a specific error message (\"SchemaMismatch\") appears in your pipeline's logs. What should you do?",[
 ["Create a log-based metric for that message and an alerting policy on it","Correct. Turns log patterns into alertable metrics."],
 ["Read the logs manually each morning","Not automated."],
 ["Increase the log retention","Doesn't alert."],
 ["Enable Data Access logs","Unrelated."]],0,"Alert on log text → log-based metric."),
Q("d5q14","Monitoring","Security wants all Cloud Logging entries from data projects kept for 5 years and analysable with SQL. What should you set up?",[
 ["A log sink routing logs to a BigQuery dataset (and/or GCS for cheap archive) with the required retention","Correct. Sinks export logs for analysis and long retention."],
 ["Rely on default log retention","Too short."],
 ["Copy logs manually","Not reliable."],
 ["Pub/Sub only","Streams logs but doesn't store them for analysis."]],0,"Long retention + SQL → log sink to BigQuery."),
Q("d5q15","Troubleshooting","A client library loading data into BigQuery intermittently fails with rateLimitExceeded errors. What should the code do?",[
 ["Retry immediately in a tight loop","Makes rate limiting worse."],
 ["Retry with exponential backoff (and jitter)","Correct. Back off progressively, then request a quota increase if it's sustained."],
 ["Give up and alert","Transient errors should be retried."],
 ["Switch to a new project per request","An anti-pattern."]],1,"Rate/quota errors → exponential backoff."),
Q("d5q16","Troubleshooting","A scheduled Dataflow job fails with \"permission denied\" writing to BigQuery, although the engineer who created it has BigQuery Admin. What's the most likely cause?",[
 ["BigQuery is down","Unlikely, and the message points to IAM."],
 ["The job's worker service account lacks write permission on the dataset","Correct. Jobs run as their service account, not as the creator."],
 ["The engineer needs Owner","The engineer's roles don't apply to the job."],
 ["The table is partitioned","Unrelated."]],1,"Job permission errors → check the job's service account."),
Q("d5q17","Troubleshooting","A BigQuery query fails with \"Resources exceeded during query execution\" while sorting a 2-billion-row result with ORDER BY and no LIMIT. What should you do?",[
 ["Add LIMIT (or remove the global ORDER BY), and filter or aggregate earlier","Correct. A global sort of a huge result runs on a single stage and exhausts resources."],
 ["Buy more storage","Unrelated."],
 ["Enable BI Engine","Unrelated."],
 ["Disable the cache","Unrelated."]],0,"Resources exceeded → reduce data / avoid huge global sorts."),
Q("d5q18","Failure","An engineer ran DELETE without a WHERE clause on a production BigQuery table 3 hours ago. What's the fastest recovery with no data loss?",[
 ["Restore with time travel: CREATE OR REPLACE TABLE … AS SELECT * FROM table FOR SYSTEM_TIME AS OF (before the delete)","Correct. Time travel covers up to 7 days."],
 ["Reload all sources for the last 5 years","Slow."],
 ["Open a fail-safe ticket","Only needed after the time-travel window."],
 ["Restore last month's export","Loses a month of data."]],0,"Recent mistake in BigQuery → time travel."),
Q("d5q19","Failure","A dashboard backed by BigQuery is business-critical and must keep working within minutes if its region has an outage. Which approach fits?",[
 ["Cross-region dataset replication with managed disaster recovery and failover reservations","Correct. A replica in another region that you can promote quickly."],
 ["Weekly exports to GCS","RTO too long."],
 ["Time travel","Doesn't protect against a region outage."],
 ["More slots in the same region","Same region, same outage."]],0,"Region-level BigQuery DR → cross-region replication / managed DR."),
Q("d5q20","Failure","A new subscriber version mis-processed Pub/Sub messages for the last 4 hours. The subscription retains acknowledged messages for 7 days. How do you reprocess them?",[
 ["Seek the subscription to a timestamp 4 hours ago after deploying the fix","Correct. Replays messages from that point."],
 ["Ask publishers to resend","Not reliable."],
 ["Create a new topic","Doesn't recover old messages."],
 ["Increase the ack deadline","Unrelated."]],0,"Reprocess messages → seek to a timestamp/snapshot."),
Q("d5q21","Failure","Occasionally upstream systems send malformed records that crash a streaming pipeline. The business wants valid data to keep flowing and bad data fixed later. What's the best design?",[
 ["Route invalid records to a dead-letter output (table/bucket), alert on its volume, and reprocess after fixing","Correct. Isolate failures without stopping the stream."],
 ["Fail the pipeline so someone notices","Stops everything."],
 ["Silently drop bad records","Loses data."],
 ["Set max_bad_records","Only for load jobs, and it drops data silently."]],0,"Bad records → dead-letter + reprocess."),
Q("d5q22","Failure","A nightly pipeline overwrote a curated table with corrupted transformations, and the bug was found 10 days later. Raw source files are kept in Cloud Storage. What's the most reliable recovery?",[
 ["Time travel","10 days is beyond the time-travel window."],
 ["Fix the code and reprocess the affected days from the immutable raw files, using idempotent writes","Correct. Raw immutable data plus idempotent pipelines make full recovery possible."],
 ["Ask analysts to ignore the bad data","Not acceptable."],
 ["Restore from the BI tool cache","Not a source of truth."]],1,"Beyond time travel → reprocess from raw (keep raw data!)."),
Q("d5q23","Failure","A long-running Dataproc cluster used for streaming Spark jobs must survive a master node failure. What should you enable?",[
 ["High-availability mode (3 masters)","Correct."],
 ["More secondary workers","Doesn't replace the master."],
 ["Spot masters","Increases risk."],
 ["Scheduled deletion","Deletes the cluster."]],0,"Dataproc master resilience → HA mode."),
Q("d5q24","Quotas","A pipeline hits the per-project Pub/Sub publish throughput quota during seasonal peaks, and backoff isn't enough. What's the right next step?",[
 ["Request a quota increase (and batch publishes to use quota efficiently)","Correct. For a sustained legitimate need, raise the quota and publish efficiently."],
 ["Spread publishes across random personal projects","An anti-pattern."],
 ["Drop messages above the limit","Data loss."],
 ["Switch to Pub/Sub Lite","Shut down."]],0,"Sustained quota need → batching + quota increase."),

Q("d5m06","Troubleshooting","An API that your Cloud Run service calls returns HTTP 429 during bursts. What should the client implement?",[

Q("d5m07","Failure","Which design choice best enables recovery from a transformation bug discovered weeks later?",[

PDE.guides.d2 = {title:"Ingesting & processing the data",color:"#0891b2",intro:"Domain terbesar (25%). Bagaimana data masuk (Pub/Sub, Datastream), diproses (Dataflow, Dataproc), dan diorkestrasi (Composer).",

   ["Tim ETL tidak bisa coding, sumbernya Salesforce, Oracle dan SFTP.","<b>Cloud Data Fusion</b>.","Drag-and-drop dengan banyak connector."],
   ["File CSV harian masuk ke GCS, cukup dimuat ke BigQuery.","<b>BigQuery load job</b> (atau DTS dari GCS).","Jangan berlebihan pakai Dataflow kalau tidak ada transformasi."]],
  [["ELT","Load dulu, transformasi di BigQuery dengan SQL"],["Serverless","Tidak perlu mengurus server atau cluster"]],
  ["Existing Spark → Dataproc · baru/serverless → Dataflow · no-code → Data Fusion · data sudah di BQ → SQL/Dataform"]),
 S("Pub/Sub",

  [["Tim fraud dan tim analytics sama-sama butuh semua pesan.","<mark>Dua subscription</mark>.","Kalau satu subscription dipakai bersama, pesannya dibagi-bagi, bukan disalin."],

   ["Pesan per customer harus diproses berurutan.","<b>Ordering keys</b> (key = customer_id).","Urutan terjamin per key, throughput tetap tinggi."],
   ["Deploy subscriber baru yang mungkin bug, dan mau bisa proses ulang.","Buat <b>snapshot</b> dulu, lalu <mark>seek</mark> ke snapshot itu kalau perlu.","Seek ke snapshot atau timestamp = replay."],

  ["Pub/Sub Lite sudah mati. Exactly-once delivery tersedia untuk pull subscription."]),

  "Dataflow menjalankan kode <b>Apache Beam</b>. Datanya disebut <b>PCollection</b>, setiap langkahnya disebut <b>transform</b>.",

   ["Join stream orders dan payments berdasarkan order_id.","<b>CoGroupByKey</b>.","Ini cara join di Beam."],

 S("Waktu, window & trigger",
  "<b>Event time</b> = kapan kejadiannya. <b>Processing time</b> = kapan sampai di server. Untuk analitik yang benar, kelompokkan berdasarkan <mark>event time</mark>. <b>Watermark</b> adalah perkiraan Dataflow bahwa semua data sampai waktu T sudah masuk.",
  [["Hitung login gagal per 5 menit, tanpa overlap.","<mark>Fixed window</mark> 5 menit.","Kata kuncinya \"every N minutes\"."],
   ["Rata-rata harga 30 menit terakhir, di-update tiap menit.","<mark>Sliding window</mark> (size 30, period 1).","Moving average."],

  ["Coba tool <b>Window Playground</b> di tab Practice."]),
 S("Dataflow di production",
  "Yang paling sering keluar di soal: cara deploy dan menghentikan job streaming tanpa kehilangan data.",
  [["Fix bug kompatibel di job streaming, state harus tetap ada.","<mark>--update</mark> dengan nama job yang sama.","Mengganti kode tanpa kehilangan state."],
   ["Perubahan tidak kompatibel (window diganti), tidak boleh ada data hilang.","<mark>Drain</mark>, lalu jalankan job baru.","Drain menyelesaikan data in-flight. Cancel membuang data in-flight."],

  ["Update = kompatibel · Drain = aman · Cancel = data in-flight hilang"]),

  "Analoginya sewa mobil per perjalanan. Buat cluster untuk satu job, jalankan, lalu hapus. Barang bawaanmu (data) disimpan di rumah, yaitu <mark>Cloud Storage, bukan HDFS</mark>.",
  [["Cluster menyala 24/7 padahal job cuma 2 jam per malam.","<mark>Ephemeral cluster</mark> + workflow template / scheduled deletion.","Bayar hanya saat dipakai. Billing per detik."],
   ["Mau hemat tanpa risiko kehilangan data.","<b>Spot/preemptible secondary workers</b>. Primary worker tetap standar.","Secondary worker hanya untuk compute, jadi aman kalau hilang."],

   ["Tim data science mau PySpark tanpa urus cluster.","<b>Serverless for Apache Spark</b>.","Tidak ada cluster sama sekali."],
   ["Notebook interaktif harus tetap jalan kalau master node mati.","<b>High-availability mode</b> (3 master).","Cluster tetap hidup walau satu master gagal."]],

PDE.guides.d5 = {title:"Maintaining & automating data workloads",color:"#db2777",intro:"Pekerjaan \"hari kedua\": biaya, kapasitas, penjadwalan, monitoring, dan desain tahan gagal.",

   ["Query mana yang paling mahal bulan ini?","<b>INFORMATION_SCHEMA.JOBS</b> / admin resource charts.","Riwayat semua job."],

PDE.guidesEn.d0 = {title:"Start here: how to think on exam day",color:"#171a26",intro:"Read this before any domain. On the PDE, picking the answer Google wants matters as much as knowing the products.",
sections:[
 S("The exam format",
  "2 hours, roughly 40–50 multiple-choice questions (sometimes \"choose 2\"), pass/fail with no score shown. Almost every question is a <b>scenario</b>: \"Company X needs Y with constraint Z. What should you do?\" Usually 2 answers are clearly wrong and 2 both look right.",
  [["Two answers would both technically work.","Pick the most <b>managed</b>, least-ops option that meets <b>every</b> requirement in the question.","The PDE tests whether you choose Google's <i>recommended</i> solution, not just one that works."]],
  [["Scenario","A story question with business needs + constraints"],["Pass/fail","No score is shown; the pass mark is roughly 70%"]],
  ["Read the last sentence first, then the story.","Circle the constraint keywords: <i>real-time, minimal ops, lowest cost, minimal changes, global</i>."]),
 S("The 6 golden rules",
  "When you're torn between two answers, use these rules. Google's answer almost always follows them.",
  [["Choose between installing Kafka/Hive yourself on Compute Engine, or using Pub/Sub/BigQuery.","Use the <mark>managed/serverless</mark> service.","Rule 1: managed beats DIY. \"Install on VMs\" is almost always the trap."],
   ["The question says \"small team, doesn't want to manage infrastructure\".","Pick the most serverless option (BigQuery, Dataflow, Pub/Sub).","Rule 2: <mark>least operational overhead wins</mark>."],
   ["Answer A is the cheapest but misses the latency requirement.","Cross A out. Among answers that meet every requirement, then pick the cheapest.","Rule 3: all requirements first, then cost."],
   ["Analysts need read access to BigQuery.","The smallest predefined roles, e.g. <code>dataViewer</code> + <code>jobUser</code>, granted to a <b>group</b>.","Rule 4: <mark>least privilege</mark>. Basic roles (Owner/Editor) are almost never right."],
   ["\"Migrate Spark jobs with minimal changes.\"","Dataproc (lift &amp; shift). If the question says \"modernize\", then Dataflow/BigQuery.","Rule 5: follow what the question says about how much change is allowed."],
   ["A BigQuery query is slow, or Bigtable has a hotspot.","Fix the design first (partition/cluster, row key), then add resources.","Rule 6: treat the cause, not the symptom."]],
  [],["Managed > DIY · least ops · all requirements then cheapest · least privilege · lift&amp;shift vs modernize · fix the cause"]),
 S("Keyword radar",
  "These words in a question almost always point straight at the answer.",
  [],
  [["real-time / streaming","Pub/Sub + Dataflow"],["sub-10 ms, key lookup, time series, IoT","Bigtable"],["global, strongly consistent, relational","Spanner"],["analytics, SQL, petabytes","BigQuery"],["existing Hadoop/Spark","Dataproc"],["no-code / GUI ETL","Data Fusion"],["orchestrate, dependencies, retries","Cloud Composer"],["PII, mask, tokenize","Sensitive Data Protection (DLP)"],["exfiltration","VPC Service Controls"],["own / control the keys","CMEK (Cloud KMS)"],["share without copying","Analytics Hub (BigQuery sharing)"],["catalog, lineage, data quality","Dataplex"]],
  ["Memorize this table. It's the fastest way to raise your score."]),
 S("Old name → new name",
  "Old practice questions (including the 2022 dump) use old product names. When you see one, translate it to today's name.",
  [],
  [["Datalab","Vertex AI Workbench / Colab Enterprise"],["ML Engine / AI Platform","Vertex AI"],["Stackdriver","Cloud Logging / Cloud Monitoring"],["Data Studio","Looker Studio"],["Data Catalog","Dataplex Universal Catalog"],["Analytics Hub","BigQuery sharing"],["Cloud DLP","Sensitive Data Protection"],["Datastore","Firestore in Datastore mode"],["Cloud Functions","Cloud Run functions"],["BigQuery flat-rate","BigQuery Editions (reservations)"],["insertAll streaming","Storage Write API"],["Pub/Sub Lite","Pub/Sub or Managed Kafka (Lite has been shut down)"],["Preemptible VM","Spot VM"]],
  ["ExamTopics answer keys are often wrong. If one contradicts the 6 golden rules, follow the rules."])
]};

PDE.guidesEn.d1 = {title:"Designing data processing systems",color:"#4f46e5",intro:"The architect's domain: who can access what, how data is protected, how systems survive failures, and how to move data into Google Cloud.",
sections:[
 S("IAM: who can do what",
  "Think of IAM as a building's keycard system. Access is granted at <b>Organization → Folder → Project → Resource</b> and is <mark>inherited downward</mark>: access granted higher up can't be removed lower down. Give the smallest <b>predefined role</b> to a <b>Google Group</b> or <b>service account</b>, not to individuals.",
  [["Analysts must query the <code>sales</code> dataset but must not change data.","<code>roles/bigquery.dataViewer</code> on the dataset + <code>roles/bigquery.jobUser</code> on the project.","Reading tables and running queries are separate permissions. This combination comes up a lot."],
   ["A Dataflow pipeline needs to write to BigQuery.","Create a <b>dedicated service account</b> for that pipeline and grant it <code>dataEditor</code> on the target dataset.","One service account per app, least privilege, never a personal account."],
   ["The company must keep all data in EU regions only.","An <b>organization policy</b> <code>gcp.resourceLocations</code> restricted to EU regions.","Org policies are org-wide guardrails, not per-person permissions."]],
  [["Predefined role","A ready-made Google role for a specific job"],["Basic role","Owner/Editor/Viewer: too broad, avoid"],["Service account","An identity for apps or pipelines, not people"],["Workload Identity Federation","External workloads (AWS, GitHub) access GCP without key files"],["Org policy","Mandatory rules for the whole organization (locations, no public IPs, etc.)"]],
  ["BigQuery now supports table, row-level and column-level (policy tags) security. Notes saying \"dataset level only\" are outdated.","Avoid <code>bigquery.admin</code> or Owner in answers."]),
 S("Encryption & keys",
  "All data in GCP is <b>encrypted automatically</b>. The question is who holds the key. If the question says \"we must control, rotate or revoke keys\" → <mark>CMEK via Cloud KMS</mark>.",
  [["Auditors want the company to be able to make data unreadable at any time.","<b>CMEK</b>. Disabling or destroying the key makes the data unreadable (<i>crypto-shredding</i>).","With CMEK, key control is in your hands."],
   ["Regulation: keys must never be stored in Google.","<b>Cloud EKM</b>: keys live in an external key manager.","EKM = keys outside Google."],
   ["Keys must be in FIPS 140-2 Level 3 certified hardware.","<b>Cloud HSM</b>.","HSM = CMEK with keys stored in dedicated hardware."],
   ["Google must never see the raw data at all.","<b>Client-side encryption</b> before upload.","The data is already encrypted before it reaches Google."]],
  [["CMEK","Customer-managed key in Cloud KMS, the most common choice"],["CSEK","Customer-supplied key, only for Cloud Storage &amp; Compute Engine"],["Crypto-shredding","Destroy the key = the data can't be read anymore"]],
  ["CSEK is <b>not supported by BigQuery</b>, so any answer using CSEK for BigQuery is wrong."]),
 S("Personal data (PII) & DLP",
  "<b>Sensitive Data Protection</b> (formerly Cloud DLP) finds sensitive data (ID numbers, card numbers, emails…) and de-identifies it. The technique you pick decides what you can still do with the data.",
  [["Analysts need to JOIN and COUNT on account numbers without seeing the real numbers.","<mark>Deterministic tokenization / format-preserving encryption (FPE)</mark>.","The same input always becomes the same token, so JOINs still work. It can be reversed with the key."],
   ["Show credit cards as ****1234 in reports.","<b>Masking/redaction</b>.","Irreversible, and the analytical value is lost."],
   ["Patient ages must be generalized for research.","<b>Bucketing</b> (34 → 30–39) or <b>date shifting</b>.","Reduces re-identification risk while keeping the patterns."],
   ["Measure how easily a dataset can be re-identified.","<b>Risk analysis</b> (k-anonymity, l-diversity) in DLP.","DLP measures risk as well as de-identifying."]],
  [["Redaction / masking","Remove or cover up, permanently"],["Tokenization / FPE","Replace with a consistent, reversible token"],["Hashing","Consistent but one-way"],["infoType","A type of sensitive data DLP detects"]],
  ["Common pattern: data lands in a staging bucket → DLP/Dataflow de-identifies it → clean output goes to BigQuery."]),
 S("Perimeters, network, audit & residency",
  "<mark>VPC Service Controls</mark> builds a \"fence\" around projects. BigQuery/GCS data can't be sent outside it, <b>even by someone with valid credentials</b> (for example stolen ones).",
  [["Worried an employee or attacker will copy BigQuery data to a personal project.","A <b>VPC Service Controls</b> perimeter.","IAM isn't enough if credentials leak. VPC-SC prevents exfiltration."],
   ["VMs without public IPs need to reach BigQuery/GCS.","<b>Private Google Access</b> on that subnet.","Access Google APIs over the internal network."],
   ["\"Who read the salary table last week?\"","<b>Data Access audit logs</b>, exported to BigQuery with a log sink.","For BigQuery, data access logs are on by default."],
   ["A developer accidentally wrote to a production table.","Separate <b>dev / test / prod projects</b> with different IAM.","Environment separation is Google's standard practice."]],
  [["Exfiltration","Data taken out without permission"],["Admin Activity log","Always on, records config changes"],["Data Access log","Records who read data"]],
  ["A BigQuery dataset's location can't be changed after creation. To move it, copy to a new dataset."]),
 S("Reliability, data quality & DR",
  "A reliable system doesn't lose data, keeps it correct, and recovers quickly. In questions, recognize <b>RPO</b> (how much data you may lose) and <b>RTO</b> (how long you may be down).",
  [["Make sure no negative <code>order_total</code> ends up in a SQL transformation's output.","<b>Dataform assertions</b>, or <b>Dataplex data quality scans</b>.","Automatic validation as part of the pipeline."],
   ["Global ACID transactions with 99.999% availability.","<b>Spanner</b>.","Only Spanner combines ACID with global scale."],
   ["RPO of 24 hours is fine, minimal budget.","Backups/snapshots to another region.","The cheapest option, even though RTO is high."],
   ["Near-zero RPO for a relational database if a region fails.","Cross-region replicas (Cloud SQL cross-region replica) or Spanner multi-region.","Smaller RPO/RTO means higher cost."]],
  [["RPO","Recovery Point Objective: the maximum data loss allowed"],["RTO","Recovery Time Objective: the maximum downtime allowed"],["ACID","Atomic, Consistent, Isolated, Durable: safe transactions"],["Dataform","SQL transformations in BigQuery with git, dependencies and tests"]],
  ["Pick the cheapest DR option that still meets the RPO/RTO numbers in the question."]),
 S("Portability & multicloud",
  "Google wants your data usable anywhere: open formats, open-source engines, and analytics across clouds.",
  [["Parquet data sits in S3 and, by contract, can't be moved.","<mark>BigQuery Omni</mark> (with BigLake tables).","BigQuery running in AWS/Azure, next to the data."],
   ["An Apache Iceberg lakehouse on GCS with column-level security.","<b>BigLake tables</b>.","One governance layer on top of open-format files."],
   ["The team wants to search every company dataset, with owners and lineage.","<b>Dataplex Universal Catalog</b>.","Catalog + metadata + lineage in one place."]],
  [["BigLake","Tables over open files (Parquet/Iceberg) with BigQuery security"],["Omni","BigQuery for data in AWS/Azure"],["Bronze/silver/gold","Raw → curated → ready-to-use zones"]],
  ["Apache Beam can run on Dataflow, Flink or Spark. That's portability too."]),
 S("Data migration",
  "Think of moving house. A few boxes go in your own car (<b>gcloud storage</b>). A full house uses a scheduled moving company (<b>Storage Transfer Service</b>). A whole warehouse goes in a <b>shipping container</b> (<b>Transfer Appliance</b>). If people still live there during the move, you need someone copying every change (<b>Datastream / DMS</b>).",
  [["500 TB on-prem with only 100 Mbps of bandwidth.","<mark>Transfer Appliance</mark>.","Over the network it would take more than a year. Use: <mark>1 TB @100 Mbps ≈ 1 day</mark>."],
   ["Daily sync from an S3 bucket to GCS.","A scheduled <b>Storage Transfer Service</b> job.","Managed, schedulable, and resumes after interruptions."],
   ["Migrate Teradata to BigQuery.","<b>BigQuery Data Transfer Service</b> (migration).","DTS supports Teradata, Redshift and SaaS sources like Google Ads."],
   ["Move a production MySQL database to Cloud SQL with minimal downtime.","<b>Database Migration Service</b>.","Continuous replication, then cut over."],
   ["Replicate Oracle changes to BigQuery in near real time for analytics.","<mark>Datastream</mark> (CDC).","Serverless change data capture."],
   ["A private, high-throughput connection from on-prem to GCP.","<b>Dedicated Interconnect</b>. VPN for quick, moderate-volume needs.","Interconnect = a physical 10/100 Gbps link."]],
  [["CDC","Change data capture: copying every database change"],["Lift &amp; shift","Move as-is, with minimal changes"],["Cut-over","The moment traffic moves to the new system"]],
  ["Migration order: assess → plan → migrate → validate (row counts, checksums) → optimize.","Hadoop → Dataproc · Kafka → Managed Kafka/Pub/Sub · HBase → Bigtable · Airflow → Composer."])
]};

PDE.guidesEn.d2 = {title:"Ingesting & processing the data",color:"#0891b2",intro:"The biggest domain (25%). How data gets in (Pub/Sub, Datastream), gets processed (Dataflow, Dataproc), and gets orchestrated (Composer).",
sections:[
 S("Pipeline map & choosing an engine",
  "The standard streaming pattern: <mark>Pub/Sub → Dataflow → BigQuery</mark> (analytics) and/or Bigtable (fast serving). The batch pattern: GCS → Dataflow/Dataproc → BigQuery, or simply a <b>load job + SQL</b>.",
  [["300 on-prem Spark jobs need to move quickly without a rewrite.","<mark>Dataproc</mark>.","Managed Spark/Hadoop, made for lift &amp; shift."],
   ["New pipeline, same logic for batch and streaming, small team.","<mark>Dataflow</mark> (Apache Beam).","Serverless, autoscaling, one codebase."],
   ["The ETL team can't code; sources are Salesforce, Oracle and SFTP.","<b>Cloud Data Fusion</b>.","Drag-and-drop with lots of connectors."],
   ["A daily CSV lands in GCS and just needs loading into BigQuery.","A <b>BigQuery load job</b> (or DTS from GCS).","Don't overuse Dataflow when there's no transformation."]],
  [["ELT","Load first, transform inside BigQuery with SQL"],["Serverless","No servers or clusters to manage"]],
  ["Existing Spark → Dataproc · new/serverless → Dataflow · no-code → Data Fusion · data already in BQ → SQL/Dataform"]),
 S("Pub/Sub",
  "Pub/Sub is a post office. Publishers send letters to a <b>topic</b>. Each <b>subscription</b> gets its <b>own copy</b> of every letter. The subscriber has to sign for it (<b>ack</b>) before the <b>ack deadline</b>, or it's delivered again.",
  [["The fraud team and the analytics team both need every message.","<mark>Two subscriptions</mark>.","If they share one subscription, messages are split between them, not copied."],
   ["Lots of duplicate messages.","The subscriber acks too late. <b>Extend the ack deadline</b> and make processing idempotent (dedupe on an ID).","The default is <mark>at-least-once</mark>, and late acks trigger redelivery."],
   ["Messages for each customer must be processed in order.","<b>Ordering keys</b> (key = customer_id).","Order is guaranteed per key, and throughput stays high."],
   ["Deploying a subscriber that might have a bug, and you want to be able to reprocess.","Take a <b>snapshot</b> first, then <mark>seek</mark> back to it if needed.","Seek to a snapshot or timestamp = replay."],
   ["One bad message makes the subscriber crash over and over.","A <b>dead-letter topic</b>.","After N failures the message moves to another topic and stops blocking."],
   ["Messages should go straight into a BigQuery table with no transformation.","A <mark>BigQuery subscription</mark>.","No Dataflow needed."]],
  [["Pull","The subscriber fetches messages (Dataflow uses this)"],["Push","Pub/Sub POSTs to an HTTPS endpoint (Cloud Run)"],["Backlog","Unacked messages; watch oldest_unacked_message_age"],["Managed Kafka","Real Kafka without managing brokers, for existing Kafka apps"]],
  ["Pub/Sub Lite is shut down. Exactly-once delivery is available for pull subscriptions."]),
 S("Apache Beam: building blocks",
  "Dataflow runs <b>Apache Beam</b> code. The data is a <b>PCollection</b>, and each step is a <b>transform</b>.",
  [["Each transaction needs enriching with a 5 MB customer-tier table.","A <mark>side input</mark>.","Small data is shared with every worker. Don't query a database per element."],
   ["Join an orders stream and a payments stream on order_id.","<b>CoGroupByKey</b>.","That's how you join in Beam."],
   ["0.1% of records fail to parse and make the job fail.","<mark>Tagged output → dead-letter</mark> table/bucket.","Valid data keeps flowing, and broken records are kept for review."],
   ["Total sales per store is slow because of GroupByKey plus a manual sum.","<b>Combine.perKey</b>.","Partial aggregation before the shuffle, so it's faster."]],
  [["PCollection","Distributed dataset (bounded = batch, unbounded = stream)"],["ParDo / DoFn","Per-element processing"],["DirectRunner","Runs a pipeline locally for testing"]],
  []),
 S("Time, windows & triggers",
  "<b>Event time</b> = when something happened. <b>Processing time</b> = when it reached the server. For correct analytics, group by <mark>event time</mark>. The <b>watermark</b> is Dataflow's estimate that all data up to time T has arrived.",
  [["Count failed logins every 5 minutes, no overlap.","<mark>Fixed window</mark> of 5 minutes.","The keyword is \"every N minutes\"."],
   ["Average price over the last 30 minutes, updated every minute.","<mark>Sliding window</mark> (size 30, period 1).","Moving average."],
   ["Group a user's clicks until they've been idle for 20 minutes.","<mark>Session window</mark> with a 20-minute gap.","Per key, closed after inactivity."],
   ["Events up to 2 hours late are missing from the results.","Event-time windows + <mark>allowed lateness</mark> of 2 hours.","Default allowed lateness = 0, so late data is dropped."],
   ["A dashboard needs a provisional number every minute, then the final one.","An early processing-time trigger + watermark trigger, in <b>accumulating</b> mode.","Accumulating = every update contains the full total."]],
  [["Watermark","Estimate of data completeness"],["Trigger","When a window's result is emitted"],["Allowed lateness","How much lateness is tolerated"],["Accumulating vs discarding","Full total vs only the new part"]],
  ["Try the <b>Window Playground</b> tool in the Practice tab."]),
 S("Dataflow in production",
  "What comes up most: how to deploy and stop streaming jobs without losing data.",
  [["A compatible bug fix for a streaming job, and state must be kept.","<mark>--update</mark> with the same job name.","Swaps the code without losing state."],
   ["An incompatible change (new windowing), and no data may be lost.","<mark>Drain</mark>, then start the new job.","Drain finishes in-flight data. Cancel throws in-flight data away."],
   ["Analysts want to run the pipeline themselves with parameters.","A <b>Flex Template</b>.","Launch from the console without touching code."],
   ["One country produces 70% of traffic and one worker is overwhelmed.","<b>Hot key</b> → <code>withHotKeyFanout</code>.","Adding workers doesn't fix a hot key."],
   ["Lag rises because of an external API call per element.","Batch the requests (<code>GroupIntoBatches</code>) or use a cache.","Far fewer round-trips."],
   ["Workers must not have public IPs.","<code>--no_use_public_ips</code> + Private Google Access.","Reach Google APIs over a private path."],
   ["A weekly batch job that isn't urgent and should be cheaper.","<b>FlexRS</b>.","A discount in exchange for a flexible start time."]],
  [["System lag / data freshness","Metrics showing how far behind a pipeline is"],["Streaming Engine","Moves state from workers to a service"],["Storage Write API","A BigQuery sink that supports exactly-once"]],
  ["Update = compatible · Drain = safe · Cancel = in-flight data lost"]),
 S("Dataproc",
  "Think of renting a car per trip. Create a cluster for one job, run it, then delete it. Your luggage (data) stays at home, in <mark>Cloud Storage, not HDFS</mark>.",
  [["The cluster runs 24/7 even though the job only runs 2 hours a night.","<mark>Ephemeral cluster</mark> + workflow template / scheduled deletion.","Pay only while it's used. Billing is per second."],
   ["Save money without risking data loss.","<b>Spot/preemptible secondary workers</b>. Keep primary workers standard.","Secondary workers only do compute, so losing them is safe."],
   ["Every node needs a special Python library.","<mark>Initialization actions</mark>.","A script that runs automatically on each node when the cluster is created."],
   ["A data science team wants PySpark without managing clusters.","<b>Serverless for Apache Spark</b>.","No cluster at all."],
   ["Interactive notebooks must keep running if the master node dies.","<b>High-availability mode</b> (3 masters).","The cluster survives a master failure."]],
  [["HDFS","The cluster's own file system, which disappears with the cluster"],["Metastore","A Hive catalog shared across clusters"],["Component Gateway","Secure access to the YARN/Spark/Jupyter UIs"]],
  []),
 S("Other tools & orchestration",
  "Pick the orchestrator by complexity: <mark>Composer</mark> for complex DAGs, <b>Workflows</b> for light API chains, <b>Scheduler</b> for cron, <b>Eventarc</b> for event triggers.",
  [["Every night: Dataproc → BigQuery load → quality check, with retries, alerts and backfills.","<mark>Cloud Composer</mark> (managed Airflow).","Dependencies + retries + backfills across services."],
   ["Call 3 APIs in sequence a few times a day, as cheaply as possible.","<b>Workflows</b>.","Serverless, pay per step."],
   ["Processing must start as soon as a file lands in a bucket.","<b>Eventarc</b> → Cloud Run function → launch a Dataflow template.","Event-driven, no polling."],
   ["SQL transformations in BigQuery with version control and tests.","<b>Dataform</b>.","SQLX + assertions + git."],
   ["A PostgreSQL replica in BigQuery with a few minutes of lag.","<mark>Datastream</mark>.","Serverless CDC."],
   ["Automated testing and promoting pipelines from dev to prod.","<b>Cloud Build</b> → Artifact Registry → deploy to the dev, then the prod project.","CI/CD with separate environments."]],
  [["DAG","Directed acyclic graph: a set of tasks and their dependencies"],["Sensor","An Airflow task that waits for a condition (e.g. a file exists)"],["Idempotent","Running it again gives the same result"]],
  [])
]};

PDE.guidesEn.d3 = {title:"Storing the data",color:"#16a34a",intro:"Picking the right database is the most tested skill. Master the decision tree and a third of the exam gets easier.",
sections:[
 S("The storage decision tree",
  "Ask in order: files? analytics? relational OLTP? large-scale NoSQL? app documents? cache?",
  [["Store videos, raw logs, backups.","<mark>Cloud Storage</mark>.","Object storage with unlimited capacity."],
   ["SQL over 300 TB of data for dashboards.","<mark>BigQuery</mark>.","Serverless petabyte-scale data warehouse."],
   ["A web app backend, MySQL, one region.","<b>Cloud SQL</b>.","Managed relational OLTP."],
   ["Global game inventory, no double-spending, 99.999%.","<mark>Spanner</mark>.","Global ACID with strong consistency."],
   ["2 million IoT readings per second, per-device queries in &lt;10 ms.","<mark>Bigtable</mark>.","Wide-column NoSQL with very high throughput."],
   ["User profiles in a mobile app that must work offline.","<b>Firestore</b>.","Offline sync + flexible documents."],
   ["Sessions or a cache with sub-millisecond latency.","<b>Memorystore</b>.","Redis/Valkey in memory."]],
  [["OLTP","Day-to-day app transactions (inserting/updating rows)"],["OLAP","Analytics: scanning many rows to aggregate"]],
  ["BigQuery ≠ OLTP · Bigtable has no joins or secondary indexes · Cloud SQL scales up, not out"]),
 S("Cloud Storage",
  "There are 4 classes with different minimum storage durations. All of them return data in milliseconds. The colder the class, the cheaper to store but the more expensive to read.",
  [["Backups used about once a month, deleted after 6 months.","<b>Nearline</b> + a lifecycle rule that deletes at day 180.","Nearline = monthly access (30-day minimum)."],
   ["A 7-year regulatory archive that nobody may delete.","<b>Archive</b> + <mark>retention policy + Bucket Lock</mark>.","Bucket Lock = WORM; not even admins can delete."],
   ["The access pattern can't be predicted.","<b>Autoclass</b>.","GCS moves each object between classes automatically."],
   ["An auditor without a Google account needs to download 1 file within 24 hours.","A <b>signed URL</b>.","Temporary access to a single object."],
   ["RPO of 15 minutes across two specific EU regions.","<b>Dual-region + turbo replication</b>.","Turbo replication targets a 15-minute RPO."]],
  [["Standard / Nearline / Coldline / Archive","Minimum 0 / 30 / 90 / 365 days"],["Lifecycle rule","Change class or delete automatically by age"],["Object versioning","Keeps old versions of objects"]],
  []),
 S("BigQuery: partition, cluster, schema",
  "In on-demand mode you pay per <b>byte scanned</b>. <mark>LIMIT doesn't reduce cost</mark>. What does: selecting only the columns you need, filtering on partitions, and clustering.",
  [["Queries always filter on <code>event_date</code> but scan the whole table.","<mark>Partition by event_date</mark> + require_partition_filter.","Irrelevant partitions aren't read."],
   ["Already partitioned, but the customer_id filter still reads most of each partition.","<mark>Cluster by customer_id</mark>.","Data inside each partition is sorted, so irrelevant blocks are skipped."],
   ["An existing 20 TB table should become partitioned.","<code>CREATE TABLE … PARTITION BY … AS SELECT</code>.","You can't change an existing table in place."],
   ["The orders table is always joined with order_items.","<mark>Nested &amp; repeated fields</mark>.","Items are stored inside the order row, so no join is needed."],
   ["Still creating a new table per day (logs_20261101…).","Consolidate into <b>one partitioned table</b>.","Partitioned beats date-sharded."]],
  [["Clustering","Sorting data by up to 4 columns"],["Denormalization","Combining data so joins aren't needed"],["STRUCT / ARRAY","Nested column / repeated column"]],
  []),
 S("BigQuery: loading, recovery & storage cost",
  "Batch loads are free. Streaming works best with the Storage Write API. Time travel acts as an \"undo\".",
  [["The fastest daily load that supports schema changes.","<mark>Avro</mark> files.","The schema travels with the file, and compressed blocks are read in parallel."],
   ["Streaming is expensive and creates duplicates after retries.","The <mark>Storage Write API</mark>.","Cheaper, and supports exactly-once."],
   ["A bad UPDATE ran 3 hours ago.","<mark>Time travel</mark>: <code>FOR SYSTEM_TIME AS OF</code>.","Goes back up to 7 days."],
   ["Data scientists need a writable copy of a 30 TB table, cheaply.","A <b>table clone</b>.","You only pay for what changes. A snapshot is read-only."],
   ["A daily join with a small Cloud SQL table, without building a pipeline.","A <b>federated query</b> (<code>EXTERNAL_QUERY</code>).","Query directly without copying data."]],
  [["Long-term storage","Tables untouched for 90 days automatically cost ~50% less"],["Partition expiration","Old partitions are deleted automatically"],["Snapshot","A read-only copy at a point in time"]],
  []),
 S("Bigtable",
  "Bigtable is a giant phone book sorted only by <b>row key</b>. Design the row key around your main query, and <mark>never start a row key with a timestamp</mark>.",
  [["Main query: the 50 most recent readings for one truck.","Row key <code>truck_id#reverse_timestamp</code>.","Trucks are grouped, and the newest data comes first."],
   ["Row key <code>timestamp#device</code>, one node at 100% CPU.","<mark>Hotspot</mark> → change to <code>device#timestamp</code> (field promotion).","Adding nodes doesn't fix a hotspot. Diagnose with Key Visualizer."],
   ["Nightly batch analytics slow down the app.","Replicate to a second cluster + a <b>single-cluster routing app profile</b> for batch.","Workloads are separated per cluster."],
   ["Automatic failover is needed if a zone dies.","<b>Multi-cluster routing</b>.","High availability."],
   ["An HDD instance should become SSD.","Create a <b>new instance</b> and copy the data.","Storage type can't be changed."]],
  [["Field promotion","Moving a field into the row key"],["Salting","Adding a hash prefix. A fallback only, because range scans break"],["Tall &amp; narrow","One row per event for time series"]],
  ["Bigtable is a poor fit for small data (&lt;1 TB), multi-attribute queries, or multi-row transactions."]),
 S("Spanner, Cloud SQL, AlloyDB, Firestore, Memorystore",
  "They're all operational databases. The difference is scale, compatibility and access pattern.",
  [["Spanner with an auto-increment primary key, and write latency rises.","Switch to <mark>UUIDv4</mark> or a bit-reversed sequence.","Sequential keys cause hotspots."],
   ["Orders and line items are always read together in Spanner.","<b>Interleaved tables</b>.","Child rows are stored near their parent."],
   ["Report queries slow down Cloud SQL.","A <b>read replica</b>.","The read load moves to the replica."],
   ["Cloud SQL must keep running if a region fails.","A <mark>cross-region replica</mark> that gets promoted.","HA only protects against a zone failure."],
   ["Postgres needs to be faster and run analytics on live data, with minimal changes.","<mark>AlloyDB</mark>.","Postgres-compatible + columnar engine."],
   ["A product catalog is read thousands of times per second with the same queries.","<b>Memorystore</b> as a cache.","Cloud SQL's load drops."]],
  [["HA (Cloud SQL)","A standby in another zone"],["HTAP","Transactions + analytics in one database"],["Data Boost (Spanner)","Analytics without disturbing OLTP"]],
  []),
 S("Warehouse modelling & Dataplex",
  "Model data around the business questions, then govern the lake with Dataplex so it doesn't become a \"data swamp\".",
  [["Past sales must show the customer's region at the time of the sale.","<mark>SCD Type 2</mark> (valid_from, valid_to, is_current) + MERGE.","The history of changes is kept."],
   ["10 domain teams; need a central catalog, central policy and data quality, without moving data.","<mark>Dataplex</mark>: lakes/zones + Universal Catalog + data quality scans.","Federated governance / data mesh."],
   ["Spark is slow reading millions of 5 KB JSON files.","<b>Compact</b> them into larger Parquet/Avro files.","Per-file overhead dominates."]],
  [["Normalization","Splitting tables for integrity (OLTP)"],["Star schema","Big fact table + small dimensions"],["Lake → Zone → Asset","Dataplex's structure"]],
  [])
]};

PDE.guidesEn.d4 = {title:"Preparing & using data for analysis",color:"#d97706",intro:"Making data fast for BI, safe to share, and ready for ML/GenAI.",
sections:[
 S("Fast, cheap dashboards",
  "For BI on BigQuery there are three main weapons: <mark>BI Engine</mark> (in-memory), <mark>materialized views</mark> (automatically refreshed aggregates), and partition/cluster.",
  [["The dashboard must respond in under a second for many users.","<mark>BI Engine</mark>.","In-memory acceleration."],
   ["The same aggregation is queried over and over.","A <mark>materialized view</mark>.","Precomputed, refreshed automatically, and queries can be rewritten to use it."],
   ["Metric definitions must be consistent across the company.","<b>Looker</b> (LookML).","A central semantic layer."],
   ["A Looker Studio dashboard doesn't show the last hour of data.","Adjust the report's <b>data freshness / cache</b> in Looker Studio.","The issue is the report cache, not BigQuery."]],
  [["BI Engine","Fast memory for BI queries"],["Materialized view","A stored query result that updates automatically"],["Looker Studio","Formerly Data Studio"]],
  []),
 S("Slow or expensive queries",
  "Troubleshooting steps: read the execution plan → cut columns → filter on partition/cluster → filter before joining → avoid self-joins and skew.",
  [["Analysts use SELECT * and LIMIT 100, then get a surprise bill.","Select only the needed columns + filter on partitions.","<mark>LIMIT doesn't reduce bytes scanned.</mark>"],
   ["A big self-join to compute a running total.","A <b>window function</b>.","One scan, no join."],
   ["Want to know the cost before running a query.","A <b>dry run</b>, and set <b>maximum bytes billed</b>.","Prevents expensive mistakes."],
   ["Count unique users over billions of rows; an estimate is fine.","<code>APPROX_COUNT_DISTINCT</code>.","Much faster."]],
  [["Execution plan","Details of a query's stages, slots and shuffle"],["Skew","One key holds most of the data"]],
  []),
 S("Security when sharing data",
  "Choose by what you want to restrict: <b>query results</b>, <b>rows</b>, or <b>columns</b>.",
  [["A partner may see summaries but not the raw tables.","An <mark>authorized view</mark> in a separate dataset.","The view is authorized to read the source; users can only read the view."],
   ["Regional managers may only see their own region's rows.","A <mark>row-level access policy</mark>.","One table, filtered automatically per user/group."],
   ["The salary column is hidden from most users.","<mark>Policy tags</mark> (column-level security).","Only Fine-Grained Readers can read it."],
   ["Users may query the column, but the values are masked.","<b>Dynamic data masking</b>.","Hash, null, or the last 4 digits."]],
  [["Policy tag","A sensitivity label on a column (taxonomy in Dataplex)"],["Fine-Grained Reader","The role that can read protected columns"]],
  []),
 S("ML basics that come up often",
  "Many older questions ask about general ML concepts. Once you know the patterns, these are free points.",
  [["Great accuracy in training but poor on new data.","<mark>Overfitting</mark> → regularization (L1/L2), dropout, more data, fewer features.","The model memorizes instead of learning."],
   ["Poor in both training and test.","<b>Underfitting</b> → more features, a more complex model.","The model is too simple."],
   ["Fraud detection on data that's 1% fraud: 99% accuracy but useless.","Use <mark>precision/recall</mark>, not accuracy. Downsample or upweight.","Class imbalance."],
   ["Cancer detection: no case may be missed.","Prioritize <mark>recall</mark>.","Recall = of all positives, how many were caught."],
   ["A user_id feature has millions of values.","An <b>embedding</b> or hash buckets.","One-hot would be far too big."],
   ["Fashion preferences change over time.","Retrain regularly on a <b>mix of old + new data</b>.","Stays relevant without forgetting old patterns."]],
  [["L1","Pushes weights to 0 (feature selection)"],["L2","Shrinks all weights"],["Training-serving skew","Preprocessing in training differs from production"],["Data leakage","Target information \"leaks\" into the features"]],
  []),
 S("BigQuery ML, Vertex AI & pre-trained APIs",
  "Choose the ML tool by <b>who the user is</b> and <b>how custom</b> the need is.",
  [["SQL analysts want churn predictions from data in BigQuery.","<mark>BigQuery ML</mark> (<code>CREATE MODEL … logistic_reg</code>).","ML with just SQL."],
   ["OCR on invoices and sentiment analysis, no ML team.","<mark>Pre-trained APIs</mark>: Document AI, Natural Language, Vision, Translation.","No training needed."],
   ["A custom model with labelled data, but little coding.","<b>Vertex AI AutoML</b>.","Google trains the model."],
   ["Data scientists with TensorFlow/PyTorch and GPUs/TPUs.","<b>Vertex AI custom training</b>.","Full control."],
   ["Low-latency predictions for an app vs scoring millions of rows overnight.","<b>Online prediction</b> vs <b>batch prediction</b>.","Synchronous and fast vs asynchronous and large."],
   ["Forecast sales per store.","BigQuery ML <code>arima_plus</code>.","A time-series model."]],
  [["TRANSFORM (BQML)","Preprocessing that's automatically reused at prediction time"],["Feature Store","Consistent features for training and serving"],["Model Monitoring","Detects skew and drift"]],
  []),
 S("GenAI: embeddings, vector search & RAG",
  "An <b>embedding</b> turns text into a list of numbers, a point on a \"meaning map\". <b>RAG</b>: find the relevant document chunks, then give them to the LLM so its answer is based on your own data.",
  [["An internal chatbot that answers from thousands of SOP PDFs.","RAG: chunk → <code>ML.GENERATE_EMBEDDING</code> → vector index → <code>VECTOR_SEARCH</code> → Gemini.","Answers grounded in your own documents."],
   ["Documents are updated often and the chatbot's answers go stale.","Re-embed changed documents incrementally.","Keeping embeddings fresh is a data engineer's job."]],
  [["Chunking","Splitting documents into small pieces"],["Vector index","An index for finding the nearest embeddings"]],
  []),
 S("Sharing data",
  "<mark>Analytics Hub</mark> (now BigQuery sharing): the publisher creates a listing, the subscriber gets a <b>linked dataset</b> with no data copy. The data is always current, and subscribers pay for their own queries.",
  [["Share a dataset with 30 external partners, always fresh, without copies.","<mark>Analytics Hub</mark>.","Linked datasets."],
   ["Two companies want joint analysis without seeing each other's raw data.","A <b>data clean room</b>.","Privacy rules such as minimum aggregation apply."]],
  [["Linked dataset","A read-only pointer to the publisher's data"],["Exchange / listing","The place and the item being shared"]],
  ["Compute cost is paid by the project that <b>runs</b> the query; storage by the table owner."])
]};

PDE.guidesEn.d5 = {title:"Maintaining & automating data workloads",color:"#db2777",intro:"\"Day two\" work: cost, capacity, scheduling, monitoring, and failure-resistant design.",
sections:[
 S("BigQuery cost",
  "There are two models: <b>on-demand</b> (pay per TiB scanned) and <mark>Editions</mark> (pay for compute slots: reservations with a baseline + autoscaling, optional 1/3-year commitments). Flat-rate no longer exists.",
  [["The on-demand bill is large and unpredictable, and the workload is steady.","<mark>BigQuery Editions</mark> + a reservation (baseline + autoscaling).","Spend becomes predictable."],
   ["Nightly ETL slows down the morning dashboards.","<b>Separate reservations</b> for ETL and BI, with each project assigned to its own.","Workload isolation."],
   ["Stop one user from burning the budget with huge queries.","A <b>custom quota</b> per user/project + maximum bytes billed.","A hard limit."],
   ["Reports aren't urgent and can wait.","<b>Batch priority</b>.","Doesn't count toward the concurrent query limit."]],
  [["Slot","A unit of BigQuery compute"],["Baseline","Slots that are always available"],["Commitment","A long-term slot contract for a discount"]],
  []),
 S("Saving money in other services",
  "Every service has its own way to save.",
  [["Dataproc sits idle at night.","Ephemeral clusters, scheduled deletion, Spot secondary workers, autoscaling.","Pay only while jobs run."],
   ["A Dataflow batch job that isn't urgent.","<b>FlexRS</b>.","A discount for a flexible schedule."],
   ["Logs in GCS are rarely read after 30 days.","A lifecycle rule to Coldline/Archive, or Autoclass.","Colder classes are cheaper."],
   ["Want to see which team spends the most.","<b>Labels</b> + billing export to BigQuery.","Cost analysis per team or job."]],
  [],[]),
 S("Automation with Composer",
  "A good DAG is <mark>idempotent</mark> (safe to rerun), uses date parameters, and pushes the heavy work to BigQuery/Dataflow instead of Composer workers.",
  [["Rerunning yesterday's job doubled the data.","Write with <code>WRITE_TRUNCATE</code> per partition, or <code>MERGE</code>.","Idempotent: reruns don't create duplicates."],
   ["Need to reprocess the last 30 days.","<b>Backfill</b> the DAG using the <code>{{ ds }}</code> parameter.","A date-parameterized DAG."],
   ["Composer tasks sit in the \"queued\" state for a long time.","Scale the environment: more workers / concurrency.","Not enough worker capacity."],
   ["Wait until a partner's file lands in GCS.","A <b>sensor</b> (GCS object sensor).","The task waits until the condition is met."]],
  [["Backfill","Running a DAG for past dates"],["Catchup","Airflow option to run missed runs"]],
  []),
 S("Monitoring & troubleshooting",
  "Cloud Monitoring for metrics and alerts, Cloud Logging for logs (which can become metrics or be exported), and INFORMATION_SCHEMA.JOBS for BigQuery query forensics.",
  [["Want an alert when a streaming pipeline falls behind.","A Cloud Monitoring alert on Dataflow <b>system lag / data freshness</b> or Pub/Sub <b>oldest_unacked_message_age</b>.","The right metric."],
   ["Which queries were the most expensive this month?","<b>INFORMATION_SCHEMA.JOBS</b> / admin resource charts.","The history of every job."],
   ["429 / quotaExceeded / rateLimitExceeded errors appear.","<mark>Exponential backoff</mark>, then request more quota if it keeps happening.","Retry with ever-longer waits."],
   ["A job fails with \"permission denied\".","Check the <b>service account</b> the job runs as, not your own account.","Jobs run with a service account's identity."],
   ["Logs need to be analysed with SQL.","A <b>log sink</b> to BigQuery.","Sinks can also go to GCS (archive) or Pub/Sub (SIEM)."]],
  [["Log-based metric","A metric built from a text pattern in logs"],["Error Reporting / Trace","App exceptions / request latency"]],
  []),
 S("Designing for failure",
  "Keep immutable raw data, make pipelines idempotent, send broken records to a dead-letter, and choose replication to match your RPO/RTO.",
  [["A BigQuery table was deleted yesterday.","<b>Time travel</b> or undelete (within 7 days).","The fastest recovery."],
   ["A BigQuery region goes down, and critical dashboards must keep working.","<b>Cross-region replication</b> / managed disaster recovery (Enterprise Plus).","Fail over to another region."],
   ["A subscriber had a bug, and messages need reprocessing.","Pub/Sub <b>seek</b> to a snapshot/timestamp.","Replay."],
   ["A Dataproc cluster dies mid-job.","The data is in GCS, so just recreate the cluster and rerun the job.","Storage is separate from compute."],
   ["Corrupt data arrives from a source.","Validate at ingest → dead-letter → reprocess from the raw copy in GCS.","A raw copy exists to reprocess from."]],
  [["Idempotent","Running it many times gives the same result"],["Failover","Switching automatically to a backup"]],
  [])
]};
})();
