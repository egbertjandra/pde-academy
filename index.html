(function(){
PDE.i18n = PDE.i18n || {lessons:{},q:{},flash:{},tools:{},dom:{}};
const X=PDE.i18n;
X.dom.d3={short:"Storing",name:"Menyimpan data (Storing the data)",blurb:"Memilih database yang tepat adalah skill yang paling sering diuji di PDE. Kuasai ini, maka sepertiga ujian jadi lebih mudah."};

X.lessons["d3-l1"]={title:"Pohon keputusan storage",why:"Relasional + transaksi + global + strong consistency adalah ciri khas Spanner. Cloud SQL hanya regional dan scale up, bukan scale out. Bigtable tidak punya transaksi multi-baris. BigQuery untuk analitik, bukan OLTP.",
 cards:[
 {h:"Tanyakan ini berurutan",b:`<ol><li><b>File atau objek?</b> → Cloud Storage</li><li><b>Analitik di banyak baris?</b> → BigQuery</li><li><b>OLTP relasional?</b> → Cloud SQL (regional) · AlloyDB (Postgres cepat) · <mark>Spanner (global, horizontal)</mark></li><li><b>NoSQL, lookup per key di skala besar?</b> → <mark>Bigtable</mark></li><li><b>Dokumen app?</b> → Firestore</li><li><b>Cache?</b> → Memorystore</li></ol><div class="box brain"><div class="l">Exam brain</div>Lingkari kata penentunya: <b>global</b>, <b>&lt;10 ms</b>, <b>time series</b>, <b>SQL analytics</b>, <b>transactions</b>, <b>mobile offline</b>, <b>sub-millisecond</b>.</div>`},
 {h:"Tabel contekan",b:`<table><tr><th>Service</th><th>Paling cocok untuk</th></tr><tr><td>Cloud Storage</td><td>Lake, arsip, staging</td></tr><tr><td>BigQuery</td><td>Analitik skala PB, hitungan detik</td></tr><tr><td>Cloud SQL</td><td>OLTP regional, scale up</td></tr><tr><td>AlloyDB</td><td>Postgres berat + HTAP</td></tr><tr><td>Spanner</td><td>OLTP global, 99.999%</td></tr><tr><td>Bigtable</td><td>IoT/time series, &lt;10 ms</td></tr><tr><td>Firestore</td><td>Dokumen app mobile/web</td></tr><tr><td>Memorystore</td><td>Cache sub-milidetik</td></tr></table>`},
 {h:"Empat jebakan klasik",b:`<div class="box trap"><div class="l">Trap</div><ul><li><mark>BigQuery bukan OLTP.</mark> App yang lookup satu baris → jangan pernah BigQuery.</li><li><mark>Bigtable tidak punya join atau secondary index.</mark> "Cari berdasarkan banyak atribut" → bukan Bigtable.</li><li>Bigtable berlebihan untuk data kecil (jauh di bawah 1 TB).</li><li><mark>Cloud SQL tidak scale out untuk write.</mark> Global + write besar → Spanner.</li></ul></div><p>Coba tool <b>Storage Picker</b> di domain ini untuk latihan alurnya.</p>`}],
 keys:["File → GCS · analitik → BigQuery · OLTP regional → Cloud SQL · OLTP global → Spanner · lookup per key skala besar → Bigtable · dokumen app → Firestore · cache → Memorystore","Baca batasannya dulu. Itu yang menentukan jawaban."]};

X.lessons["d3-l2"]={title:"Cloud Storage: storage class & lifecycle",why:"Retention policy yang di-lock (Bucket Lock) adalah satu-satunya opsi yang membuat penghapusan mustahil, bahkan untuk admin (WORM). Archive paling murah untuk data yang hampir tidak pernah dibaca. IAM bisa diubah balik oleh admin, dan versioning tidak mencegah penghapusan.",
 cards:[
 {h:"Empat kelas, empat batas minimum",b:`<table><tr><th>Class</th><th>Durasi minimum</th><th>Akses</th></tr><tr><td>Standard</td><td>tidak ada</td><td>Sering</td></tr><tr><td>Nearline</td><td><mark>30 hari</mark></td><td>~Bulanan</td></tr><tr><td>Coldline</td><td><mark>90 hari</mark></td><td>~Per kuartal</td></tr><tr><td>Archive</td><td><mark>365 hari</mark></td><td>&lt; setahun sekali</td></tr></table><p><mark>Semua kelas bisa diakses dalam milidetik.</mark> Makin dingin = simpan makin murah, baca makin mahal.</p>`},
 {h:"Otomatiskan",b:`<ul><li><b>Lifecycle rules</b>: ganti kelas atau hapus berdasarkan umur, misalnya <mark>"Coldline setelah 90 hari, hapus setelah 7 tahun"</mark>.</li><li><b>Autoclass</b>: GCS memindahkan setiap objek berdasarkan akses sebenarnya. Pilih ini kalau polanya tidak diketahui.</li><li><b>Object versioning</b> menyimpan versi lama. <b>Soft delete</b> menyimpan objek yang terhapus selama 7 hari (default).</li></ul>`},
 {h:"Lokasi, kunci & akses",b:`<ul><li><b>Region</b> (paling murah, dekat compute) · <b>dual-region</b> (dua region tertentu, <mark>turbo replication = RPO 15 menit</mark>) · <b>multi-region</b> (US/EU/ASIA).</li><li><mark>Retention policy + Bucket Lock = WORM</mark>: tidak bisa dihapus sebelum masa simpan habis.</li><li><b>Signed URL</b>: akses sementara untuk orang tanpa akun Google.</li><li>Uniform bucket-level access = hanya IAM (direkomendasikan).</li></ul><div class="box pic"><div class="l">Bayangkan</div>Storage class itu seperti rumah: ruang tamu (Standard), garasi (Nearline), loteng (Coldline), dan gudang sewaan di ujung kota (Archive). Semuanya bisa dibuka seketika, tapi makin jauh, makin mahal ongkos setiap kali ke sana.</div>`}],
 keys:["Minimum 30 / 90 / 365 hari untuk Nearline / Coldline / Archive","Tidak boleh dihapus selama N tahun → retention policy + Bucket Lock","Pola diketahui → lifecycle rule; tidak diketahui → Autoclass"]};

X.lessons["d3-l3"]={title:"BigQuery: partitioning & clustering",why:"Partitioning membuang semua data di luar tanggal yang difilter, lalu clustering melewati blok di dalam partisi. LIMIT tidak mengurangi byte yang di-scan. View tidak mengubah layout storage. Slot mengubah kecepatan, bukan byte yang ditagih.",
 cards:[
 {h:"Cara kamu bayar (on-demand)",b:`<div class="box pic"><div class="l">Bayangkan</div>BigQuery menagih setiap rak yang kamu lewati, bukan buku yang kamu ambil. Partisi = ruangan per tanggal. Clustering = rak yang diurutkan. Lebih sedikit kolom = lebih sedikit lorong (storage kolumnar).</div><p><mark>LIMIT tidak mengurangi byte yang di-scan</mark> di tabel biasa. <code>SELECT *</code> adalah musuh.</p>`},
 {h:"Partitioning",b:`<ul><li>Jenis: <b>time-unit column</b> (DATE/TIMESTAMP/DATETIME per jam/hari/bulan/tahun), <b>ingestion time</b> (<code>_PARTITIONTIME</code>), <b>integer range</b>.</li><li><mark>require_partition_filter</mark> mencegah full scan yang tidak disengaja.</li><li><b>Partition expiration</b> menghapus partisi lama secara otomatis.</li><li><mark>Tabel yang sudah ada tidak bisa dipartisi langsung</mark>. Pakai <code>CREATE TABLE … PARTITION BY … AS SELECT</code>.</li><li>Ada batas jumlah partisi per tabel (ribuan), jadi jangan pakai partisi per jam untuk data bertahun-tahun.</li></ul>`},
 {h:"Clustering",b:`<ul><li>Mengurutkan storage berdasarkan <mark>sampai 4 kolom</mark>. Paling cocok untuk filter kolom dengan nilai unik banyak (customer_id, sku).</li><li>Bisa dengan atau tanpa partisi. Re-clustering otomatis dan gratis.</li><li><mark>"Partition by date, cluster by customer_id"</mark> adalah jawaban klasik.</li></ul><div class="box brain"><div class="l">Exam brain</div>Filter tanggal (nilai unik sedikit) → partition. Filter ID (nilai unik banyak) → cluster. Dua-duanya → pakai keduanya.</div>`}],
 keys:["Partition di kolom tanggal yang difilter; cluster di filter dengan nilai unik banyak (≤4 kolom)","LIMIT ≠ lebih murah. Pilih kolom yang dibutuhkan saja","Tabel yang sudah ada → CTAS ke tabel partitioned baru"]};

X.lessons["d3-l4"]={title:"BigQuery: desain schema & loading",why:"Nested/repeated fields menyimpan data anak bersama baris induknya, jadi join-nya hilang. Normalisasi lebih jauh malah menambah join. Cloud SQL tidak kuat untuk skala analitik ini. Date-sharding adalah pola yang sudah usang.",
 cards:[
 {h:"Denormalisasi ala BigQuery",b:`<ul><li><mark>Nested &amp; repeated fields</mark> (STRUCT / ARRAY) sebagai pengganti join besar.</li><li>Star schema juga boleh: dimensi kecil di-join ke fact besar.</li><li>Hindari self-join di tabel raksasa → pakai <b>window function</b>.</li><li>Hindari DML satu baris yang sering → batch-kan, atau pakai <code>MERGE</code>.</li><li><mark>Tabel partitioned lebih baik daripada tabel date-sharded</mark> (<code>events_20260101</code>…).</li></ul>`},
 {h:"Memasukkan data",b:`<ul><li><mark>Batch load job gratis</mark> (pakai slot bersama).</li><li>Format terbaik: <mark>Avro</mark> (schema ada di file, blok terkompresi, bisa dibaca paralel). Lalu Parquet/ORC, lalu CSV/JSON.</li><li>Streaming: <mark>Storage Write API</mark> (lebih murah, exactly-once dengan committed stream) &gt; <code>insertAll</code> lama. Atau Pub/Sub BigQuery subscription.</li></ul>`},
 {h:"Query data di tempat asalnya",b:`<ul><li><b>External table</b>: file GCS, Google Sheets, Bigtable. Lebih lambat, tapi tidak perlu copy.</li><li><b>Federated query</b>: <code>EXTERNAL_QUERY</code> ke Cloud SQL / AlloyDB / Spanner.</li><li><b>BigLake</b>: tabel lake format terbuka (Iceberg/Parquet) dengan security baris/kolom.</li><li><b>BigQuery Omni</b>: query data di S3/Azure tanpa memindahkannya.</li><li><b>Object table</b>: file tidak terstruktur (gambar, PDF) sebagai tabel, siap untuk ML.</li></ul>`}],
 keys:["Nested/repeated lebih baik daripada join untuk analitik parent-child","Avro untuk load, Storage Write API untuk stream","Tabel partitioned, bukan date-sharded"]};

X.lessons["d3-l5"]={title:"BigQuery: backup, recovery & biaya storage",why:"Time travel menyimpan riwayat sampai 7 hari (2–7 hari, bisa diatur), jadi query AS OF sebelum perubahan bisa memulihkannya dalam hitungan menit. Fail-safe untuk setelah jendela time travel dan butuh Google support. Opsi lain lambat dan kehilangan data terbaru.",
 cards:[
 {h:"Tool pemulihan",b:`<table><tr><th>Tool</th><th>Dipakai untuk</th></tr><tr><td>Time travel</td><td><mark>2–7 hari terakhir</mark>, <code>FOR SYSTEM_TIME AS OF</code></td></tr><tr><td>Fail-safe</td><td>7 hari tambahan, lewat Google support</td></tr><tr><td>Table snapshot</td><td>Salinan read-only titik-waktu yang murah, disimpan selama yang kamu mau</td></tr><tr><td>Table clone</td><td>Salinan ringan yang bisa diubah untuk testing</td></tr><tr><td>Cross-region replication</td><td>Salinan DR dataset di region lain</td></tr></table>`},
 {h:"Cara menekan biaya storage",b:`<ul><li><mark>Long-term storage: 90 hari tidak diubah → ~50% lebih murah</mark>, otomatis.</li><li><b>Table / partition expiration</b> untuk data sementara.</li><li><b>Physical (compressed) billing</b> bisa jauh lebih murah untuk data yang mudah dikompresi.</li><li><b>Lokasi dataset tidak bisa diubah setelah dibuat</b>. Kalau mau pindah, copy ke dataset baru.</li></ul>`}],
 keys:["Salah dalam seminggu terakhir → time travel","Backup jangka panjang → table snapshot","90 hari tidak disentuh → harga long-term otomatis"]};

X.lessons["d3-l6"]={title:"Bigtable: model data & row key",why:"Memulai dengan truck_id mengelompokkan baris setiap truk dan menyebarkan write ke banyak node. Reverse timestamp mengurutkan data terbaru di depan, jadi 50 data terakhir cukup di-scan sedikit dari awal. Key yang diawali timestamp bikin hotspot, dan UUID membuat \"data terbaru satu truk\" jadi full scan.",
 cards:[
 {h:"Ini buku telepon raksasa",b:`<div class="box pic"><div class="l">Bayangkan</div>Bigtable itu buku telepon yang hanya diurutkan berdasarkan <b>row key</b>. Mencari satu nama langsung ketemu. "Semua orang yang tinggal di Jalan Sudirman" artinya membaca seluruh buku.</div><ul><li>Baris → <b>column family</b> → kolom → cell dengan timestamp. Sparse: cell kosong gratis.</li><li><mark>Satu-satunya index adalah row key</mark>, diurutkan secara leksikografis. Bisa point lookup, prefix scan dan range scan.</li><li><b>Atomic hanya di satu baris</b>.</li><li>Throughput naik <mark>linear dengan jumlah node</mark>. Mendukung autoscaling.</li><li>API kompatibel HBase: mudah migrasi dari HBase.</li></ul>`},
 {h:"Aturan row key",b:`<table><tr><th>Lakukan</th><th>Jangan</th></tr><tr><td>Awali dengan yang di-query: <code>device#metric#ts</code></td><td><mark>Awali dengan timestamp → hotspot</mark></td></tr><tr><td><mark>Field promotion</mark> dulu</td><td>ID berurutan sebagai prefix</td></tr><tr><td>Salting kalau perlu saja</td><td>Hash key kalau butuh range scan</td></tr><tr><td><mark>Reverse timestamp</mark> untuk yang terbaru duluan</td><td>Key yang panjang</td></tr><tr><td>Tall &amp; narrow untuk time series</td><td>Versi tanpa batas di satu baris</td></tr></table>`},
 {h:"Diagnosis dulu sebelum scaling",b:`<div class="box brain"><div class="l">Exam brain</div>"Satu node kewalahan, latency tidak merata" → <b>hotspot karena row key yang buruk</b>. Diagnosis dengan <mark>Key Visualizer</mark>, perbaiki dengan mendesain ulang key. <mark>Menambah node tidak menyelesaikan hotspot.</mark></div><ul><li>Bigtable berlebihan untuk data kecil (jauh di bawah 1 TB).</li><li>Untuk tes performa yang realistis, pakai ≥300 GB dan jalankan 10+ menit.</li></ul>`}],
 keys:["Row key = query utamamu. Jangan pernah diawali timestamp","Field promotion sebelum salting; reverse timestamp untuk terbaru duluan","Beban tidak merata → Key Visualizer → perbaiki key"]};

X.lessons["d3-l7"]={title:"Bigtable: replikasi & operasional",why:"Replikasi plus app profile memisahkan workload: app memakai satu cluster dan batch memakai cluster lain. Menambah node membantu, tapi batch tetap bersaing dengan app. BigQuery bukan untuk serving latency rendah. HDD membuat latency lebih buruk.",
 cards:[
 {h:"Replikasi & app profile",b:`<ul><li>Satu instance bisa punya <b>beberapa cluster</b> di zona/region berbeda dengan replikasi otomatis (eventually consistent antar cluster).</li><li><mark>Multi-cluster routing</mark>: failover otomatis, high availability.</li><li><mark>Single-cluster routing</mark>: read-your-writes, dan <b>memisahkan workload</b>.</li></ul>`},
 {h:"Fakta operasional",b:`<ul><li><mark>SSD ↔ HDD tidak bisa diganti.</mark> Buat instance baru lalu copy datanya (Dataflow atau export/import).</li><li>HDD hanya untuk data besar, kebanyakan batch, dan sensitif biaya.</li><li>Delete/update sebenarnya write baru, dibersihkan nanti oleh <b>compaction</b> + <b>garbage-collection policy</b> (max versi / max umur), jadi menghapus data sementara menambah storage.</li><li>Taruh client di region/zona yang sama dengan cluster.</li></ul>`}],
 keys:["Pisahkan workload → replikasi + app profile","HA → multi-cluster routing","SSD/HDD permanen per instance"]};

X.lessons["d3-l8"]={title:"Spanner",why:"Key berurutan mengirim setiap baris baru ke split yang sama, jadi satu server menanggung semua write. UUIDv4 atau bit-reversed sequence menyebarkannya. Menambah node dan index tidak menyelesaikan hotspot.",
 cards:[
 {h:"Apa yang membuat Spanner istimewa",b:`<ul><li>Relasional + SQL + ACID + <mark>scale horizontal</mark> + <mark>strong (external) consistency global</mark> berkat TrueTime.</li><li>SLA: 99.99% regional, <mark>99.999% multi-region</mark>.</li><li>Scale dengan node / processing unit, dengan autoscaling.</li><li>Dipakai untuk ledger bank, inventory global, dan state game saat Cloud SQL tidak sanggup.</li></ul>`},
 {h:"Aturan desain",b:`<ul><li><mark>Hindari primary key yang terus naik</mark>: pakai UUIDv4 atau bit-reversed sequence.</li><li><mark>Interleaved tables</mark>: baris anak disimpan secara fisik bersama induknya (baca parent-child cepat).</li><li><b>Data Boost</b>: jalankan analitik atau federated query BigQuery tanpa mengganggu kapasitas OLTP.</li><li>Point-in-time recovery + backup untuk menangani kegagalan.</li></ul>`}],
 keys:["Global + relasional + strongly consistent + skala besar → Spanner","Jangan pakai primary key berurutan","Interleave tabel anak dengan induknya"]};

X.lessons["d3-l9"]={title:"Cloud SQL & AlloyDB",why:"Read replica menampung beban baca yang boleh sedikit tertinggal. HA hanya standby untuk failover dan tidak melayani read. Spanner adalah redesign besar yang tidak diperlukan. Ukuran storage tidak mempercepat query.",
 cards:[
 {h:"Cloud SQL dalam 30 detik",b:`<ul><li>MySQL / PostgreSQL / SQL Server yang di-manage. <b>Scale up, bukan scale out.</b></li><li><mark>HA = regional instance dengan standby di zona lain</mark> (failover otomatis saat zona mati).</li><li><mark>Read replica</mark> menampung beban baca. <mark>Cross-region replica</mark> = DR saat region mati (di-promote).</li><li>Backup otomatis + point-in-time recovery.</li><li>Koneksi lewat Cloud SQL Auth Proxy / private IP. Migrasi masuk dengan Database Migration Service.</li></ul>`},
 {h:"Kapan AlloyDB lebih baik dari Cloud SQL",b:`<ul><li>Kompatibel PostgreSQL, dengan throughput transaksi yang jauh lebih tinggi.</li><li><mark>Columnar engine bawaan → analitik cepat di data operasional yang live (HTAP)</mark>.</li><li>Read pool, HA, vector search (AlloyDB AI).</li></ul><div class="box brain"><div class="l">Exam brain</div>"Tetap Postgres, butuh performa lebih atau analitik di data yang sama, perubahan app minimal" → <b>AlloyDB</b>. "Write global, skala tak terbatas" → <b>Spanner</b>.</div>`}],
 keys:["Zona mati → HA · region mati → cross-region replica · beban baca → read replica","Postgres lebih cepat + HTAP → AlloyDB"]};

X.lessons["d3-l10"]={title:"Firestore & Memorystore",why:"Read berulang yang identik untuk data yang jarang berubah adalah kasus cache klasik: Memorystore melayaninya di bawah 1 milidetik dan mengurangi beban Cloud SQL. Opsi lain adalah redesign mahal yang tidak menyasar masalah sebenarnya.",
 cards:[
 {h:"Firestore",b:`<ul><li>Database <b>dokumen</b> serverless. Field di-index otomatis, jadi bisa query berdasarkan property (beda dengan Bigtable).</li><li><mark>Transaksi ACID, real-time listener, sinkronisasi offline untuk mobile/web.</mark></li><li>Native mode vs <mark>Datastore mode</mark> (dump lama menyebut "Datastore").</li><li>Analitik berat → export ke BigQuery.</li></ul>`},
 {h:"Memorystore",b:`<ul><li><b>Redis / Valkey / Memcached</b> yang di-manage, sub-milidetik.</li><li>Dipakai untuk: <mark>cache hasil query yang sering dibaca, session state, leaderboard</mark>, rate limiting.</li><li>Ini cache, bukan sumber data utama.</li></ul>`}],
 keys:["Dokumen mobile/web + offline → Firestore","Read berulang yang panas → cache Memorystore"]};

X.lessons["d3-l11"]={title:"Modelling data warehouse",why:"SCD Type 2 menyimpan setiap versi customer beserta periode berlakunya, jadi setiap order di-join ke region yang berlaku saat order terjadi. Type 1 menimpa riwayat, dan reload malam juga menghilangkannya.",
 cards:[
 {h:"Mulai dari pertanyaannya",b:`<ul><li>Siapa yang query apa, seberapa sering, dan seberapa segar datanya harus? Desain berdasarkan <b>pola akses</b>.</li><li><b>Normalisasi</b> (3NF) untuk integritas OLTP. <mark>Denormalisasi</mark> (star schema, nested/repeated) untuk analitik.</li><li>Dataset per <b>domain + batas akses</b> (<code>finance_raw</code>, <code>finance_curated</code>), karena IAM paling mudah diatur per dataset.</li></ul>`},
 {h:"Slowly changing dimensions",b:`<ul><li><b>Type 1</b>: timpa, tanpa riwayat.</li><li><mark>Type 2</mark>: baris baru setiap ada perubahan, dengan <code>valid_from</code>, <code>valid_to</code>, <code>is_current</code>.</li><li>Upsert dengan <code>MERGE</code> di BigQuery (atau Dataform).</li></ul>`}],
 keys:["Analitik → denormalisasi; OLTP → normalisasi","Simpan riwayat → SCD Type 2 + MERGE"]};

X.lessons["d3-l12"]={title:"Data lake & Dataplex",why:"Dataplex mengatur bucket dan dataset yang sudah ada menjadi lake dan zone dengan governance pusat, katalog, profiling, quality dan lineage, tanpa memindahkan data. Mengumpulkan copy ke satu tempat merusak kepemilikan domain dan menduplikasi data.",
 cards:[
 {h:"Dari rawa jadi platform",b:`<div class="box pic"><div class="l">Bayangkan</div>Lake tanpa governance itu rawa (data swamp). Dataplex adalah pustakawan sekaligus inspektur kesehatan: tahu isi setiap bucket dan tabel, siapa pemiliknya, seberapa bagus kualitasnya, dan dari mana asalnya.</div><ul><li><mark>Lake → Zone (raw / curated) → Asset</mark> (bucket GCS, dataset BigQuery).</li><li><b>Dataplex Universal Catalog</b> (dulu Data Catalog): pencarian, metadata, glosarium.</li><li><mark>Data profiling + data quality scan</mark> dengan aturan dan alert.</li><li><b>Lineage</b> lintas BigQuery, Dataflow, Composer, Dataproc.</li></ul>`},
 {h:"Data mesh & biaya lake",b:`<ul><li><mark>Federated governance</mark>: tim domain memiliki data product-nya, policy pusat tetap berlaku. Itu Dataplex + BigQuery + Analytics Hub.</li><li>Biaya lake: lifecycle rules/Autoclass, partition expiration, <mark>gabungkan banyak file kecil jadi file besar yang lebih sedikit</mark>.</li></ul>`}],
 keys:["Temukan + atur + quality + lineage tanpa memindahkan data → Dataplex","Banyak file kecil bikin lambat → gabungkan"]};

/* questions: explanations in Indonesian */
const q=(id,tip,...w)=>{X.q[id]={w,tip};};
q("d3q01","Frekuensi akses menentukan kelas (bulanan → Nearline). Lifecycle rule mengotomatiskan perpindahan kelas dan penghapusan.",
 "Standard lebih mahal dari yang diperlukan untuk akses bulanan, dan menghapus manual rawan lupa.",
 "Benar. Nearline cocok untuk akses sekitar sebulan sekali (minimum 30 hari), dan lifecycle Delete di hari ke-180 mengotomatiskan penghapusan.",
 "Archive punya minimum 365 hari dan biaya retrieval mahal. Restore bulanan akan jauh lebih mahal.",
 "Retrieval Coldline lebih mahal dari Nearline untuk akses bulanan, dan versioning tidak menghapus apa pun.");
q("d3q02","Pola akses diketahui → lifecycle rule. Pola tidak diketahui → Autoclass.",
 "Benar. Polanya sudah jelas, jadi lifecycle rule memindahkan objek ke Coldline (akses sesekali) setelah masa sibuk dan menghapusnya di tahun pertama.",
 "Editing berat di 30 hari pertama akan memicu biaya retrieval dan early-deletion Nearline.",
 "Minimum 365 hari dan biaya retrieval tinggi di Archive tidak cocok untuk data yang dibaca beberapa kali setahun dan dihapus setelah setahun.",
 "Tidak ada optimasi biaya sama sekali. Soft delete hanya membantu pemulihan.");
q("d3q03","Akses sementara untuk orang tanpa akun Google → signed URL.",
 "Akses publik membuka file untuk siapa saja dan bergantung pada kamu ingat untuk mengembalikannya.",
 "Bisa, tapi berat dan meninggalkan akses permanen yang harus dibersihkan.",
 "Benar. Signed URL memberi akses terbatas waktu ke satu objek tanpa perlu identitas Google.",
 "Mereka tidak punya project atau akun Google Cloud, jadi ini tidak bisa.");
q("d3q04","RPO 15 menit untuk GCS → dual-region + turbo replication.",
 "Copy harian berarti bisa kehilangan data sampai 24 jam, jauh di atas RPO 15 menit.",
 "Replikasi multi-region asinkron tanpa jaminan RPO 15 menit, dan kamu tidak bisa memilih region spesifiknya.",
 "Benar. Dual-region memungkinkan memilih dua region, dan turbo replication menargetkan RPO 15 menit.",
 "Versioning melindungi dari overwrite, bukan dari kehilangan region.");
q("d3q05","\"Tidak boleh double-spend\" + global + highly available → Spanner.",
 "Replika hanya read-only, jadi write tetap ke satu region primer, dan failover-nya tidak mulus.",
 "Satu region tidak tahan saat region mati, dan tidak dirancang untuk transaksi relasional yang konsisten global di skala ini.",
 "Benar. Transaksi ACID yang strongly consistent secara global dengan availability 99.999% lintas region.",
 "Replikasi Bigtable eventually consistent dan tanpa transaksi multi-baris, jadi double-spend bisa terjadi.");
q("d3q06","Time series + write masif + read <10 ms → Bigtable. Analitik berat tetap bisa ke BigQuery.",
 "Bagus untuk analisis mingguan, tapi tidak untuk point read di bawah 10 ms dari aplikasi.",
 "Satu primer tidak mungkin menampung 2 juta write per detik.",
 "Benar. Dibuat untuk throughput write masif dan read per key/range time series dengan latency rendah. Export atau federasi ke BigQuery untuk analitik.",
 "Cache in-memory, bukan penyimpanan tahan lama untuk data bertahun-tahun.");
q("d3q07","Mobile + sinkronisasi offline + dokumen fleksibel → Firestore.",
 "Benar. SDK mobile Firestore menyediakan persistensi offline dan sinkronisasi otomatis, dengan model dokumen yang fleksibel.",
 "Tidak ada sinkronisasi offline untuk mobile, dan berlebihan untuk dokumen profil.",
 "Butuh lapisan API custom dan tidak punya sinkronisasi offline bawaan.",
 "Object storage, bukan database app yang bisa di-query.");
q("d3q08","Analitik SQL + data besar + tanpa infrastruktur → BigQuery.",
 "Bisa, tapi kamu harus mengurus cluster, padahal tim jelas tidak mau.",
 "Benar. Warehouse serverless skala petabyte dengan SQL standar dan koneksi BI bawaan.",
 "Tidak dirancang untuk scan analitik ratusan TB.",
 "Tidak ada join SQL atau agregasi di kolom sembarang.");
q("d3q09","Tanda bahaya Bigtable: data kecil, cari berdasarkan banyak atribut, transaksi multi-baris, join SQL.",
 "Benar (tidak cocok). Datanya kecil, dan Bigtable tidak bisa query berdasarkan banyak atribut karena tidak ada secondary index.",
 "Cocok: time series berbasis key dengan throughput tinggi.",
 "Benar (tidak cocok). Bigtable hanya atomic di satu baris, tidak ada transaksi multi-baris.",
 "Cocok: lookup per key dengan throughput tinggi dan latency rendah.");
q("d3q10","Key diawali timestamp → hotspot. Perbaiki dengan field promotion; salting adalah cadangan.",
 "Write baru tetap jatuh di range key yang sama, jadi hotspot-nya ikut pindah. Node tidak memperbaiki key yang buruk.",
 "Benar. Field promotion: diawali device menyebarkan write ke seluruh key space sambil tetap bisa range scan per device.",
 "Salting memang menyebarkan write, tapi membaca satu device berarti scan 100 range. Pakai hanya kalau field promotion tidak cukup.",
 "Tidak bisa diganti di tempat, dan tipe storage bukan penyebab hotspot.");
q("d3q11","Desain row key sesuai urutan query paling umum: entitas dulu, lalu waktu.",
 "Hotspot di tanggal hari ini, dan event satu user tersebar di banyak tanggal.",
 "Benar. Satu prefix scan per user, di-range berdasarkan timestamp, dan write tersebar ke banyak user.",
 "Write tersebar, tapi query range per user jadi full table scan.",
 "Mengelompokkan berdasarkan tipe, bukan user dan waktu, jadi query utamanya mahal.");
q("d3q12","SSD ↔ HDD permanen per instance → instance baru + copy.",
 "Tipe storage tidak bisa diubah setelah instance dibuat.",
 "Benar. Migrasi ke instance baru adalah satu-satunya cara mengganti tipe storage.",
 "Node tambahan menambah throughput tapi tidak memberi latency setara SSD.",
 "Semua cluster di satu instance memakai tipe storage yang sama.");
q("d3q13","HA Bigtable → multi-cluster routing. Isolasi workload → single-cluster routing per workload.",
 "Benar. Replikasi plus multi-cluster routing otomatis failover ke cluster yang sehat.",
 "Pemulihan lambat dan bisa kehilangan data sampai sehari, jadi ini bukan failover otomatis.",
 "Node tambahan tidak membantu kalau zonanya sendiri yang mati.",
 "Single-cluster routing mengunci traffic ke satu cluster, jadi tidak ada failover otomatis.");
q("d3q14","Time series di Bigtable → baris tall & narrow.",
 "Baris tumbuh tanpa batas, berisiko melewati batas ukuran baris dan memperlambat read.",
 "Benar. Tall/narrow adalah pola time series yang direkomendasikan, baris tetap kecil dan scan efisien.",
 "Time series justru use case utama Bigtable.",
 "Ribuan tabel adalah anti-pattern.");
q("d3q15","Akses parent-child di Spanner → interleaved tables.",
 "Benar. Interleaving menyimpan line item setiap order secara fisik di sebelah baris order-nya, jadi baca parent-child cepat.",
 "Tidak menempatkan baris berdekatan, jadi biaya join tetap ada.",
 "Kehilangan integritas relasional dan menambah kompleksitas.",
 "Menambah kapasitas tapi tidak memperbaiki masalah lokalitas data.");
q("d3q16","Spanner (dan Bigtable): jangan pernah diawali nilai yang terus naik.",
 "Acak, jadi write tersebar merata. Ini pilihan yang direkomendasikan.",
 "Memang dirancang khusus untuk menghindari hotspot.",
 "Benar. Nilai yang terus naik mengirim semua insert ke split yang sama.",
 "Hash di prefix menyebarkan write.");
q("d3q17","Cloud SQL: zona mati → HA; region mati → cross-region replica.",
 "HA melindungi dari kegagalan zona, bukan region.",
 "Benar. Cross-region replica adalah pola DR Cloud SQL untuk kehilangan satu region.",
 "Restore butuh waktu, dan backup di region yang sama bisa ikut terdampak.",
 "Tidak melindungi dari outage.");
q("d3q18","Postgres + performa + analitik di data live + perubahan minimal → AlloyDB.",
 "BigQuery bukan database OLTP untuk sistem order.",
 "Benar. Kompatibel Postgres, OLTP lebih cepat, dan columnar engine mempercepat analitik di data live (HTAP).",
 "Migrasi lebih besar (dialek dan desain berbeda) dari yang dibutuhkan.",
 "Tidak relasional, jadi harus menulis ulang semuanya.");
q("d3q19","Sub-milidetik + session/cache/leaderboard → Memorystore.",
 "Benar. Key-value in-memory dengan latency sub-milidetik adalah session store standar.",
 "Latency analitik dalam hitungan detik.",
 "Baca objek puluhan milidetik, terlalu lambat untuk session per request.",
 "Database strongly consistent itu berlebihan dan lebih lambat dari cache in-memory.");
q("d3q20","Cegah full scan tidak sengaja → require partition filter.",
 "Benar. Query tanpa filter partisi ditolak, jadi full scan tidak sengaja tercegah.",
 "Clustering membantu, tapi tidak mencegah query tanpa filter men-scan semuanya.",
 "Analis tetap bisa query tabel dasarnya langsung.",
 "LIMIT tidak mengurangi byte yang di-scan.");
q("d3q21","Partition di tanggal, cluster di filter dengan nilai unik banyak.",
 "Kehilangan pruning tanggal, dan integer-range partition punya batas, jadi bukan pilihan terbaik.",
 "Benar. Clustering mengurutkan data di dalam setiap partisi, jadi filter store_id bisa melewati blok.",
 "Ribuan tabel adalah anti-pattern.",
 "Lebih cepat, tapi byte yang di-scan (dan dibayar on-demand) tetap sama.");
q("d3q22","Tabel yang sudah ada → CTAS ke tabel partitioned baru.",
 "Partisi tidak bisa ditambahkan langsung ke tabel non-partitioned yang sudah ada.",
 "Benar. Buat tabel partitioned dari data yang ada dengan query (CTAS), lalu pindah ke tabel baru.",
 "Bisa, tapi lambat dan tidak perlu dibanding CTAS.",
 "Clustering bukan partitioning. Tidak ada partition pruning atau partition expiration.");
q("d3q23","Tabel date-sharded → satu tabel partitioned.",
 "Tidak mengatasi overhead ribuan tabel.",
 "Benar. Tabel partitioned lebih cepat dan sederhana dari tabel date-sharded, dan tetap bisa pruning per hari.",
 "Tidak dirancang untuk volume analitik ini.",
 "Masalahnya malah makin parah.");
q("d3q24","Induk + daftar anak yang dibaca bersama → nested & repeated fields.",
 "Join yang mahal tetap ada.",
 "Benar. Nested/repeated fields menyimpan data terkait di baris yang sama, jadi join-nya hilang.",
 "Bisa, tapi kehilangan schema, tipe data dan column pruning yang efisien.",
 "Malah menambah join.");
q("d3q25","Format load BigQuery tercepat → Avro (Parquet/ORC juga bagus).",
 "CSV yang di-gzip tidak bisa dipecah, jadi load lambat dan tanpa schema.",
 "Benar. Schema ada di dalam file, blok terkompresi dibaca paralel, dan ini format load tercepat.",
 "Masalah split yang sama dengan CSV gzip, plus overhead parsing JSON.",
 "Bukan format load yang didukung.");
q("d3q26","Streaming BigQuery modern → Storage Write API.",
 "Benar. Lebih murah dari streaming lama dan mendukung exactly-once dengan committed stream.",
 "Murah, tapi menambah latency sampai satu jam, tidak cocok untuk kebutuhan streaming.",
 "Menambah bottleneck dan kompleksitas.",
 "Retry lebih banyak = duplikat lebih banyak.");
q("d3q27","Join sesekali dengan Cloud SQL tanpa copy → federated query.",
 "Benar. Query langsung ke Cloud SQL dari BigQuery, tanpa copy dan tanpa pipeline.",
 "Valid untuk replikasi terus-menerus, tapi setup-nya lebih berat dari yang dibutuhkan untuk lookup harian tabel kecil.",
 "Manual dan rawan salah.",
 "BigQuery bukan database OLTP.");
q("d3q28","Data di cloud lain yang tidak boleh dipindah → BigQuery Omni / BigLake.",
 "Memindahkan data, padahal dilarang kontrak.",
 "Benar. Omni menjalankan BigQuery di AWS, dekat dengan datanya, tanpa memindahkan data.",
 "Tetap menarik data lintas cloud dan harus mengurus cluster.",
 "Bukan pendekatan yang didukung atau scalable.");
q("d3q29","Biaya on-demand = byte yang di-scan. Lebih sedikit kolom + filter partition/cluster.",
 "Benar. BigQuery kolumnar, jadi kolom yang tidak dibaca tidak ditagih.",
 "LIMIT tidak mengurangi byte yang di-scan di tabel biasa.",
 "Benar. Partition pruning melewati seluruh partisi.",
 "Batch priority mengubah penjadwalan, bukan byte yang ditagih.");
q("d3q30","Aturan data quality terkelola lintas lake + warehouse → Dataplex (Dataform assertions adalah alternatif di pipeline SQL).",
 "Benar. Definisikan aturan (range, uniqueness, not-null) dan jalankan terjadwal dengan alert.",
 "Mengatur umur dan kelas objek, bukan kualitas data.",
 "Menghapus tabel, bukan memvalidasinya.",
 "Tidak ada hubungannya dengan kualitas data BigQuery.");
q("d3q31","Banyak file kecil → gabungkan jadi file (kolumnar) yang lebih besar.",
 "Membuat baca lebih mahal dan tidak mempercepat.",
 "Benar. Overhead per file mendominasi saat filenya kecil-kecil. File kolumnar besar yang lebih sedikit jauh lebih cepat.",
 "Bottleneck-nya overhead file, bukan master.",
 "Tidak berhubungan dengan performa.");
q("d3q32","Butuh riwayat perubahan dimensi → SCD Type 2.",
 "Riwayat hilang, jadi penjualan lama akan menampilkan kategori baru.",
 "Benar. Menyimpan setiap versi produk, jadi penjualan di-join ke kategori yang berlaku saat transaksi.",
 "Itu juga tidak menyimpan riwayat.",
 "Membangun ulang tanpa riwayat tetap kehilangan versi lama.");
q("d3m01",null,"BI Engine mempercepat dashboard, bukan 200 ribu point lookup per detik.","Benar. Lookup per key dengan QPS tinggi dan latency satu digit milidetik di skala TB–PB.","Replika tidak sanggup mencapai QPS ini untuk 40 TB.","Tidak dirancang untuk QPS ini di 40 TB profil key-value.");
q("d3m02",null,"Database terpisah per region tidak bisa memberi konsistensi global.","Eventually consistent, tanpa transaksi multi-baris.","Benar. ACID global, external consistency, SLA 99.999%.","Regional, jadi tidak bisa melayani write global dengan strong consistency.");
q("d3m03",null,"Kehilangan semua yang ditulis sejak semalam.","Benar. PITR memulihkan ke timestamp yang tepat tanpa membuang data terbaru di production.","Replikanya sudah ikut mereplikasi delete-nya.","Itu hanya berlaku untuk tabel BigQuery.");
q("d3m04",null,"Bisa, tapi itu job manual yang harus dirawat. Sudah ada setting bawaannya.","Benar. Partisi lama terhapus otomatis.","Mengurangi biaya data lama tapi tidak menghapusnya.","Menghapus seluruh tabel setelah 400 hari.");
q("d3m05",null,"Membuat copy penuh yang ditagih sebagai storage penuh.","Benar. Clone bisa diubah, dan kamu hanya bayar data yang berbeda dari tabel dasarnya.","Snapshot read-only.","Read-only, dan setiap query jalan ke production.");
q("d3m06",null,"Time travel maksimal 7 hari.","Benar. Snapshot adalah salinan titik-waktu yang murah (hanya bayar data yang berubah) dengan expiration yang bisa diatur.","Bisa, tapi copy penuh jauh lebih mahal storage-nya.","Fail-safe hanya 7 hari dan lewat Google support.");
q("d3m07",null,"Tes-nya sendiri yang tidak realistis. Bigtable butuh data dan waktu lebih untuk menyeimbangkan beban.","Benar. Bigtable menyeimbangkan tablet seiring waktu, jadi tes kecil dan singkat memberi hasil menyesatkan.","HDD lebih lambat, dan tipe storage juga tidak bisa diganti di tempat.","Terlalu kecil untuk representatif.");
q("d3m08",null,"Tidak ada secondary index, jadi filter multi-atribut berarti full scan. Juga berlebihan untuk 20 GB.","Benar. Dokumen serverless dengan index otomatis dan composite index untuk query multi-field.","Latency analitik kurang ideal untuk filter toko online yang interaktif.","Cache, bukan sumber data utama.");
q("d3m09",null,"Benar. Autoclass memindahkan setiap objek ke kelas yang tepat berdasarkan akses sebenarnya.","Merugikan objek yang sering dibaca karena biaya retrieval.","Malah menambah biaya.","Untuk RPO, bukan biaya.");
q("d3m10",null,"BigQuery menangani star schema dengan dimensi kecil dengan baik.","Benar. Denormalisasi di tempat yang membantu, tapi join ke dimensi kecil bukan masalah.","Menambah latency dan kompleksitas tanpa manfaat.","Pakai partisi, bukan sharding, dan sharding juga bukan masalahnya.");
q("d3m11",null,"Kepemilikan jadi terpusat, kebalikan dari data mesh.","Benar. Federated governance: kepemilikan per domain plus policy dan discovery pusat.","Tidak ada governance atau discovery pusat.","Menduplikasi data dan tetap tidak memberi governance.");
q("d3m12",null,"Membantu sedikit, tapi analitik tetap berebut kapasitas di replika itu.","Benar. Data Boost menjalankan analitik di compute terpisah on-demand, terisolasi dari workload OLTP.","Basi dan manual.","Mahal, dan tidak memisahkan workload.");

 nodes:{
  start:{q:"Apa yang mau disimpan?",opts:["File, gambar, log, backup, data lake mentah","Data untuk analitik, laporan atau warehouse (SQL di banyak baris)","Data operasional yang dibaca dan ditulis aplikasi","Cache sementara, session atau leaderboard"]},
  obj:{q:"Seberapa sering datanya dibaca?",opts:["Sering (data panas, pipeline aktif)","Sekitar sebulan sekali","Sekitar sekali per kuartal","Kurang dari setahun sekali (arsip kepatuhan)","Tidak bisa diprediksi, berubah-ubah"]},
  gStd:{result:"Cloud Storage · Standard",why:"Tanpa durasi minimum dan biaya baca paling murah. Tepat untuk data panas dan landing zone data lake.",keys:"data lake, staging, storage bersama Dataproc/BigQuery",trap:"Harus tidak bisa diubah selama bertahun-tahun? Tambahkan retention policy + Bucket Lock."},
  gNear:{result:"Cloud Storage · Nearline",why:"Storage lebih murah, minimum 30 hari, ada biaya retrieval kecil. Klasik untuk backup yang diakses bulanan.",keys:"backup, diakses sebulan sekali"},
  gCold:{result:"Cloud Storage · Coldline",why:"Minimum 90 hari, biaya simpan lebih rendah, biaya retrieval lebih tinggi. Untuk salinan disaster recovery dan akses per kuartal.",keys:"salinan DR, per kuartal"},
  gArc:{result:"Cloud Storage · Archive",why:"Storage paling murah, minimum 365 hari, tetap bisa diakses dalam milidetik (tanpa waktu tunggu).",keys:"kepatuhan, legal hold, simpan 7 tahun",trap:"\"Tidak boleh dihapus selama N tahun\" → tambahkan juga retention policy + Bucket Lock."},
  gAuto:{result:"Cloud Storage · Autoclass",why:"Autoclass memindahkan setiap objek antar kelas berdasarkan akses sebenarnya, jadi tidak perlu menebak. Kalau polanya sudah pasti, lifecycle rule juga bisa.",keys:"pola akses tidak diketahui atau berubah-ubah"},
  ana:{q:"Datanya di mana, dan formatnya apa?",opts:["Boleh di-load ke warehouse Google","Harus tetap format terbuka (Parquet/Iceberg) di GCS, tapi diatur seperti tabel","Ada di AWS S3 atau Azure dan tidak boleh dipindah"]},
  bq:{result:"BigQuery",why:"Warehouse kolumnar serverless skala petabyte. Partition by date, cluster berdasarkan filter yang umum, pakai nested/repeated fields.",keys:"analitik, SQL, petabyte, dashboard, warehouse serverless",trap:"Jangan pilih BigQuery untuk lookup satu baris dengan latency rendah dari aplikasi. Ini bukan OLTP."},
  biglake:{result:"BigLake tables (di GCS)",why:"Tabel lakehouse format terbuka dengan security fine-grained BigQuery (baris/kolom), bisa di-query BigQuery dan Spark.",keys:"lakehouse, Iceberg, format terbuka, security fine-grained di lake"},
  omni:{result:"BigQuery Omni",why:"Menjalankan analitik BigQuery di AWS/Azure, dekat dengan datanya, tanpa memindahkan data.",keys:"multicloud, data di S3/Azure, tanpa perpindahan data"},
  op:{q:"Butuh model relasional dengan SQL dan transaksi multi-baris?",opts:["Ya, relasional dengan transaksi ACID","Tidak, NoSQL sudah cukup"]},
  rel:{q:"Seberapa besar dan seberapa global?",hint:"Pikirkan skala write dan region, bukan cuma ukuran.",opts:["Satu region, ukuran sedang (sampai puluhan TB), MySQL/Postgres/SQL Server standar","User global, write scale horizontal, availability 99.999%, strong consistency"]},
  rel2:{q:"Apakah ini PostgreSQL yang butuh performa jauh lebih tinggi, atau analitik cepat di data live?",opts:["Ya, Postgres berat atau analitik di data operasional","Tidak, database managed standar sudah cukup"]},
  spanner:{result:"Spanner",why:"Relasional + SQL + ACID dengan scale horizontal dan strong consistency global (99.999% multi-region).",keys:"global, strongly consistent, scalable horizontal, keuangan/inventory",trap:"Jangan pakai primary key yang terus naik (timestamp, sequence). Itu bikin hotspot. Pakai UUIDv4."},
  alloy:{result:"AlloyDB for PostgreSQL",why:"Kompatibel PostgreSQL, OLTP jauh lebih cepat dari Postgres biasa, plus columnar engine bawaan untuk analitik di data live (HTAP).",keys:"kompatibel Postgres + performa, HTAP"},
  csql:{result:"Cloud SQL",why:"MySQL, PostgreSQL atau SQL Server yang di-manage. HA dengan standby di zona lain, read replica, cross-region replica untuk DR.",keys:"relasional lift-and-shift, backend web app, regional",trap:"Scale up, bukan scale out. Kalau write melebihi satu mesin atau user-nya global → Spanner."},

(function(){
PDE.i18n = PDE.i18n || {lessons:{},q:{},flash:{},tools:{},dom:{}};
const X=PDE.i18n;
X.dom.d2={short:"Ingesting & processing",name:"Ingest & memproses data (Ingesting and processing the data)",blurb:"Pub/Sub, Dataflow, Dataproc, Data Fusion, Composer, dan konsep streaming."};

X.lessons["d2-l1"]={title:"Peta pipeline & memilih engine",why:"\"Spark/Hadoop yang sudah ada + perubahan minimal\" adalah ciri khas Dataproc: Spark dan Hadoop yang di-manage. Dataflow berarti menulis ulang job-nya dengan Apache Beam.",
 cards:[
 {h:"Pipeline standar",b:`<p><b>Streaming:</b> <mark>Pub/Sub → Dataflow → BigQuery</mark> (analitik) dan/atau Bigtable (serving latency rendah).</p><p><b>Batch:</b> GCS → Dataflow / Dataproc → BigQuery. Atau cukup <mark>GCS → BigQuery load job → SQL (ELT)</mark>, yang sering jadi jawaban paling sederhana dan benar.</p><div class="box pic"><div class="l">Bayangkan</div>Sumber data itu kebun, Pub/Sub depo truk, Dataflow pabrik, BigQuery gudang, dan Looker etalase toko.</div>`},
 {h:"Engine mana?",b:`<table><tr><th>Skenario bilang…</th><th>Pilih</th></tr><tr><td>Spark/Hadoop yang sudah ada, perubahan minimal</td><td><mark>Dataproc</mark></td></tr><tr><td>Batch + streaming baru, serverless, autoscaling</td><td><mark>Dataflow</mark></td></tr><tr><td>Data sudah di BigQuery, transformasi SQL</td><td>BigQuery SQL / Dataform</td></tr><tr><td>No-code, visual, banyak connector</td><td><mark>Data Fusion</mark></td></tr><tr><td>Analis membersihkan file berantakan secara visual</td><td>Dataprep</td></tr><tr><td>Bereaksi ke satu event dengan logika kecil</td><td>Cloud Run functions</td></tr><tr><td>Spark tanpa mengurus cluster</td><td>Serverless for Apache Spark</td></tr></table>`}],
 keys:["Lift & shift Spark/Hadoop → Dataproc; pipeline serverless baru → Dataflow","Data sudah di BigQuery → ELT dengan SQL/Dataform","No-code → Data Fusion"]};

X.lessons["d2-l2"]={title:"Dasar-dasar Pub/Sub",why:"Setiap subscription mendapat salinan sendiri dari setiap pesan. Consumer yang berbagi satu subscription membagi pesannya (load balancing), jadi setiap tim hanya melihat sebagian stream.",
 cards:[
 {h:"Kantor pos",b:`<div class="box pic"><div class="l">Bayangkan</div>Publisher memasukkan surat ke <b>topic</b>. Setiap <b>subscription</b> adalah rute pengiriman terpisah dengan <b>salinan sendiri</b> dari setiap surat. Subscriber harus tanda tangan (<b>ack</b>) sebelum <b>ack deadline</b>, kalau tidak, suratnya dikirim lagi.</div><ul><li>Global, serverless, autoscaling. Tidak ada broker atau partisi yang perlu diurus.</li><li><mark>Dua app yang sama-sama butuh semua pesan → dua subscription.</mark> Worker yang berbagi beban → satu subscription.</li></ul>`},
 {h:"Aturan pengiriman",b:`<ul><li><mark>At-least-once</mark> secara default, jadi <b>duplikat bisa terjadi</b>. <b>Exactly-once delivery</b> bisa diaktifkan di pull subscription (regional).</li><li><mark>Urutan tidak dijamin</mark> kecuali pakai <b>ordering keys</b> (per key, misalnya per customer).</li><li><b>Pull</b>: subscriber yang meminta pesan. Throughput tinggi, dan Dataflow memakai ini. <b>Push</b>: Pub/Sub mengirim POST ke endpoint HTTPS (Cloud Run, webhook).</li><li>Pesan yang belum di-ack disimpan 7 hari secara default. Topic juga bisa menyimpan pesan (sampai 31 hari).</li></ul>`},
 {h:"Kenapa ada duplikat",b:`<div class="box trap"><div class="l">Trap</div><mark>Banyak duplikat = subscriber tidak ack sebelum deadline</mark> (proses lambat). Solusinya: ack lebih cepat / perpanjang ack deadline, dan buat proses idempotent (dedupe pakai ID unik). "Tambah subscription" malah memperparah.</div>`}],
 keys:["Topic → banyak subscription; setiap subscription dapat semua pesan","Default at-least-once; ordering keys untuk urutan per key","Duplikat biasanya karena ack yang lambat"]};

X.lessons["d2-l3"]={title:"Pub/Sub di production",why:"Snapshot merekam status acknowledgment sebuah subscription. Seek ke snapshot itu membuat Pub/Sub mengirim ulang semua pesan yang di-ack sejak saat itu. Kamu juga bisa seek ke timestamp kalau pesan yang sudah di-ack disimpan.",
 cards:[
 {h:"Replay & penanganan kegagalan",b:`<ul><li><mark>Seek</mark> subscription ke <b>snapshot</b> atau <b>timestamp</b> untuk memproses ulang pesan (misalnya setelah deploy yang salah).</li><li><mark>Dead-letter topic</mark>: setelah N kali gagal, pesan disingkirkan, jadi satu pesan rusak tidak memblokir semuanya.</li><li><b>Schema</b> (Avro/Protobuf) di topic menolak pesan yang formatnya salah saat publish.</li></ul>`},
 {h:"Sink tanpa coding",b:`<ul><li><mark>BigQuery subscription</mark>: menulis pesan langsung ke tabel, tanpa Dataflow.</li><li><b>Cloud Storage subscription</b>: menulis kumpulan pesan ke file.</li><li>Pakai saat <b>tidak ada transformasi</b>. Butuh window, join atau enrichment? → Dataflow.</li></ul>`},
 {h:"Memantau backlog",b:`<ul><li><code>num_undelivered_messages</code> dan <mark>oldest_unacked_message_age</mark> yang terus naik artinya consumer tidak sanggup mengejar.</li><li>Perbaiki consumer-nya: tambah worker (max workers Dataflow), percepat proses, ack dengan benar.</li><li>Pub/Sub Lite sudah dimatikan. Kalau soal lama menyebutnya, pikirkan Pub/Sub atau Managed Kafka.</li></ul><div class="box brain"><div class="l">Kafka di GCP</div>App Kafka yang sudah ada, perubahan minimal → <b>Managed Service for Apache Kafka</b>. Siap berubah, operasional paling sedikit → <b>Pub/Sub</b>.</div>`}],
 keys:["Replay → seek ke snapshot/timestamp","Pesan rusak → dead-letter topic","Tanpa transformasi → BigQuery subscription"]};

X.lessons["d2-l4"]={title:"Blok dasar Apache Beam",why:"Side input membagikan dataset kecil ke setiap worker, cocok untuk tabel lookup kecil. Memanggil database untuk setiap elemen itu lambat dan rapuh.",
 cards:[
 {h:"Kosakatanya",b:`<table><tr><th>Istilah</th><th>Arti</th></tr><tr><td>Pipeline</td><td>Baca → transformasi → tulis</td></tr><tr><td>PCollection</td><td>Dataset terdistribusi. Bounded = batch, unbounded = stream</td></tr><tr><td>ParDo / DoFn</td><td>Map / filter / flatMap per elemen</td></tr><tr><td>GroupByKey</td><td>Kelompokkan nilai berdasarkan key</td></tr><tr><td><mark>Combine</mark></td><td>Agregasi efisien (sum, count, mean) dengan pre-agregasi parsial</td></tr><tr><td><mark>CoGroupByKey</mark></td><td>Join dua PCollection berdasarkan key</td></tr><tr><td>Flatten / Partition</td><td>Gabung / pecah PCollection</td></tr></table>`},
 {h:"Pola yang disukai ujian",b:`<ul><li><mark>Side input</mark>: data lookup kecil yang tersedia di semua worker (kurs, tier, config).</li><li><mark>Multiple (tagged) outputs</mark>: baris valid → BigQuery, tidak valid → tabel/GCS <b>dead-letter</b>. Record rusak tidak boleh menggagalkan seluruh job.</li><li><b>Combine, bukan GroupByKey + jumlah manual</b>: shuffle lebih sedikit, lebih cepat.</li><li>Runner: DataflowRunner (cloud), <b>DirectRunner</b> (tes lokal). Beam juga bisa jalan di Flink dan Spark (portability).</li></ul>`}],
 keys:["Lookup kecil → side input; join dua stream → CoGroupByKey","Record rusak → tagged dead-letter output","Agregasi → Combine"]};

X.lessons["d2-l5"]={title:"Event time, watermark & window",why:"Event time adalah kapan kejadiannya. Window berdasarkan processing time akan memasukkan event jam 09:55 yang telat ke jam 13:00. Ambil timestamp dari payload dan buat window berdasarkan event time.",
 cards:[
 {h:"Dua jam",b:`<div class="box pic"><div class="l">Bayangkan</div>Kamu foto-foto di Bali hari Senin, tapi baru upload dari Jakarta hari Jumat. <b>Event time</b> = Senin (kapan kejadiannya). <b>Processing time</b> = Jumat (kapan server melihatnya). <mark>Analitik yang benar mengelompokkan berdasarkan event time.</mark></div><p><mark>Watermark</mark> adalah perkiraan Dataflow yang terus berjalan bahwa "semua event sampai waktu T kemungkinan sudah masuk". Saat watermark melewati ujung window, window itu bisa mengeluarkan hasilnya.</p>`},
 {h:"Empat jenis window",b:`<table><tr><th>Window</th><th>Bentuk</th><th>Frasa di soal</th></tr><tr><td><mark>Fixed</mark> (tumbling)</td><td>Sama besar, tidak tumpang tindih</td><td>"setiap 5 menit"</td></tr><tr><td><mark>Sliding</mark> (hopping)</td><td>Tumpang tindih: size + period</td><td>"1 jam terakhir, update tiap 5 menit", moving average</td></tr><tr><td><mark>Session</mark></td><td>Per key, ditutup setelah <b>gap</b> tanpa aktivitas</td><td>"sesi user", "sampai idle 30 menit"</td></tr><tr><td>Global</td><td>Satu window selamanya (default)</td><td>Butuh trigger di stream</td></tr></table><p>Buka tool <b>Window Playground</b> untuk melihat setiap jenis window mengelompokkan event yang sama.</p>`}],
 keys:["Window berdasarkan event time, bukan waktu tiba","Watermark = perkiraan kelengkapan data","Fixed = setiap N · sliding = N terakhir tiap M · session = sampai idle"]};

X.lessons["d2-l6"]={title:"Trigger, lateness & accumulation",why:"Secara default allowed lateness bernilai nol: data yang tiba setelah watermark melewati ujung window akan dibuang. Atur allowed lateness sesuai seberapa telat data bisa datang.",
 cards:[
 {h:"Kapan hasil dikeluarkan",b:`<ul><li><b>Trigger</b> = <i>kapan</i> window mengeluarkan hasil. Default: sekali saat <mark>watermark melewati ujung window</mark> (lalu lagi untuk data telat, kalau diizinkan).</li><li><b>Event-time</b> (<code>AfterWatermark</code>) · <b>processing-time</b> (<code>AfterProcessingTime</code>, misalnya "hasil awal tiap menit") · <b>data-driven</b> (<code>AfterCount</code>) · <b>composite</b>.</li></ul>`},
 {h:"Data yang telat",b:`<ul><li><mark>Allowed lateness</mark>: berapa lama setelah watermark data masih diterima ke dalam window. Default-nya 0, jadi data telat dibuang.</li><li><mark>Accumulating</mark>: setiap trigger mengeluarkan hasil lengkap yang sudah diperbarui. <b>Discarding</b>: setiap trigger hanya mengeluarkan bagian yang baru.</li></ul><div class="box brain"><div class="l">Exam brain</div>"Dashboard butuh perkiraan awal yang cepat, lalu total yang dikoreksi saat data telat datang" → <b>early processing-time trigger + watermark trigger + allowed lateness, mode accumulating</b>.</div>`}],
 keys:["Data telat dibuang → atur allowed lateness","Hasil awal → processing-time trigger","Total terkoreksi → mode accumulating"]};

X.lessons["d2-l7"]={title:"Dataflow di production",why:"Drain berhenti membaca data baru tapi menyelesaikan semua yang sedang diproses, jadi tidak ada yang hilang. Cancel langsung berhenti dan membuang data in-flight. --update hanya bisa untuk perubahan yang kompatibel.",
 cards:[
 {h:"Deploy & menghentikan job",b:`<table><tr><th>Aksi</th><th>Efek</th></tr><tr><td><mark>Update</mark> (<code>--update</code>, nama job sama)</td><td>Ganti kode di tempat, <b>state tetap ada</b>. Hanya untuk perubahan kompatibel (rename transform dengan transform mapping).</td></tr><tr><td><mark>Drain</mark></td><td>Berhenti membaca, <b>selesaikan data in-flight</b>, tidak ada yang hilang</td></tr><tr><td><mark>Cancel</mark></td><td>Berhenti sekarang, <b>data in-flight hilang</b></td></tr><tr><td>Snapshot</td><td>Simpan state streaming untuk restart atau rollback</td></tr></table>`},
 {h:"Scaling & biaya",b:`<ul><li><b>Autoscaling</b> dengan batas <b>max workers</b>. <b>Streaming Engine</b> memindahkan state dari worker. <b>Dataflow Shuffle</b> untuk batch.</li><li><mark>FlexRS</mark>: batch lebih murah untuk job yang boleh menunggu (mulai tertunda, kapasitas preemptible).</li><li><mark>Flex Templates</mark>: membungkus pipeline supaya orang lain bisa menjalankannya dengan parameter, tanpa kode. Ada template bawaan Google (Pub/Sub → BigQuery…).</li><li>Exactly-once processing di dalam pipeline. Pakai sink <b>BigQuery Storage Write API</b> untuk write exactly-once.</li></ul>`},
 {h:"Troubleshooting",b:`<ul><li><mark>System lag / data freshness naik</mark> = tertinggal. Cek max workers, hot key dan pemanggilan eksternal yang lambat.</li><li><mark>Hot key</mark> (satu key memegang sebagian besar data) → <code>Combine.perKey().withHotKeyFanout()</code>.</li><li>Pemanggilan API per elemen itu lambat → batch-kan (<code>GroupIntoBatches</code>), atau cache / pakai side input.</li><li>Worker kehabisan memori → mesin lebih besar, perbaiki hot key, side input lebih kecil.</li><li><b>Security</b>: worker service account khusus (<code>roles/dataflow.worker</code>), <mark>private IP (<code>--no_use_public_ips</code>) + Private Google Access</mark>, CMEK kalau diwajibkan.</li></ul>`}],
 keys:["Perubahan kompatibel → update · tidak kompatibel → drain + job baru · cancel menghilangkan data","Non-developer menjalankan pipeline → Flex Templates","Lag → max workers, hot key, pemanggilan eksternal"]};

X.lessons["d2-l8"]={title:"Dataproc yang benar",why:"Buat cluster per job, jalankan, lalu hapus. Itu hanya bisa kalau data disimpan di GCS, bukan di HDFS cluster. Spot VM untuk primary worker berisiko kehilangan HDFS dan job-nya sendiri.",
 cards:[
 {h:"Sewa mobil per perjalanan",b:`<div class="box pic"><div class="l">Bayangkan</div>Hadoop lama itu seperti membeli mobil lalu merawatnya selamanya. Dataproc memungkinkan kamu <b>menyewa mobil per perjalanan</b>, dan barang bawaanmu tetap di rumah, yaitu <b>Cloud Storage</b>, bukan di bagasi mobil (HDFS).</div><ul><li>Cluster menyala dalam ~90 detik. Ditagih <b>per detik</b> (minimum 1 menit).</li><li><mark>Pakai GCS, bukan HDFS</mark> (<code>gs://</code>): storage terpisah dari compute.</li><li><mark>Ephemeral cluster</mark> + <b>workflow template</b> (buat → jalankan → hapus) + <b>scheduled deletion</b> (idle timeout).</li></ul>`},
 {h:"Biaya & kustomisasi",b:`<ul><li><mark>Secondary worker sebagai Spot/preemptible VM</mark> (hanya compute). Primary worker tetap standar.</li><li><b>Autoscaling policy</b> untuk beban yang naik-turun.</li><li><mark>Initialization action</mark>: instal package di setiap node saat dibuat. <b>Cluster properties</b> mengatur file config.</li><li><b>Dataproc Metastore</b>: Hive metastore bersama untuk banyak ephemeral cluster.</li><li><b>Component Gateway</b>: akses UI yang aman (YARN, Spark, Jupyter).</li><li><b>High-availability mode</b>: 3 master node.</li><li><mark>Serverless for Apache Spark</mark>: jalankan Spark batch tanpa cluster.</li></ul>`}],
 keys:["Ephemeral cluster + GCS + Spot secondary worker","Instal library → initialization action","Tanpa cluster sama sekali → Serverless for Apache Spark"]};

X.lessons["d2-l9"]={title:"Data Fusion, Dataprep, Dataform, Datastream",why:"Datastream adalah change data capture (CDC) serverless langsung ke BigQuery. DMS memigrasi database ke Cloud SQL/AlloyDB. STS meng-copy file. Dump harian tidak hampir real-time.",
 cards:[
 {h:"Pemilih tool",b:`<table><tr><th>Tool</th><th>Pilih saat</th></tr><tr><td><mark>Cloud Data Fusion</mark></td><td>ETL visual no-code, 150+ connector, sumber hybrid. Jalan di Dataproc.</td></tr><tr><td>Dataprep</td><td>Analis menjelajah dan membersihkan file secara visual</td></tr><tr><td><mark>Dataform</mark></td><td>ELT SQL di BigQuery dengan dependency, <b>assertion</b> (test), git</td></tr><tr><td><mark>Datastream</mark></td><td>CDC dari MySQL/Postgres/Oracle/SQL Server → BigQuery/GCS</td></tr><tr><td>BigQuery continuous queries</td><td>SQL di data streaming, output ke Pub/Sub/Bigtable</td></tr><tr><td>Managed Kafka</td><td>App Kafka yang sudah ada, perubahan minimal</td></tr></table>`},
 {h:"Sederhana lebih baik",b:`<div class="box brain"><div class="l">Exam brain</div>"CSV harian masuk ke GCS, load ke BigQuery" → cukup <b>load job</b> (atau BigQuery Data Transfer Service dari GCS), bukan pipeline Dataflow. Pilih Dataflow hanya kalau butuh transformasi nyata, streaming atau logika rumit.</div>`}],
 keys:["CDC ke BigQuery → Datastream","ETL no-code → Data Fusion; ELT SQL dengan test → Dataform","Load file sederhana → BigQuery load job"]};

X.lessons["d2-l10"]={title:"Orkestrasi & CI/CD",why:"Dependency multi-langkah lintas service dengan retry, alert dan backfill adalah fungsi Composer (Airflow yang di-manage). Scheduler hanya menjalankan satu hal sesuai jadwal.",
 cards:[
 {h:"Tiga orkestrator",b:`<table><tr><th>Tool</th><th>Paling cocok untuk</th></tr><tr><td><mark>Cloud Composer</mark></td><td>Airflow managed: DAG kompleks, dependency, retry, backfill, SLA, sensor. DAG disimpan di folder <code>dags/</code> di bucket GCS environment.</td></tr><tr><td><mark>Workflows</mark></td><td>Rangkaian pemanggilan API/service yang serverless dan murah, ditulis dalam YAML</td></tr><tr><td>Cloud Scheduler</td><td>Cron: menjalankan satu hal sesuai jadwal</td></tr><tr><td>Eventarc</td><td>Berbasis event (objek GCS selesai diupload → Cloud Run / Workflows)</td></tr></table>`},
 {h:"Event-driven & CI/CD",b:`<ul><li>"Mulai proses begitu file masuk" → <b>Eventarc / Cloud Run function</b> yang menjalankan Dataflow template, atau sensor GCS di Composer.</li><li><b>CI/CD</b>: git → <b>Cloud Build</b> (test) → image di <b>Artifact Registry</b> → deploy Flex Template / sinkron DAG / rilis Dataform → <b>project dev/test/prod</b> terpisah. Infrastruktur sebagai kode dengan Terraform.</li></ul><div class="box brain"><div class="l">Exam brain</div>Composer = DAG kompleks · Workflows = rangkaian API ringan · Scheduler = cron · scheduled query = satu statement SQL.</div>`}],
 keys:["Pipeline multi-langkah dengan retry → Composer","Rangkaian API serverless yang ringan → Workflows","Trigger saat file datang → Eventarc / Cloud Run function"]};

const q=(id,tip,...w)=>{X.q[id]={w,tip};};
q("d2q01","Logika sama untuk batch + streaming, serverless → Dataflow.",
 "Bisa, tapi kamu harus mengurus cluster, padahal tim ingin menghindarinya.",
 "Benar. Satu codebase Beam jalan untuk batch dan streaming, dan Dataflow serverless dengan autoscaling.",
 "Bagus untuk ETL visual, tapi logika streaming bersama yang rumit lebih cocok ditulis dengan kode Beam.",
 "Beban operasional paling besar.");
q("d2q02","No-code + banyak connector → Data Fusion.",
 "Butuh kemampuan coding.",
 "Benar. Pipeline visual tanpa kode dengan banyak connector, termasuk sumber hybrid dan on-prem.",
 "Butuh coding Spark/Hadoop dan pemahaman cluster.",
 "Tidak bisa menarik data dari Salesforce, Oracle atau SFTP sendiri.");
q("d2q03","File sederhana → BigQuery, tanpa transformasi → load job / DTS.",
 "Berlebihan untuk file harian tanpa transformasi.",
 "Mengurus cluster hanya untuk load sederhana.",
 "Benar. Batch load bawaan gratis dan tidak butuh kode pipeline.",
 "Notifikasi GCS berisi metadata objek, bukan isi file-nya.");
q("d2q04","Duplikat = ack terlambat. Perpanjang deadline, dedupe berdasarkan ID.",
 "Duplikat itu perilaku yang wajar kalau ack terlambat.",
 "Benar. Dengan deadline default 10 detik, proses 90 detik pasti memicu pengiriman ulang. Perpanjang deadline dan dedupe pakai ID unik.",
 "Subscription kedua dapat salinan lengkap sendiri, artinya pemrosesan bertambah, bukan duplikat berkurang.",
 "Ordering tidak mencegah pengiriman ulang.");
q("d2q05","Urutan per entitas → ordering keys.",
 "Throughput hancur.",
 "Benar. Ordering keys menjamin urutan per key, sementara key yang berbeda tetap diproses paralel.",
 "Tidak membantu urutan pemrosesan real-time.",
 "Jutaan topic adalah anti-pattern.");
q("d2q06","Pesan rusak → dead-letter topic.",
 "Benar. Setelah N kali gagal, pesan diteruskan ke dead-letter topic untuk dicek nanti.",
 "Pesan rusaknya malah disimpan lebih lama.",
 "Tidak membantu pesan yang selalu gagal.",
 "Cara pengiriman tidak menyelesaikan pesan rusak.");
q("d2q07","Tanpa transformasi → BigQuery subscription.",
 "Bisa, tapi menjalankan pipeline yang sebenarnya tidak perlu.",
 "Benar. Pub/Sub menulis langsung ke BigQuery, tanpa pipeline yang perlu diurus.",
 "Kode custom yang harus dirawat.",
 "Dua langkah dan menambah latency.");
q("d2q08","Endpoint HTTPS, tanpa polling → push. Worker throughput tinggi / Dataflow → pull.",
 "Subscriber harus melakukan polling.",
 "Benar. Pub/Sub mengirim POST setiap pesan ke endpoint HTTPS.",
 "Menulis ke tabel, bukan ke service-mu.",
 "Menulis file, bukan request HTTP.");
q("d2q09","Backlog naik → consumer terlalu lambat: scale atau perbaiki bottleneck.",
 "Hanya menyembunyikan gejalanya, backlog tetap naik.",
 "Benar. Consumer tidak sanggup mengejar. Beri kapasitas dan cari bottleneck-nya.",
 "Tidak mempercepat konsumsi.",
 "Tidak menambah kapasitas pemrosesan.");
q("d2q10","Join dua PCollection ber-key → CoGroupByKey.",
 "Menggabungkan PCollection bertipe sama. Itu bukan join.",
 "Benar. Mengelompokkan nilai dari beberapa PCollection ber-key berdasarkan key, ini cara join di Beam.",
 "Untuk dataset kecil yang hampir statis, bukan untuk join dua stream besar.",
 "Memecah satu PCollection jadi beberapa.");
q("d2q11","Record rusak → dead-letter output, bukan job gagal.",
 "Kehilangan record rusak yang justru perlu diselidiki.",
 "Benar. Pola dead-letter menjaga pipeline utama tetap sehat dan menyimpan record yang gagal.",
 "Hanya berlaku untuk load job, dan diam-diam membuang baris.",
 "Error parsing bukan masalah memori.");
q("d2q12","Agregasi → Combine (agregasi parsial), bukan GroupByKey + jumlah manual.",
 "Benar. Combine melakukan pre-agregasi di setiap worker sebelum shuffle, jadi perpindahan data berkurang.",
 "Side input untuk lookup kecil.",
 "Tidak mengurangi volume shuffle.",
 "Shuffle malah bertambah.");
q("d2q13","\"Setiap N menit\" → fixed.",
 "Benar. Window tumbling yang sama besar dan tidak tumpang tindih.",
 "Tumpang tindih, jadi setiap event dihitung di beberapa window.",
 "Ditutup karena tidak ada aktivitas per key, bukan ember tetap.",
 "Tidak pernah ditutup tanpa trigger.");
q("d2q14","\"N terakhir, update tiap M\" → sliding.",
 "Hanya update setiap 30 menit.",
 "Benar. Window yang tumpang tindih menghasilkan moving average.",
 "Berbasis aktivitas, bukan rentang waktu yang bergulir.",
 "Tidak ada batas waktu yang bergulir.");
q("d2q15","\"Sampai tidak aktif selama X\" → session window.",
 "Memotong kunjungan di batas yang sembarang.",
 "Rentang tetap yang tumpang tindih, bukan berbasis aktivitas.",
 "Benar. Session window ditutup setelah gap tanpa aktivitas, per key.",
 "Tidak ada batas kunjungan.");
q("d2q16","Data tertunda → timestamp event time + allowed lateness.",
 "Benar. Buat window berdasarkan kapan reading terjadi, bukan kapan tiba.",
 "Reading yang telat akan masuk ke jam yang salah.",
 "Benar. Kalau tidak, reading yang tiba setelah watermark akan dibuang.",
 "Tidak ada pengelompokan per jam.");
q("d2q17","Hasil awal + tepat waktu + koreksi telat dengan total penuh → early processing-time trigger, watermark trigger, accumulating.",
 "Hanya mengeluarkan hasil saat watermark lewat, tanpa hasil awal.",
 "Benar. Hasil awal spekulatif, hasil tepat waktu, koreksi data telat, dan setiap trigger menampilkan total terbaru yang lengkap.",
 "Trigger per elemen dengan delta parsial saja, berisik dan tidak lengkap.",
 "Tidak pernah mengeluarkan hasil di stream unbounded.");
q("d2q18","Perubahan kompatibel → update. Tidak kompatibel → drain + job baru.",
 "Cancel menghilangkan data in-flight dan state.",
 "Benar. Update di tempat mempertahankan state dan menjaga exactly-once processing.",
 "Aman, tapi membuang state window yang sudah terkumpul, dan update lebih tepat untuk perubahan kompatibel.",
 "Kehilangan riwayat yang belum di-ack dan menduplikasi pemrosesan.");
q("d2q19","Perubahan tidak kompatibel, tanpa kehilangan data → drain.",
 "Data in-flight hilang.",
 "Benar. Drain menyelesaikan data yang tertahan, dan job baru melanjutkan dari pesan yang belum di-ack.",
 "Perubahan tidak kompatibel akan gagal di pengecekan kompatibilitas.",
 "Pesan yang belum di-ack hilang.");
q("d2q20","Jalankan pipeline tanpa kode → (Flex) template.",
 "Mereka tetap butuh build tool dan kemampuan coding.",
 "Benar. Bisa dijalankan dari console, gcloud atau API dengan parameter, tanpa kode.",
 "Service yang salah untuk pipeline Beam.",
 "Terlalu berat untuk kebutuhan ini.");
q("d2q21","Hot key → hot-key fanout / desain key yang lebih baik.",
 "Hot key tetap jatuh ke satu worker.",
 "Benar. Fanout melakukan pre-agregasi hot key di banyak worker sebelum combine akhir.",
 "Tidak mengubah distribusi key.",
 "Pub/Sub bukan bottleneck-nya.");
q("d2q22","Pemanggilan eksternal per elemen → batch / cache / side input.",
 "Panggilan makin banyak, lag makin parah.",
 "Benar. Round-trip jauh lebih sedikit, jadi throughput naik.",
 "Tidak berhubungan dengan overhead pemanggilan.",
 "Sumber data bukan bottleneck-nya.");
q("d2q23","Tanpa public IP → worker private IP + Private Google Access.",
 "Benar. Worker hanya punya IP internal dan mengakses API Google secara privat.",
 "Worker tetap punya public IP.",
 "Tidak memenuhi syarat dan menambah beban operasional.",
 "Pipeline-nya rusak.");
q("d2q24","Batch tidak mendesak, lebih murah → FlexRS.",
 "Untuk job streaming.",
 "Benar. Flexible Resource Scheduling memakai kapasitas diskon dengan jadwal mulai yang tertunda, cocok untuk job yang tidak mendesak.",
 "Biasanya malah lebih mahal.",
 "Lebih mahal dan tidak perlu.");
q("d2q25","Ephemeral cluster butuh data di GCS, bukan HDFS.",
 "Benar. Memisahkan storage dari compute memungkinkan cluster dihapus tanpa kehilangan data.",
 "Tetap terikat ke cluster.",
 "Meningkatkan uptime, bukan menekan biaya.",
 "Tidak memisahkan storage.");
q("d2q26","Dataproc lebih murah → Spot secondary worker, primary standar.",
 "Kehilangan primary berisiko kehilangan data HDFS dan stabilitas job.",
 "Benar. Secondary worker hanya mengerjakan compute, jadi kehilangannya aman dan murah.",
 "Kehilangan master mematikan cluster.",
 "Kapasitasnya tidak cukup untuk job production.");
q("d2q27","Software di setiap node → initialization action (atau custom image).",
 "Manual, dan hilang setiap kali cluster baru dibuat.",
 "Benar. Script jalan di setiap node saat dibuat, jadi bisa diulang.",
 "Bukan cara mengatur software di node Dataproc.",
 "Worker tidak akan punya library-nya.");
q("d2q28","Spark tanpa urus cluster sama sekali → Serverless for Apache Spark.",
 "Tetap ada cluster yang harus dibuat dan dikelola.",
 "Benar. Submit Spark batch tanpa mengelola cluster.",
 "Menjalankan Beam, bukan kode PySpark apa adanya.",
 "Beban operasional paling besar.");
q("d2q29","Tetap pakai Kafka API, tanpa broker → Managed Kafka. Siap berubah → Pub/Sub.",
 "Operasional paling sedikit, tapi client harus diubah dari Kafka API.",
 "Benar. Kompatibel dengan Kafka API asli tanpa harus menjalankan broker sendiri.",
 "Bisa, tapi kamu harus mengurus broker, padahal perusahaan ingin menghindarinya.",
 "Sudah dimatikan.");
q("d2q30","Replikasi DB → BigQuery hampir real-time → Datastream.",
 "Benar. Change data capture serverless menjaga BigQuery tetap hampir real-time.",
 "Basi sampai 24 jam.",
 "Memigrasi ke Cloud SQL/AlloyDB, bukan replikasi analitik ke BigQuery.",
 "Membebani database production dengan query analitik.");
q("d2q31","DAG multi-langkah + retry + backfill → Composer.",
 "Hanya menjalankan satu aksi, tanpa dependency atau backfill.",
 "Benar. DAG Airflow menangani dependency, retry, alert dan backfill lintas service.",
 "Messaging, bukan orkestrasi.",
 "Rapuh dan tidak di-manage.");
q("d2q32","Rangkaian API ringan → Workflows. DAG data kompleks → Composer.",
 "Kuat, tapi environment yang selalu menyala dan berat untuk rangkaian sederhana.",
 "Benar. Orkestrasi langkah pemanggilan API yang serverless, bayar per langkah.",
 "Engine pemrosesan data, bukan orkestrator API.",
 "Hanya untuk job Dataproc.");
q("d2q33","Bereaksi saat file datang → Eventarc / Cloud Run functions.",
 "Polling membuang resource dan menambah delay.",
 "Benar. Berbasis event: hanya jalan saat ada file datang.",
 "Polling mahal yang selalu menyala untuk file yang jarang datang.",
 "Tetap polling, dan tetap ada delay.");
q("d2q34","CI/CD → Cloud Build + Artifact Registry + project terpisah per environment.",
 "Tidak bisa diulang dan tidak terkontrol.",
 "Benar. CI/CD dengan artifact yang sama dipromosikan melalui environment yang terpisah.",
 "Kode tidak bisa diubah di console, dan tidak bisa diulang.",
 "Tidak ada proses testing atau promosi.");
q("d2m01",null,"Benar. Pipeline streaming dengan sink yang tepat untuk setiap pola akses.","Tidak sanggup menampung volume write ini, dan buruk untuk analitik skala besar.","Tidak real-time.","Tidak ada point lookup di bawah 10 ms.");
q("d2m02",null,"Ordering tidak mencegah pengiriman ulang.","Benar. Pub/Sub menjamin tidak ada pengiriman ulang setelah pesan berhasil di-ack.","Menangani kegagalan, bukan duplikat.","Push tidak mendukung exactly-once delivery.");
q("d2m03",null,"Benar. Memberi semantik exactly-once ke BigQuery.","Duplikat tetap terlihat sepanjang hari.","Tidak berpengaruh ke duplikat.","Menambah latency dan kompleksitas.");
q("d2m04",null,"Benar. HA mode menjalankan 3 master supaya cluster tetap hidup saat satu master gagal.","Worker tidak menggantikan master.","Malah menghapus cluster.","Membuat kegagalan lebih mungkin terjadi.");
q("d2m05",null,"Benar. Topic memvalidasi pesan terhadap schema saat publish.","Menangkap kegagalan setelah pengiriman, bukan saat publish.","Tidak berhubungan dengan validasi.","Tidak berhubungan dengan validasi.");
q("d2m06",null,"Tidak menyelesaikan masalah kapasitas.","Benar. Task yang tertahan di queued artinya kapasitas worker atau concurrency tidak cukup.","Tidak menambah kapasitas.","Lokasi DAG bukan masalahnya.");
q("d2m07",null,"Bukan engine eksekusi default Data Fusion.","Benar. Data Fusion mengompilasi pipeline ke Spark dan menjalankannya di Dataproc.","Bisa push down sebagian pekerjaan, tapi bukan eksekutornya.","Bukan.");
q("d2m08",null,"Gap 45 menit antara 10:20 dan 11:05 melebihi gap 30 menit.","Benar. Dua klik pertama berjarak kurang dari 30 menit. Klik ketiga memulai sesi baru.","10:00 dan 10:20 hanya berjarak 20 menit, jadi bergabung.","Trigger mengatur kapan hasil dikeluarkan, bukan bagaimana sesi terbentuk.");
q("d2m09",null,"Tidak.","Benar. Allowed lateness default nol, jadi data di belakang watermark dibuang. Atur allowed lateness untuk menyimpan data telat.","Semua jenis window bisa menerima data telat kalau lateness diizinkan.","Tidak.");
q("d2m10",null,"CPU rendah, jadi bukan kekurangan compute.","Benar. CPU rendah dengan lag yang terus naik menandakan pipeline sedang menunggu I/O.","Topic tidak punya ukuran.","Tidak menyebabkan lag naik terus saat input datar.");
q("d2m11",null,"Benar. Transfer managed, terjadwal dan bisa dilanjutkan dari file system on-prem.","Appliance untuk transfer massal offline, bukan harian.","Tidak terkelola dan tidak andal.","Untuk CDC database, bukan file.");
q("d2m12",null,"200 GB terlalu besar untuk side input.","Benar. Data referensi besar yang terus berubah butuh lookup ber-key atau join, bukan disebar ke semua worker.","Masalahnya sama dengan side input.","Tidak memenuhi kebutuhan.");
