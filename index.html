I("d3-l1",
 {what:"Google Cloud has a different storage service for each <b>access pattern</b>: files, analytics, transactional apps, huge key-value workloads, app documents and caches. Picking the right one is the single most tested skill on the PDE.",
  how:["<b>Cloud Storage</b> holds files/objects. <b>BigQuery</b> runs SQL analytics over huge tables.","<b>Cloud SQL</b>, <b>AlloyDB</b> and <b>Spanner</b> are relational databases for apps (OLTP).","<b>Bigtable</b> is NoSQL for massive, low-latency key lookups (IoT, time series).","<b>Firestore</b> stores app documents. <b>Memorystore</b> is an in-memory cache."],
  when:"Almost every scenario: \"where should this data live?\" Read the constraints (latency, scale, SQL, global, offline) and match them to the service."},
 {what:"Google Cloud punya layanan storage berbeda untuk setiap <b>pola akses</b>: file, analitik, aplikasi transaksional, key-value skala raksasa, dokumen app, dan cache. Memilih yang tepat adalah skill yang paling sering diuji di PDE.",
  how:["<b>Cloud Storage</b> menyimpan file/objek. <b>BigQuery</b> untuk analitik SQL di tabel besar.","<b>Cloud SQL</b>, <b>AlloyDB</b> dan <b>Spanner</b> adalah database relasional untuk aplikasi (OLTP).","<b>Bigtable</b> adalah NoSQL untuk lookup per key yang sangat cepat di skala besar (IoT, time series).","<b>Firestore</b> menyimpan dokumen app. <b>Memorystore</b> adalah cache di memori."],
  when:"Hampir di setiap skenario: \"data ini sebaiknya disimpan di mana?\" Baca batasannya (latency, skala, SQL, global, offline), lalu cocokkan dengan layanannya."});
I("d3-l2",
 {what:"<b>Cloud Storage (GCS)</b> is object storage: you put files (\"objects\") into <b>buckets</b>. It's unlimited, durable, and the default landing zone for data lakes, backups and archives.",
  how:["Four <b>storage classes</b>: Standard, Nearline (30-day min), Coldline (90-day min), Archive (365-day min). Colder = cheaper to store, pricier to read.","All classes return data in milliseconds. There's no \"restore\" wait.","<b>Lifecycle rules</b> change class or delete objects by age. <b>Autoclass</b> does it automatically.","<b>Retention policy + Bucket Lock</b> makes objects undeletable until the period ends (WORM)."],
  when:"Questions about backups, archives, compliance (\"keep 7 years, can't delete\"), cost by access frequency, and temporary access (signed URLs)."},
 {what:"<b>Cloud Storage (GCS)</b> adalah object storage: kamu menaruh file (\"object\") di dalam <b>bucket</b>. Kapasitasnya tidak terbatas, datanya awet, dan jadi tempat utama untuk data lake, backup dan arsip.",
  how:["Ada 4 <b>storage class</b>: Standard, Nearline (minimal 30 hari), Coldline (minimal 90 hari), Archive (minimal 365 hari). Makin dingin, makin murah simpannya tapi makin mahal bacanya.","Semua kelas bisa diakses dalam hitungan milidetik. Tidak ada waktu tunggu \"restore\".","<b>Lifecycle rules</b> memindahkan kelas atau menghapus objek berdasarkan umur. <b>Autoclass</b> melakukannya otomatis.","<b>Retention policy + Bucket Lock</b> membuat objek tidak bisa dihapus sampai masa simpannya habis (WORM)."],
  when:"Soal tentang backup, arsip, kepatuhan (\"simpan 7 tahun, tidak boleh dihapus\"), biaya berdasarkan frekuensi akses, dan akses sementara (signed URL)."});
I("d3-l3",
 {what:"<b>Partitioning</b> splits a BigQuery table into chunks (usually by date). <b>Clustering</b> sorts the data inside each chunk by up to 4 columns. Both let BigQuery skip data it doesn't need, so queries get cheaper and faster.",
  how:["With on-demand pricing you pay for <b>bytes scanned</b>, not rows returned.","A filter on the partition column skips whole partitions (\"partition pruning\").","A filter on a clustered column skips blocks inside a partition.","<b>LIMIT doesn't reduce</b> bytes scanned. Selecting fewer columns does."],
  when:"\"Queries are too expensive/slow\", \"analysts scan the whole table\", \"filter by date and customer_id\". The classic answer is to partition by date and cluster by the ID."},
 {what:"<b>Partitioning</b> membagi tabel BigQuery menjadi potongan-potongan (biasanya per tanggal). <b>Clustering</b> mengurutkan data di dalam setiap potongan berdasarkan sampai 4 kolom. Keduanya membuat BigQuery bisa melewati data yang tidak dibutuhkan, jadi query lebih murah dan cepat.",
  how:["Di harga on-demand, kamu bayar per <b>byte yang di-scan</b>, bukan per baris hasil.","Filter di kolom partisi membuat partisi yang tidak relevan dilewati (\"partition pruning\").","Filter di kolom cluster membuat blok di dalam partisi dilewati.","<b>LIMIT tidak mengurangi</b> byte yang di-scan. Memilih lebih sedikit kolom baru mengurangi."],
  when:"\"Query terlalu mahal/lambat\", \"analis scan seluruh tabel\", \"filter berdasarkan tanggal dan customer_id\". Jawaban klasiknya: partition by date, cluster by ID."});
I("d3-l4",
 {what:"BigQuery is a columnar warehouse that works best with <b>denormalized</b> data. Instead of many joins, you can store child records inside the parent row using <b>nested and repeated fields</b>. Data gets in through <b>load jobs</b> (batch) or the <b>Storage Write API</b> (streaming).",
  how:["<b>STRUCT</b> = a nested record. <b>ARRAY</b> = a repeated list (e.g. an order with its line items).","Batch load jobs are free. <b>Avro</b> is the fastest format (schema included, parallel reads).","Streaming: Storage Write API (cheaper, exactly-once) or a Pub/Sub BigQuery subscription.","External/federated tables let you query data where it lives (GCS, Cloud SQL, S3 via Omni)."],
  when:"\"Joins are slow\", \"which file format loads fastest\", \"stream events into BigQuery cheaply\", \"query Cloud SQL or S3 without copying\"."},
 {what:"BigQuery adalah warehouse kolumnar yang paling optimal dengan data yang <b>didenormalisasi</b>. Daripada banyak join, data anak bisa disimpan di dalam baris induknya memakai <b>nested and repeated fields</b>. Data masuk lewat <b>load job</b> (batch) atau <b>Storage Write API</b> (streaming).",
  how:["<b>STRUCT</b> = record bersarang. <b>ARRAY</b> = daftar berulang (misalnya order beserta line item-nya).","Batch load job gratis. <b>Avro</b> adalah format tercepat (schema ikut di file, bisa dibaca paralel).","Streaming: Storage Write API (lebih murah, exactly-once) atau Pub/Sub BigQuery subscription.","External/federated table memungkinkan query data di tempat asalnya (GCS, Cloud SQL, S3 lewat Omni)."],
  when:"\"Join lambat\", \"format file apa yang paling cepat di-load\", \"streaming event ke BigQuery dengan murah\", \"query Cloud SQL atau S3 tanpa copy\"."});
I("d3-l5",
 {what:"BigQuery has built-in safety nets. <b>Time travel</b> lets you see or restore a table as it was up to 7 days ago. <b>Snapshots</b> and <b>clones</b> keep cheap point-in-time copies. Storage cost drops automatically for data you don't touch.",
  how:["<b>Time travel</b>: <code>FOR SYSTEM_TIME AS OF</code> any time in the last 2–7 days. After that, 7 days of <b>fail-safe</b> (only via Google support).","<b>Table snapshot</b>: a read-only copy where you pay only for data that later changes. Use it for long-term backups.","<b>Table clone</b>: a writable copy for testing, also only billed for changes.","<b>Long-term storage</b>: a table or partition untouched for 90 days costs ~50% less, automatically."],
  when:"\"Someone ran a bad UPDATE/DELETE\", \"keep monthly backups for a year\", \"give data scientists a test copy cheaply\", \"reduce storage cost\"."},
 {what:"BigQuery punya jaring pengaman bawaan. <b>Time travel</b> memungkinkan kamu melihat atau mengembalikan tabel seperti kondisinya sampai 7 hari lalu. <b>Snapshot</b> dan <b>clone</b> menyimpan salinan titik-waktu dengan murah. Biaya storage otomatis turun untuk data yang tidak disentuh.",
  how:["<b>Time travel</b>: <code>FOR SYSTEM_TIME AS OF</code> waktu mana pun dalam 2–7 hari terakhir. Setelah itu ada 7 hari <b>fail-safe</b> (hanya lewat Google support).","<b>Table snapshot</b>: salinan read-only, kamu hanya bayar data yang berubah setelahnya. Dipakai untuk backup jangka panjang.","<b>Table clone</b>: salinan yang bisa diubah untuk testing, juga hanya bayar perubahannya.","<b>Long-term storage</b>: tabel/partisi yang tidak diubah 90 hari otomatis ~50% lebih murah."],
  when:"\"Ada yang menjalankan UPDATE/DELETE salah\", \"simpan backup bulanan selama setahun\", \"kasih data scientist copy murah untuk testing\", \"kurangi biaya storage\"."});
I("d3-l6",
 {what:"<b>Bigtable</b> is a NoSQL wide-column database for huge volumes (TB–PB) with single-digit millisecond reads and writes. Rows are sorted by one thing only, the <b>row key</b>, so the row key design decides performance.",
  how:["Data model: row key → column families → columns → timestamped cells. Empty cells cost nothing.","The <b>only index</b> is the row key: you can look up one key, a prefix, or a range.","Writes spread across nodes by key range. If many writes hit the same range you get a <b>hotspot</b>.","Never start a key with a timestamp. Put the entity first (<code>device#time</code>), and use a reverse timestamp for newest-first."],
  when:"IoT, time series, ad tech, \"&lt;10 ms at massive scale\", \"one node is overloaded\", \"which row key should you use?\"."},
 {what:"<b>Bigtable</b> adalah database NoSQL wide-column untuk volume sangat besar (TB–PB) dengan baca/tulis dalam hitungan milidetik. Baris hanya diurutkan berdasarkan satu hal, yaitu <b>row key</b>, jadi desain row key menentukan performanya.",
  how:["Model datanya: row key → column family → kolom → cell dengan timestamp. Cell kosong tidak memakan biaya.","<b>Satu-satunya index</b> adalah row key: bisa lookup satu key, prefix, atau range.","Write tersebar ke node berdasarkan range key. Kalau banyak write jatuh di range yang sama, terjadi <b>hotspot</b>.","Jangan pernah mulai key dengan timestamp. Taruh entitasnya di depan (<code>device#time</code>), dan pakai reverse timestamp kalau mau data terbaru duluan."],
  when:"IoT, time series, ad tech, \"&lt;10 ms di skala besar\", \"satu node kewalahan\", \"row key mana yang harus dipakai?\"."});
I("d3-l7",
 {what:"A Bigtable <b>instance</b> can have several <b>clusters</b> in different zones or regions that replicate each other. <b>App profiles</b> decide which cluster each application talks to.",
  how:["Replication between clusters is automatic and eventually consistent.","<b>Multi-cluster routing</b>: requests go to the nearest healthy cluster, with automatic failover (high availability).","<b>Single-cluster routing</b>: pins an app to one cluster. Use it to keep batch jobs away from serving traffic.","SSD vs HDD is chosen at creation and can't be changed later."],
  when:"\"Batch analytics slows down the app\", \"survive a zone failure\", \"switch HDD to SSD\"."},
 {what:"Satu <b>instance</b> Bigtable bisa punya beberapa <b>cluster</b> di zona/region berbeda yang saling mereplikasi. <b>App profile</b> menentukan setiap aplikasi bicara ke cluster mana.",
  how:["Replikasi antar cluster otomatis dan bersifat eventually consistent.","<b>Multi-cluster routing</b>: request dikirim ke cluster sehat terdekat, dengan failover otomatis (high availability).","<b>Single-cluster routing</b>: mengunci aplikasi ke satu cluster. Dipakai untuk memisahkan batch job dari traffic serving.","SSD vs HDD dipilih saat membuat instance dan tidak bisa diubah."],
  when:"\"Batch analytics memperlambat app\", \"tetap jalan saat zona mati\", \"ganti HDD ke SSD\"."});
I("d3-l8",
 {what:"<b>Spanner</b> is a relational database (SQL + ACID transactions) that scales horizontally across regions, with strong global consistency and up to 99.999% availability.",
  how:["You get tables, SQL, schemas and transactions like a normal database, but it grows by adding nodes.","It keeps data consistent across continents using Google's TrueTime clocks.","<b>Primary key design</b> matters: monotonically increasing keys (timestamps, auto-increment) cause hotspots. Use UUIDv4.","<b>Interleaved tables</b> store child rows next to their parent for fast parent-child reads."],
  when:"\"Global\", \"strongly consistent\", \"relational\", \"can't double-spend\", \"Cloud SQL can't keep up with writes\"."},
 {what:"<b>Spanner</b> adalah database relasional (SQL + transaksi ACID) yang bisa scale horizontal lintas region, dengan konsistensi kuat secara global dan availability sampai 99.999%.",
  how:["Kamu dapat tabel, SQL, schema dan transaksi seperti database biasa, tapi kapasitasnya bertambah dengan menambah node.","Data tetap konsisten lintas benua berkat jam TrueTime milik Google.","<b>Desain primary key</b> penting: key yang terus naik (timestamp, auto-increment) bikin hotspot. Pakai UUIDv4.","<b>Interleaved tables</b> menyimpan baris anak di dekat induknya supaya baca parent-child lebih cepat."],
  when:"\"Global\", \"strongly consistent\", \"relasional\", \"tidak boleh double-spend\", \"Cloud SQL tidak kuat menangani write\"."});
I("d3-l9",
 {what:"<b>Cloud SQL</b> is managed MySQL, PostgreSQL or SQL Server for regular app backends in one region. <b>AlloyDB</b> is Google's faster PostgreSQL-compatible database that also runs analytics on live data.",
  how:["Cloud SQL scales <b>up</b> (bigger machine), not out. Practical size is up to tens of TB.","<b>HA</b> = a standby in another zone with automatic failover. <b>Read replicas</b> offload reads. <b>Cross-region replicas</b> cover a region outage.","Backups + point-in-time recovery restore to an exact moment.","AlloyDB adds much higher throughput and a <b>columnar engine</b> for fast analytical queries on the same data (HTAP)."],
  when:"\"Lift-and-shift MySQL/Postgres\", \"reports slow down the app\", \"survive a zone/region failure\", \"Postgres but faster, with minimal changes\"."},
 {what:"<b>Cloud SQL</b> adalah MySQL, PostgreSQL atau SQL Server yang di-manage, untuk backend aplikasi biasa di satu region. <b>AlloyDB</b> adalah database PostgreSQL-compatible dari Google yang lebih cepat dan juga bisa menjalankan analitik di data live.",
  how:["Cloud SQL scale <b>up</b> (mesin lebih besar), bukan scale out. Ukuran praktisnya sampai puluhan TB.","<b>HA</b> = standby di zona lain dengan failover otomatis. <b>Read replica</b> menampung beban baca. <b>Cross-region replica</b> untuk antisipasi region mati.","Backup + point-in-time recovery bisa mengembalikan database ke momen tertentu.","AlloyDB menambah throughput jauh lebih tinggi dan <b>columnar engine</b> untuk query analitik cepat di data yang sama (HTAP)."],
  when:"\"Lift-and-shift MySQL/Postgres\", \"laporan memperlambat app\", \"tetap jalan saat zona/region mati\", \"Postgres tapi lebih cepat, dengan perubahan minimal\"."});
I("d3-l10",
 {what:"<b>Firestore</b> is a serverless document database for web and mobile apps. <b>Memorystore</b> is managed Redis/Valkey/Memcached, an in-memory cache with sub-millisecond latency.",
  how:["Firestore stores JSON-like documents, indexes fields automatically, supports transactions, and syncs to phones even offline.","Old exam material calls it \"Datastore\" (now Firestore in Datastore mode).","Memorystore keeps hot data in RAM: cached query results, user sessions, leaderboards.","A cache is not your system of record. The real data still lives in a database."],
  when:"\"Mobile app with offline sync\", \"flexible schema user profiles\", \"database overloaded by the same reads\", \"sub-millisecond sessions\"."},
 {what:"<b>Firestore</b> adalah database dokumen serverless untuk aplikasi web dan mobile. <b>Memorystore</b> adalah Redis/Valkey/Memcached yang di-manage, yaitu cache di memori dengan latency di bawah 1 milidetik.",
  how:["Firestore menyimpan dokumen mirip JSON, meng-index field secara otomatis, mendukung transaksi, dan bisa sinkron ke HP bahkan saat offline.","Materi ujian lama menyebutnya \"Datastore\" (sekarang Firestore in Datastore mode).","Memorystore menyimpan data yang sering dipakai di RAM: hasil query, session user, leaderboard.","Cache bukan sumber data utama. Data aslinya tetap disimpan di database."],
  when:"\"App mobile dengan sinkronisasi offline\", \"profil user dengan schema fleksibel\", \"database kewalahan karena read yang sama berulang\", \"session sub-milidetik\"."});
I("d3-l11",
 {what:"Data warehouse modelling is about shaping tables for the questions the business asks. OLTP systems are <b>normalized</b> for integrity, while warehouses are usually <b>denormalized</b> (star schemas, nested fields) for fast analytics.",
  how:["Star schema = big <b>fact</b> tables (sales events) joined to small <b>dimension</b> tables (customers, products).","<b>Slowly changing dimensions</b>: Type 1 overwrites old values, Type 2 keeps history rows with valid_from / valid_to.","In BigQuery, upserts are done with <code>MERGE</code>.","Organize datasets by domain and access boundary, because IAM is easiest per dataset."],
  when:"\"Keep the history of changes\", \"report on the value at the time of the sale\", \"should we normalize or denormalize?\"."},
 {what:"Modelling data warehouse artinya membentuk tabel sesuai pertanyaan bisnis. Sistem OLTP <b>dinormalisasi</b> demi integritas, sedangkan warehouse biasanya <b>didenormalisasi</b> (star schema, nested fields) supaya analitik cepat.",
  how:["Star schema = tabel <b>fact</b> besar (event penjualan) yang di-join ke tabel <b>dimension</b> kecil (customer, produk).","<b>Slowly changing dimension</b>: Type 1 menimpa nilai lama, Type 2 menyimpan baris riwayat dengan valid_from / valid_to.","Di BigQuery, upsert dilakukan dengan <code>MERGE</code>.","Atur dataset per domain dan batas akses, karena IAM paling mudah diatur per dataset."],
  when:"\"Simpan riwayat perubahan\", \"laporan dengan nilai saat transaksi terjadi\", \"normalisasi atau denormalisasi?\"."});
I("d3-l12",
 {what:"A <b>data lake</b> stores raw and curated data (mostly files in GCS plus BigQuery tables). <b>Dataplex</b> sits on top to organize, catalog, secure and quality-check all of it without moving the data.",
  how:["Dataplex structure: <b>Lake</b> (a business domain) → <b>Zones</b> (raw / curated) → <b>Assets</b> (buckets, datasets).","<b>Dataplex Universal Catalog</b> (formerly Data Catalog): search, metadata, business glossary.","<b>Data profiling</b>, <b>data quality scans</b> with rules and alerts, and <b>lineage</b> across services.","Supports <b>data mesh</b>: domain teams own their data, central policies still apply."],
  when:"\"Discover all our data\", \"central governance without copying\", \"automatic quality checks\", \"data mesh\", \"many tiny files are slow\"."},
 {what:"<b>Data lake</b> menyimpan data mentah dan data yang sudah dikurasi (kebanyakan file di GCS plus tabel BigQuery). <b>Dataplex</b> berada di atasnya untuk mengatur, membuat katalog, mengamankan dan mengecek kualitas semua data itu tanpa memindahkannya.",
  how:["Struktur Dataplex: <b>Lake</b> (satu domain bisnis) → <b>Zone</b> (raw / curated) → <b>Asset</b> (bucket, dataset).","<b>Dataplex Universal Catalog</b> (dulu Data Catalog): pencarian, metadata, glosarium bisnis.","<b>Data profiling</b>, <b>data quality scan</b> dengan aturan dan alert, serta <b>lineage</b> lintas service.","Mendukung <b>data mesh</b>: tim domain memiliki datanya sendiri, policy pusat tetap berlaku."],
  when:"\"Temukan semua data kita\", \"governance pusat tanpa copy\", \"cek kualitas otomatis\", \"data mesh\", \"banyak file kecil bikin lambat\"."});

/* ===== Domain 2 · Ingesting & processing ===== */
I("d2-l1",
 {what:"A data pipeline moves data from <b>sources</b> (apps, devices, databases, files) through <b>ingestion</b> and <b>processing</b> into <b>storage</b> where people use it. Google has a standard set of building blocks for each step.",
  how:["Ingest: <b>Pub/Sub</b> (events), <b>Datastream</b> (database changes), <b>Storage Transfer Service</b> (files).","Process: <b>Dataflow</b> (Apache Beam, serverless), <b>Dataproc</b> (managed Spark/Hadoop), <b>BigQuery SQL</b>, <b>Data Fusion</b> (no-code).","Streaming classic: Pub/Sub → Dataflow → BigQuery/Bigtable.","Batch classic: GCS → load job / Dataflow / Dataproc → BigQuery."],
  when:"Every \"design a pipeline\" question, and \"which processing engine should we use?\"."},
 {what:"Pipeline data memindahkan data dari <b>sumber</b> (app, perangkat, database, file) melalui <b>ingestion</b> dan <b>processing</b> sampai ke <b>storage</b> tempat data itu dipakai. Google punya blok standar untuk setiap langkahnya.",
  how:["Ingest: <b>Pub/Sub</b> (event), <b>Datastream</b> (perubahan database), <b>Storage Transfer Service</b> (file).","Process: <b>Dataflow</b> (Apache Beam, serverless), <b>Dataproc</b> (Spark/Hadoop managed), <b>BigQuery SQL</b>, <b>Data Fusion</b> (no-code).","Pola streaming klasik: Pub/Sub → Dataflow → BigQuery/Bigtable.","Pola batch klasik: GCS → load job / Dataflow / Dataproc → BigQuery."],
  when:"Setiap soal \"desain pipeline\" dan \"engine processing mana yang dipakai?\"."});
I("d2-l2",
 {what:"<b>Pub/Sub</b> is Google's global, serverless messaging service. Producers <b>publish</b> messages to a <b>topic</b>, and every <b>subscription</b> on that topic receives its own copy of each message.",
  how:["Subscribers must <b>acknowledge (ack)</b> each message before the ack deadline, otherwise it's delivered again.","Delivery is <b>at-least-once</b> by default, so duplicates can happen and consumers should be idempotent.","Order isn't guaranteed unless you use <b>ordering keys</b>.","<b>Pull</b> = the consumer fetches messages (Dataflow). <b>Push</b> = Pub/Sub calls an HTTPS endpoint."],
  when:"Real-time ingestion, decoupling systems, \"why are there duplicates?\", \"two teams both need all messages\"."},
 {what:"<b>Pub/Sub</b> adalah layanan messaging global dan serverless dari Google. Producer <b>mem-publish</b> pesan ke <b>topic</b>, dan setiap <b>subscription</b> di topic itu menerima salinan sendiri dari setiap pesan.",
  how:["Subscriber harus <b>ack</b> setiap pesan sebelum ack deadline, kalau tidak, pesannya dikirim ulang.","Pengirimannya <b>at-least-once</b> secara default, jadi duplikat bisa terjadi dan consumer sebaiknya idempotent.","Urutan tidak dijamin kecuali pakai <b>ordering keys</b>.","<b>Pull</b> = consumer yang mengambil pesan (Dataflow). <b>Push</b> = Pub/Sub memanggil endpoint HTTPS."],
  when:"Ingestion real-time, memisahkan sistem, \"kenapa ada duplikat?\", \"dua tim sama-sama butuh semua pesan\"."});
I("d2-l3",
 {what:"Running Pub/Sub in production means handling failures and replays: bad messages, buggy subscribers, and consumers that fall behind.",
  how:["<b>Seek</b> to a <b>snapshot</b> or timestamp to replay messages after a bad deploy.","<b>Dead-letter topics</b> catch messages that keep failing so they don't block the rest.","<b>Schemas</b> (Avro/Protobuf) reject malformed messages at publish time.","<b>BigQuery / Cloud Storage subscriptions</b> write messages straight to a table or bucket, with no pipeline."],
  when:"\"Reprocess the last 4 hours\", \"one bad message blocks everything\", \"load messages into BigQuery with no transformation\", \"backlog keeps growing\"."},
 {what:"Menjalankan Pub/Sub di production artinya menangani kegagalan dan replay: pesan rusak, subscriber yang bug, dan consumer yang tertinggal.",
  how:["<b>Seek</b> ke <b>snapshot</b> atau timestamp untuk memutar ulang pesan setelah deploy yang salah.","<b>Dead-letter topic</b> menampung pesan yang terus gagal supaya tidak memblokir yang lain.","<b>Schema</b> (Avro/Protobuf) menolak pesan yang formatnya salah saat publish.","<b>BigQuery / Cloud Storage subscription</b> menulis pesan langsung ke tabel atau bucket, tanpa pipeline."],
  when:"\"Proses ulang 4 jam terakhir\", \"satu pesan rusak memblokir semuanya\", \"masukkan pesan ke BigQuery tanpa transformasi\", \"backlog terus naik\"."});
I("d2-l4",
 {what:"<b>Apache Beam</b> is the programming model that <b>Dataflow</b> runs. You describe a pipeline once, as a series of steps on datasets, and the same code works for batch and streaming.",
  how:["<b>PCollection</b> = a distributed dataset (bounded for batch, unbounded for streams).","<b>Transforms</b>: ParDo (per element), GroupByKey, <b>Combine</b> (efficient sums/averages), <b>CoGroupByKey</b> (joins), Flatten, Partition.","<b>Side input</b> = a small lookup dataset broadcast to every worker.","<b>Tagged outputs</b> let you route bad records to a dead-letter sink."],
  when:"\"Enrich events with a small table\", \"join two streams\", \"bad records shouldn't fail the job\", \"aggregation is slow\"."},
 {what:"<b>Apache Beam</b> adalah model pemrograman yang dijalankan oleh <b>Dataflow</b>. Kamu menulis pipeline sekali, sebagai rangkaian langkah di atas dataset, dan kode yang sama bisa dipakai untuk batch maupun streaming.",
  how:["<b>PCollection</b> = dataset terdistribusi (bounded untuk batch, unbounded untuk stream).","<b>Transform</b>: ParDo (per elemen), GroupByKey, <b>Combine</b> (sum/rata-rata yang efisien), <b>CoGroupByKey</b> (join), Flatten, Partition.","<b>Side input</b> = dataset lookup kecil yang dibagikan ke semua worker.","<b>Tagged output</b> memungkinkan record rusak diarahkan ke dead-letter."],
  when:"\"Enrich event dengan tabel kecil\", \"join dua stream\", \"record rusak tidak boleh menggagalkan job\", \"agregasi lambat\"."});
I("d2-l5",
 {what:"Streaming data arrives continuously and often late. To aggregate it you group events into <b>windows</b> of time, based on <b>event time</b> (when it happened), not arrival time.",
  how:["<b>Event time</b> = timestamp in the data. <b>Processing time</b> = when the pipeline sees it.","The <b>watermark</b> is Dataflow's estimate of \"all events up to time T have probably arrived\".","Window types: <b>fixed</b> (every N minutes), <b>sliding</b> (last N, every M), <b>session</b> (until a gap of inactivity), <b>global</b>.","A window produces its result when the watermark passes its end."],
  when:"\"Count every 5 minutes\", \"moving average\", \"user sessions\", \"devices send delayed data\"."},
 {what:"Data streaming datang terus-menerus dan sering terlambat. Untuk mengagregasinya, event dikelompokkan ke dalam <b>window</b> waktu berdasarkan <b>event time</b> (kapan terjadinya), bukan waktu tiba.",
  how:["<b>Event time</b> = timestamp di dalam data. <b>Processing time</b> = saat pipeline melihatnya.","<b>Watermark</b> adalah perkiraan Dataflow bahwa \"semua event sampai waktu T kemungkinan sudah tiba\".","Jenis window: <b>fixed</b> (setiap N menit), <b>sliding</b> (N terakhir, tiap M), <b>session</b> (sampai ada jeda tanpa aktivitas), <b>global</b>.","Window mengeluarkan hasil saat watermark melewati ujung window."],
  when:"\"Hitung setiap 5 menit\", \"moving average\", \"sesi user\", \"perangkat mengirim data terlambat\"."});
I("d2-l6",
 {what:"<b>Triggers</b> decide when a window emits results, and <b>allowed lateness</b> decides how long late data is still accepted. Together they balance speed against completeness.",
  how:["Default trigger: emit once when the watermark passes the window end.","<b>Early triggers</b> (processing time) give speculative results while the window is still open.","<b>Allowed lateness</b> is 0 by default, so late data is dropped unless you raise it.","<b>Accumulating</b> mode re-emits the full total each time. <b>Discarding</b> emits only what's new."],
  when:"\"Late events are missing\", \"dashboards need early estimates then corrections\"."},
 {what:"<b>Trigger</b> menentukan kapan window mengeluarkan hasil, dan <b>allowed lateness</b> menentukan berapa lama data telat masih diterima. Keduanya menyeimbangkan kecepatan dan kelengkapan.",
  how:["Trigger default: keluarkan hasil sekali saat watermark melewati ujung window.","<b>Early trigger</b> (berbasis processing time) memberi hasil sementara selagi window masih terbuka.","<b>Allowed lateness</b> default-nya 0, jadi data telat dibuang kalau tidak dinaikkan.","Mode <b>accumulating</b> mengirim ulang total lengkap setiap kali. <b>Discarding</b> hanya mengirim bagian yang baru."],
  when:"\"Event telat hilang\", \"dashboard butuh angka sementara lalu koreksi\"."});
I("d2-l7",
 {what:"<b>Dataflow</b> is Google's serverless runner for Beam pipelines: it provisions workers, autoscales and handles failures. Operating it well means knowing how to deploy, stop, scale and debug jobs.",
  how:["<b>Update</b> (<code>--update</code>) swaps code in place and keeps state, for compatible changes.","<b>Drain</b> stops reading and finishes in-flight data. <b>Cancel</b> stops immediately and loses it.","<b>Flex Templates</b> let others launch a pipeline with parameters. <b>FlexRS</b> makes non-urgent batch cheaper.","Lag rising? Check max workers, <b>hot keys</b> and slow external calls."],
  when:"\"Deploy a fix without losing data\", \"stop the job safely\", \"analysts launch the pipeline\", \"one worker is overloaded\", \"no public IPs\"."},
 {what:"<b>Dataflow</b> adalah runner serverless untuk pipeline Beam: menyediakan worker, autoscaling, dan menangani kegagalan. Mengoperasikannya dengan baik artinya paham cara deploy, menghentikan, scaling dan debug job.",
  how:["<b>Update</b> (<code>--update</code>) mengganti kode di tempat dan mempertahankan state, untuk perubahan yang kompatibel.","<b>Drain</b> berhenti membaca dan menyelesaikan data in-flight. <b>Cancel</b> langsung berhenti dan data in-flight hilang.","<b>Flex Template</b> memungkinkan orang lain menjalankan pipeline dengan parameter. <b>FlexRS</b> membuat batch yang tidak mendesak lebih murah.","Lag naik? Cek max workers, <b>hot key</b> dan pemanggilan eksternal yang lambat."],
  when:"\"Deploy fix tanpa kehilangan data\", \"hentikan job dengan aman\", \"analis menjalankan pipeline sendiri\", \"satu worker kewalahan\", \"tanpa public IP\"."});
I("d2-l8",
 {what:"<b>Dataproc</b> is managed Spark and Hadoop. Clusters start in about 90 seconds and are billed per second, so the best practice is one short-lived cluster per job, with data kept in Cloud Storage.",
  how:["Store data in <b>GCS</b> (<code>gs://</code>), not on cluster HDFS, so clusters can be deleted.","<b>Ephemeral clusters</b> + workflow templates + scheduled deletion keep cost down.","Add <b>Spot secondary workers</b> for cheap extra compute. Keep primary workers standard.","<b>Initialization actions</b> install software on every node. <b>Serverless for Apache Spark</b> needs no cluster at all."],
  when:"\"Migrate existing Spark/Hadoop with minimal changes\", \"cluster idles and costs too much\", \"install a library on every node\"."},
 {what:"<b>Dataproc</b> adalah Spark dan Hadoop yang di-manage. Cluster menyala dalam sekitar 90 detik dan ditagih per detik, jadi praktik terbaiknya adalah satu cluster singkat per job, dengan data disimpan di Cloud Storage.",
  how:["Simpan data di <b>GCS</b> (<code>gs://</code>), bukan di HDFS cluster, supaya cluster bisa dihapus.","<b>Ephemeral cluster</b> + workflow template + scheduled deletion menekan biaya.","Tambahkan <b>Spot secondary worker</b> untuk compute tambahan yang murah. Primary worker tetap standar.","<b>Initialization action</b> menginstal software di setiap node. <b>Serverless for Apache Spark</b> tidak butuh cluster sama sekali."],
  when:"\"Migrasi Spark/Hadoop yang sudah ada dengan perubahan minimal\", \"cluster nganggur dan mahal\", \"instal library di setiap node\"."});
I("d2-l9",
 {what:"Besides Dataflow and Dataproc, Google offers specialised tools: <b>Data Fusion</b> (no-code ETL), <b>Dataprep</b> (visual cleaning), <b>Dataform</b> (SQL transformations in BigQuery) and <b>Datastream</b> (change data capture from databases).",
  how:["<b>Data Fusion</b>: drag-and-drop pipelines with 150+ connectors. Runs on Dataproc.","<b>Dataform</b>: SQLX files with dependencies, git and <b>assertions</b> (data tests).","<b>Datastream</b>: copies every insert/update/delete from MySQL, Postgres, Oracle or SQL Server into BigQuery in near real time.","Simple file loads don't need a pipeline: a BigQuery <b>load job</b> is enough."],
  when:"\"Team can't code\", \"SQL pipelines with tests\", \"replicate a database to BigQuery continuously\", \"daily CSV into BigQuery\"."},
 {what:"Selain Dataflow dan Dataproc, Google punya tool khusus: <b>Data Fusion</b> (ETL no-code), <b>Dataprep</b> (membersihkan data secara visual), <b>Dataform</b> (transformasi SQL di BigQuery) dan <b>Datastream</b> (change data capture dari database).",
  how:["<b>Data Fusion</b>: pipeline drag-and-drop dengan 150+ connector. Berjalan di atas Dataproc.","<b>Dataform</b>: file SQLX dengan dependency, git dan <b>assertion</b> (test data).","<b>Datastream</b>: menyalin setiap insert/update/delete dari MySQL, Postgres, Oracle atau SQL Server ke BigQuery hampir real-time.","Load file sederhana tidak butuh pipeline: BigQuery <b>load job</b> sudah cukup."],
  when:"\"Tim tidak bisa coding\", \"pipeline SQL dengan test\", \"replikasi database ke BigQuery terus-menerus\", \"CSV harian ke BigQuery\"."});
I("d2-l10",
 {what:"Orchestration decides <b>what runs when, in what order, and what happens on failure</b>. Google offers Cloud Composer (managed Airflow), Workflows, Cloud Scheduler and Eventarc, plus Cloud Build for CI/CD.",
  how:["<b>Cloud Composer</b>: Python DAGs with dependencies, retries, backfills, sensors and alerts across many services.","<b>Workflows</b>: lightweight, serverless chains of API calls in YAML.","<b>Cloud Scheduler</b> is cron. <b>Eventarc</b> reacts to events (e.g. a file landing in GCS).","<b>CI/CD</b>: Cloud Build tests and builds, Artifact Registry stores images, and deployments go to separate dev/prod projects."],
  when:"\"Multi-step nightly pipeline with retries\", \"cheap chain of API calls\", \"start when a file arrives\", \"promote code from dev to prod\"."},
 {what:"Orkestrasi menentukan <b>apa yang jalan kapan, dengan urutan apa, dan apa yang terjadi kalau gagal</b>. Google menyediakan Cloud Composer (Airflow managed), Workflows, Cloud Scheduler dan Eventarc, plus Cloud Build untuk CI/CD.",
  how:["<b>Cloud Composer</b>: DAG Python dengan dependency, retry, backfill, sensor dan alert lintas banyak service.","<b>Workflows</b>: rangkaian pemanggilan API yang ringan dan serverless, ditulis dalam YAML.","<b>Cloud Scheduler</b> adalah cron. <b>Eventarc</b> bereaksi terhadap event (misalnya file masuk ke GCS).","<b>CI/CD</b>: Cloud Build menjalankan test dan build, Artifact Registry menyimpan image, deploy ke project dev/prod yang terpisah."],
  when:"\"Pipeline malam multi-langkah dengan retry\", \"rangkaian API yang murah\", \"mulai saat file datang\", \"promosi kode dari dev ke prod\"."});
})();

(function(){
PDE.intros = PDE.intros || {};
const I=(id,en,idv)=>{PDE.intros[id]={en,id:idv};};

/* ===== Domain 1 · Designing ===== */
I("d1-l1",
 {what:"<b>IAM (Identity and Access Management)</b> controls who can do what on which resource. Google's rule is simple: give <b>predefined roles</b> to <b>groups</b> or <b>service accounts</b>, at the smallest scope that works.",
  how:["Resources sit in a hierarchy: Organization → Folders → Projects → Resources. Permissions are <b>inherited downward</b>.","Principals: Google accounts, <b>Google Groups</b> (preferred), <b>service accounts</b> (apps/pipelines), Workload Identity Federation (external workloads).","Role types: basic (Owner/Editor/Viewer, too broad), <b>predefined</b> (the default answer), custom (only when nothing fits).","<b>Organization policies</b> are guardrails for the whole org, e.g. allowed regions or no service account keys."],
  when:"\"Least privilege\", \"analysts should only query\", \"pipeline needs to write\", \"data must stay in the EU\", \"no long-lived keys\"."},
 {what:"<b>IAM (Identity and Access Management)</b> mengatur siapa boleh melakukan apa di resource mana. Aturan Google sederhana: berikan <b>predefined role</b> ke <b>group</b> atau <b>service account</b>, di scope sekecil mungkin yang masih cukup.",
  how:["Resource tersusun bertingkat: Organization → Folder → Project → Resource. Izin <b>diwariskan ke bawah</b>.","Principal: akun Google, <b>Google Group</b> (paling disarankan), <b>service account</b> (app/pipeline), Workload Identity Federation (workload dari luar).","Jenis role: basic (Owner/Editor/Viewer, terlalu luas), <b>predefined</b> (jawaban default), custom (hanya kalau tidak ada yang cocok).","<b>Organization policy</b> adalah pagar untuk seluruh organisasi, misalnya region yang diizinkan atau larangan service account key."],
  when:"\"Least privilege\", \"analis cukup bisa query\", \"pipeline perlu menulis\", \"data harus tetap di EU\", \"tanpa key jangka panjang\"."});
I("d1-l2",
 {what:"All data in Google Cloud is <b>encrypted at rest automatically</b>. The exam asks who controls the keys: Google (default), you inside Google (<b>CMEK</b> in Cloud KMS), hardware (<b>Cloud HSM</b>), or a system outside Google (<b>Cloud EKM</b>).",
  how:["<b>CMEK</b>: you create and rotate keys in Cloud KMS. Disable or destroy a key and the data becomes unreadable.","<b>Cloud HSM</b>: CMEK keys stored in certified hardware security modules.","<b>Cloud EKM</b>: keys live in an external key manager you control.","<b>CSEK</b>: you send the key with each request. Only Cloud Storage and Compute Engine support it, not BigQuery."],
  when:"\"We must control/rotate/revoke keys\", \"keys must never be stored in Google\", \"make a customer's data unrecoverable instantly\"."},
 {what:"Semua data di Google Cloud <b>otomatis terenkripsi</b>. Yang ditanya di ujian adalah siapa yang mengontrol kuncinya: Google (default), kamu di dalam Google (<b>CMEK</b> di Cloud KMS), hardware khusus (<b>Cloud HSM</b>), atau sistem di luar Google (<b>Cloud EKM</b>).",
  how:["<b>CMEK</b>: kamu membuat dan merotasi kunci di Cloud KMS. Kalau kuncinya di-disable atau dihancurkan, data jadi tidak bisa dibaca.","<b>Cloud HSM</b>: kunci CMEK yang disimpan di hardware security module tersertifikasi.","<b>Cloud EKM</b>: kunci disimpan di key manager eksternal yang kamu kontrol.","<b>CSEK</b>: kamu mengirim kunci di setiap request. Hanya Cloud Storage dan Compute Engine yang mendukung, BigQuery tidak."],
  when:"\"Kami harus mengontrol/merotasi/mencabut kunci\", \"kunci tidak boleh disimpan di Google\", \"buat data customer langsung tidak bisa dipulihkan\"."});
I("d1-l3",
 {what:"<b>Sensitive Data Protection</b> (formerly Cloud DLP) finds sensitive data such as card numbers, emails or ID numbers, and <b>de-identifies</b> it. The technique you choose decides what analysts can still do with the data.",
  how:["<b>Inspect</b>: scans BigQuery, Cloud Storage or streams for 150+ infoTypes, plus your own patterns.","<b>Masking/redaction</b> hides values permanently. <b>Deterministic encryption / FPE (tokenization)</b> keeps joins working and can be reversed with the key.","<b>Hashing</b> is joinable but one-way. <b>Bucketing</b> and <b>date shifting</b> keep the overall shape of the data.","<b>Risk analysis</b> (k-anonymity) measures how easy re-identification would be."],
  when:"\"Analysts must join on PII without seeing it\", \"mask card numbers\", \"hide exact ages but keep trends\", \"remove PII before loading\"."},
 {what:"<b>Sensitive Data Protection</b> (dulu Cloud DLP) mencari data sensitif seperti nomor kartu, email atau nomor identitas, lalu <b>menyamarkannya</b> (de-identify). Teknik yang dipilih menentukan apa yang masih bisa dilakukan analis dengan datanya.",
  how:["<b>Inspect</b>: men-scan BigQuery, Cloud Storage atau stream untuk 150+ infoType, plus pola buatanmu sendiri.","<b>Masking/redaction</b> menyembunyikan nilai secara permanen. <b>Deterministic encryption / FPE (tokenization)</b> membuat join tetap jalan dan bisa dikembalikan dengan kunci.","<b>Hashing</b> bisa di-join tapi satu arah. <b>Bucketing</b> dan <b>date shifting</b> menjaga bentuk umum datanya.","<b>Risk analysis</b> (k-anonymity) mengukur seberapa mudah data bisa diidentifikasi ulang."],
  when:"\"Analis harus join pakai PII tanpa melihatnya\", \"samarkan nomor kartu\", \"sembunyikan umur pasti tapi tren tetap ada\", \"hapus PII sebelum load\"."});
I("d1-l4",
 {what:"IAM controls who can access data, but stolen credentials still work. <b>VPC Service Controls</b> adds a perimeter so data can't leave your projects even with valid credentials. <b>Audit logs</b> record who did what.",
  how:["<b>VPC Service Controls</b>: a service perimeter around projects that blocks copying data outside it (exfiltration).","<b>Private Google Access</b>: VMs without public IPs can still reach Google APIs.","<b>Audit logs</b>: Admin Activity (always on), Data Access (on by default for BigQuery), System Event, Policy Denied.","Separate <b>dev / test / prod projects</b>, and pick dataset regions carefully (BigQuery location is fixed at creation)."],
  when:"\"Prevent exfiltration\", \"stolen credentials\", \"who read this table?\", \"VMs without external IPs\", \"developers broke prod\"."},
 {what:"IAM mengatur siapa yang boleh akses data, tapi kredensial curian tetap bisa dipakai. <b>VPC Service Controls</b> menambah pagar supaya data tidak bisa keluar dari project-mu walau kredensialnya valid. <b>Audit log</b> mencatat siapa melakukan apa.",
  how:["<b>VPC Service Controls</b>: perimeter di sekeliling project yang memblokir penyalinan data ke luar (exfiltration).","<b>Private Google Access</b>: VM tanpa public IP tetap bisa mengakses API Google.","<b>Audit log</b>: Admin Activity (selalu aktif), Data Access (aktif secara default untuk BigQuery), System Event, Policy Denied.","Pisahkan <b>project dev / test / prod</b>, dan pilih region dataset dengan cermat (lokasi BigQuery tidak bisa diubah setelah dibuat)."],
  when:"\"Cegah exfiltration\", \"kredensial dicuri\", \"siapa yang membaca tabel ini?\", \"VM tanpa external IP\", \"developer merusak prod\"."});
I("d1-l5",
 {what:"Reliable systems lose no data, keep data correct, and recover quickly. The two numbers to know are <b>RPO</b> (how much data you can lose) and <b>RTO</b> (how long you can be down).",
  how:["Lower RPO/RTO costs more: backups → replicas → multi-region / active-active.","Pick the <b>cheapest option that still meets</b> the stated RPO and RTO.","Data correctness: <b>Dataform assertions</b>, <b>Dataplex data quality scans</b>, and dead-letter outputs for bad records.","Validate migrations with row counts and checksums, and run old and new systems in parallel."],
  when:"\"RPO of 24 hours on a tight budget\", \"survive a region outage\", \"catch duplicate IDs automatically\"."},
 {what:"Sistem yang andal tidak kehilangan data, datanya tetap benar, dan cepat pulih. Dua angka yang wajib dikenal adalah <b>RPO</b> (berapa banyak data boleh hilang) dan <b>RTO</b> (berapa lama boleh down).",
  how:["RPO/RTO makin kecil, biaya makin mahal: backup → replika → multi-region / active-active.","Pilih <b>opsi termurah yang tetap memenuhi</b> angka RPO dan RTO di soal.","Kebenaran data: <b>Dataform assertions</b>, <b>Dataplex data quality scans</b>, dan dead-letter output untuk record rusak.","Validasi migrasi dengan row count dan checksum, dan jalankan sistem lama dan baru secara paralel."],
  when:"\"RPO 24 jam dengan budget terbatas\", \"tetap jalan saat region mati\", \"deteksi ID duplikat otomatis\"."});
I("d1-l6",
 {what:"Google wants your data and pipelines to be <b>portable</b>: open file formats, open-source engines, and analytics that work across clouds without moving data.",
  how:["<b>BigQuery Omni</b> runs BigQuery queries on data that stays in AWS S3 or Azure.","<b>BigLake</b> gives governed, fine-grained-secured tables over open formats like Parquet and Apache Iceberg.","<b>Apache Beam</b> pipelines can run on Dataflow, Flink or Spark.","<b>Dataplex Universal Catalog</b> makes data discoverable everywhere, with metadata and lineage."],
  when:"\"Data in S3 can't be moved\", \"Iceberg tables for BigQuery and Spark\", \"avoid lock-in\", \"multicloud\"."},
 {what:"Google ingin data dan pipeline kamu <b>portable</b>: format file terbuka, engine open-source, dan analitik yang jalan lintas cloud tanpa memindahkan data.",
  how:["<b>BigQuery Omni</b> menjalankan query BigQuery di data yang tetap berada di AWS S3 atau Azure.","<b>BigLake</b> menyediakan tabel ber-governance dengan security fine-grained di atas format terbuka seperti Parquet dan Apache Iceberg.","Pipeline <b>Apache Beam</b> bisa dijalankan di Dataflow, Flink atau Spark.","<b>Dataplex Universal Catalog</b> membuat data bisa ditemukan di mana saja, lengkap dengan metadata dan lineage."],
  when:"\"Data di S3 tidak boleh dipindah\", \"tabel Iceberg untuk BigQuery dan Spark\", \"hindari lock-in\", \"multicloud\"."});
I("d1-l7",
 {what:"Migration questions ask how to move data and systems into Google Cloud. Pick the tool by <b>what</b> you move (files, a warehouse, a database), <b>how much</b>, and <b>how fast your network is</b>.",
  how:["Files: <b>gcloud storage</b> (small), <b>Storage Transfer Service</b> (large, scheduled, cross-cloud), <b>Transfer Appliance</b> (huge data, slow network).","Warehouses and SaaS → BigQuery: <b>BigQuery Data Transfer Service</b>. Databases → Cloud SQL/AlloyDB: <b>Database Migration Service</b>.","Continuous change replication into BigQuery: <b>Datastream</b> (CDC).","Rule of thumb: <b>1 TB over 100 Mbps ≈ 1 day</b>. Private high bandwidth → Interconnect, quick and encrypted → VPN."],
  when:"\"800 TB and a 200 Mbps link\", \"migrate Teradata\", \"MySQL with minimal downtime\", \"keep BigQuery in sync with Oracle\"."},
 {what:"Soal migrasi menanyakan cara memindahkan data dan sistem ke Google Cloud. Pilih tool berdasarkan <b>apa</b> yang dipindah (file, warehouse, database), <b>seberapa banyak</b>, dan <b>seberapa cepat jaringannya</b>.",
  how:["File: <b>gcloud storage</b> (kecil), <b>Storage Transfer Service</b> (besar, terjadwal, lintas cloud), <b>Transfer Appliance</b> (data sangat besar, jaringan lambat).","Warehouse dan SaaS → BigQuery: <b>BigQuery Data Transfer Service</b>. Database → Cloud SQL/AlloyDB: <b>Database Migration Service</b>.","Replikasi perubahan terus-menerus ke BigQuery: <b>Datastream</b> (CDC).","Rumus cepat: <b>1 TB lewat 100 Mbps ≈ 1 hari</b>. Butuh bandwidth besar dan privat → Interconnect, cepat dan terenkripsi → VPN."],
  when:"\"800 TB dengan link 200 Mbps\", \"migrasi Teradata\", \"MySQL dengan downtime minimal\", \"BigQuery harus sinkron dengan Oracle\"."});

/* ===== Domain 4 · Analysis & ML ===== */
I("d4-l1",
 {what:"Dashboards on BigQuery need to be fast and cheap for many users. Google's tools for this are <b>BI Engine</b> (in-memory acceleration), <b>materialized views</b> (precomputed aggregates) and good table design, plus <b>Looker</b> for governed metrics.",
  how:["<b>BI Engine</b> keeps hot data in memory so BI tools get sub-second responses.","<b>Materialized views</b> store an aggregation, refresh automatically, and BigQuery can rewrite queries to use them.","<b>Looker</b> defines metrics once in LookML. <b>Looker Studio</b> builds quick dashboards.","The query cache returns identical results for free for up to 24 hours."],
  when:"\"Dashboard is slow for many users\", \"same aggregation runs all day\", \"teams define metrics differently\", \"dashboard shows stale data\"."},
 {what:"Dashboard di atas BigQuery harus cepat dan murah untuk banyak user. Tool Google untuk ini adalah <b>BI Engine</b> (akselerasi in-memory), <b>materialized view</b> (agregasi yang dihitung di awal) dan desain tabel yang baik, plus <b>Looker</b> untuk metrik yang terkelola.",
  how:["<b>BI Engine</b> menyimpan data yang sering dipakai di memori, jadi tool BI dapat respons di bawah 1 detik.","<b>Materialized view</b> menyimpan hasil agregasi, refresh otomatis, dan BigQuery bisa me-rewrite query supaya memakainya.","<b>Looker</b> mendefinisikan metrik sekali di LookML. <b>Looker Studio</b> untuk dashboard cepat.","Query cache mengembalikan hasil yang identik secara gratis sampai 24 jam."],
  when:"\"Dashboard lambat untuk banyak user\", \"agregasi yang sama jalan seharian\", \"setiap tim mendefinisikan metrik berbeda\", \"dashboard menampilkan data basi\"."});
I("d4-l2",
 {what:"When a BigQuery query is slow or expensive, the fix is usually in how the query is written, not in buying more capacity. The <b>execution graph</b> shows where the time and bytes go.",
  how:["Select only the columns you need. <b>LIMIT doesn't reduce</b> bytes scanned.","Filter on partition and cluster columns early, and filter before joining.","Replace self-joins with <b>window functions</b> (LAG, ROW_NUMBER…). Watch for <b>skew</b> (one key with most rows).","Use <code>APPROX_COUNT_DISTINCT</code> when exact isn't needed, a <b>dry run</b> to preview bytes, and search indexes for needle-in-haystack lookups."],
  when:"\"Query is slow\", \"bill is too high\", \"one worker does most of the work\", \"find one ID in a 100 TB log table\"."},
 {what:"Kalau query BigQuery lambat atau mahal, solusinya biasanya ada di cara query ditulis, bukan di menambah kapasitas. <b>Execution graph</b> menunjukkan ke mana waktu dan byte-nya habis.",
  how:["Pilih kolom yang dibutuhkan saja. <b>LIMIT tidak mengurangi</b> byte yang di-scan.","Filter kolom partisi dan cluster sedini mungkin, dan filter sebelum join.","Ganti self-join dengan <b>window function</b> (LAG, ROW_NUMBER…). Waspadai <b>skew</b> (satu key memegang sebagian besar baris).","Pakai <code>APPROX_COUNT_DISTINCT</code> kalau tidak perlu angka pasti, <b>dry run</b> untuk melihat byte di awal, dan search index untuk mencari satu nilai di tabel raksasa."],
  when:"\"Query lambat\", \"tagihan terlalu besar\", \"satu worker mengerjakan sebagian besar beban\", \"cari satu ID di tabel log 100 TB\"."});
I("d4-l3",
 {what:"BigQuery lets you share data safely at different levels: share only query <b>results</b> (authorized views), filter <b>rows</b> per user (row-level security), or hide and mask <b>columns</b> (policy tags and dynamic masking).",
  how:["<b>Authorized view</b>: users query the view, but have no access to the source tables. Put it in a separate dataset.","<b>Row-level access policy</b>: one table, and each group automatically sees only its rows.","<b>Policy tags</b>: column-level security. Only Fine-Grained Readers can see the real values.","<b>Dynamic data masking</b>: users can still query the column but see nulls, hashes or the last 4 digits."],
  when:"\"Partner sees aggregates only\", \"managers see their own region\", \"hide the salary column\", \"show only the last 4 digits\"."},
 {what:"BigQuery memungkinkan berbagi data dengan aman di beberapa level: hanya membagikan <b>hasil</b> query (authorized view), memfilter <b>baris</b> per user (row-level security), atau menyembunyikan dan menyamarkan <b>kolom</b> (policy tags dan dynamic masking).",
  how:["<b>Authorized view</b>: user bisa query view-nya, tapi tidak punya akses ke tabel sumbernya. Taruh view di dataset terpisah.","<b>Row-level access policy</b>: satu tabel, dan setiap group otomatis hanya melihat barisnya sendiri.","<b>Policy tags</b>: security di level kolom. Hanya Fine-Grained Reader yang bisa melihat nilai aslinya.","<b>Dynamic data masking</b>: user tetap bisa query kolomnya tapi yang terlihat null, hash, atau 4 digit terakhir."],
  when:"\"Partner hanya melihat agregat\", \"manajer melihat region-nya sendiri\", \"sembunyikan kolom gaji\", \"tampilkan 4 digit terakhir saja\"."});
I("d4-l4",
 {what:"The PDE still asks general machine learning questions: why a model fails on new data, which metric to use, and how to represent features. You don't need deep math, just the symptom → fix patterns.",
  how:["<b>Overfitting</b> (great on training, poor on new data) → regularization, dropout, more data, early stopping.","<b>Underfitting</b> (poor everywhere) → more features or a more complex model.","<b>Precision</b> = how many flagged items were right. <b>Recall</b> = how many real positives were caught. Accuracy misleads on imbalanced data.","High-cardinality features → <b>embeddings</b> or hash buckets. Same preprocessing in training and serving avoids <b>training-serving skew</b>."],
  when:"\"99% train, 70% test\", \"fraud is 1% of data\", \"don't miss any sick patients\", \"millions of user IDs as a feature\"."},
 {what:"Ujian PDE masih menanyakan konsep machine learning umum: kenapa model gagal di data baru, metrik apa yang dipakai, dan cara merepresentasikan fitur. Tidak perlu matematika mendalam, cukup paham pola gejala → solusi.",
  how:["<b>Overfitting</b> (bagus di training, jelek di data baru) → regularization, dropout, tambah data, early stopping.","<b>Underfitting</b> (jelek di semua data) → tambah fitur atau model yang lebih kompleks.","<b>Precision</b> = berapa banyak yang ditandai ternyata benar. <b>Recall</b> = berapa banyak positif asli yang tertangkap. Accuracy menyesatkan di data yang tidak seimbang.","Fitur dengan nilai unik sangat banyak → <b>embedding</b> atau hash bucket. Preprocessing yang sama di training dan serving mencegah <b>training-serving skew</b>."],
  when:"\"99% di training, 70% di test\", \"fraud cuma 1% dari data\", \"jangan sampai ada pasien sakit yang terlewat\", \"jutaan user ID sebagai fitur\"."});
I("d4-l5",
 {what:"<b>BigQuery ML</b> lets you create, evaluate and use machine learning models with plain SQL, right where the data already lives. It's the go-to answer when the users are SQL analysts.",
  how:["<code>CREATE MODEL</code> trains, <code>ML.EVALUATE</code> scores, <code>ML.PREDICT</code> predicts.","Model types: linear_reg (numbers), logistic_reg (categories), <b>kmeans</b> (segments), <b>matrix_factorization</b> (recommendations), <b>arima_plus</b> (forecasting).","The <b>TRANSFORM</b> clause stores preprocessing with the model, so prediction uses the same steps.","Remote models can call Gemini and Vertex AI from SQL (text generation, embeddings)."],
  when:"\"Analysts know SQL\", \"segment customers\", \"forecast sales\", \"recommend products\", \"predictions look wrong after preprocessing\"."},
 {what:"<b>BigQuery ML</b> memungkinkan kamu membuat, mengevaluasi dan memakai model machine learning cukup dengan SQL, langsung di tempat datanya berada. Ini jawaban utama kalau user-nya analis SQL.",
  how:["<code>CREATE MODEL</code> untuk training, <code>ML.EVALUATE</code> untuk menilai, <code>ML.PREDICT</code> untuk prediksi.","Jenis model: linear_reg (angka), logistic_reg (kategori), <b>kmeans</b> (segmentasi), <b>matrix_factorization</b> (rekomendasi), <b>arima_plus</b> (forecasting).","Klausa <b>TRANSFORM</b> menyimpan preprocessing bersama model, jadi prediksi memakai langkah yang sama.","Remote model bisa memanggil Gemini dan Vertex AI dari SQL (generate teks, embedding)."],
  when:"\"Analis paham SQL\", \"segmentasi customer\", \"forecast penjualan\", \"rekomendasi produk\", \"prediksi terlihat salah setelah preprocessing\"."});
I("d4-l6",
 {what:"Beyond BigQuery ML, Google offers <b>pre-trained APIs</b> (no training at all), <b>Vertex AI AutoML</b> (custom models with little code) and <b>Vertex AI custom training</b> (full control). The right one depends on who builds it and how custom the task is.",
  how:["Pre-trained APIs: Vision, Natural Language, Speech-to-Text, Translation, Video Intelligence, <b>Document AI</b>, Gemini.","<b>AutoML</b>: bring labelled data, and Google trains and tunes the model.","<b>Custom training</b>: your own TensorFlow/PyTorch code on GPUs/TPUs, with <b>Vertex AI Pipelines</b> for repeatability.","Serving: <b>online prediction</b> (low latency, per request) vs <b>batch prediction</b> (large volumes, async)."],
  when:"\"No ML team\", \"custom labels, limited expertise\", \"score 200M rows nightly\", \"fraud score in 100 ms\"."},
 {what:"Selain BigQuery ML, Google menyediakan <b>pre-trained API</b> (tanpa training sama sekali), <b>Vertex AI AutoML</b> (model custom dengan sedikit kode) dan <b>Vertex AI custom training</b> (kontrol penuh). Pilihannya tergantung siapa yang membangun dan seberapa spesifik tugasnya.",
  how:["Pre-trained API: Vision, Natural Language, Speech-to-Text, Translation, Video Intelligence, <b>Document AI</b>, Gemini.","<b>AutoML</b>: bawa data berlabel, Google yang melatih dan men-tuning modelnya.","<b>Custom training</b>: kode TensorFlow/PyTorch sendiri di GPU/TPU, dengan <b>Vertex AI Pipelines</b> supaya bisa diulang.","Serving: <b>online prediction</b> (latency rendah, per request) vs <b>batch prediction</b> (volume besar, asinkron)."],
  when:"\"Tidak ada tim ML\", \"label custom, keahlian terbatas\", \"scoring 200 juta baris tiap malam\", \"skor fraud dalam 100 ms\"."});
I("d4-l7",
 {what:"<b>RAG (retrieval-augmented generation)</b> lets an LLM answer from your own documents. You turn document chunks into <b>embeddings</b> (vectors of numbers that capture meaning), find the most relevant chunks with <b>vector search</b>, and pass them to Gemini.",
  how:["Collect documents (e.g. GCS + BigQuery object tables), then parse and <b>chunk</b> them.","Create embeddings with <code>ML.GENERATE_EMBEDDING</code> or Vertex AI.","Store them in a <b>vector index</b> (BigQuery, AlloyDB or Vertex AI Vector Search) and query with <code>VECTOR_SEARCH</code>.","Re-embed documents when they change, so answers stay fresh."],
  when:"\"Chatbot over company documents\", \"answers must cite sources\", \"semantic search in SQL\", \"chatbot gives outdated answers\"."},
 {what:"<b>RAG (retrieval-augmented generation)</b> membuat LLM bisa menjawab berdasarkan dokumenmu sendiri. Potongan dokumen diubah menjadi <b>embedding</b> (deretan angka yang menangkap makna), potongan yang paling relevan dicari dengan <b>vector search</b>, lalu diberikan ke Gemini.",
  how:["Kumpulkan dokumen (misalnya GCS + BigQuery object tables), lalu parse dan <b>chunk</b>.","Buat embedding dengan <code>ML.GENERATE_EMBEDDING</code> atau Vertex AI.","Simpan di <b>vector index</b> (BigQuery, AlloyDB atau Vertex AI Vector Search) lalu query dengan <code>VECTOR_SEARCH</code>.","Buat ulang embedding saat dokumen berubah supaya jawabannya tetap terbaru."],
  when:"\"Chatbot dari dokumen perusahaan\", \"jawaban harus menyebut sumber\", \"semantic search di SQL\", \"chatbot memberi jawaban basi\"."});
I("d4-l8",
 {what:"<b>Analytics Hub</b> (now called BigQuery sharing) lets you share BigQuery datasets with other teams or companies <b>without copying</b> them. Subscribers get a live, read-only linked dataset and pay for their own queries.",
  how:["Publishers create <b>exchanges</b> and <b>listings</b>. Subscribers add a <b>linked dataset</b> to their project.","Data is always current because nothing is copied.","<b>Data clean rooms</b> let two companies analyse combined data under privacy rules, without seeing each other's raw rows.","Billing: the project that <b>runs</b> the query pays for compute. The owner pays for storage."],
  when:"\"Share with 40 partners, no copies\", \"sell a dataset\", \"measure customer overlap with a partner privately\", \"who pays for this query?\"."},
 {what:"<b>Analytics Hub</b> (sekarang disebut BigQuery sharing) memungkinkan berbagi dataset BigQuery dengan tim atau perusahaan lain <b>tanpa meng-copy</b>. Subscriber mendapat linked dataset yang live dan read-only, dan membayar query-nya sendiri.",
  how:["Publisher membuat <b>exchange</b> dan <b>listing</b>. Subscriber menambahkan <b>linked dataset</b> ke project-nya.","Data selalu terbaru karena tidak ada yang di-copy.","<b>Data clean room</b> memungkinkan dua perusahaan menganalisis data gabungan dengan aturan privasi, tanpa melihat baris mentah milik pihak lain.","Billing: project yang <b>menjalankan</b> query membayar compute. Pemilik tabel membayar storage."],
  when:"\"Berbagi dengan 40 partner tanpa copy\", \"menjual dataset\", \"mengukur irisan customer dengan partner secara privat\", \"siapa yang bayar query ini?\"."});

/* ===== Domain 5 · Maintaining ===== */
I("d5-l1",
 {what:"BigQuery charges for storage plus <b>compute</b>. Compute is either <b>on-demand</b> (pay per TiB scanned) or <b>capacity</b> through <b>BigQuery Editions</b> (pay for slots, with reservations). The old flat-rate model is retired.",
  how:["On-demand suits spiky or small workloads. Editions suit steady, heavy workloads that need predictable spend.","A <b>reservation</b> has a <b>baseline</b> of slots plus <b>autoscaling</b> up to a max. Commitments (1 or 3 years) add discounts.","<b>Assignments</b> connect projects to reservations, so ETL and BI can each have their own capacity.","Guardrails: <b>custom quotas</b>, <b>maximum bytes billed</b>, dry runs, budgets and billing export."],
  when:"\"Bill is unpredictable\", \"ETL slows dashboards\", \"stop a runaway query\", \"flat-rate\" in old questions."},
 {what:"BigQuery mengenakan biaya storage plus <b>compute</b>. Compute bisa <b>on-demand</b> (bayar per TiB yang di-scan) atau <b>capacity</b> lewat <b>BigQuery Editions</b> (bayar slot, dengan reservation). Model flat-rate yang lama sudah tidak ada.",
  how:["On-demand cocok untuk workload yang naik-turun atau kecil. Editions cocok untuk workload stabil dan berat yang butuh biaya terprediksi.","<b>Reservation</b> punya <b>baseline</b> slot plus <b>autoscaling</b> sampai batas maksimum. Commitment (1 atau 3 tahun) memberi diskon.","<b>Assignment</b> menghubungkan project ke reservation, jadi ETL dan BI bisa punya kapasitas masing-masing.","Pengaman: <b>custom quota</b>, <b>maximum bytes billed</b>, dry run, budget dan billing export."],
  when:"\"Tagihan tidak bisa diprediksi\", \"ETL memperlambat dashboard\", \"hentikan query yang kebablasan\", \"flat-rate\" di soal lama."});
I("d5-l2",
 {what:"Every data service has its own cost levers. The exam wants you to cut spend <b>without breaking requirements</b>: pay only while jobs run, use cheaper capacity where it's safe, and see who spends what.",
  how:["Dataproc: <b>ephemeral clusters</b>, data in GCS, <b>Spot secondary workers</b>, autoscaling.","Dataflow: max-workers caps, right-sized machines, <b>FlexRS</b> for batch jobs that can wait.","Cloud Storage: lifecycle rules and Autoclass. Bigtable/Spanner: autoscaling.","<b>Labels</b> + <b>billing export</b> to BigQuery show cost by team and pipeline."],
  when:"\"Cluster idles at night\", \"non-urgent weekly batch\", \"which team spends the most?\"."},
 {what:"Setiap layanan data punya cara hemat masing-masing. Ujian ingin kamu memangkas biaya <b>tanpa melanggar kebutuhan</b>: bayar hanya saat job jalan, pakai kapasitas murah di tempat yang aman, dan lihat siapa yang menghabiskan biaya.",
  how:["Dataproc: <b>ephemeral cluster</b>, data di GCS, <b>Spot secondary worker</b>, autoscaling.","Dataflow: batas max workers, ukuran mesin yang pas, <b>FlexRS</b> untuk batch yang boleh menunggu.","Cloud Storage: lifecycle rules dan Autoclass. Bigtable/Spanner: autoscaling.","<b>Labels</b> + <b>billing export</b> ke BigQuery menunjukkan biaya per tim dan per pipeline."],
  when:"\"Cluster nganggur di malam hari\", \"batch mingguan yang tidak mendesak\", \"tim mana yang paling boros?\"."});
I("d5-l3",
 {what:"<b>Cloud Composer</b> is managed Apache Airflow. It runs <b>DAGs</b>: Python files that describe tasks, their order, retries and schedules. Good DAGs are safe to rerun and easy to backfill.",
  how:["<b>Idempotent</b> tasks: overwrite the day's partition (WRITE_TRUNCATE) or MERGE, so reruns never duplicate data.","Parameterize tasks by the run's logical date (<code>{{ ds }}</code>) so <b>backfills</b> work.","<b>Sensors</b> wait for conditions (a file in GCS, another DAG). Retries and SLAs handle failures.","Composer orchestrates. Heavy work runs in BigQuery, Dataflow or Dataproc. Queued tasks mean the environment needs more workers."],
  when:"\"Rerun created duplicates\", \"reprocess the last 60 days\", \"wait for a partner's file\", \"tasks stuck in queued\"."},
 {what:"<b>Cloud Composer</b> adalah Apache Airflow yang di-manage. Composer menjalankan <b>DAG</b>: file Python yang menjelaskan task, urutannya, retry dan jadwalnya. DAG yang baik aman dijalankan ulang dan mudah di-backfill.",
  how:["Task <b>idempotent</b>: timpa partisi harian (WRITE_TRUNCATE) atau MERGE, jadi rerun tidak pernah menduplikasi data.","Beri parameter task berdasarkan tanggal logis run-nya (<code>{{ ds }}</code>) supaya <b>backfill</b> bisa jalan.","<b>Sensor</b> menunggu kondisi tertentu (file di GCS, DAG lain). Retry dan SLA menangani kegagalan.","Composer hanya mengorkestrasi. Pekerjaan berat dijalankan di BigQuery, Dataflow atau Dataproc. Task yang tertahan di queued artinya environment butuh worker tambahan."],
  when:"\"Rerun membuat duplikat\", \"proses ulang 60 hari terakhir\", \"tunggu file dari partner\", \"task tertahan di queued\"."});
I("d5-l4",
 {what:"Not every query is urgent. BigQuery lets you mark work as <b>interactive</b> or <b>batch</b>, and you can isolate teams into separate reservations so heavy work doesn't slow down critical work.",
  how:["<b>Interactive</b> (default): runs as soon as possible and counts toward the concurrent query limit.","<b>Batch</b>: waits for idle capacity and doesn't block interactive queries.","<b>Separate reservations or projects</b> for ETL, BI and data science give each its own capacity and billing view.","Watch slot usage in <code>INFORMATION_SCHEMA.JOBS</code> and admin resource charts to size capacity."],
  when:"\"Non-urgent reports block analysts\", \"data science queries slow down ETL\"."},
 {what:"Tidak semua query mendesak. BigQuery memungkinkan menandai pekerjaan sebagai <b>interactive</b> atau <b>batch</b>, dan tim bisa dipisah ke reservation berbeda supaya pekerjaan berat tidak memperlambat pekerjaan penting.",
  how:["<b>Interactive</b> (default): dijalankan secepat mungkin dan dihitung ke batas query bersamaan.","<b>Batch</b>: menunggu kapasitas kosong dan tidak menghalangi query interactive.","<b>Reservation atau project terpisah</b> untuk ETL, BI dan data science memberi masing-masing kapasitas dan tampilan biaya sendiri.","Pantau pemakaian slot di <code>INFORMATION_SCHEMA.JOBS</code> dan admin resource chart untuk menentukan kapasitas."],
  when:"\"Laporan tidak mendesak menghalangi analis\", \"query data science memperlambat ETL\"."});
I("d5-l5",
 {what:"Monitoring means knowing something is wrong <b>before users tell you</b>. Google's observability tools are Cloud Monitoring (metrics and alerts), Cloud Logging (logs) and, for BigQuery, <code>INFORMATION_SCHEMA.JOBS</code>.",
  how:["<b>Alerting policies</b> on metrics like Dataflow system lag, Pub/Sub oldest unacked message age, or BigQuery slot usage.","<b>Log-based metrics</b> turn specific log messages into alertable metrics. <b>Log sinks</b> export logs to BigQuery, GCS or Pub/Sub.","<code>INFORMATION_SCHEMA.JOBS</code> shows who ran which query, the bytes billed and any errors.","Rate/quota errors → <b>exponential backoff</b>. Permission errors → check the job's <b>service account</b>."],
  when:"\"Alert if the pipeline falls behind\", \"who caused the bill spike?\", \"429 errors\", \"keep logs for 5 years\"."},
 {what:"Monitoring artinya tahu ada yang salah <b>sebelum user yang memberitahu</b>. Tool observability Google adalah Cloud Monitoring (metrik dan alert), Cloud Logging (log) dan, khusus BigQuery, <code>INFORMATION_SCHEMA.JOBS</code>.",
  how:["<b>Alerting policy</b> pada metrik seperti system lag Dataflow, oldest unacked message age Pub/Sub, atau pemakaian slot BigQuery.","<b>Log-based metric</b> mengubah pesan log tertentu jadi metrik yang bisa diberi alert. <b>Log sink</b> mengekspor log ke BigQuery, GCS atau Pub/Sub.","<code>INFORMATION_SCHEMA.JOBS</code> menunjukkan siapa menjalankan query apa, byte yang ditagih, dan error-nya.","Error rate/quota → <b>exponential backoff</b>. Error permission → cek <b>service account</b> yang dipakai job."],
  when:"\"Alert kalau pipeline tertinggal\", \"siapa penyebab tagihan melonjak?\", \"error 429\", \"simpan log 5 tahun\"."});
I("d5-l6",
 {what:"Things will break: someone deletes a table, a region goes down, a bad deploy corrupts data. Designing for failure means choosing, per service, how you'll <b>undo, fail over and reprocess</b>.",
  how:["BigQuery: <b>time travel</b> (up to 7 days), snapshots, cross-region replication / managed disaster recovery.","Pub/Sub: <b>seek</b> to replay messages. Dataflow: drain/update, and restart in another region.","Cloud SQL: HA for zones, <b>cross-region replicas</b> for regions. Bigtable: replication with multi-cluster routing.","Keep <b>immutable raw data</b> in GCS and make pipelines idempotent, so you can always reprocess."],
  when:"\"Table dropped 2 hours ago\", \"region outage\", \"bug found 10 days later\", \"reprocess messages after a bad deploy\"."},
 {what:"Pasti ada yang rusak: seseorang menghapus tabel, region mati, deploy yang salah merusak data. Desain tahan gagal artinya memilih, untuk setiap layanan, cara untuk <b>membatalkan, failover dan memproses ulang</b>.",
  how:["BigQuery: <b>time travel</b> (sampai 7 hari), snapshot, cross-region replication / managed disaster recovery.","Pub/Sub: <b>seek</b> untuk memutar ulang pesan. Dataflow: drain/update, dan jalankan ulang di region lain.","Cloud SQL: HA untuk zona, <b>cross-region replica</b> untuk region. Bigtable: replikasi dengan multi-cluster routing.","Simpan <b>data mentah yang tidak diubah-ubah</b> di GCS dan buat pipeline idempotent, supaya selalu bisa diproses ulang."],
  when:"\"Tabel terhapus 2 jam lalu\", \"region mati\", \"bug ketahuan 10 hari kemudian\", \"proses ulang pesan setelah deploy yang salah\"."});
