g("tb","TB / PB / GB",["TB","PB","GB","TiB","petabyte","petabytes","terabytes"],"Terabyte / Petabyte / Gigabyte","General",
 ["Data sizes: 1 GB ≈ a thousand MB, 1 TB ≈ a thousand GB, 1 PB ≈ a thousand TB. TiB is the binary version (1,024 GiB).","1 GB ≈ a movie, 1 TB ≈ a thousand movies, 1 PB ≈ a million movies.","Scale words decide the answer: GB → Cloud SQL ok; TB–PB → BigQuery/Bigtable."],
 ["Ukuran data: 1 GB ≈ seribu MB, 1 TB ≈ seribu GB, 1 PB ≈ seribu TB. TiB adalah versi biner (1.024 GiB).","1 GB ≈ satu film, 1 TB ≈ seribu film, 1 PB ≈ sejuta film.","Kata skala menentukan jawaban: GB → Cloud SQL masih oke; TB–PB → BigQuery/Bigtable."]);
g("mbps","Mbps / Gbps",["Mbps","Gbps"],"Megabits / Gigabits per second","Network",
 ["Network speed in bits per second. 8 bits = 1 byte, so 100 Mbps ≈ 12.5 MB per second.","The width of a water pipe.","Transfer math: 1 TB over 100 Mbps ≈ 1 day."],
 ["Kecepatan jaringan dalam bit per detik. 8 bit = 1 byte, jadi 100 Mbps ≈ 12,5 MB per detik.","Lebar pipa air.","Hitungan transfer: 1 TB lewat 100 Mbps ≈ 1 hari."]);
g("gcp","GCP / Google Cloud",["GCP"],"Google Cloud Platform","General",
 ["Google's public cloud: compute, storage, data and AI services you rent over the internet.","A huge rentable data center.","The whole exam is about choosing the right GCP service."],
 ["Cloud publik Google: layanan compute, storage, data dan AI yang disewa lewat internet.","Data center raksasa yang bisa disewa.","Seluruh ujian ini tentang memilih layanan GCP yang tepat."]);
g("aws","AWS / Azure",["AWS","Azure"],"Amazon Web Services / Microsoft Azure","General",
 ["Other public clouds from Amazon and Microsoft.","Other big malls next to Google's mall.","Data in AWS/Azure that can't move → BigQuery Omni."],
 ["Cloud publik lain dari Amazon dan Microsoft.","Mal besar lain di sebelah mal milik Google.","Data di AWS/Azure yang tidak boleh dipindah → BigQuery Omni."]);
g("s3","S3",["S3","Amazon S3"],"Amazon Simple Storage Service","Storage",
 ["Amazon's object storage, the AWS equivalent of Cloud Storage.","AWS's version of GCS.","S3 → GCS copies use Storage Transfer Service; querying S3 in place uses BigQuery Omni."],
 ["Object storage milik Amazon, padanan Cloud Storage di AWS.","Versi GCS milik AWS.","Copy S3 → GCS pakai Storage Transfer Service; query S3 di tempat pakai BigQuery Omni."]);
g("multicloud","Multicloud",["multicloud","multi-cloud","cross-cloud"],"","General",
 ["Using more than one cloud provider (e.g. GCP + AWS) at the same time.","Shopping at two supermarkets.","BigQuery Omni / BigLake are the multicloud answers."],
 ["Memakai lebih dari satu penyedia cloud (misalnya GCP + AWS) bersamaan.","Belanja di dua supermarket.","BigQuery Omni / BigLake adalah jawaban untuk multicloud."]);
g("onprem","On-premises (on-prem)",["on-premises","on-prem","on-premise"],"","Migration",
 ["Servers in your company's own data center, not in a cloud.","Your own house versus a rented apartment.","\"Migrate from on-prem\" questions test transfer tools and lift & shift."],
 ["Server di data center milik perusahaan sendiri, bukan di cloud.","Rumah milik sendiri vs apartemen sewaan.","Soal \"migrasi dari on-prem\" menguji tool transfer dan lift & shift."]);
g("liftshift","Lift and shift",["lift and shift","lift & shift","lift-and-shift"],"","Migration",
 ["Moving an existing system to the cloud with minimal changes.","Moving house with all your furniture as-is.","\"Minimal changes\" + Spark/Hadoop → Dataproc."],
 ["Memindahkan sistem yang sudah ada ke cloud dengan perubahan minimal.","Pindah rumah dengan semua perabot apa adanya.","\"Perubahan minimal\" + Spark/Hadoop → Dataproc."]);
g("region","Region / zone",["multi-region","multi-zone","dual-region","regional","region","regions","zone","zones"],"","Network",
 ["A region is a geographic area (e.g. asia-southeast2 = Jakarta) with several isolated data centers called zones.","A region is a city; zones are separate buildings in that city.","Zone failure → HA in another zone. Region failure → replica in another region."],
 ["Region adalah area geografis (misalnya asia-southeast2 = Jakarta) yang berisi beberapa data center terpisah bernama zone.","Region = kota; zone = gedung-gedung terpisah di kota itu.","Zone mati → HA di zone lain. Region mati → replika di region lain."]);
g("sla","SLA",["SLA","SLAs"],"Service Level Agreement","General",
 ["A promise about availability, e.g. 99.99% uptime, with credits if it's broken.","A delivery guarantee: \"arrives in 1 day or your money back\".","Spanner multi-region: 99.999% SLA."],
 ["Janji tingkat ketersediaan, misalnya uptime 99,99%, dengan kompensasi kalau dilanggar.","Garansi pengiriman: \"sampai 1 hari atau uang kembali\".","Spanner multi-region: SLA 99,999%."]);
g("availability","Availability (99.9…%)",["high availability","availability"],"","General",
 ["The share of time a system works. 99.99% ≈ 52 minutes of downtime a year; 99.999% ≈ 5 minutes.","How often the shop is open when you arrive.","\"Five nines\" (99.999%) → Spanner multi-region."],
 ["Persentase waktu sebuah sistem berfungsi. 99,99% ≈ 52 menit down per tahun; 99,999% ≈ 5 menit.","Seberapa sering toko buka saat kamu datang.","\"Five nines\" (99,999%) → Spanner multi-region."]);
g("ha","HA",["HA"],"High Availability","Database",
 ["A setup that keeps running when one component fails, usually with a standby that takes over automatically.","A backup goalkeeper warming up on the bench.","Cloud SQL HA = standby in another zone (zone failure only)."],
 ["Setup yang tetap jalan saat satu komponen gagal, biasanya ada standby yang otomatis mengambil alih.","Kiper cadangan yang sudah pemanasan di bangku.","Cloud SQL HA = standby di zone lain (hanya untuk zone mati)."]);
g("failover","Failover",["failover","fail over","fails over"],"","Database",
 ["Automatically switching traffic to a backup when the primary fails.","The generator turning on when PLN power goes out.","Bigtable multi-cluster routing and Cloud SQL HA fail over automatically."],
 ["Memindahkan traffic otomatis ke cadangan saat yang utama gagal.","Genset menyala otomatis saat listrik PLN padam.","Bigtable multi-cluster routing dan Cloud SQL HA melakukan failover otomatis."]);
g("dr","DR",["DR","disaster recovery"],"Disaster Recovery","Ops & Cost",
 ["Plans and tools to recover after a big failure, like a whole region going down.","An emergency plan after a flood hits the office.","Pick the cheapest DR that meets the stated RPO and RTO."],
 ["Rencana dan tool untuk pulih setelah kegagalan besar, misalnya satu region mati.","Rencana darurat setelah kantor kebanjiran.","Pilih DR termurah yang memenuhi RPO dan RTO di soal."]);
g("rpo","RPO",["RPO"],"Recovery Point Objective","Ops & Cost",
 ["The maximum amount of data (measured in time) you can afford to lose. RPO 15 minutes = you may lose the last 15 minutes of data.","How many pages of your thesis you can afford to lose since the last save.","Turbo replication on GCS = 15-minute RPO."],
 ["Batas data yang boleh hilang, diukur dalam waktu. RPO 15 menit = boleh kehilangan data 15 menit terakhir.","Berapa halaman skripsi yang rela hilang sejak terakhir di-save.","Turbo replication di GCS = RPO 15 menit."]);
g("rto","RTO",["RTO"],"Recovery Time Objective","Ops & Cost",
 ["The maximum time the system may be down before it must work again.","How long the shop can stay closed after a blackout.","Loose RTO (days) → backups are fine; tight RTO (minutes) → replicas/failover."],
 ["Batas waktu sistem boleh mati sebelum harus jalan lagi.","Berapa lama toko boleh tutup setelah listrik padam.","RTO longgar (hari) → backup cukup; RTO ketat (menit) → replika/failover."]);
g("rporto","RPO/RTO",["RPO/RTO"],"Recovery Point / Time Objective","Ops & Cost",
 ["RPO = how much data you can lose; RTO = how long you can be down. Lower values cost more.","RPO = lost pages; RTO = time until you can write again.","Every DR question: match the cheapest option to these two numbers."],
 ["RPO = berapa banyak data boleh hilang; RTO = berapa lama boleh mati. Makin kecil, makin mahal.","RPO = halaman yang hilang; RTO = waktu sampai bisa menulis lagi.","Setiap soal DR: cocokkan opsi termurah dengan dua angka ini."]);
g("pitr","PITR",["PITR","point-in-time recovery"],"Point-In-Time Recovery","Database",
 ["Restoring a database to its exact state at a chosen moment, using backups plus change logs.","Rewinding a CCTV recording to 10:58, just before the accident.","Cloud SQL / Spanner: undo a bad delete by restoring to a clone at a timestamp."],
 ["Mengembalikan database ke kondisi persis di momen tertentu, memakai backup + log perubahan.","Memutar mundur rekaman CCTV ke 10:58, tepat sebelum kejadian.","Cloud SQL / Spanner: batalkan delete yang salah dengan restore ke clone pada timestamp tertentu."]);
g("idempotent","Idempotent",["idempotent","idempotency"],"","Processing",
 ["Running the same operation twice gives the same result as running it once.","Pressing the lift button five times still calls the lift once.","Retries, backfills and duplicate Pub/Sub messages are safe only if processing is idempotent (WRITE_TRUNCATE a partition / MERGE)."],
 ["Menjalankan operasi yang sama dua kali hasilnya sama dengan sekali.","Menekan tombol lift lima kali, lift tetap dipanggil sekali.","Retry, backfill dan pesan Pub/Sub duplikat hanya aman kalau prosesnya idempotent (WRITE_TRUNCATE per partisi / MERGE)."]);
g("backoff","Exponential backoff",["exponential backoff","backoff"],"","Ops & Cost",
 ["Retrying a failed request after waiting longer each time (1s, 2s, 4s, 8s…), often with random jitter.","Calling a busy friend back after 1 minute, then 2, then 4…","Answer for 429 / quotaExceeded / rateLimitExceeded errors."],
 ["Mengulang request yang gagal dengan jeda yang makin lama (1d, 2d, 4d, 8d…), sering dengan jitter acak.","Menelepon teman yang sibuk setelah 1 menit, lalu 2, lalu 4…","Jawaban untuk error 429 / quotaExceeded / rateLimitExceeded."]);
g("quota","Quota",["quota","quotas","quotaExceeded","rateLimitExceeded"],"","Ops & Cost",
 ["A limit on how much of a resource you can use (requests per second, bytes per day…).","A daily data package limit on your phone plan.","Hard cap on BigQuery spend per user → custom quotas."],
 ["Batas pemakaian sebuah resource (request per detik, byte per hari…).","Batas kuota internet harian di paket HP.","Batas keras biaya BigQuery per user → custom quota."]);
g("oom","OOM",["OOM","out of memory"],"Out Of Memory","Processing",
 ["A worker crashed because it ran out of RAM.","Trying to fit a wardrobe into a hatchback.","Dataflow OOM → bigger machines, fix hot keys, smaller side inputs."],
 ["Worker crash karena RAM-nya habis.","Memaksa lemari masuk ke mobil hatchback.","Dataflow OOM → mesin lebih besar, perbaiki hot key, side input lebih kecil."]);
g("ttl","TTL / expiration",["TTL","expiration","time-to-live"],"Time To Live","Storage",
 ["An automatic expiry: data older than X is deleted.","Milk with an expiry date that throws itself away.","BigQuery table/partition expiration; Bigtable max-age garbage collection."],
 ["Kedaluwarsa otomatis: data yang lebih tua dari X dihapus.","Susu yang membuang dirinya sendiri saat lewat tanggal kedaluwarsa.","Table/partition expiration di BigQuery; garbage collection max-age di Bigtable."]);
g("labels","Labels (billing)",["labels"],"","Ops & Cost",
 ["Key–value tags (team=finance) on resources and jobs, used to break down costs.","Name stickers on lunch boxes in the office fridge.","\"Spend per team\" → labels + billing export to BigQuery."],
 ["Tag key–value (team=finance) di resource dan job, dipakai untuk memecah biaya.","Stiker nama di kotak bekal di kulkas kantor.","\"Biaya per tim\" → labels + billing export ke BigQuery."]);
g("ui_console","Console / gcloud",["gcloud","Cloud Shell"],"","General",
 ["Ways to control GCP: the web Console, the gcloud command-line tool, and Cloud Shell (a browser terminal).","Steering wheel (console) versus keyboard shortcuts (gcloud).","Shows up in options like \"run gcloud storage cp\"."],
 ["Cara mengontrol GCP: Console di web, tool command-line gcloud, dan Cloud Shell (terminal di browser).","Setir (console) vs shortcut keyboard (gcloud).","Muncul di opsi seperti \"jalankan gcloud storage cp\"."]);

/* ---------- Databases ---------- */
g("sql","SQL",["SQL"],"Structured Query Language","Database",
 ["The standard language for asking questions of tables: SELECT, JOIN, GROUP BY…","A precise way to ask a librarian for books.","BigQuery, Cloud SQL, AlloyDB and Spanner speak SQL; Bigtable mostly doesn't."],
 ["Bahasa standar untuk bertanya ke tabel: SELECT, JOIN, GROUP BY…","Cara yang tepat untuk meminta buku ke pustakawan.","BigQuery, Cloud SQL, AlloyDB dan Spanner pakai SQL; Bigtable umumnya tidak."]);
g("nosql","NoSQL",["NoSQL"],"Not only SQL","Database",
 ["Databases that don't use relational tables and joins (key-value, wide-column, document). They trade query flexibility for scale or flexibility of schema.","A giant labelled locker room instead of a library catalogue.","Bigtable (wide-column) and Firestore (document) are NoSQL."],
 ["Database yang tidak memakai tabel relasional dan join (key-value, wide-column, dokumen). Fleksibilitas query ditukar dengan skala atau schema yang fleksibel.","Ruang loker berlabel raksasa, bukan katalog perpustakaan.","Bigtable (wide-column) dan Firestore (dokumen) adalah NoSQL."]);
g("relational","Relational database",["relational"],"","Database",
 ["Data in tables with fixed columns, linked by keys and queried with SQL joins.","Excel sheets linked by an ID column.","Relational + transactions → Cloud SQL / AlloyDB / Spanner."],
 ["Data di tabel dengan kolom tetap, terhubung lewat key dan di-query dengan SQL join.","Sheet Excel yang saling terhubung lewat kolom ID.","Relasional + transaksi → Cloud SQL / AlloyDB / Spanner."]);
g("oltp","OLTP",["OLTP"],"Online Transaction Processing","Database",
 ["Workloads with many small, fast reads and writes of individual rows: orders, payments, logins.","The cashier scanning items one by one all day.","OLTP → Cloud SQL / AlloyDB / Spanner. Never BigQuery."],
 ["Beban kerja dengan banyak baca/tulis kecil dan cepat per baris: order, pembayaran, login.","Kasir yang men-scan barang satu per satu sepanjang hari.","OLTP → Cloud SQL / AlloyDB / Spanner. Bukan BigQuery."]);
g("olap","OLAP / analytics",["OLAP","analytical"],"Online Analytical Processing","Analytics",
 ["Workloads that scan many rows to aggregate: totals, trends, dashboards.","The accountant summarising a whole year of receipts.","OLAP / analytics → BigQuery."],
 ["Beban kerja yang men-scan banyak baris untuk agregasi: total, tren, dashboard.","Akuntan yang merangkum seluruh struk satu tahun.","OLAP / analitik → BigQuery."]);
g("acid","ACID",["ACID"],"Atomicity, Consistency, Isolation, Durability","Database",
 ["The guarantees of a safe transaction: all-or-nothing, rules respected, no interference between transactions, and saved permanently.","A bank transfer: money leaves A and arrives at B, or nothing happens at all.","Need multi-row ACID → relational DB / Spanner; Bigtable is atomic per row only."],
 ["Jaminan transaksi yang aman: semua-atau-tidak-sama-sekali, aturan dipatuhi, transaksi tidak saling ganggu, dan tersimpan permanen.","Transfer bank: uang keluar dari A dan masuk ke B, atau tidak terjadi apa-apa.","Butuh ACID multi-baris → database relasional / Spanner; Bigtable hanya atomik per baris."]);
g("transaction","Transaction",["transaction","transactions","transactional","multi-row"],"","Database",
 ["A group of operations that succeed or fail together.","Buying something online: payment and stock update happen together or not at all.","\"Atomically update two rows\" rules out Bigtable."],
 ["Kumpulan operasi yang berhasil atau gagal bersama-sama.","Belanja online: pembayaran dan pengurangan stok terjadi bersamaan atau tidak sama sekali.","\"Update dua baris secara atomik\" mencoret Bigtable."]);
g("consistency","Strong vs eventual consistency",["strong consistency","strongly consistent","eventual consistency","eventually consistent","external consistency","external"],"","Database",
 ["Strong: every read sees the latest write. Eventual: copies catch up after a short delay, so a read might briefly see old data.","Strong = one shared whiteboard; eventual = photocopies handed around the office.","Spanner = strong/external consistency globally; Bigtable replication = eventual."],
 ["Strong: setiap read selalu melihat write terbaru. Eventual: salinan menyusul setelah jeda singkat, jadi read bisa sebentar melihat data lama.","Strong = satu papan tulis bersama; eventual = fotokopi yang diedarkan ke seluruh kantor.","Spanner = strong/external consistency global; replikasi Bigtable = eventual."]);
g("schema","Schema",["schema","schemas"],"","Database",
 ["The structure of data: column names, types and nesting.","The blank form that defines which fields must be filled.","Avro files carry their schema; Pub/Sub topics can enforce schemas."],
 ["Struktur data: nama kolom, tipe dan nesting-nya.","Formulir kosong yang menentukan kolom apa saja yang harus diisi.","File Avro membawa schema-nya; topic Pub/Sub bisa mewajibkan schema."]);
g("primarykey","Primary key",["primary key","primary keys","PK"],"","Database",
 ["The column(s) that uniquely identify each row.","Your NIK: unique per person.","Spanner: never use a monotonically increasing primary key → use UUIDv4."],
 ["Kolom yang mengidentifikasi setiap baris secara unik.","NIK kamu: unik per orang.","Spanner: jangan pakai primary key yang terus naik → pakai UUIDv4."]);
g("uuid","UUID",["UUID","UUIDv4","UUIDs"],"Universally Unique Identifier","Database",
 ["A random 128-bit ID like 3f2a…; v4 is fully random so new rows spread evenly.","Random lottery numbers instead of a queue number.","Spanner hotspot fix → UUIDv4 keys."],
 ["ID acak 128-bit seperti 3f2a…; v4 sepenuhnya acak sehingga baris baru tersebar merata.","Nomor undian acak, bukan nomor antrean.","Perbaikan hotspot Spanner → key UUIDv4."]);
g("monotonic","Monotonically increasing key",["monotonically increasing","monotonic","auto-increment","auto-incrementing","sequential IDs","sequential keys"],"","Database",
 ["A key that always grows (1, 2, 3… or timestamps), so every new row lands at the end of the key range on one server.","Everyone queuing at the last counter because numbers only go up.","Causes hotspots in Spanner and Bigtable."],
 ["Key yang selalu bertambah (1, 2, 3… atau timestamp), jadi setiap baris baru jatuh di ujung range key, di satu server.","Semua orang antre di loket terakhir karena nomornya selalu naik.","Menyebabkan hotspot di Spanner dan Bigtable."]);
g("index","Index / secondary index",["secondary index","secondary indexes","index","indexes"],"","Database",
 ["A lookup structure that makes searching by a column fast. A secondary index is on a column other than the primary key.","The index at the back of a book.","Bigtable has no secondary indexes (row key only); Firestore indexes fields automatically."],
 ["Struktur pencarian yang membuat pencarian berdasarkan kolom tertentu jadi cepat. Secondary index = index di kolom selain primary key.","Indeks di bagian belakang buku.","Bigtable tidak punya secondary index (hanya row key); Firestore meng-index field otomatis."]);
g("replica","Replica / replication",["read replica","read replicas","replica","replicas","replication","replicate","replicated","cross-region replica"],"","Database",
 ["A copy of a database kept in sync with the original. Read replicas serve reads; cross-region replicas cover disasters.","Photocopies of the master ledger in other branches.","Reports slow the app → read replica. Region outage → cross-region replica."],
 ["Salinan database yang terus disinkronkan dengan aslinya. Read replica melayani read; cross-region replica untuk bencana.","Fotokopi buku besar di cabang-cabang lain.","Laporan memperlambat app → read replica. Region mati → cross-region replica."]);
g("standby","Standby",["standby"],"","Database",
 ["An idle copy ready to take over if the primary fails.","The substitute player on the bench.","Cloud SQL HA keeps a standby in another zone."],
 ["Salinan yang menganggur dan siap mengambil alih kalau yang utama gagal.","Pemain cadangan di bangku.","Cloud SQL HA menyimpan standby di zone lain."]);
g("shard","Shard / sharding",["sharded","sharding","shard","shards","date-sharded"],"","Database",
 ["Splitting data into separate pieces stored separately, e.g. one table per day.","Splitting the phone book into volumes A–F, G–M…","BigQuery: partitioned tables beat date-sharded tables."],
 ["Memecah data jadi beberapa bagian yang disimpan terpisah, misalnya satu tabel per hari.","Memecah buku telepon jadi jilid A–F, G–M…","BigQuery: tabel partitioned lebih baik daripada tabel date-sharded."]);
g("normalize","Normalize / denormalize",["denormalize","denormalized","denormalization","normalize","normalized","normalization","3NF"],"","Analytics",
 ["Normalizing splits data into many tables to avoid repetition (good for OLTP). Denormalizing combines it into wider tables to avoid joins (good for analytics).","Normalized = separate folders per topic; denormalized = one big binder with everything.","BigQuery prefers denormalized data with nested/repeated fields."],
 ["Normalisasi memecah data ke banyak tabel supaya tidak berulang (bagus untuk OLTP). Denormalisasi menggabungkannya jadi tabel lebar supaya tidak perlu join (bagus untuk analitik).","Normalized = map terpisah per topik; denormalized = satu binder besar berisi semuanya.","BigQuery lebih suka data denormalized dengan nested/repeated fields."]);
g("join","JOIN",["JOIN","joins","join","self-join","self-joins","cross join","cross joins"],"","Analytics",
 ["Combining rows from two tables that share a key. A self-join joins a table to itself; a cross join pairs every row with every row.","Matching guests to their table numbers on two lists.","Huge self-joins → window functions; Bigtable has no joins."],
 ["Menggabungkan baris dari dua tabel yang punya key yang sama. Self-join = join tabel ke dirinya sendiri; cross join = setiap baris dipasangkan dengan setiap baris.","Mencocokkan daftar tamu dengan daftar nomor meja.","Self-join besar → window function; Bigtable tidak punya join."]);
g("htap","HTAP",["HTAP"],"Hybrid Transactional/Analytical Processing","Database",
 ["One database that handles both OLTP transactions and analytical queries on the same live data.","A shop where the cashier can also instantly tell you today's total sales.","AlloyDB's columnar engine enables HTAP."],
 ["Satu database yang menangani transaksi OLTP sekaligus query analitik di data live yang sama.","Toko yang kasirnya juga bisa langsung menyebut total penjualan hari ini.","Columnar engine AlloyDB memungkinkan HTAP."]);
g("columnar","Columnar storage",["columnar","column-oriented"],"","Analytics",
 ["Storing data column by column instead of row by row, so queries read only the columns they need.","Reading only the 'price' column of every receipt instead of whole receipts.","Why SELECT * is expensive in BigQuery; also AlloyDB's columnar engine."],
 ["Menyimpan data per kolom, bukan per baris, sehingga query hanya membaca kolom yang dibutuhkan.","Hanya membaca kolom 'harga' di setiap struk, bukan seluruh struknya.","Alasan SELECT * mahal di BigQuery; juga columnar engine AlloyDB."]);
g("dml","DML / DDL",["DML","DDL"],"Data Manipulation / Definition Language","Database",
 ["DML = SQL that changes data (INSERT, UPDATE, DELETE, MERGE). DDL = SQL that changes structure (CREATE, ALTER).","DML edits the contents of the form; DDL redesigns the form.","Avoid frequent single-row DML in BigQuery; batch it."],
 ["DML = SQL yang mengubah data (INSERT, UPDATE, DELETE, MERGE). DDL = SQL yang mengubah struktur (CREATE, ALTER).","DML mengisi isi formulir; DDL mendesain ulang formulirnya.","Hindari DML per baris yang sering di BigQuery; kumpulkan jadi batch."]);
g("merge","MERGE (upsert)",["MERGE","upsert","upserts"],"","Analytics",
 ["One SQL statement that inserts new rows and updates existing ones based on a key.","Updating the contact list: add new people, update changed numbers.","Idempotent loads and SCD Type 2 use MERGE."],
 ["Satu statement SQL yang meng-insert baris baru dan meng-update baris yang sudah ada berdasarkan key.","Memperbarui daftar kontak: tambah orang baru, ubah nomor yang berganti.","Load yang idempotent dan SCD Type 2 memakai MERGE."]);
g("ctas","CTAS",["CTAS","CREATE TABLE AS SELECT"],"CREATE TABLE … AS SELECT","Analytics",
 ["Creating a new table from the results of a query.","Photocopying a document into a new, better-organised folder.","Make an existing table partitioned → CTAS into a new table."],
 ["Membuat tabel baru dari hasil sebuah query.","Memfotokopi dokumen ke map baru yang lebih rapi.","Ubah tabel yang ada jadi partitioned → CTAS ke tabel baru."]);
g("star","Star schema / fact & dimension",["star schema","fact table","fact tables","dimension table","dimension tables","dimensions"],"","Analytics",
 ["A warehouse design with a big fact table of events (sales) linked to small dimension tables (customer, product, date).","A big receipt book (facts) plus small address books (dimensions).","Fine in BigQuery; denormalize where large joins hurt."],
 ["Desain warehouse dengan satu tabel fact besar berisi event (penjualan) yang terhubung ke tabel dimension kecil (customer, produk, tanggal).","Buku struk besar (fact) plus buku alamat kecil (dimension).","Aman di BigQuery; denormalisasi kalau join besar terasa berat."]);
g("scd","SCD",["SCD","SCD Type 2","Type 2"],"Slowly Changing Dimension","Analytics",
 ["How you handle dimension values that change over time. Type 1 overwrites; Type 2 keeps history rows with valid_from / valid_to.","Type 2 = keeping all your old ID cards with their validity dates.","\"Show the value at the time of the sale\" → SCD Type 2."],
 ["Cara menangani nilai dimensi yang berubah seiring waktu. Type 1 menimpa; Type 2 menyimpan baris riwayat dengan valid_from / valid_to.","Type 2 = menyimpan semua KTP lamamu beserta masa berlakunya.","\"Tampilkan nilai saat transaksi terjadi\" → SCD Type 2."]);
g("nested","Nested & repeated fields",["nested and repeated","nested & repeated","nested/repeated","STRUCT","ARRAY","ARRAY<STRUCT>","repeated field"],"","Analytics",
 ["Storing child records inside the parent row: STRUCT = a nested record, ARRAY = a list.","A receipt that lists its items on the same piece of paper.","Avoid order ↔ line-item joins in BigQuery."],
 ["Menyimpan record anak di dalam baris induk: STRUCT = record bersarang, ARRAY = daftar.","Satu struk yang mencantumkan semua barangnya di kertas yang sama.","Menghindari join order ↔ line item di BigQuery."]);
g("view","View / logical view",["logical view","logical views","view","views"],"","Analytics",

g("memorystore","Memorystore / Redis",["Memorystore","Redis","Valkey","Memcached"],"","Database",

/* ---------- Streaming & processing ---------- */
g("pubsub","Pub/Sub",["Pub/Sub"],"Publish/Subscribe","Streaming",
 ["Google's global, serverless messaging service: publishers send messages to topics; subscriptions deliver them to consumers.","A post office: each subscription is its own delivery route.","Real-time ingestion and decoupling systems."],
 ["Layanan messaging global dan serverless milik Google: publisher mengirim pesan ke topic; subscription mengantarkannya ke consumer.","Kantor pos: setiap subscription adalah jalur pengiriman tersendiri.","Ingestion real-time dan memisahkan antar sistem."]);
g("topic","Topic / subscription",["topic","topics","subscription","subscriptions","subscriber","subscribers","publisher","publishers"],"","Streaming",
 ["A topic is where messages are published; each subscription attached to it receives every message; subscribers read from a subscription.","Topic = mailbox; subscription = delivery route; subscriber = the person receiving.","Two apps needing all messages → two subscriptions."],
 ["Topic adalah tempat pesan dipublish; setiap subscription di topic itu menerima semua pesan; subscriber membaca dari subscription.","Topic = kotak surat; subscription = jalur antar; subscriber = penerimanya.","Dua app yang butuh semua pesan → dua subscription."]);
g("ack","Ack / ack deadline",["ack deadline","ack","acks","acked","unacked","acknowledge","acknowledged"],"Acknowledgement","Streaming",
 ["The subscriber's signal that a message was processed. If no ack arrives before the deadline, Pub/Sub redelivers it.","Signing for a parcel; no signature, the courier comes back.","Many duplicates → acks arriving too late."],
 ["Sinyal dari subscriber bahwa pesan sudah diproses. Kalau ack tidak datang sebelum deadline, Pub/Sub mengirim ulang.","Tanda tangan saat menerima paket; tanpa tanda tangan, kurirnya datang lagi.","Banyak duplikat → ack datang terlambat."]);
g("delivery","At-least-once / exactly-once",["at-least-once","exactly-once","at least once","exactly once"],"","Streaming",
 ["At-least-once: every message is delivered, sometimes more than once. Exactly-once: delivered/processed once with no duplicates.","At-least-once = the courier may deliver the same parcel twice to be safe.","Pub/Sub default = at-least-once; Dataflow = exactly-once processing."],
 ["At-least-once: setiap pesan pasti terkirim, kadang lebih dari sekali. Exactly-once: dikirim/diproses tepat sekali tanpa duplikat.","At-least-once = kurir mungkin mengantar paket yang sama dua kali biar aman.","Default Pub/Sub = at-least-once; Dataflow = exactly-once processing."]);
g("orderingkey","Ordering key",["ordering key","ordering keys"],"","Streaming",
 ["A Pub/Sub label that guarantees messages with the same key are delivered in publish order.","One queue per customer, so their orders stay in sequence.","Per-customer ordering with high overall throughput."],
 ["Label Pub/Sub yang menjamin pesan dengan key yang sama dikirim sesuai urutan publish.","Satu antrean per pelanggan, supaya pesanannya tetap berurutan.","Urutan per customer dengan throughput tetap tinggi."]);
g("pushpull","Push vs pull",["push subscription","pull subscription"],"","Streaming",
 ["Pull: the consumer asks for messages. Push: Pub/Sub sends each message to an HTTPS endpoint.","Pull = picking up mail at the post office; push = mail delivered to your door.","Cloud Run endpoint, no polling → push; Dataflow → pull."],
 ["Pull: consumer yang meminta pesan. Push: Pub/Sub mengirim setiap pesan ke endpoint HTTPS.","Pull = mengambil surat di kantor pos; push = surat diantar ke rumah.","Endpoint Cloud Run tanpa polling → push; Dataflow → pull."]);
g("deadletter","Dead-letter (DLQ)",["dead-letter","dead letter","DLQ","dead-letter topic"],"Dead-Letter Queue","Streaming",
 ["A separate place where messages or records that keep failing are sent, so they don't block the rest.","A 'problem parcels' shelf at the post office.","Poison messages → dead-letter topic; bad records → dead-letter output."],
 ["Tempat terpisah untuk pesan atau record yang terus gagal, supaya tidak memblokir yang lain.","Rak 'paket bermasalah' di kantor pos.","Pesan beracun → dead-letter topic; record rusak → dead-letter output."]);
g("seek","Seek / replay",["seek","replay","replays"],"","Streaming",
 ["Rewinding a Pub/Sub subscription to a snapshot or timestamp so messages are delivered again.","Rewinding a video to watch a scene again.","Reprocess after a buggy deploy."],
 ["Memutar mundur subscription Pub/Sub ke snapshot atau timestamp supaya pesan dikirim ulang.","Memutar ulang video untuk menonton adegan yang sama.","Proses ulang setelah deploy yang bug."]);
g("backlog","Backlog",["backlog","oldest_unacked_message_age","num_undelivered_messages"],"","Streaming",
 ["Messages waiting to be processed. A growing backlog means consumers are too slow.","A growing pile of unread mail.","Alert on oldest unacked message age; scale the consumer."],
 ["Pesan yang menunggu untuk diproses. Backlog yang terus naik berarti consumer terlalu lambat.","Tumpukan surat belum dibaca yang terus meninggi.","Alert di oldest unacked message age; scale consumer-nya."]);
g("kafka","Kafka",["Kafka","Apache Kafka","Managed Kafka","Managed Service for Apache Kafka"],"","Streaming",
 ["Apache Kafka is a popular open-source event streaming platform. Google offers Managed Service for Apache Kafka.","Another post-office brand many companies already use.","Existing Kafka apps, minimal changes → Managed Kafka; open to change → Pub/Sub."],
 ["Apache Kafka adalah platform event streaming open-source yang populer. Google menyediakan Managed Service for Apache Kafka.","Merek kantor pos lain yang sudah dipakai banyak perusahaan.","App Kafka yang sudah ada, perubahan minimal → Managed Kafka; terbuka untuk berubah → Pub/Sub."]);
g("streaming","Streaming vs batch",["streaming","batch","real-time","real time","near real time","near-real-time"],"","Processing",
 ["Batch processes a finished chunk of data (e.g. yesterday's file). Streaming processes data continuously as it arrives.","Batch = doing laundry once a week; streaming = washing each dish right after use.","Same logic for both → Dataflow (Beam)."],
 ["Batch memproses potongan data yang sudah lengkap (misalnya file kemarin). Streaming memproses data terus-menerus saat datang.","Batch = mencuci baju seminggu sekali; streaming = mencuci piring langsung setelah dipakai.","Logika yang sama untuk keduanya → Dataflow (Beam)."]);
g("etl","ETL / ELT",["ETL","ELT"],"Extract, Transform, Load / Extract, Load, Transform","Processing",
 ["ETL transforms data before loading it into the warehouse; ELT loads raw data first and transforms it inside (e.g. with SQL in BigQuery).","ETL = cooking before putting food in the fridge; ELT = storing ingredients, cooking later in the kitchen.","Data already in BigQuery → ELT with SQL/Dataform."],
 ["ETL mentransformasi data sebelum dimuat ke warehouse; ELT memuat data mentah dulu lalu mentransformasinya di dalam (misalnya pakai SQL di BigQuery).","ETL = masak dulu baru masuk kulkas; ELT = simpan bahan mentah, masak nanti di dapur.","Data sudah di BigQuery → ELT dengan SQL/Dataform."]);
g("pipeline","Pipeline",["pipeline","pipelines"],"","Processing",
 ["A chain of steps that moves and transforms data from sources to destinations.","An assembly line in a factory.","Every design question describes a pipeline."],
 ["Rangkaian langkah yang memindahkan dan mentransformasi data dari sumber ke tujuan.","Jalur perakitan di pabrik.","Setiap soal desain menggambarkan sebuah pipeline."]);
g("dataflow","Dataflow",["Dataflow"],"","Processing",
 ["Google's serverless service that runs Apache Beam pipelines for batch and streaming, with autoscaling.","A self-managing factory that hires and sends home workers as needed.","New serverless batch+streaming pipelines."],
 ["Layanan serverless Google yang menjalankan pipeline Apache Beam untuk batch dan streaming, dengan autoscaling.","Pabrik yang mengatur dirinya sendiri, menambah dan memulangkan pekerja sesuai kebutuhan.","Pipeline baru batch+streaming yang serverless."]);
g("beam","Apache Beam",["Beam","Apache Beam"],"","Processing",
 ["An open-source programming model for data pipelines; the same code runs on Dataflow, Flink or Spark.","A recipe that works in any kitchen.","Portable pipelines; Dataflow's language."],
 ["Model pemrograman open-source untuk pipeline data; kode yang sama bisa jalan di Dataflow, Flink atau Spark.","Resep yang bisa dimasak di dapur mana pun.","Pipeline yang portable; bahasa milik Dataflow."]);
g("pcollection","PCollection / PTransform",["PCollection","PCollections","PTransform","ParDo","DoFn","GroupByKey","CoGroupByKey","Combine","Flatten"],"","Processing",
 ["Beam's building blocks: a PCollection is a distributed dataset; transforms like ParDo (per element), GroupByKey, Combine (aggregate), CoGroupByKey (join) and Flatten (merge) process it.","Ingredients (PCollection) and cooking steps (transforms).","Join → CoGroupByKey; efficient sums → Combine."],
 ["Blok dasar Beam: PCollection adalah dataset terdistribusi; transform seperti ParDo (per elemen), GroupByKey, Combine (agregasi), CoGroupByKey (join) dan Flatten (gabung) memprosesnya.","Bahan (PCollection) dan langkah memasak (transform).","Join → CoGroupByKey; sum yang efisien → Combine."]);
g("sideinput","Side input",["side input","side inputs"],"","Processing",
 ["A small extra dataset (e.g. a lookup table) broadcast to every Beam worker.","A cheat sheet handed to every cashier.","Enrich events with a small reference table."],
 ["Dataset tambahan yang kecil (misalnya tabel lookup) yang dibagikan ke setiap worker Beam.","Contekan yang dibagikan ke setiap kasir.","Enrich event dengan tabel referensi kecil."]);
g("eventtime","Event time vs processing time",["event time","event-time","processing time","processing-time"],"","Streaming",
 ["Event time = when something happened (timestamp in the data). Processing time = when the pipeline saw it.","Photo taken Monday in Bali (event) vs uploaded Friday in Jakarta (processing).","Correct analytics with delayed data → window on event time."],
 ["Event time = kapan kejadiannya (timestamp di data). Processing time = kapan pipeline melihatnya.","Foto diambil Senin di Bali (event) vs di-upload Jumat di Jakarta (processing).","Analitik yang benar dengan data telat → window berdasarkan event time."]);
g("watermark","Watermark",["watermark","watermarks"],"","Streaming",
 ["Dataflow's running estimate that all events up to time T have probably arrived. Windows emit when it passes their end.","The teacher's guess that all homework has been handed in.","Late data = data behind the watermark."],
 ["Perkiraan Dataflow bahwa semua event sampai waktu T kemungkinan sudah tiba. Window mengeluarkan hasil saat watermark melewati ujungnya.","Tebakan guru bahwa semua PR sudah dikumpulkan.","Data telat = data yang datang setelah watermark lewat."]);
g("window","Window (fixed / sliding / session)",["fixed window","fixed windows","sliding window","sliding windows","session window","session windows","windowing","tumbling","hopping","window","windows"],"","Streaming",
 ["A time bucket for grouping streaming data. Fixed = equal non-overlapping; sliding = overlapping (moving averages); session = per key until a gap of inactivity; global = one window forever.","Fixed = hourly shifts; sliding = 'last 60 minutes' updated every 5; session = a customer's visit until they leave.","Exam phrases map directly to window types."],
 ["Ember waktu untuk mengelompokkan data streaming. Fixed = sama besar dan tidak tumpang tindih; sliding = tumpang tindih (moving average); session = per key sampai ada jeda tanpa aktivitas; global = satu window selamanya.","Fixed = shift per jam; sliding = '60 menit terakhir' diperbarui tiap 5 menit; session = satu kunjungan pelanggan sampai dia pergi.","Frasa di soal langsung menunjuk jenis window."]);
g("trigger","Trigger",["trigger","triggers","early trigger","AfterWatermark","AfterProcessingTime","AfterCount"],"","Streaming",
 ["Decides when a window outputs results: at the watermark, early (processing time), after a count, or combinations.","When the scoreboard updates: every minute, or at the final whistle.","Early estimates + final result → early processing-time trigger + watermark trigger."],
 ["Menentukan kapan window mengeluarkan hasil: saat watermark, lebih awal (processing time), setelah sejumlah elemen, atau kombinasinya.","Kapan papan skor diperbarui: tiap menit, atau saat peluit akhir.","Angka sementara + hasil akhir → early trigger processing time + trigger watermark."]);
g("lateness","Allowed lateness",["allowed lateness","late data","late-arriving","late events"],"","Streaming",
 ["How long after the watermark a window still accepts late data. Default 0, so late data is dropped.","A grace period for late homework.","\"Late events are missing\" → raise allowed lateness."],
 ["Berapa lama setelah watermark sebuah window masih menerima data telat. Default 0, jadi data telat dibuang.","Masa toleransi untuk PR yang terlambat.","\"Event telat hilang\" → naikkan allowed lateness."]);
g("accum","Accumulating vs discarding",["accumulating","discarding"],"","Streaming",
 ["Accumulating: each window firing re-emits the full updated total. Discarding: each firing emits only the new part.","Accumulating = announcing the running score; discarding = announcing only the new goals.","Corrected totals on dashboards → accumulating."],
 ["Accumulating: setiap kali window mengeluarkan hasil, total lengkap terbaru dikirim ulang. Discarding: hanya bagian barunya.","Accumulating = mengumumkan skor total; discarding = hanya mengumumkan gol baru.","Total yang dikoreksi di dashboard → accumulating."]);
g("drain","Drain / Cancel / Update",["drain","drained","draining","Drain"],"","Processing",
 ["Ways to change a running Dataflow job. Update swaps code and keeps state (compatible changes). Drain stops reading and finishes in-flight data. Cancel stops at once and loses in-flight data.","Drain = let the factory finish the items on the belt before closing.","No data loss → drain (incompatible) or update (compatible)."],
 ["Cara mengubah job Dataflow yang sedang jalan. Update mengganti kode dan mempertahankan state (perubahan kompatibel). Drain berhenti membaca dan menyelesaikan data in-flight. Cancel langsung berhenti dan data in-flight hilang.","Drain = biarkan pabrik menyelesaikan barang di ban berjalan sebelum tutup.","Tanpa kehilangan data → drain (tidak kompatibel) atau update (kompatibel)."]);
g("inflight","In-flight data",["in-flight","in flight"],"","Processing",
 ["Data that a pipeline has read but not finished processing or writing yet.","Parcels already loaded on the truck but not delivered.","Cancel loses in-flight data; drain doesn't."],
 ["Data yang sudah dibaca pipeline tapi belum selesai diproses atau ditulis.","Paket yang sudah naik truk tapi belum diantar.","Cancel menghilangkan data in-flight; drain tidak."]);
g("state","State (streaming)",["stateful"],"","Processing",
 ["What a streaming pipeline remembers between elements: partial window totals, buffers, timers.","The running tally on a cashier's notepad.","--update keeps state; a new job starts with empty state."],
 ["Yang diingat pipeline streaming di antara elemen: total window sementara, buffer, timer.","Hitungan berjalan di catatan kasir.","--update mempertahankan state; job baru mulai dengan state kosong."]);
g("hotkey","Hot key",["hot key","hot keys","withHotKeyFanout","fanout"],"","Processing",
 ["One key with far more data than others, so one worker gets overloaded during grouping.","One checkout lane for the most popular product.","Fix with Combine + withHotKeyFanout, not more workers."],
 ["Satu key dengan data jauh lebih banyak dari yang lain, sehingga satu worker kewalahan saat grouping.","Satu jalur kasir khusus untuk produk paling laris.","Atasi dengan Combine + withHotKeyFanout, bukan menambah worker."]);
g("shuffle","Shuffle",["shuffle","shuffled","shuffles"],"","Processing",
 ["Moving data between workers so records with the same key end up together (needed for grouping/joins). Expensive.","Redistributing exam papers so each teacher gets their subject.","Combine reduces shuffle; skew makes shuffle uneven."],
 ["Memindahkan data antar worker supaya record dengan key yang sama berkumpul (dibutuhkan untuk grouping/join). Mahal.","Membagi ulang kertas ujian supaya setiap guru menerima mata pelajarannya.","Combine mengurangi shuffle; skew membuat shuffle tidak merata."]);
g("skew","Skew",["skew","skewed","data skew"],"","Analytics",
 ["Data unevenly spread across keys, so one worker/stage does most of the work.","One cashier with 90% of the customers.","Uneven join stage in BigQuery or Dataflow."],
 ["Data yang tidak merata di antara key, sehingga satu worker/stage mengerjakan sebagian besar pekerjaan.","Satu kasir menangani 90% pelanggan.","Stage join yang tidak merata di BigQuery atau Dataflow."]);
g("systemlag","System lag / data freshness",["system lag","data freshness"],"","Ops & Cost",
 ["Dataflow metrics showing how far behind real time a streaming job is.","How late the train is running.","Alert on these to catch a falling-behind pipeline."],
 ["Metrik Dataflow yang menunjukkan seberapa jauh job streaming tertinggal dari waktu nyata.","Seberapa terlambat kereta berjalan.","Pasang alert di sini untuk menangkap pipeline yang tertinggal."]);
g("template","Flex Template",["Flex Template","Flex Templates","template","templates"],"","Processing",
 ["A packaged Dataflow pipeline (container) that others can launch with parameters, without code or build tools.","A ready-made cake mix: just add the parameters.","Non-developers launch pipelines → Flex Template."],
 ["Pipeline Dataflow yang dikemas (container) sehingga orang lain bisa menjalankannya dengan parameter, tanpa kode atau build tool.","Tepung kue instan: tinggal tambah parameter.","Non-developer menjalankan pipeline → Flex Template."]);
g("flexrs","FlexRS",["FlexRS"],"Flexible Resource Scheduling","Ops & Cost",
 ["A cheaper way to run Dataflow batch jobs that can wait a bit before starting.","A cheaper flight if you don't mind a flexible departure time.","Non-urgent batch, lower cost."],
 ["Cara lebih murah menjalankan job batch Dataflow yang boleh menunggu sebelum mulai.","Tiket pesawat lebih murah kalau jam berangkatnya fleksibel.","Batch yang tidak mendesak, biaya lebih rendah."]);
g("streamingengine","Streaming Engine",["Streaming Engine","Dataflow Shuffle","Dataflow Prime"],"","Processing",
 ["Dataflow backend services that move state/shuffle off the workers for smoother autoscaling.","Moving the warehouse out of the factory floor so machines have room.","Improves streaming job scaling and efficiency."],
 ["Layanan backend Dataflow yang memindahkan state/shuffle keluar dari worker supaya autoscaling lebih mulus.","Memindahkan gudang keluar dari lantai pabrik supaya mesin punya ruang.","Meningkatkan scaling dan efisiensi job streaming."]);
g("dataproc","Dataproc",["Dataproc"],"","Processing",
 ["Google's managed Spark and Hadoop clusters, quick to create and billed per second.","Renting a car per trip instead of owning one.","Existing Spark/Hadoop with minimal changes."],
 ["Cluster Spark dan Hadoop yang di-manage Google, cepat dibuat dan ditagih per detik.","Menyewa mobil per perjalanan, bukan membeli.","Spark/Hadoop yang sudah ada dengan perubahan minimal."]);
g("hadoop","Hadoop / Spark / Hive",["Hadoop","Spark","Hive","Pig","PySpark","MapReduce","Flink"],"","Processing",
 ["Open-source big-data engines: Hadoop (storage + MapReduce), Spark (fast in-memory processing), Hive (SQL on Hadoop), Flink (streaming).","Older and newer generations of factory machinery.","Lift & shift → Dataproc; modernise → BigQuery/Dataflow."],
 ["Engine big data open-source: Hadoop (storage + MapReduce), Spark (pemrosesan in-memory yang cepat), Hive (SQL di atas Hadoop), Flink (streaming).","Mesin pabrik generasi lama dan baru.","Lift & shift → Dataproc; modernisasi → BigQuery/Dataflow."]);
g("hdfs","HDFS",["HDFS"],"Hadoop Distributed File System","Processing",
 ["The file system inside a Hadoop cluster's disks; it disappears when the cluster is deleted.","Luggage kept in the rental car's boot.","Use GCS (gs://) instead so clusters can be ephemeral."],

g("yarn","YARN",["YARN"],"Yet Another Resource Negotiator","Processing",
 ["Hadoop's resource manager that schedules jobs on cluster machines.","The shift supervisor assigning workers to tasks.","Its UI is reachable via Dataproc Component Gateway."],
 ["Resource manager Hadoop yang menjadwalkan job di mesin cluster.","Supervisor shift yang membagi tugas ke pekerja.","UI-nya bisa diakses lewat Dataproc Component Gateway."]);
g("ephemeral","Ephemeral cluster",["ephemeral","job-scoped","ephemeral cluster","ephemeral clusters","persistent cluster"],"","Ops & Cost",
 ["A cluster created for one job and deleted afterwards (vs a persistent always-on cluster).","Renting a hall only for the wedding day.","Cut Dataproc cost → ephemeral clusters + data in GCS."],
 ["Cluster yang dibuat untuk satu job lalu dihapus setelahnya (vs cluster persistent yang selalu menyala).","Menyewa gedung hanya untuk hari pernikahan.","Hemat biaya Dataproc → ephemeral cluster + data di GCS."]);
g("spot","Spot / preemptible VMs",["Spot","Spot VMs","preemptible","secondary workers","secondary worker"],"","Ops & Cost",
 ["Much cheaper VMs that Google can take back at any time. Safe for compute-only Dataproc secondary workers.","Standby airline seats: cheap, but you may be bumped.","Never for masters or primary workers holding HDFS."],
 ["VM yang jauh lebih murah tapi bisa diambil kembali Google kapan saja. Aman untuk secondary worker Dataproc yang hanya compute.","Kursi pesawat standby: murah, tapi bisa digeser.","Jangan untuk master atau primary worker yang menyimpan HDFS."]);
g("initaction","Initialization action",["initialization action","initialization actions","init actions"],"","Processing",
 ["A script that runs on every Dataproc node when the cluster is created, e.g. to install libraries.","A checklist every new employee follows on day one.","Install a library on all nodes → initialization actions."],
 ["Script yang dijalankan di setiap node Dataproc saat cluster dibuat, misalnya untuk menginstal library.","Checklist yang diikuti setiap karyawan baru di hari pertama.","Instal library di semua node → initialization action."]);
g("datafusion","Data Fusion / Dataprep / Dataform",["Data Fusion","Cloud Data Fusion","Dataprep","Dataform","SQLX"],"","Processing",
 ["Data Fusion = visual no-code ETL (runs on Dataproc). Dataprep = visual data cleaning. Dataform = SQL (SQLX) transformations in BigQuery with dependencies, tests and git.","Drag-and-drop LEGO (Fusion), spreadsheet-like cleaning (Dataprep), version-controlled SQL recipes (Dataform).","No-code → Data Fusion; SQL ELT with tests → Dataform."],
 ["Data Fusion = ETL visual tanpa coding (jalan di Dataproc). Dataprep = membersihkan data secara visual. Dataform = transformasi SQL (SQLX) di BigQuery dengan dependency, test dan git.","LEGO drag-and-drop (Fusion), membersihkan data ala spreadsheet (Dataprep), resep SQL dengan version control (Dataform).","Tanpa coding → Data Fusion; ELT SQL dengan test → Dataform."]);
g("assertion","Assertion (data test)",["assertion","assertions"],"","Processing",
 ["An automatic check that fails the pipeline when data breaks a rule (no nulls, unique IDs, positive totals).","A quality inspector stopping the line when a product is faulty.","Dataform assertions or Dataplex data quality scans."],
 ["Pengecekan otomatis yang menggagalkan pipeline kalau data melanggar aturan (tidak null, ID unik, total positif).","Petugas QC yang menghentikan lini produksi kalau ada produk cacat.","Dataform assertion atau Dataplex data quality scan."]);
g("cdc","CDC",["CDC","change data capture"],"Change Data Capture","Migration",
 ["Capturing every insert, update and delete from a database as it happens and sending it elsewhere.","A CCTV on your database recording every change.","Near-real-time database → BigQuery replication → Datastream."],
 ["Menangkap setiap insert, update dan delete dari database saat terjadi lalu mengirimkannya ke tempat lain.","CCTV untuk database yang merekam setiap perubahan.","Replikasi database → BigQuery hampir real-time → Datastream."]);
g("datastream","Datastream",["Datastream"],"","Migration",
 ["Google's serverless CDC service from MySQL, PostgreSQL, Oracle, SQL Server into BigQuery or GCS.","A live courier copying every change to the warehouse.","\"Keep BigQuery within minutes of the source DB\"."],
 ["Layanan CDC serverless Google dari MySQL, PostgreSQL, Oracle, SQL Server ke BigQuery atau GCS.","Kurir langsung yang menyalin setiap perubahan ke gudang.","\"BigQuery tertinggal beberapa menit saja dari DB sumber\"."]);
g("dms","DMS",["DMS","Database Migration Service"],"Database Migration Service","Migration",
 ["Google's service for migrating MySQL/PostgreSQL/SQL Server/Oracle databases into Cloud SQL or AlloyDB with minimal downtime.","Moving house while still living in it, then switching keys at the end.","Database → Cloud SQL with little downtime."],
 ["Layanan Google untuk migrasi database MySQL/PostgreSQL/SQL Server/Oracle ke Cloud SQL atau AlloyDB dengan downtime minimal.","Pindah rumah sambil tetap tinggal, lalu tukar kunci di akhir.","Database → Cloud SQL dengan downtime kecil."]);
g("dts","BigQuery DTS",["DTS","BigQuery Data Transfer Service","Data Transfer Service"],"BigQuery Data Transfer Service","Migration",
 ["Scheduled, managed loads into BigQuery from SaaS (Google Ads, YouTube), S3, and warehouse migrations (Teradata, Redshift).","A subscription delivery straight into the warehouse.","Teradata/Redshift → BigQuery; recurring SaaS loads."],
 ["Load terjadwal dan managed ke BigQuery dari SaaS (Google Ads, YouTube), S3, dan migrasi warehouse (Teradata, Redshift).","Pengiriman langganan langsung ke gudang.","Teradata/Redshift → BigQuery; load SaaS berulang."]);
g("sts","Storage Transfer Service / Transfer Appliance",["STS","Storage Transfer Service","Transfer Appliance"],"","Migration",
 ["STS = managed, scheduled online copies into GCS (from S3, Azure, HTTP, on-prem). Transfer Appliance = a physical device you fill and ship for huge datasets.","STS = a moving company over the road; Appliance = a shipping container.","Huge data + slow network → Appliance; otherwise STS."],
 ["STS = copy online yang managed dan terjadwal ke GCS (dari S3, Azure, HTTP, on-prem). Transfer Appliance = perangkat fisik yang diisi lalu dikirim untuk data raksasa.","STS = jasa pindahan lewat jalan; Appliance = kontainer kapal.","Data raksasa + jaringan lambat → Appliance; selain itu STS."]);
g("teradata","Teradata / Redshift / Netezza",["Teradata","Redshift","Netezza"],"","Migration",

/* ===== d3-l1 storage decision tree ===== */
dd("d3-l1",[
`<p>Every application produces data, and that data has to live somewhere. The catch is that "somewhere" is not one product. A photo upload, a bank transfer, a 5-year sales report and a phone's offline to-do list all have completely different needs: some need answers in under 10 milliseconds, some need SQL over billions of rows, some need to survive a whole region going down, some need to work with no signal at all.</p><p>If you pick the wrong store, nothing breaks on day one. It breaks later, when the bill explodes, queries take minutes, or writes start failing at peak traffic. That's why <mark>choosing the storage service is the single most tested skill on the PDE</mark>: almost every scenario hides a "where should this data live?" decision.</p>`,
`<p>Start with two words you'll see everywhere:</p><ul><li><b>OLTP</b> (Online Transaction Processing): many tiny reads/writes of individual rows, e.g. "save this order", "show this user's profile". Speed per request matters.</li><li><b>OLAP / analytics</b>: few big queries that scan many rows, e.g. "total revenue per city last year". Volume scanned matters.</li></ul><p>Then the main families of storage:</p><table><tr><th>Family</th><th>GCP service</th><th>Shape of data</th></tr><tr><td>Object storage</td><td>Cloud Storage</td><td>Files (any format)</td></tr><tr><td>Data warehouse</td><td>BigQuery</td><td>Huge SQL tables for analytics</td></tr><tr><td>Relational OLTP</td><td>Cloud SQL, AlloyDB, Spanner</td><td>Tables with transactions</td></tr><tr><td>Wide-column NoSQL</td><td>Bigtable</td><td>Rows found by one key, massive scale</td></tr><tr><td>Document NoSQL</td><td>Firestore</td><td>JSON-like documents for apps</td></tr><tr><td>In-memory cache</td><td>Memorystore</td><td>Hot key-value data in RAM</td></tr></table><p><b>Latency</b> = time per request. <b>Throughput</b> = requests per second. <b>Consistency</b> = whether every reader immediately sees the latest write.</p>`,
`<p>Run this checklist in your head, in order, every time:</p><ol><li><b>Is it files?</b> Images, logs, backups, raw exports → <b>Cloud Storage</b>.</li><li><b>Is it analytics?</b> SQL over lots of rows, dashboards → <b>BigQuery</b>.</li><li><b>Is it an app's transactional data that needs SQL + multi-row transactions?</b><ul><li>One region, normal size, MySQL/Postgres/SQL Server → <b>Cloud SQL</b>.</li><li>Postgres but much faster, or analytics on live data → <b>AlloyDB</b>.</li><li>Global users, writes beyond one machine, 99.999% → <b>Spanner</b>.</li></ul></li><li><b>Is it NoSQL at huge scale with key lookups</b> (IoT, time series, &lt;10 ms)? → <b>Bigtable</b>.</li><li><b>Is it documents for a web/mobile app</b> (flexible fields, offline sync)? → <b>Firestore</b>.</li><li><b>Is it a cache</b> (sessions, leaderboard, sub-ms)? → <b>Memorystore</b>.</li></ol><p>After choosing, check the secondary constraints in the question (region, cost, "minimal changes") to confirm.</p>`,
`<div class="box pic"><div class="l">Analogy</div>Think of a city's buildings. <b>Cloud Storage</b> is a giant warehouse of boxes. <b>BigQuery</b> is the national library where researchers read millions of records at once. <b>Cloud SQL</b> is a neighbourhood bank branch. <b>Spanner</b> is a bank with branches in every country that never disagree about your balance. <b>Bigtable</b> is a phone book with billions of numbers sorted by one name. <b>Firestore</b> is the notebook in your pocket that syncs when you're back online. <b>Memorystore</b> is the sticky note on your monitor.</div>`,
`<p>A Jakarta e-commerce company ("TokoKita") has five kinds of data. Here's how they map:</p><table><tr><th>Data</th><th>Need</th><th>Choice</th></tr><tr><td>Product photos (40 TB)</td><td>Files, cheap, durable</td><td>Cloud Storage</td></tr><tr><td>Orders and payments</td><td>Transactions, one region (Indonesia)</td><td>Cloud SQL (or AlloyDB if heavy)</td></tr><tr><td>Click events, 50k/sec, last 30 days per user shown in app</td><td>&lt;10 ms per user lookup at scale</td><td>Bigtable</td></tr><tr><td>"Revenue per city per day" dashboards over 3 years</td><td>SQL analytics</td><td>BigQuery</td></tr><tr><td>Shopping cart / sessions</td><td>Sub-ms, temporary</td><td>Memorystore</td></tr></table><p>Notice that one company uses five services. On the exam, each question usually focuses on one of these needs.</p>`,
`<div class="box trap"><div class="l">Traps</div><ul><li><mark>BigQuery is not OLTP.</mark> "An app looks up one row in &lt;10 ms" is never BigQuery.</li><li><mark>Bigtable has no SQL joins or secondary indexes.</mark> "Search by many different attributes" → not Bigtable.</li><li>Bigtable for 50 GB of data is overkill; it's built for TB–PB.</li><li><mark>Cloud SQL scales up, not out.</mark> Global writes or huge write volume → Spanner.</li><li>"Datastore" in old questions = Firestore in Datastore mode.</li></ul></div><p>Also watch for answers that solve the problem by running your own database on Compute Engine VMs. That's the do-it-yourself option, and it's almost never preferred.</p>`,
`<p>Each GCP storage service is built for one access pattern: files, analytics, regional or global transactions, massive key lookups, app documents, or caching. Read the constraints in the question first (latency, scale, SQL, global, offline). Then walk the decision tree: files → GCS, analytics → BigQuery, OLTP → Cloud SQL/AlloyDB/Spanner, key-value at scale → Bigtable, documents → Firestore, cache → Memorystore.</p>`
],[
`<p>Setiap aplikasi menghasilkan data, dan data itu harus disimpan di suatu tempat. Masalahnya, "suatu tempat" itu bukan satu produk. Upload foto, transfer bank, laporan penjualan 5 tahun dan to-do list offline di HP punya kebutuhan yang sangat berbeda: ada yang butuh jawaban di bawah 10 milidetik, ada yang butuh SQL di miliaran baris, ada yang harus tetap hidup walau satu region mati, ada yang harus jalan tanpa sinyal.</p><p>Kalau salah pilih, di hari pertama tidak ada yang rusak. Masalahnya muncul belakangan: tagihan membengkak, query butuh beberapa menit, atau write gagal saat traffic puncak. Itu sebabnya <mark>memilih layanan storage adalah skill yang paling sering diuji di PDE</mark>: hampir setiap skenario menyembunyikan pertanyaan "data ini sebaiknya disimpan di mana?".</p>`,
`<p>Mulai dari dua istilah yang akan sering kamu temui:</p><ul><li><b>OLTP</b> (Online Transaction Processing): banyak baca/tulis kecil per baris, misalnya "simpan order ini", "tampilkan profil user ini". Yang penting kecepatan per request.</li><li><b>OLAP / analitik</b>: sedikit query besar yang men-scan banyak baris, misalnya "total pendapatan per kota tahun lalu". Yang penting volume yang di-scan.</li></ul><p>Lalu keluarga storage utamanya:</p><table><tr><th>Keluarga</th><th>Layanan GCP</th><th>Bentuk data</th></tr><tr><td>Object storage</td><td>Cloud Storage</td><td>File (format apa pun)</td></tr><tr><td>Data warehouse</td><td>BigQuery</td><td>Tabel SQL raksasa untuk analitik</td></tr><tr><td>OLTP relasional</td><td>Cloud SQL, AlloyDB, Spanner</td><td>Tabel dengan transaksi</td></tr><tr><td>NoSQL wide-column</td><td>Bigtable</td><td>Baris dicari pakai satu key, skala raksasa</td></tr><tr><td>NoSQL dokumen</td><td>Firestore</td><td>Dokumen mirip JSON untuk app</td></tr><tr><td>Cache di memori</td><td>Memorystore</td><td>Data key-value yang sering dipakai, di RAM</td></tr></table><p><b>Latency</b> = waktu per request. <b>Throughput</b> = jumlah request per detik. <b>Consistency</b> = apakah setiap pembaca langsung melihat data terbaru.</p>`,
`<p>Jalankan checklist ini di kepala, berurutan, setiap kali:</p><ol><li><b>Apakah ini file?</b> Gambar, log, backup, hasil export → <b>Cloud Storage</b>.</li><li><b>Apakah ini analitik?</b> SQL di banyak baris, dashboard → <b>BigQuery</b>.</li><li><b>Apakah ini data transaksi app yang butuh SQL + transaksi multi-baris?</b><ul><li>Satu region, ukuran normal, MySQL/Postgres/SQL Server → <b>Cloud SQL</b>.</li><li>Postgres tapi jauh lebih cepat, atau analitik di data live → <b>AlloyDB</b>.</li><li>User global, write melebihi kemampuan satu mesin, 99,999% → <b>Spanner</b>.</li></ul></li><li><b>Apakah ini NoSQL skala raksasa dengan lookup per key</b> (IoT, time series, &lt;10 ms)? → <b>Bigtable</b>.</li><li><b>Apakah ini dokumen untuk app web/mobile</b> (field fleksibel, sinkron offline)? → <b>Firestore</b>.</li><li><b>Apakah ini cache</b> (session, leaderboard, sub-milidetik)? → <b>Memorystore</b>.</li></ol><p>Setelah memilih, cek batasan tambahan di soal (region, biaya, "perubahan minimal") untuk memastikan.</p>`,
`<div class="box pic"><div class="l">Analogi</div>Bayangkan gedung-gedung di sebuah kota. <b>Cloud Storage</b> adalah gudang raksasa berisi kardus. <b>BigQuery</b> adalah perpustakaan nasional tempat peneliti membaca jutaan catatan sekaligus. <b>Cloud SQL</b> adalah kantor cabang bank di kompleks. <b>Spanner</b> adalah bank dengan cabang di setiap negara yang tidak pernah beda pendapat soal saldomu. <b>Bigtable</b> adalah buku telepon berisi miliaran nomor yang diurutkan satu nama. <b>Firestore</b> adalah buku catatan di sakumu yang tersinkron saat kembali online. <b>Memorystore</b> adalah sticky note di monitormu.</div>`,
`<p>Sebuah e-commerce di Jakarta ("TokoKita") punya lima jenis data. Begini pemetaannya:</p><table><tr><th>Data</th><th>Kebutuhan</th><th>Pilihan</th></tr><tr><td>Foto produk (40 TB)</td><td>File, murah, awet</td><td>Cloud Storage</td></tr><tr><td>Order dan pembayaran</td><td>Transaksi, satu region (Indonesia)</td><td>Cloud SQL (atau AlloyDB kalau berat)</td></tr><tr><td>Event klik, 50 ribu/detik, 30 hari terakhir per user tampil di app</td><td>Lookup per user &lt;10 ms di skala besar</td><td>Bigtable</td></tr><tr><td>Dashboard "pendapatan per kota per hari" selama 3 tahun</td><td>Analitik SQL</td><td>BigQuery</td></tr><tr><td>Keranjang belanja / session</td><td>Sub-milidetik, sementara</td><td>Memorystore</td></tr></table><p>Perhatikan bahwa satu perusahaan memakai lima layanan. Di ujian, setiap soal biasanya fokus ke salah satu kebutuhan ini.</p>`,
`<div class="box trap"><div class="l">Jebakan</div><ul><li><mark>BigQuery bukan OLTP.</mark> "App mencari satu baris dalam &lt;10 ms" tidak pernah BigQuery.</li><li><mark>Bigtable tidak punya SQL join atau secondary index.</mark> "Cari berdasarkan banyak atribut berbeda" → bukan Bigtable.</li><li>Bigtable untuk data 50 GB itu berlebihan; ia dibuat untuk TB–PB.</li><li><mark>Cloud SQL scale up, bukan scale out.</mark> Write global atau volume write sangat besar → Spanner.</li><li>"Datastore" di soal lama = Firestore in Datastore mode.</li></ul></div><p>Hati-hati juga dengan jawaban yang menyelesaikan masalah dengan menjalankan database sendiri di VM Compute Engine. Itu opsi DIY, dan hampir tidak pernah jadi pilihan yang disukai Google.</p>`,
`<p>Setiap layanan storage GCP dibuat untuk satu pola akses: file, analitik, transaksi regional atau global, lookup key skala raksasa, dokumen app, atau cache. Baca dulu batasan di soal (latency, skala, SQL, global, offline). Lalu jalankan pohon keputusannya: file → GCS, analitik → BigQuery, OLTP → Cloud SQL/AlloyDB/Spanner, key-value skala besar → Bigtable, dokumen → Firestore, cache → Memorystore.</p>`
